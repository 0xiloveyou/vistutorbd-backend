<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual Lessons | VizTutorBD</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f1f5f9;color:#0f172a}

  /* Interactive visual lessons carousel */

  .vc{padding:24px 0 64px;background:linear-gradient(#f1f5f9,#e2e8f0);overflow:hidden}
  .vc-wrap{max-width:none;margin:0 auto;padding:0 16px}
  .vc h2{font-size:30px;margin:0 auto 6px;text-align:center}
  .vc-sub{text-align:center;color:#64748b;margin:0 auto 30px}
  .vc-wrap>h2,.vc-wrap>.vc-sub{max-width:820px}

  /* --- the carousel itself --- */
  .vc-carousel{position:relative;outline:none}
  .vc-viewport{overflow:hidden;padding:18px 0 26px;touch-action:pan-y}
  .vc-track{display:flex;gap:22px;transition:transform .55s cubic-bezier(.65,0,.25,1);will-change:transform}
  .vc-slide{flex:0 0 auto;min-width:0;background:#111a2e;border-radius:22px;padding:14px;box-shadow:0 18px 50px #0f172a33;
    opacity:.42;transform:scale(.92);filter:saturate(.6);cursor:pointer;
    transition:opacity .5s,transform .5s,filter .5s}
  .vc-slide.on{opacity:1;transform:none;filter:none;cursor:default}
  .vc-head{display:flex;align-items:center;gap:10px;color:#e6edf7;padding:2px 6px 12px}
  .vc-count{background:#1e293b;color:#38bdf8;font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px}
  .vc-head b{font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vc-band{margin-left:auto;background:#082f49;border:1px solid #0c4a6e;color:#7dd3fc;font-size:11px;
    font-weight:700;letter-spacing:.02em;padding:4px 10px;border-radius:999px;white-space:nowrap;flex-shrink:0}
  .vc-stage{border-radius:14px;overflow:hidden;background-color:#0b1220;
    background-image:linear-gradient(rgba(148,163,184,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.07) 1px,transparent 1px);
    background-size:32px 32px}
  .vc-stage svg{display:block;width:100%;height:auto}
  .vc-stage svg text{font-family:"Segoe UI",system-ui,sans-serif}

  .vc-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:46px;height:46px;border-radius:50%;
    border:0;background:#fff;color:#0f172a;font-size:28px;line-height:1;cursor:pointer;box-shadow:0 6px 18px #0f172a30;
    display:flex;align-items:center;justify-content:center;padding:0 0 4px}
  .vc-arrow:hover{background:#38bdf8}
  .vc-arrow.prev{left:6px}.vc-arrow.next{right:6px}

  .vc-dots{display:flex;justify-content:center;gap:10px;margin:0 0 26px}
  .vc-dots button{width:10px;height:10px;padding:0;border:0;border-radius:999px;background:#94a3b8;cursor:pointer;transition:.3s}
  .vc-dots button.on{width:30px;background:#0ea5e9}

  /* --- separate control panel --- */
  .vc-panel{max-width:820px;margin:0 auto;background:#fff;border:1px solid #e2e8f0;border-radius:20px;
    padding:16px 18px;box-shadow:0 10px 30px #0f172a14;display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;justify-content:space-between}
  .vc-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#94a3b8;font-weight:700;margin-bottom:6px}
  .vc-btns{display:flex;gap:8px;flex-wrap:wrap}
  .vc-btns button,.vc-modes button{border:1px solid #cbd5e1;background:#f8fafc;color:#0f172a;padding:9px 14px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
  .vc-btns button:hover,.vc-modes button:hover{background:#e0f2fe;border-color:#38bdf8}
  .vc-btns button.main{background:#0ea5e9;border-color:#0ea5e9;color:#fff}
  .vc-btns button.main:hover{background:#0284c7}
  .vc-modes{display:flex;gap:8px}
  .vc-modes button.on{background:#0f172a;border-color:#0f172a;color:#fff}
  .vc-info{flex:1 1 100%;display:flex;align-items:center;gap:12px;color:#64748b;font-size:13px}
  .vc-prog{flex:1;height:5px;background:#e2e8f0;border-radius:5px;overflow:hidden}
  .vc-prog i{display:block;height:100%;width:0;background:#0ea5e9}

  /* --- interactive "try it" bar --- */
  .vc-try{max-width:820px;margin:0 auto 16px;background:#fff;border:1px solid #e2e8f0;border-radius:20px;
    padding:13px 18px;box-shadow:0 10px 30px #0f172a14;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
  .vc-try[hidden]{display:none}
  .vc-try>.vc-label{margin:0;white-space:nowrap}
  .vc-try-body{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;flex:1}
  .vc-try-row{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:#334155}
  .vc-try-row input[type=range]{width:150px;accent-color:#0ea5e9;cursor:pointer}
  .vc-try-row output{min-width:44px;font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px;color:#0f172a;
    background:#f1f5f9;border-radius:8px;padding:3px 7px;text-align:center}
  .vc-try-opts{display:flex;gap:6px;flex-wrap:wrap}
  .vc-try-opts button{border:1px solid #cbd5e1;background:#f8fafc;color:#0f172a;border-radius:10px;
    padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer}
  .vc-try-opts button:hover{background:#e0f2fe;border-color:#38bdf8}
  .vc-try-opts button.on{background:#0f172a;border-color:#0f172a;color:#fff}
  .vc-try-note{flex:1 1 100%;font-size:12px;color:#64748b}
  @media(max-width:640px){.vc-arrow{width:34px;height:34px;font-size:20px}.vc-btns{display:grid;grid-template-columns:1fr 1fr;width:100%}
    .vc-btns button{justify-content:center;padding:8px 10px;font-size:13px}
    .vc-try-row input[type=range]{width:105px}.vc-band{display:none}
    .vc-dots{gap:5px}.vc-dots button{width:7px;height:7px}.vc-dots button.on{width:18px}}
</style>
</head>
<body>
<main>

  <section id="vc" class="vc" aria-label="Visual lessons">
    <div class="vc-wrap">
      <!-- carousel: only slides + side arrows -->
      <div class="vc-carousel" id="vcCar" tabindex="0" aria-roledescription="carousel">
        <button class="vc-arrow prev" id="aPrev" aria-label="Previous lesson">&#8249;</button>
        <div class="vc-viewport" id="vcView"><div class="vc-track" id="vcTrack"></div></div>
        <button class="vc-arrow next" id="aNext" aria-label="Next lesson">&#8250;</button>
      </div>
      <div class="vc-dots" id="vcDots"></div>

      <div class="vc-try" id="vcTry" hidden>
        <div class="vc-label">Try it</div>
        <div class="vc-try-body" id="vcTryBody"></div>
      </div>

      <!-- separate control panel -->
      <div class="vc-panel">
        <div>
          <div class="vc-label">Playback</div>
          <div class="vc-btns">
            <button id="bPrev" aria-label="Previous lesson">⏮ Back</button>
            <button id="bPlay" class="main" aria-label="Pause or play">⏸ Pause</button>
            <button id="bRep"  aria-label="Watch again">⟲ Watch again</button>
            <button id="bNext" aria-label="Next lesson">Next ⏭</button>
          </div>
        </div>
        <div id="vcModeBox">
          <div class="vc-label">Style</div>
          <div class="vc-modes" id="vcModes"></div>
        </div>
        <div class="vc-info"><span id="vcInfo"></span><div class="vc-prog"><i id="vcFill"></i></div></div>
      </div>
    </div>
  </section>

</main>

<script>
(function(){
/* =====================================================================
   HOW TO ADD A NEW VISUALIZATION LATER
   Call registerVisual({
     id:'my-lesson',
     title:'My lesson title',
     modes:[ { id:'art', label:'✏️ Line art', duration:20,            // seconds
               frame:(t)=> '<svg inner markup for time t (0..duration)>' } ]  // frame(t) = SVG inner markup
   });
   frame(t) must be a pure function of time, so pause / replay / seek just work.
   Add a 2nd mode (e.g. robot) and a toggle button appears automatically.
   ===================================================================== */
const VISUALS=[];
const S={vi:0,mi:0,t:0,playing:false,manual:false,last:0,adv:null,busy:false,ready:false,params:{}};
window.registerVisual=v=>{VISUALS.push(v);if(S.ready) rebuild();};

/* ---------- tiny helpers ---------- */
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const lerp=(a,b,k)=>a+(b-a)*k;
const f=n=>Math.round(n*10)/10;
function path(d,o={}){
  const {stroke='#e2e8f0',w=2,fill='none',fo=1,op=1,draw=1}=o;
  if(draw<=0) return '';
  const dash=draw<1?` stroke-dasharray="1" stroke-dashoffset="${1-draw}"`:'';
  return `<path d="${d}" pathLength="1" fill="${fill}" fill-opacity="${fo}" stroke="${stroke}" stroke-width="${w}" opacity="${op}" stroke-linejoin="round" stroke-linecap="round"${dash}/>`;
}
function txt(x,y,s,o={}){
  const {size=18,fill='#e2e8f0',anchor='middle',op=1,weight=700}=o;
  if(op<=0) return '';
  return `<text x="${f(x)}" y="${f(y)}" font-size="${size}" fill="${fill}" text-anchor="${anchor}" opacity="${op}" font-weight="${weight}">${s}</text>`;
}
const D=(pts,m)=>'M'+pts.map(p=>m(p[0],p[1]).map(f).join(' ')).join('L')+'Z';
const cap=(list,t)=>{let c=null;for(const e of list) if(e[0]<=t) c=e;return c;};
function wrap(s,n){const out=[];let l='';for(const w of s.split(' ')){if((l+' '+w).trim().length>n){out.push(l);l=w;}else l=(l+' '+w).trim();}if(l)out.push(l);return out;}
function typedPairs(lines,n){return lines.map(l=>{const k=clamp(n,0,l.length);n-=l.length;return [l.slice(0,k),l.slice(k)];});}

/* bottom caption bar (used by line-art modes) */
function captionBar(t,list){
  const c=cap(list,t); if(!c) return '';
  const lines=wrap(c[1],72), n=Math.floor((t-c[0])*45);
  const h=lines.length*24+16, y0=472-h;
  let s=`<rect x="30" y="${y0}" width="740" height="${h}" rx="12" fill="#020617" opacity=".75"/>`;
  typedPairs(lines,n).forEach((p,i)=>{
    if(!p[0]) return;
    s+=`<text x="400" y="${y0+28+i*24}" font-size="18" font-weight="500" fill="#f1f5f9" text-anchor="middle">${p[0]}<tspan opacity="0">${p[1]}</tspan></text>`;
  });
  return s;
}

/* =====================================================================
   VISUAL A : Ten-frame counting  (Play / Nursery / Class 1) — INTERACTIVE
   ===================================================================== */
const NUM_WORDS=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
function tenFrame(t,p={}){
  const n=Math.round(clamp(p.n ?? 6,0,10));
  let s=txt(400,44,'Make numbers to 10',{size:30});
  const cols=5,rows=2,cell=66,x0=152,y0=122;
  s+=`<rect x="${x0-10}" y="${y0-10}" width="${cols*cell+20}" height="${rows*cell+20}" rx="20" fill="#0f172a" stroke="${INK}" stroke-width="2.5"/>`;
  for(let i=0;i<10;i++){
    const c=i%cols,r=Math.floor(i/cols),x=x0+c*cell,y=y0+r*cell;
    s+=`<rect x="${x}" y="${y}" width="${cell}" height="${cell}" fill="${i%2?'#0b1220':'#0f172a'}" stroke="#334155" stroke-width="1.2"/>`;
    if(i<n){
      const a=ease(clamp((t-.12*i)/.5));
      s+=`<circle cx="${x+cell/2}" cy="${y+cell/2}" r="${f(23*a)}" fill="${CA}"/>`;
      s+=txt(x+cell/2,y+cell/2+6,String(i+1),{size:17,fill:'#0b1220',op:a});
    }
  }
  s+=txt(400,y0+rows*cell+48,'two rows of five',{size:16,fill:'#94a3b8'});
  const px=650,py=260;
  s+=`<circle cx="${px}" cy="${py}" r="78" fill="${CT}" fill-opacity=".14" stroke="${CT}" stroke-width="2.5"/>`;
  s+=txt(px,py+25,String(n),{size:76,fill:CT});
  s+=txt(px,py+64,NUM_WORDS[n],{size:18,fill:INK});
  s+=txt(400,402,`${n} + ${10-n} = 10`,{size:36,fill:INK,op:ease(clamp(t/.8))});
  s+=txt(400,440,n===10?'The frame is full — ten!':n===0?'Add counters to begin.':`${10-n} more counters would fill the frame.`,{size:16,fill:'#94a3b8'});
  return s;
}
registerVisual({
  id:'ten-frame',
  rank:1,
  title:'Ten-frame counting: numbers to 10',
  level:'Play–Class 1 · Easy',
  hint:'Drag the slider to add or remove counters. Every row holds five.',
  controls:[{id:'n',label:'Counters',type:'range',min:0,max:10,step:1,value:6}],
  modes:[{id:'explore',label:'🧮 Explore',duration:8,frame:tenFrame}]
});

/* =====================================================================
   VISUAL B : Fraction bar  (Class 3–5) — INTERACTIVE
   ===================================================================== */
function fractionFrame(t,p={}){
  const den=Math.round(clamp(p.den ?? 4,2,12));
  const num=Math.round(clamp(p.num ?? 3,0,den));
  const dec=num/den;
  let s=txt(400,44,'Build a fraction',{size:30});
  const bx=90,by=142,bw=620,bh=116,pw=bw/den;
  s+=`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="14" fill="#0b1220" stroke="${INK}" stroke-width="2.5"/>`;
  for(let i=0;i<den;i++){
    const x=bx+i*pw;
    if(i<num){
      const a=ease(clamp((t-.08*i)/.4));
      s+=`<rect x="${x+2}" y="${by+2}" width="${pw-4}" height="${bh-4}" fill="${CA}" opacity="${.88*a}"/>`;
    }
    if(i>0) s+=`<line x1="${f(x)}" y1="${by}" x2="${f(x)}" y2="${by+bh}" stroke="${INK}" stroke-width="2"/>`;
  }
  s+=txt(bx+bw/2,by-16,`${den} equal parts`,{size:17,fill:'#94a3b8'});
  const fy=318;
  s+=txt(400,fy-16,String(num),{size:56,fill:CA});
  s+=`<line x1="356" y1="${fy}" x2="444" y2="${fy}" stroke="${INK}" stroke-width="3.5"/>`;
  s+=txt(400,fy+50,String(den),{size:56,fill:CT});
  s+=txt(400,412,`${num} ÷ ${den} = ${dec.toFixed(3).replace(/0+$/,'').replace(/\.$/,'')}  ·  ${Math.round(dec*100)}%`,{size:24,fill:INK});
  s+=txt(400,446,'Numerator = shaded parts · Denominator = total equal parts',{size:15,fill:'#94a3b8'});
  return s;
}
registerVisual({
  id:'fraction-bar',
  rank:2,
  title:'Fractions: how many parts are shaded?',
  level:'Class 3–5 · Easy',
  hint:'Change the denominator to cut the bar into more parts, then shade the numerator.',
  sync:p=>{p.num=Math.min(p.num,p.den);},
  controls:[
    {id:'den',label:'Denominator',type:'range',min:2,max:12,step:1,value:4},
    {id:'num',label:'Numerator',type:'range',min:0,max:12,step:1,value:3}
  ],
  modes:[{id:'explore',label:'🍕 Explore',duration:8,frame:fractionFrame}]
});

/* =====================================================================
   VISUAL 1 : Pythagorean theorem  (line art  +  robot)
   ===================================================================== */
const CA='#fbbf24',CB='#4ade80',CC='#c4b5fd',CT='#38bdf8',INK='#e2e8f0';

/* --- intro: triangle + squares on the sides (3-4-5) --- */
const IP=(x,y)=>[260+30*x,285+30*y];
const il=(x,y,s,o)=>{const p=IP(x,y);return txt(p[0],p[1]+5,s,o);};
const TRI=[[0,0],[4,0],[0,-3]],SA=[[0,0],[0,-3],[-3,-3],[-3,0]],SB=[[0,0],[4,0],[4,4],[0,4]],SC=[[4,0],[0,-3],[3,-7],[7,-4]];
function introScene(t,T){
  let s='';
  s+=txt(400,44,`Why does <tspan fill="${CA}">a²</tspan> + <tspan fill="${CB}">b²</tspan> = <tspan fill="${CC}">c²</tspan> ?`,{size:30});
  const pSq=prog(t,...T.sq),pF=prog(t,...T.fill),pN=prog(t,...T.nums),pT=prog(t,...T.tri),pL=prog(t,...T.labels);
  [[SA,CA],[SB,CB],[SC,CC]].forEach(([q,c],i)=>{
    if(pF>0) s+=path(D(q,IP),{stroke:'none',w:0,fill:c,fo:.2*pF});
    s+=path(D(q,IP),{stroke:c,w:2.5,draw:clamp(pSq*3-i)});
  });
  if(pF>0){
    let g='';
    for(let k=1;k<3;k++) g+=`M${IP(-k,0)}L${IP(-k,-3)}M${IP(-3,-k)}L${IP(0,-k)}`;
    for(let k=1;k<4;k++) g+=`M${IP(k,0)}L${IP(k,4)}M${IP(0,k)}L${IP(4,k)}`;
    for(let k=1;k<5;k++){
      const a=[4-.8*k,-.6*k],b=[4+.6*k,-.8*k];
      g+=`M${IP(a[0],a[1])}L${IP(a[0]+3,a[1]-4)}M${IP(b[0],b[1])}L${IP(b[0]-4,b[1]-3)}`;
    }
    s+=`<path d="${g}" stroke="#e2e8f0" stroke-width="1" opacity="${.28*pF}" fill="none"/>`;
  }
  if(pT>=1) s+=path(D(TRI,IP),{stroke:'none',w:0,fill:CT,fo:.4});
  s+=path(D(TRI,IP),{stroke:INK,w:3,draw:pT});
  s+=path(`M${IP(.5,0)}L${IP(.5,-.5)}L${IP(0,-.5)}`,{stroke:INK,w:1.5,op:pL});
  s+=il(.5,-1.4,'a',{fill:CA,size:17,op:pL})+il(2,-.4,'b',{fill:CB,size:17,op:pL})+il(1.9,-1.1,'c',{fill:CC,size:17,op:pL});
  s+=il(-1.5,-1.5,'a² = 9',{fill:CA,size:20,op:pN})+il(2,2,'b² = 16',{fill:CB,size:22,op:pN})+il(3.5,-3.5,'c² = 25',{fill:CC,size:22,op:pN});
  return s;
}

/* --- proof: 4 triangles inside a big square of side a+b --- */
const BX=110,BY=90,BU=36,Q=(x,y)=>[BX+BU*x,BY+BU*y];
const BIG=[[0,0],[7,0],[7,7],[0,7]];
const PIECES=[
  {id:'TL',n:1,pts:[[0,0],[3,0],[0,4]],d:[0,3]},
  {id:'TR',n:2,pts:[[3,0],[7,0],[7,3]],d:[0,0]},
  {id:'BR',n:3,pts:[[7,3],[7,7],[4,7]],d:[-4,0]},
  {id:'BL',n:4,pts:[[0,4],[0,7],[4,7]],d:[3,-4]}
];
const cen=p=>[(p[0][0]+p[1][0]+p[2][0])/3,(p[0][1]+p[1][1]+p[2][1])/3];
function proofScene(t,T,robot){
  let s='';
  const pB=prog(t,...T.big);
  s+=txt(BX+126,44,'The puzzle proof',{size:22,op:pB});
  let g='';for(let k=1;k<7;k++) g+=`M${Q(k,0)}L${Q(k,7)}M${Q(0,k)}L${Q(7,k)}`;
  s+=`<path d="${g}" stroke="#94a3b8" stroke-width="1" opacity="${.16*pB}" fill="none"/>`;
  s+=path(D(BIG,Q),{stroke:INK,w:3,draw:pB});
  s+=txt(BX+126,BY-10,'a + b',{op:pB,size:17});
  s+=`<text transform="translate(${BX-14} ${BY+126}) rotate(-90)" font-size="17" font-weight="700" fill="${INK}" text-anchor="middle" opacity="${pB}">a + b</text>`;

  // empty space, arrangement 1  (tilted square c²)
  const c2=prog(t,...T.c2)*(1-prog(t,...T.c2out));
  if(c2>0){
    s+=path(D([[3,0],[7,3],[4,7],[0,4]],Q),{stroke:CC,w:2,fill:CC,fo:.45,op:c2});
    const q=Q(3.5,3.5); s+=txt(q[0],q[1]+12,'c²',{size:38,fill:'#fff',op:c2});
  }
  // empty space, arrangement 2  (a² and b²)
  const ab=prog(t,...T.ab);
  if(ab>0){
    s+=path(D([[0,0],[3,0],[3,3],[0,3]],Q),{stroke:CA,w:2,fill:CA,fo:.45,op:ab});
    s+=path(D([[3,3],[7,3],[7,7],[3,7]],Q),{stroke:CB,w:2,fill:CB,fo:.45,op:ab});
    let q=Q(1.5,1.5); s+=txt(q[0],q[1]+10,'a²',{size:32,fill:'#fff',op:ab});
    q=Q(5,5); s+=txt(q[0],q[1]+12,'b²',{size:38,fill:'#fff',op:ab});
  }
  // the 4 triangles
  const pTr=prog(t,...T.tris);
  PIECES.forEach((p,i)=>{
    const a=clamp(pTr*4-i); if(a<=0) return;
    const w=T.mv[p.id], m=w?prog(t,...w):0, k=ease(m), moving=m>0&&m<1;
    const dx=p.d[0]*k*BU, dy=p.d[1]*k*BU, c=cen(p.pts), q=Q(c[0],c[1]);
    s+=`<g transform="translate(${f(dx)} ${f(dy)})" opacity="${a}">`
      +path(D(p.pts,Q),{stroke:moving?'#fff':INK,w:moving?3.5:2,fill:CT,fo:moving?.8:.55})
      +txt(q[0],q[1]+6,p.n,{size:18,fill:'#0b1220'})+'</g>';
  });

  if(!robot){
    const L=[[T.big[1],`Big square side = <tspan fill="${INK}">a + b</tspan>`],
             [T.c2[1],`Empty space (1) = <tspan fill="${CC}">c²</tspan>`],
             [T.ab[1],`Empty space (2) = <tspan fill="${CA}">a²</tspan> + <tspan fill="${CB}">b²</tspan>`]];
    L.forEach(([ts,str],i)=>{s+=txt(440,150+i*46,str,{size:22,anchor:'start',op:prog(t,ts-.8,ts)});});

function robotSvg(t,hx,hy,talking,happy,rp,rv){
  const bob=happy?-Math.abs(Math.sin(t*6))*12:Math.sin(t*2.2)*4;

  const ox=-36,oy=-20;
  const sx=cx+ox*Math.cos(th)-oy*Math.sin(th), sy=cy+ox*Math.sin(th)+oy*Math.cos(th);
  // arm only stretches when the hand is far away; when close it stays short
  const dist=Math.hypot(hx-sx,hy-sy), sag=Math.min(50,dist*.45);

  </g>

/* robot flies: its body drifts toward whatever the hand points at (smoothed, so it glides),
   and the arm only stretches for the remaining distance */
const HOME=[640,318];
function robotPos(t,T){
  let hx=0,hy=0;const N=7;
  for(let j=0;j<N;j++){const p=handAt(T.hk,Math.max(0,t-j*.15));hx+=p[0];hy+=p[1];}
  hx/=N;hy/=N;
  const home=T.home||HOME;
  let x=home[0]+.85*(hx-REST[0]), y=home[1]+.85*(hy-REST[1]);
  x=clamp(x,T.minX??70,740);
  const minY=170+150*clamp((x-350)/70);          // stay out from under the speech bubble
  y=clamp(y,minY,392);
  return [x,y];
}
function handAt(k,t){
  if(t<=k[0][0]) return [k[0][1],k[0][2]];
  for(let i=0;i<k.length-1;i++){
    const a=k[i],b=k[i+1];
    if(t<=b[0]){const u=ease(prog(t,a[0],b[0]));return [lerp(a[1],b[1],u),lerp(a[2],b[2],u)];}
  }
  const l=k[k.length-1];return [l[1],l[2]];
}
function robotLayer(t,T,list){
  const [hx,hy]=handAt(T.hk,t), c=cap(list,t);
  const rp=robotPos(t,T), rq=robotPos(Math.max(0,t-.1),T);
  const rv=[(rp[0]-rq[0])/.1,(rp[1]-rq[1])/.1];
  let talking=false,bubble='';
  if(c){
    const lines=wrap(c[1],31),n=Math.floor((t-c[0])*28),total=lines.join('').length;
    talking=n<total;
    const h=lines.length*22+22,top=172-h;
    const tx=clamp(rp[0]-10,510,750), tip=tx+clamp((rp[0]-tx)*.35,-40,40);
    bubble=`<rect x="478" y="${top}" width="306" height="${h}" rx="14" fill="#f8fafc"/><path d="M${f(tx-13)} 171L${f(tx+13)} 171L${f(tip)} 198Z" fill="#f8fafc"/>`;
    typedPairs(lines,n).forEach((p,i)=>{bubble+=`<text x="494" y="${top+28+i*22}" font-size="16" font-weight="600" fill="#0f172a">${p[0]}</text>`;});
  }
  return bubble+robotSvg(t,hx,hy,talking,t>=T.concl[0],rp,rv);
}

  s+=txt(px+pw-8,py+ph-8,'x',{size:15,fill:'#94a3b8',anchor:'end'});
  s+=txt(px+8,py+16,'y',{size:15,fill:'#94a3b8',anchor:'start'});

  for(let i=0;i<=280;i++){
    const x=xmin+(xmax-xmin)*i/280;

  s+=txt(px,py+ph+34,eq,{size:24,anchor:'start',fill:CT});

  s+=txt(px,py+ph+64,note,{size:16,anchor:'start',fill:'#94a3b8'});

}

    for(let i=0;i<=96;i++){const xv=i/30;cp.push([X(xv),Y(ftcFn(xv))]);}
    s+=`<path d="M${cp.map(q=>f(q[0])+' '+f(q[1])).join('L')}" fill="none" stroke="${CT}" stroke-width="3"/>`;
    const ap=[[X(0),Y(0)]];
    for(let i=0;i<=30;i++){const xv=i/30*x;ap.push([X(xv),Y(ftcFn(xv))]);}
    ap.push([X(x),Y(0)]);
    if(pa>0) s+=`<path d="${D(ap,(x,y)=>[x,y])}" fill="${CT}" fill-opacity="${f(.20*pa)}" stroke="none"/>`;
    const sy=Y(ftcFn(x));
    if(pa>0){
      s+=`<line x1="${f(X(x))}" y1="${gy1}" x2="${f(X(x))}" y2="${f(sy)}" stroke="${CA}" stroke-width="2" stroke-dasharray="6 5" opacity="${f(.85*pa)}"/>`;
      s+=txt(X(x*.5),Y(ftcFn(x*.5)*.55),'A(x)',{size:22,fill:CT,op:pa});
      s+=txt(X(x),gy1+34,`x = ${x.toFixed(2)}`,{size:12,fill:CA,op:pa});
    }
    if(dx>.002){
      const sw=X(x+dx)-X(x);
      s+=`<rect x="${f(X(x))}" y="${f(sy)}" width="${f(sw)}" height="${f(Y(0)-sy)}" fill="${CA}" fill-opacity=".6" stroke="${CA}" stroke-width="1.5"/>`;
      s+=txt(X(x+dx)+7,gy1-10,'f(x) · dx',{size:12,anchor:'start',fill:CA});
    }
    s+=`<circle cx="${f(X(x))}" cy="${f(sy)}" r="6" fill="${CA}"/>`;
    s+=txt(X(x)+9,sy-9,`f(x) = ${ftcFn(x).toFixed(2)}`,{size:12,anchor:'start',fill:CA});
    s+=txt(X(3.0),Y(ftcFn(3.0))-10,'f(t)',{size:14,anchor:'end',fill:CT});
    s+=txt(gx1+14,gy1+4,'t',{size:14,fill:'#94a3b8'});
    s+=txt(gx0-20,gy0-8,'y',{size:14,fill:'#94a3b8'});
    if(robot){
      const a=ease(pr);
      s+=`<rect x="40" y="410" width="720" height="58" rx="14" fill="#0f172a" stroke="${CT}" stroke-width="2"/>`;
      s+=txt(65,442,`A(x) = ${ftcArea(x).toFixed(2)}`,{size:18,anchor:'start',fill:CT});
      s+=txt(400,440,"A′(x) = f(x)",{size:28,fill:CA,op:a});
      s+=txt(400,462,'Differentiation undoes integration.',{size:12,fill:'#94a3b8',op:a});
      s+=txt(735,442,`f(x) = ${ftcFn(x).toFixed(2)}`,{size:16,anchor:'end',fill:INK});
    } else {
      const a=ease(pr);
      s+=`<rect x="448" y="105" width="312" height="245" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>`;
      s+=txt(470,136,'AREA FUNCTION',{size:11,anchor:'start',fill:'#94a3b8'});
      s+=txt(470,174,'A(x) = ∫₀ˣ f(t) dt',{size:20,anchor:'start',fill:CT});
      s+=txt(470,202,'area under f from 0 to x',{size:12,anchor:'start',fill:'#94a3b8'});
      s+=`<line x1="470" y1="220" x2="738" y2="220" stroke="#334155" stroke-width="1"/>`;
      s+=txt(470,258,"A′(x) = f(x)",{size:30,anchor:'start',fill:CA,op:a});
      s+=txt(470,286,'the area grows at rate f(x)',{size:12,anchor:'start',fill:'#94a3b8',op:a});
      s+=txt(470,323,'ΔA ≈ f(x) · dx',{size:16,anchor:'start',fill:INK});
      s+=txt(470,344,`x = ${x.toFixed(2)}   A = ${ftcArea(x).toFixed(2)}`,{size:12,anchor:'start',fill:'#94a3b8'});
    }
    return s+(robot?robotLayer(real,FTC_T,CAP_FTC_BOT):captionBar(t,CAP_FTC_ART));
  };
}
const CAP_FTC_ART=[
  [.3,'Let A(x) be the area under y = f(t) from 0 to x.'],

FTC_T.hk=[ftk(0,REST),ftk(.5,REST),ftk(1.4,[200,300]),ftk(3.5,[200,300]),

/* =====================================================================
   VISUAL X : Motion of a particle in a plane  (Class 11-12, line art + robot)
   ===================================================================== */
const MPK=1.3;
const MPX=v=>55+v/4*395;
const MPY=v=>380-v/3.2*275;
function mpArrow(x1,y1,x2,y2,color,op,w=2.5){
  const a=ease(op); if(a<=0) return '';
  const len=Math.hypot(x2-x1,y2-y1); if(len<3) return '';
  const xe=lerp(x1,x2,a), ye=lerp(y1,y2,a);
  const ux=(x2-x1)/len, uy=(y2-y1)/len, h=9, px=-uy*4.5, py=ux*4.5;
  return `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(xe)}" y2="${f(ye)}" stroke="${color}" stroke-width="${w}" opacity="${f(a)}" stroke-linecap="round"/>`
    +`<path d="M${f(xe)} ${f(ye)}L${f(xe-ux*h+px)} ${f(ye-uy*h+py)}L${f(xe-ux*h-px)} ${f(ye-uy*h-py)}Z" fill="${color}" opacity="${f(a)}"/>`;
}
function particleFrame(robot){
  const K=robot?MPK:1;
  return real=>{
    const t=real/K;
    const tau=3.2*ease(prog(t,1.5,15.5));
    const xp=1.1*tau, yp=3.2*tau-tau*tau;
    const vx=1.1, vy=3.2-2*tau, ax=0, ay=-2;
    const px=MPX(xp), py=MPY(yp), ox=MPX(0), oy=MPY(0);
    const pr=prog(t,2,3.2), pv=prog(t,4.5,5.7), pa=prog(t,7,8.2);
    let s=txt(400,44,'Motion of a particle in a plane',{size:30});
    s+=`<defs><clipPath id="mpClip"><rect x="55" y="105" width="395" height="275"/></clipPath></defs>`;
    for(let v=1;v<=4;v++){
      s+=`<line x1="${f(MPX(v))}" y1="105" x2="${f(MPX(v))}" y2="380" stroke="#94a3b8" stroke-width="1" opacity=".08"/>`;
      s+=txt(MPX(v),398,String(v),{size:12,fill:'#94a3b8'});
    }
    for(let v=1;v<=3;v++){
      s+=`<line x1="55" y1="${f(MPY(v))}" x2="450" y2="${f(MPY(v))}" stroke="#94a3b8" stroke-width="1" opacity=".08"/>`;
      s+=txt(43,MPY(v)+5,String(v),{size:12,fill:'#94a3b8'});
    }
    s+=path('M55 380H450',{stroke:'#94a3b8',w:1.5,op:.6});
    s+=path('M55 380V105',{stroke:'#94a3b8',w:1.5,op:.6});
    s+=txt(462,384,'x',{size:14,fill:'#94a3b8'});
    s+=txt(43,96,'y',{size:14,fill:'#94a3b8'});
    const full=[];
    for(let i=0;i<=80;i++){const tv=i/25;full.push([MPX(1.1*tv),MPY(3.2*tv-tv*tv)]);}
    s+=`<path d="M${full.map(q=>f(q[0])+' '+f(q[1])).join('L')}" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5" opacity=".35"/>`;
    s+=`<g clip-path="url(#mpClip)">`;
    if(tau>.01){
      const tr=[];
      for(let i=0;i<=60;i++){const tv=i/60*tau;tr.push([MPX(1.1*tv),MPY(3.2*tv-tv*tv)]);}
      s+=`<path d="M${tr.map(q=>f(q[0])+' '+f(q[1])).join('L')}" fill="none" stroke="${CT}" stroke-width="3"/>`;
    }
    if(pr>0) s+=mpArrow(ox,oy,px,py,CC,pr,2.5);
    const vTipX=px+vx*36, vTipY=py-vy*36;
    if(pv>0) s+=mpArrow(px,py,vTipX,vTipY,CA,pv,3);
    const aTipX=px+ax*28, aTipY=py-ay*28;
    if(pa>0) s+=mpArrow(px,py,aTipX,aTipY,CB,pa,3);
    s+=`</g>`;
    s+=`<circle cx="${f(px)}" cy="${f(py)}" r="6" fill="${INK}"/>`;
    s+=`<circle cx="${f(px)}" cy="${f(py)}" r="3" fill="${CT}"/>`;
    if(pr>0) s+=txt((ox+px)/2-8,(oy+py)/2-8,'r',{size:16,fill:CC,op:pr});
    if(pv>0&&tau<2.8) s+=txt(vTipX+8,vTipY-6,'v',{size:16,fill:CA,op:pv});
    if(pa>0&&tau<2.8) s+=txt(aTipX+8,aTipY+14,'a',{size:16,fill:CB,op:pa});
    if(robot){
      const a=ease(prog(t,12,13.4));
      s+=`<rect x="40" y="410" width="520" height="58" rx="14" fill="#0f172a" stroke="${CT}" stroke-width="2"/>`;
      s+=txt(70,435,'r = (x, y)',{size:17,anchor:'start',fill:CC});
      s+=txt(210,435,'v = dr/dt',{size:17,anchor:'start',fill:CA,op:a});
      s+=txt(350,435,'a = dv/dt',{size:17,anchor:'start',fill:CB,op:a});
      s+=txt(70,455,`vx = 1.10   vy = ${vy.toFixed(2)}   ·   Horizontal velocity stays constant.`,{size:11,anchor:'start',fill:'#94a3b8'});
    } else {
      s+=`<rect x="468" y="108" width="288" height="252" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>`;
      s+=txt(488,136,'KINEMATICS',{size:11,anchor:'start',fill:'#94a3b8'});
      s+=txt(488,170,'POSITION',{size:11,anchor:'start',fill:CC});
      s+=txt(488,196,'r(t) = (x(t), y(t))',{size:19,anchor:'start',fill:INK});
      s+=txt(488,232,'VELOCITY',{size:11,anchor:'start',fill:CA});
      s+=txt(488,258,'v = dr/dt',{size:19,anchor:'start',fill:INK});
      s+=txt(488,280,`vx = 1.10   vy = ${vy.toFixed(2)}`,{size:12,anchor:'start',fill:'#94a3b8'});
      s+=txt(488,316,'ACCELERATION',{size:11,anchor:'start',fill:CB});
      s+=txt(488,342,'a = dv/dt = (0, -2)',{size:18,anchor:'start',fill:INK});
      s+=txt(488,360,'Horizontal velocity stays constant.',{size:11,anchor:'start',fill:'#94a3b8'});
    }
    return s+(robot?robotLayer(real,MP_T,CAP_MP_BOT):captionBar(t,CAP_MP_ART));
  };
}
const CAP_MP_ART=[
  [.4,'A particle moves in a plane. Its path is a curve, not just a straight line.'],
  [2,'The position vector r(t) points from the origin to the particle.'],
  [4.6,'Velocity is the rate of change of position: v = dr/dt.'],
  [6.8,'The velocity vector is always tangent to the path.'],
  [9,'Acceleration is the rate of change of velocity: a = dv/dt.'],
  [11.2,'Here gravity gives a constant downward acceleration.'],
  [13.2,'Horizontal velocity stays constant; vertical velocity changes.'],
  [15.4,'Together, r, v and a describe the whole motion.']
];
const CAP_MP_BOT=[
  [.4,"Hi! Let's track a particle moving in a plane."],
  [2.2,'The position vector r points from the origin to the particle.'],
  [4.8,'Velocity is the rate of change of position: v = dr/dt.'],
  [7,'The velocity arrow is tangent to the path.'],
  [9.2,'Acceleration is the rate of change of velocity: a = dv/dt.'],
  [11.4,'Gravity pulls down, so the acceleration arrow points downward.'],
  [13.6,'Horizontal velocity stays constant; vertical velocity changes.'],
  [15.8,'Position, velocity and acceleration describe the whole motion.']
].map(c=>[c[0]*MPK,c[1]]);
const mpk=(a,p)=>[a*MPK,p[0],p[1]];
const MP_T={concl:[15.8*MPK,17.5*MPK],end:19.5*MPK,minX:600};
MP_T.hk=[mpk(0,REST),mpk(.8,REST),mpk(1.6,[MPX(.5),MPY(1.2)]),mpk(2.6,[MPX(.8),MPY(1.5)]),
  mpk(4.8,[MPX(.5),MPY(1.2)]),mpk(7,[MPX(1.4),MPY(2)]),mpk(9.2,[MPX(2.4),MPY(1.6)]),
  mpk(11.5,[MPX(2.8),MPY(1.1)]),mpk(13.8,[400,435]),mpk(16.5,REST),mpk(19.5,REST)];
registerVisual({
  id:'particle-plane',
  rank:13.2,
  title:'Motion of a particle in a plane',
  level:'Class 11–12 · Hard',
  /* MANDATORY: keep all Robot explanations first, then keep the rest. */
  modes:[
    {id:'robot',label:'🤖 Robot explains',duration:MP_T.end,frame:particleFrame(true)},
    {id:'art',  label:'✏️ Line art',      duration:19.5,   frame:particleFrame(false)}
  ]
});

/* =====================================================================
   CAROUSEL ENGINE  (slides slide sideways; the active slide animates itself)
   ===================================================================== */
const track=$('#vcTrack'),view=$('#vcView'),svgs=[],slides=[];
const cur=()=>VISUALS[S.vi].modes[S.mi];
const previewT=v=>v.modes[0].preview!=null?v.modes[0].preview:v.modes[0].duration*.9;
function paramsFor(v){const o={};(v.controls||[]).forEach(c=>{o[c.id]=c.value;});return o;}

function buildControls(){
  const v=VISUALS[S.vi],box=$('#vcTry'),body=$('#vcTryBody'),cs=v.controls||[];
  body.innerHTML='';
  if(!cs.length){box.hidden=true;return;}
  box.hidden=false;
  const rows=[];
  const refresh=()=>rows.forEach(r=>{
    const val=S.params[r.c.id]!=null?S.params[r.c.id]:r.c.value;
    r.inp.value=val;r.out.textContent=r.fmt(val);
  });
  cs.forEach(c=>{
    if(c.type==='options'){
      const row=document.createElement('div');row.className='vc-try-row';
      const name=document.createElement('span');name.textContent=c.label;
      const opts=document.createElement('div');opts.className='vc-try-opts';
      c.options.forEach(o=>{
        const b=document.createElement('button');b.type='button';b.textContent=o.label;
        b.className=(S.params[c.id]!=null?S.params[c.id]:c.value)===o.value?'on':'';
        b.onclick=()=>{S.params[c.id]=o.value;[...opts.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');render();};
        opts.appendChild(b);
      });
      row.append(name,opts);body.appendChild(row);
      return;
    }
    const row=document.createElement('label');row.className='vc-try-row';
    const name=document.createElement('span');name.textContent=c.label;
    const inp=document.createElement('input');inp.type='range';
    inp.min=c.min;inp.max=c.max;inp.step=c.step;
    inp.value=S.params[c.id]!=null?S.params[c.id]:c.value;
    inp.setAttribute('aria-label',v.title+' — '+c.label);
    const out=document.createElement('output');
    const fmt=val=>(Math.round(val*100)/100)+(c.suffix||'');
    out.textContent=fmt(inp.value);
    inp.oninput=()=>{
      S.params[c.id]=parseFloat(inp.value);
      if(v.sync) v.sync(S.params);
      refresh();render();
    };
    rows.push({c,inp,out,fmt});
    row.append(name,inp,out);body.appendChild(row);
  });
  const note=document.createElement('div');note.className='vc-try-note';note.textContent=v.hint||'';
  body.appendChild(note);
}

function rebuild(){
  /* MANDATORY: keep every visual with a Robot explanation first, then keep the rest. */
  VISUALS.sort((a,b)=>{
    const ar=(a.modes||[]).some(m=>m.id==='robot')?0:1;
    const br=(b.modes||[]).some(m=>m.id==='robot')?0:1;
    return ar-br||((a.rank ?? 99)-(b.rank ?? 99));
  });
  track.innerHTML='';svgs.length=0;slides.length=0;
  if(!Object.keys(S.params).length&&VISUALS.length) S.params=paramsFor(VISUALS[S.vi]);
  VISUALS.forEach((v,i)=>{
    const sl=document.createElement('div');sl.className='vc-slide';
    sl.innerHTML='<div class="vc-head"><span class="vc-count">'+(i+1)+' / '+VISUALS.length+'</span><b>'+v.title+'</b>'
      +(v.level?'<span class="vc-band">'+v.level+'</span>':'')+'</div>'
      +'<div class="vc-stage"><svg viewBox="0 0 800 480" role="img" aria-label="'+v.title+'"></svg></div>';
    sl.onclick=()=>{if(i!==S.vi) go(i);};
    track.appendChild(sl);slides.push(sl);svgs.push(sl.querySelector('svg'));
  });
  buildDots();buildModes();buildControls();layout();renderAll();ui();
}
function layout(){
  const w=view.clientWidth||800, sw=w<640?w-44:Math.min(w*.62,760), gap=22;
  slides.forEach((sl,i)=>{sl.style.flexBasis=sw+'px';sl.classList.toggle('on',i===S.vi);});
  track.style.transform='translateX('+((w-sw)/2-S.vi*(sw+gap))+'px)';
}
function renderAll(){
  VISUALS.forEach((v,i)=>{
    const act=i===S.vi, m=act?cur():v.modes[0];
    svgs[i].innerHTML=m.frame(act?Math.min(S.t,m.duration):previewT(v),act?S.params:paramsFor(v));
  });
  progress();
}
function render(){
  const m=cur();
  svgs[S.vi].innerHTML=m.frame(Math.min(S.t,m.duration),S.params);
  progress();
}
function progress(){
  const m=cur();
  $('#vcFill').style.width=(clamp(S.t/m.duration)*100)+'%';
  $('#vcInfo').textContent='Lesson '+(S.vi+1)+' of '+VISUALS.length+'  ·  '+Math.floor(S.t)+'s / '+Math.round(m.duration)+'s';
}
function ui(){$('#bPlay').textContent=S.playing?'⏸ Pause':'▶ Play';}
function buildModes(){
  const v=VISUALS[S.vi],box=$('#vcModes');box.innerHTML='';
  $('#vcModeBox').style.display=v.modes.length>1?'':'none';
  v.modes.forEach((m,i)=>{
    const b=document.createElement('button');b.textContent=m.label;b.className=i===S.mi?'on':'';
    b.onclick=()=>{S.mi=i;S.t=0;clearTimeout(S.adv);buildModes();render();if(!S.playing) play();};
    box.appendChild(b);
  });
}
function buildDots(){
  const d=$('#vcDots');d.innerHTML='';
  VISUALS.forEach((v,i)=>{
    const b=document.createElement('button');b.title=v.title;b.setAttribute('aria-label',v.title);
    b.className=i===S.vi?'on':'';b.onclick=()=>go(i);d.appendChild(b);
  });
}
function tick(ts){
  if(!S.playing) return;
  S.t+=Math.max(0,(ts-S.last)/1000);S.last=ts;
  if(S.t>=cur().duration){S.t=cur().duration;S.playing=false;render();ui();onEnd();return;}
  render();requestAnimationFrame(tick);
}
function play(){
  if(S.playing) return;
  clearTimeout(S.adv);S.manual=false;
  if(S.t>=cur().duration) S.t=0;
  S.playing=true;S.last=performance.now();ui();requestAnimationFrame(tick);
}
function pause(manual=true){S.playing=false;if(manual) S.manual=true;clearTimeout(S.adv);ui();}
function onEnd(){clearTimeout(S.adv);S.adv=setTimeout(()=>{if(!S.manual) go(S.vi+1);},2200);}
function go(i,auto=true){
  if(S.busy||!VISUALS.length) return;
  S.busy=true;clearTimeout(S.adv);S.playing=false;
  S.vi=(i+VISUALS.length)%VISUALS.length;S.mi=0;S.t=0;
  S.params=paramsFor(VISUALS[S.vi]);
  buildDots();buildModes();buildControls();layout();renderAll();ui();
  setTimeout(()=>{S.busy=false;if(auto) play();},560);   // wait for the slide animation
}

$('#bPlay').onclick=()=>S.playing?pause(true):play();
$('#bRep').onclick=()=>{clearTimeout(S.adv);S.t=0;if(S.playing) render();else play();};
$('#bNext').onclick=$('#aNext').onclick=()=>go(S.vi+1);
$('#bPrev').onclick=$('#aPrev').onclick=()=>go(S.vi-1);
$('#vcCar').onkeydown=e=>{if(e.key==='ArrowRight') go(S.vi+1);if(e.key==='ArrowLeft') go(S.vi-1);};
let sx=null;
view.addEventListener('pointerdown',e=>{sx=e.clientX;});
view.addEventListener('pointerup',e=>{
  if(sx===null) return; const dx=e.clientX-sx; sx=null;
  if(Math.abs(dx)>50) go(S.vi+(dx<0?1:-1));
});
window.addEventListener('resize',layout);

S.ready=true;rebuild();

/* start when the carousel scrolls into view, pause when it leaves */
new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){
    if(!S.manual&&!S.playing&&!S.busy){ S.t>=cur().duration?go(S.vi+1):play(); }
  } else if(S.playing){ pause(false); }
}),{threshold:.4}).observe($('#vcCar'));
if(window.parent!==window){
  const reportHeight=()=>window.parent.postMessage(
    {type:'visual-lessons-height',height:document.documentElement.scrollHeight},
    window.location.origin
  );
  const observer=new ResizeObserver(()=>requestAnimationFrame(reportHeight));
  observer.observe(document.documentElement);
  window.addEventListener('load',reportHeight);
  window.addEventListener('resize',reportHeight);
  reportHeight();
}
})();
</script>

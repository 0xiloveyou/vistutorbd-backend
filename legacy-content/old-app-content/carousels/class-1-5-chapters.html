<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Class 1&ndash;5 with Bolt</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f1f5f9;color:#0f172a}
  .bnf{font-family:"Noto Sans Bengali","Nirmala UI","Kalpurush","SolaimanLipi",system-ui,sans-serif}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .top{text-align:center;padding:30px 16px 0}
  .top h1{margin:0;font-size:clamp(22px,3.4vw,34px)}
  .top p{margin:8px 0 0;color:#64748b;font-size:15px}

  /* ===== visual lessons carousel ===== */
  .vc{padding:18px 0 72px;background:linear-gradient(#f1f5f9,#e2e8f0);overflow:hidden}
  .vc-wrap{max-width:none;margin:0 auto;padding:0 16px}

  .vc-carousel{position:relative;outline:none}
  .vc-viewport{overflow:hidden;padding:18px 0 26px;touch-action:pan-y}
  .vc-track{display:flex;gap:22px;transition:transform .55s cubic-bezier(.65,0,.25,1);will-change:transform}
  .vc-slide{flex:0 0 auto;background:#111a2e;border-radius:22px;padding:14px;box-shadow:0 18px 50px #0f172a33;
    opacity:.42;transform:scale(.92);filter:saturate(.6);cursor:pointer;
    transition:opacity .5s,transform .5s,filter .5s}
  .vc-slide.on{opacity:1;transform:none;filter:none;cursor:default}
  .vc-head{display:flex;align-items:center;gap:10px;color:#e6edf7;padding:2px 6px 12px}
  .vc-count{background:#1e293b;color:#38bdf8;font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px}
  .vc-head b{font-size:16px}

  .vc-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}
  .vc-slide.stack .vc-body{grid-template-columns:1fr}
  .vc-stage{border-radius:14px;overflow:hidden;background-color:#0b1220;
    background-image:linear-gradient(rgba(148,163,184,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.07) 1px,transparent 1px);
    background-size:32px 32px}
  .vc-stage svg{display:block;width:100%;height:auto}
  .vc-stage svg text{font-family:"Segoe UI","Segoe UI Symbol","Cambria Math",system-ui,sans-serif}

  /* Bolt's comment panel */
  .vc-cm{position:relative;background:#0b1220;border-radius:14px;overflow:hidden;min-height:0}
  .vc-slide.stack .vc-cm{height:250px}
  .cm-in{position:absolute;inset:0;display:flex;flex-direction:column;padding:10px 10px 12px}
  .cm-top{display:flex;align-items:center;gap:8px;color:#94a3b8;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0 2px 8px;border-bottom:1px solid #1e293b}
  .cm-feed{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;overflow:hidden;padding-top:8px;
    -webkit-mask-image:linear-gradient(transparent,#000 18%);mask-image:linear-gradient(transparent,#000 18%)}
  .cm{display:flex;gap:8px;align-items:flex-end}
  .cm-av{flex:0 0 30px;width:30px;height:30px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:17px}
  .cm-bb{background:#1e293b;color:#f1f5f9;border-radius:14px 14px 14px 4px;padding:8px 11px;font-size:14px;line-height:1.45;min-width:0}
  .cm.old .cm-bb{opacity:.55}
  .cm-bb .en,.cm-bb .bn{display:block;overflow-wrap:anywhere}
  .cm-bb .bn{font-family:"Noto Sans Bengali","Nirmala UI","Kalpurush","SolaimanLipi",system-ui,sans-serif;color:#fde68a;font-size:15px}
  .cm-bb .en + .bn{margin-top:6px;padding-top:6px;border-top:1px dashed #334155}
  .cm-bb i{font-style:normal;color:#38bdf8}
  .cm-hint{color:#64748b;font-size:13px;text-align:center;padding:6px}

  .vc-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:46px;height:46px;border-radius:50%;
    border:0;background:#fff;color:#0f172a;font-size:28px;line-height:1;cursor:pointer;box-shadow:0 6px 18px #0f172a30;
    display:flex;align-items:center;justify-content:center;padding:0 0 4px}
  .vc-arrow:hover{background:#38bdf8}
  .vc-arrow.prev{left:6px}.vc-arrow.next{right:6px}

  .vc-dots{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin:0 0 26px;padding:0 16px}
  .vc-dots button{width:10px;height:10px;padding:0;border:0;border-radius:999px;background:#94a3b8;cursor:pointer;transition:.3s}
  .vc-dots button.on{width:30px;background:#0ea5e9}

  .vc-panel{max-width:980px;margin:0 auto;background:#fff;border:1px solid #e2e8f0;border-radius:20px;
    padding:16px 18px;box-shadow:0 10px 30px #0f172a14;display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 26px;justify-content:space-between}
  .vc-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#94a3b8;font-weight:700;margin-bottom:6px}
  .vc-btns,.vc-modes{display:flex;gap:8px;flex-wrap:wrap}
  .vc-btns button,.vc-modes button{border:1px solid #cbd5e1;background:#f8fafc;color:#0f172a;padding:9px 14px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;font-family:inherit}
  .vc-modes button.on{background:#0f172a;border-color:#0f172a;color:#fff}
  .vc-btns button:hover,.vc-modes button:hover{background:#e0f2fe;border-color:#38bdf8}
  .vc-modes button.on:hover{background:#0f172a}
  .vc-btns button.main{background:#0ea5e9;border-color:#0ea5e9;color:#fff}
  .vc-btns button.main:hover{background:#0284c7}
  #bVoice.on{background:#16a34a;border-color:#16a34a;color:#fff}
  .vc-note{font-size:11px;color:#b45309;margin-top:6px;max-width:230px;line-height:1.3}
  .vc-info{flex:1 1 100%;display:flex;align-items:center;gap:12px;color:#64748b;font-size:13px}
  .vc-prog{flex:1;height:5px;background:#e2e8f0;border-radius:5px;overflow:hidden}
  .vc-prog i{display:block;height:100%;width:0;background:#0ea5e9}
  @media(max-width:640px){.vc-arrow{width:38px;height:38px;font-size:22px}.vc-btns button,.vc-modes button{padding:8px 10px;font-size:13px}}
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>Class 1&ndash;5 Visual Explanations</h1>
    <p>Class 1&ndash;5 &middot; 59 chapters &middot; Bolt draws, speaks and comments in English and <span class="bnf">বাংলা</span></p>
  </header>

  <section id="vc" class="vc" aria-label="Classes 1 to 5: animated lessons">
    <h2 class="sr">Classes 1 to 5 with Bolt the robot</h2>
    <div class="vc-wrap">

      <div class="vc-carousel" id="vcCar" tabindex="0" aria-roledescription="carousel">
        <button class="vc-arrow prev" id="aPrev" aria-label="Previous lesson">&#8249;</button>
        <div class="vc-viewport" id="vcView"><div class="vc-track" id="vcTrack"></div></div>
        <button class="vc-arrow next" id="aNext" aria-label="Next lesson">&#8250;</button>
      </div>
      <div class="vc-dots" id="vcDots"></div>

      <div class="vc-panel">
        <div>
          <div class="vc-label">Playback</div>
          <div class="vc-btns">
            <button id="bPrev" aria-label="Previous lesson">⏮ Back</button>
            <button id="bPlay" class="main" aria-label="Pause or play">⏸ Pause</button>
            <button id="bRep"  aria-label="Watch again">⟲ Watch again</button>
            <button id="bNext" aria-label="Next lesson">Next ⏭</button>
          </div>
        </div>
        <div>
          <div class="vc-label">Language</div>
          <div class="vc-modes bnf" id="vcLang"></div>
        </div>
        <div>
          <div class="vc-label">Voice</div>
          <div class="vc-btns"><button id="bVoice" aria-label="Turn Bolt's voice on or off">🔇 Voice off</button></div>
          <div class="vc-note" id="vcVoiceNote"></div>
        </div>
        <div id="vcModeBox">
          <div class="vc-label">Style</div>
          <div class="vc-modes" id="vcModes"></div>
        </div>
        <div class="vc-info"><span id="vcInfo"></span><div class="vc-prog"><i id="vcFill"></i></div></div>
      </div>
    </div>
  </section>
</main>

<script>
(function(){
/* =====================================================================
   HOW TO ADD A NEW LESSON
   lesson('id','Slide title','Heading drawn on the board',A=>{
     A.say('English comment','বাংলা মন্তব্য');          // comment bubble + voice + talking
     A.text(x,y,'hello',{size:22,c:'#fbbf24'});          // Bolt writes it with the pen
     const g=A.mat(cx,cy,[[1,2],[3,4]],{cw:56,rh:44,size:24,col:(i,j)=>...});   // matrix (optional)
     A.box(g.cell(i,j),colour);  A.arrow(..); A.circle(..); A.rect(..); A.line(..); A.ell(..); A.pts([[x,y],..],{c,w,fill,fo});
   });
   Everything is drawn by Bolt's pen in the order you call it. The stage is 800 x 480.
   ===================================================================== */
const VISUALS=[];
const S={vi:0,mi:0,t:0,playing:false,manual:false,last:0,adv:null,busy:false,ready:false,lang:'both',voice:false,sp:null};
window.registerVisual=v=>{VISUALS.push(v);if(S.ready) rebuild();};

/* ---------- tiny helpers ---------- */
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const lerp=(a,b,k)=>a+(b-a)*k;
const f=n=>Math.round(n*10)/10;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function path(d,o={}){
  const {stroke='#e2e8f0',w=2,fill='none',fo=1,op=1,draw=1}=o;
  if(draw<=0) return '';
  const dash=draw<1?` stroke-dasharray="1" stroke-dashoffset="${1-draw}"`:'';
  return `<path d="${d}" pathLength="1" fill="${fill}" fill-opacity="${fo}" stroke="${stroke}" stroke-width="${w}" opacity="${op}" stroke-linejoin="round" stroke-linecap="round"${dash}/>`;
}
function txt(x,y,s,o={}){
  const {size=18,fill='#e2e8f0',anchor='middle',op=1,weight=700}=o;
  if(op<=0) return '';
  return `<text x="${f(x)}" y="${f(y)}" font-size="${size}" fill="${fill}" text-anchor="${anchor}" opacity="${op}" font-weight="${weight}">${esc(s)}</text>`;
}
const cap=(list,t)=>{let c=null;for(const e of list) if(e[0]<=t) c=e;return c;};
const capIdx=(list,t)=>{let k=-1;for(let i=0;i<list.length;i++) if(list[i][0]<=t) k=i;return k;};
/* how long one comment stays on screen (same for every language mode, so timing never changes) */
const ctime=c=>(c[1].length+c[2].length)/20+.35;

const AM='#fbbf24',SK='#38bdf8',GR='#4ade80',PK='#f472b6',VI='#c4b5fd',RD='#f87171',INK='#e2e8f0',MU='#94a3b8';

/* =====================================================================
   BOLT: cute robot with rocket shoes, holding a pen
   ===================================================================== */
function robotSvg(t,cx,cy,tilt,sgn,spd,pen,talking,happy,ink,s){
  const th=tilt*Math.PI/180;
  const ox=34*sgn, oy=-20;
  const sx=cx+s*(ox*Math.cos(th)-oy*Math.sin(th)), sy=cy+s*(ox*Math.sin(th)+oy*Math.cos(th));
  const hx=pen[0]+16, hy=pen[1]-30;
  const dist=Math.hypot(hx-sx,hy-sy), sag=Math.min(36,dist*.28);
  const mx=(sx+hx)/2, my=(sy+hy)/2+sag;
  const fl=30+Math.sin(t*25)*5+clamp(spd/10,0,26);
  const blink=(t%3.8)>3.65?.12:1, mo=talking?4+Math.abs(Math.sin(t*17))*8:3;
  const ex=clamp((pen[0]-cx)/90,-1,1)*3, ey=clamp((pen[1]-cy)/120,-1,1)*2;
  let b='';
  [-14,14].forEach(x=>{
    const sd=x<0?-1:1;
    b+=`<path d="M${x-7} 70Q${x-3} ${f(70+fl*.6)} ${x} ${f(70+fl)}Q${x+3} ${f(70+fl*.6)} ${x+7} 70Z" fill="#fb923c"/><path d="M${x-3} 70L${x} ${f(70+fl*.62)}L${x+3} 70Z" fill="#fde047"/>`;
    b+=`<rect x="${x-4}" y="34" width="8" height="16" fill="#94a3b8"/>`;
    b+=`<rect x="${x-6}" y="64" width="12" height="7" rx="2" fill="#475569"/><rect x="${x-12}" y="48" width="24" height="18" rx="6" fill="#f87171" stroke="#b91c1c" stroke-width="2"/>`;
    b+=`<path d="M${x+sd*12} 52L${x+sd*23} 67L${x+sd*12} 64Z" fill="#fbbf24" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round"/>`;
  });
  b+=`<path d="M${-ox} -20Q${f(-ox*1.45)} 4 ${f(-ox*1.25)} 24" fill="none" stroke="#94a3b8" stroke-width="9" stroke-linecap="round"/><circle cx="${f(-ox*1.25)}" cy="26" r="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2.5"/>`;
  b+=`<rect x="-36" y="-42" width="72" height="78" rx="16" fill="#cbd5e1" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="0" cy="-8" r="11" fill="#38bdf8" opacity="${f(.6+.4*Math.sin(t*4))}"/>
  <rect x="-8" y="-52" width="16" height="12" fill="#94a3b8"/>
  <line x1="0" y1="-114" x2="0" y2="-132" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="0" cy="-137" r="7" fill="#f472b6"/>
  <rect x="-46" y="-114" width="92" height="66" rx="22" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
  <rect x="-35" y="-104" width="70" height="46" rx="14" fill="#0f172a"/>
  <ellipse cx="${f(-15+ex)}" cy="${f(-86+ey)}" rx="7" ry="${f(7*blink)}" fill="#38bdf8"/>
  <ellipse cx="${f(15+ex)}" cy="${f(-86+ey)}" rx="7" ry="${f(7*blink)}" fill="#38bdf8"/>
  <rect x="-9" y="-72" width="18" height="${f(mo)}" rx="3" fill="#38bdf8"/>
  <circle cx="-27" cy="-74" r="4" fill="#f472b6" opacity=".6"/><circle cx="27" cy="-74" r="4" fill="#f472b6" opacity=".6"/>`;
  const px=pen[0],py=pen[1];
  let o=`<g transform="translate(${f(cx)} ${f(cy)}) rotate(${f(tilt)}) scale(${s})">${b}</g>`;
  o+=`<path d="M${f(sx)} ${f(sy)}Q${f(mx)} ${f(my)} ${f(hx)} ${f(hy)}" fill="none" stroke="#94a3b8" stroke-width="9" stroke-linecap="round"/>`;
  o+=`<line x1="${f(px+5)}" y1="${f(py-10)}" x2="${f(px+27)}" y2="${f(py-52)}" stroke="#f472b6" stroke-width="8" stroke-linecap="round"/>`;
  o+=`<path d="M${f(px)} ${f(py)}L${f(px+2)} ${f(py-10)}L${f(px+9)} ${f(py-8)}Z" fill="#e2e8f0"/>`;
  if(ink) o+=`<circle cx="${f(px)}" cy="${f(py)}" r="9" fill="${ink}" opacity=".25"/><circle cx="${f(px)}" cy="${f(py)}" r="3.5" fill="${ink}"/>`;
  o+=`<circle cx="${f(hx)}" cy="${f(hy)}" r="11" fill="#fde68a" stroke="#f59e0b" stroke-width="3"/>`;
  return o;
}

/* =====================================================================
   LESSON ENGINE: every element is drawn by the pen, in order.
   ===================================================================== */
function mkP(pts){const cum=[0];for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return {pts,cum,len:cum[cum.length-1]||1};}
function ptAt(P,u){
  const g=u*P.len;let i=1;
  while(i<P.pts.length-1&&P.cum[i]<g) i++;
  const a=P.pts[i-1],b=P.pts[i],sl=P.cum[i]-P.cum[i-1]||1,k=clamp((g-P.cum[i-1])/sl);
  return [a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k];
}
const epts=(cx,cy,rx,ry,n=48)=>{const p=[];for(let i=0;i<=n;i++){const a=-Math.PI/2+i*2*Math.PI/n;p.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)]);}return p;};
const rpts=(x,y,w,h)=>[[x,y],[x+w,y],[x+w,y+h],[x,y+h],[x,y]];
const dstr=pts=>'M'+pts.map(p=>f(p[0])+' '+f(p[1])).join('L');

function elPos(e,u){return e.k==='s'?ptAt(e.P,u):[e.xs+e.w*u,e.yy];}
function penAt(L,t){
  const E=L.els,R=L.rest;let i=-1;
  for(let k=0;k<E.length;k++){if(E[k].t0<=t) i=k; else break;}
  if(i<0){const e=E[0],u=ease(prog(t,e.t0-e.tr,e.t0));return [lerp(R[0],e.start[0],u),lerp(R[1],e.start[1],u)];}
  const e=E[i];
  if(t<=e.t1) return elPos(e,prog(t,e.t0,e.t1));
  const nx=E[i+1];
  if(!nx){const u=ease(prog(t,e.t1+.6,e.t1+2.4));return [lerp(e.end[0],R[0],u),lerp(e.end[1],R[1],u)];}
  const u=ease(prog(t,nx.t0-nx.tr,nx.t0));
  return [lerp(e.end[0],nx.start[0],u),lerp(e.end[1],nx.start[1],u)];
}
function bodyAt(L,t){
  let x=0,y=0,sd=0;const N=9;
  for(let j=0;j<N;j++){
    const p=penAt(L,Math.max(0,t-j*.11)), side=clamp((640-p[0])/60,-1,1);
    x+=p[0]+side*85; y+=p[1]-48; sd+=side;
  }
  x=clamp(x/N,62,738); y=clamp(y/N,168,330); sd/=N;
  const E=L.els,last=E[E.length-1];
  const u=Math.max(1-ease(prog(t,.2,E[0].t0)),ease(prog(t,last.t1+.6,last.t1+2.4)));
  return [lerp(x,L.park[0],u),lerp(y,L.park[1],u),lerp(sd,1,u),lerp(.72,.5,u)];
}
function drawEl(e,t){
  const p=prog(t,e.t0,e.t1); if(p<=0) return '';
  if(e.k==='s'){
    let s='';
    if(e.fill){const q=prog(t,e.t1,e.t1+.5);if(q>0) s+=path(e.d+'Z',{stroke:'none',fill:e.fill,fo:e.fo*q,w:0});}
    return s+path(e.d,{stroke:e.c,w:e.w,draw:p});
  }
  const n=Math.floor(p*e.s.length+1e-6); if(n<=0) return '';
  const body=n>=e.s.length?esc(e.s):`${esc(e.s.slice(0,n))}<tspan opacity="0">${esc(e.s.slice(n))}</tspan>`;
  return `<text x="${f(e.x)}" y="${f(e.y)}" font-size="${e.size}" fill="${e.c}" text-anchor="${e.anchor}" font-weight="${e.weight}">${body}</text>`;
}

function lesson(id,title,head,build){
  const els=[],caps=[];let c=.5,last=null,ls=null,park=[762,100];
  const restOf=()=>[park[0]-26,park[1]+46];
  const add=(e,dur)=>{
    if(!last) last=restOf();
    const d=Math.hypot(e.start[0]-last[0],e.start[1]-last[1]);
    e.tr=clamp(d/520,.08,1); e.t0=c+e.tr; e.t1=e.t0+dur; c=e.t1+.04; last=e.end; els.push(e);
  };
  const A={
    park(x,y){park=[x,y];},
    say(en,bn){ if(ls) c=Math.max(c,ls[0]+ctime(ls)); const e=[c,en,bn]; caps.push(e); ls=e; },
    pts(P,o={},dur=.8){
      add({k:'s',d:dstr(P),c:o.c||INK,w:o.w||3,fill:o.fill,fo:o.fo||.2,P:mkP(P),start:P[0],end:P[P.length-1]},dur);
    },
    line(x1,y1,x2,y2,o={},dur=.5){A.pts([[x1,y1],[x2,y2]],o,dur);},
    arrow(x1,y1,x2,y2,o={},dur=.5){
      A.line(x1,y1,x2,y2,o,dur);
      const a=Math.atan2(y2-y1,x2-x1),h=11;
      A.pts([[x2-h*Math.cos(a-.5),y2-h*Math.sin(a-.5)],[x2,y2],[x2-h*Math.cos(a+.5),y2-h*Math.sin(a+.5)]],o,.2);
    },
    dashed(x1,y1,x2,y2,o={},dur=.9){
      const l=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/l,uy=(y2-y1)/l;let d='';
      for(let k=0;k<l;k+=11){const e=Math.min(k+6,l);d+=`M${f(x1+ux*k)} ${f(y1+uy*k)}L${f(x1+ux*e)} ${f(y1+uy*e)}`;}
      add({k:'s',d,c:o.c||INK,w:o.w||2,P:mkP([[x1,y1],[x2,y2]]),start:[x1,y1],end:[x2,y2]},dur);
    },
    circle(cx,cy,r,o={},dur=.8){A.pts(epts(cx,cy,r,r),o,dur);},
    ell(cx,cy,rx,ry,o={},dur=1){A.pts(epts(cx,cy,rx,ry),o,dur);},
    rect(x,y,w,h,o={},dur=.8){A.pts(rpts(x,y,w,h),o,dur);},
    text(x,y,s,o={},dur){
      const size=o.size||20,anchor=o.anchor||'middle',w=s.length*size*.56;
      const xs=anchor==='middle'?x-w/2:anchor==='end'?x-w:x, yy=y-size*.3;
      add({k:'t',x,y,s,size,c:o.c||INK,anchor,weight:o.weight||700,xs,w,yy,start:[xs,yy],end:[xs+w,yy]},dur||(.25+s.length*.05));
    },
    /* a matrix: brackets (or |bars|) + entries, drawn by the pen. returns its geometry */
    mat(cx,cy,M,o={},dur=.16){
      const cw=o.cw||56,rh=o.rh||44,size=o.size||22,R=M.length,C=M[0].length,W=C*cw,H=R*rh,x0=cx-W/2,y0=cy-H/2;
      const col=o.col||(()=>INK),bc=o.bc||MU;
      if(o.bar){
        A.line(x0,y0-4,x0,y0+H+4,{c:bc,w:3},.3); A.line(x0+W,y0-4,x0+W,y0+H+4,{c:bc,w:3},.3);
      }else{
        A.pts([[x0+8,y0-4],[x0-2,y0-4],[x0-2,y0+H+4],[x0+8,y0+H+4]],{c:bc,w:3},.35);
        A.pts([[x0+W-8,y0-4],[x0+W+2,y0-4],[x0+W+2,y0+H+4],[x0+W-8,y0+H+4]],{c:bc,w:3},.35);
      }
      M.forEach((r,i)=>r.forEach((v,j)=>{
        A.text(x0+cw*(j+.5),y0+rh*(i+.5)+size*.35,String(v),{size,c:col(i,j,v)},dur);
      }));
      return {x0,y0,W,H,cw,rh,cx:j=>x0+cw*(j+.5),cy:i=>y0+rh*(i+.5),cell:(i,j)=>[x0+cw*j+3,y0+rh*i+3,cw-6,rh-6]};
    },
    box(r,c){A.rect(r[0],r[1],r[2],r[3],{c,w:2.5,fill:c,fo:.17},.3);}
  };
  build(A);
  const endT=Math.max(c,ls?ls[0]+ctime(ls):0), D=endT+3.4;
  const L={els,caps,D,head,park,rest:restOf()};
  const mk=robot=>t=>{
    let s=txt(400,34,head,{size:22});
    els.forEach(e=>{s+=drawEl(e,t);});
    if(!robot) return s;
    const pen=penAt(L,t), body=bodyAt(L,t), bq=bodyAt(L,Math.max(0,t-.1));
    const vx=(body[0]-bq[0])/.1, vy=(body[1]-bq[1])/.1;
    let ink=null;
    for(const e of els) if(e.t0<=t&&t<=e.t1){ink=e.c;break;}
    const cp=cap(caps,t), talking=!!cp&&(t-cp[0])<ctime(cp);
    const happy=t>=D-3.2, bob=happy?-Math.abs(Math.sin(t*6))*12:Math.sin(t*2.2)*4;
    s+=robotSvg(t,body[0],body[1]+bob,clamp(vx*.03,-12,12),-body[2],Math.hypot(vx,vy),pen,talking,happy,ink,body[3]);
    return s;
  };
  registerVisual({id,title,caps,modes:[
    {id:'robot',label:'🤖 Bolt draws',duration:D,frame:mk(true)},
    {id:'art',label:'✏️ Line art',duration:D,frame:mk(false)}]});
}

const NOTE=(A,y,s)=>A.text(400,y,'Note: '+s,{size:18,c:AM});
const card=(A,x,y,w,h,c,label,sub,size=34)=>{
  A.rect(x,y,w,h,{c,w:3,fill:c,fo:.14},.3);
  A.text(x+w/2,y+h/2+(sub?-4:12),label,{size,c});
  if(sub)A.text(x+w/2,y+h/2+26,sub,{size:15,c:MU});
};
const dot=(A,x,y,c,r=11)=>A.circle(x,y,r,{c,w:2,fill:c,fo:.85},.15);
const groupRow=(A,x,y,n,c,gap=30,r=10)=>{for(let i=0;i<n;i++)dot(A,x+i*gap,y,c,r);};
const tenFrame=(A,x,y,c,n,cell=44)=>{
  for(let i=0;i<10;i++){
    const row=Math.floor(i/5),k=i%5;
    A.rect(x+k*cell,y+row*cell,cell-3,cell-3,{c:MU,w:2},.1);
    if(i<n)A.circle(x+k*cell+(cell-3)/2,y+row*cell+(cell-3)/2,12,{c,w:2,fill:c,fo:.85},.12);
  }
};
const shapeCircle=(A,cx,cy,r,c)=>A.circle(cx,cy,r,{c,w:3,fill:c,fo:.14},.5);
const shapeSquare=(A,cx,cy,s,c)=>A.rect(cx-s/2,cy-s/2,s,s,{c,w:3,fill:c,fo:.14},.5);
const shapeRect=(A,cx,cy,w,h,c)=>A.rect(cx-w/2,cy-h/2,w,h,{c,w:3,fill:c,fo:.14},.5);
const shapeTriangle=(A,cx,cy,s,c)=>A.pts([[cx,cy-s/2],[cx+s/2,cy+s/2],[cx-s/2,cy+s/2],[cx,cy-s/2]],{c,w:3,fill:c,fo:.14},.5);
const clockFace=(A,cx,cy,r,h,m)=>{
  A.circle(cx,cy,r,{c:SK,w:3,fill:SK,fo:.05},.5);
  for(let i=0;i<12;i++){
    const a=-Math.PI/2+i*Math.PI/6;
    A.text(cx+Math.cos(a)*(r-18),cy+Math.sin(a)*(r-18)+5,String(i===0?12:i),{size:13,c:MU});
  }
  const ah=-Math.PI/2+(h%12)*Math.PI/6, am=-Math.PI/2+m*Math.PI/30;
  A.line(cx,cy,cx+Math.cos(ah)*(r*.5),cy+Math.sin(ah)*(r*.5),{c:AM,w:5},.25);
  A.line(cx,cy,cx+Math.cos(am)*(r*.78),cy+Math.sin(am)*(r*.78),{c:SK,w:3},.25);
  A.circle(cx,cy,6,{c:INK,w:2,fill:INK,fo:1},.1);
};
const coin=(A,cx,cy,r,c,label)=>{
  A.circle(cx,cy,r,{c,w:3,fill:c,fo:.16},.35);
  A.text(cx,cy+8,label,{size:20,c});
};
const noteBill=(A,x,y,w,h,c,label)=>{
  A.rect(x,y,w,h,{c,w:3,fill:c,fo:.16},.3);
  A.text(x+w/2,y+h/2+9,label,{size:24,c});
};
const numLine=(A,x1,x2,y,from,to,step,marks)=>{
  A.arrow(x1,y,x2,y,{c:MU,w:2},.4);
  const span=x2-x1, X=v=>x1+span*((v-from)/(to-from));
  for(let v=from;v<=to;v+=step){
    A.line(X(v),y-6,X(v),y+6,{c:MU,w:2},.1);
    A.text(X(v),y+23,String(v),{size:13,c:MU});
  }
  (marks||[]).forEach(([v,lab,c])=>{
    A.circle(X(v),y,6,{c:c||AM,w:2,fill:c||AM,fo:1},.15);
    if(lab)A.text(X(v),y-16,lab,{size:16,c:c||AM});
  });
};
const fracBar=(A,x,y,w,h,n,shade,c)=>{
  A.rect(x,y,w,h,{c:MU,w:2.5},.4);
  for(let i=1;i<n;i++) A.line(x+w*i/n,y,x+w*i/n,y+h,{c:MU,w:1.5},.1);
  for(let i=0;i<shade;i++) A.rect(x+w*i/n+2,y+2,w/n-4,h-4,{c:c||AM,w:0,fill:c||AM,fo:.45},.12);
};
const bars=(A,x,y,w,h,vals,cols,labels)=>{
  const max=Math.max.apply(null,vals), bw=w/vals.length;
  A.arrow(x,y,x,y-h-12,{c:MU,w:2},.3);
  A.arrow(x,y,x+w+12,y,{c:MU,w:2},.3);
  vals.forEach((v,i)=>{
    const bh=h*(v/max);
    A.rect(x+bw*i+bw*.15,y-bh,bw*.7,bh,{c:cols[i%cols.length],w:2.5,fill:cols[i%cols.length],fo:.35},.3);
    A.text(x+bw*i+bw*.5,y-bh-8,String(v),{size:15,c:cols[i%cols.length]});
    if(labels)A.text(x+bw*i+bw*.5,y+22,labels[i],{size:13,c:MU});
  });
};
const grid=(A,x,y,n,m,cell)=>{
  for(let i=0;i<=m;i++) A.line(x+i*cell,y,x+i*cell,y+n*cell,{c:MU,w:1.5},.05);
  for(let j=0;j<=n;j++) A.line(x,y+j*cell,x+m*cell,y+j*cell,{c:MU,w:1.5},.05);
};

  A.text(400,110,'6 + 4 = 10',{size:38,c:SK});
  A.say("From six and four making ten, we can write three more facts.",
        "ছয় ও চার মিলে দশ হলে আরও তিনটি তথ্য লেখা যায়।");
  A.text(400,180,'4 + 6 = 10',{size:28,c:MU});
  A.text(400,230,'10 - 6 = 4',{size:28,c:MU});
  A.text(400,280,'10 - 4 = 6',{size:28,c:MU});
  A.say("This helps us check our work: if six plus four is ten, then ten minus six is four.",
        "এটি কাজ যাচাইয়ে সাহায্য করে: ছয় যোগ চার দশ হলে, দশ বিয়োগ ছয় চার।");
  NOTE(A,432,'one fact family has two sums and two differences.');
});

lesson('c3-05','Multiplication','Multiply by splitting the number',A=>{
  A.say("Multiplication finds the total of equal groups.",
        "গুণ সমান দলের মোট বের করে।");
  A.text(400,100,'24 × 3',{size:40,c:SK});
  A.say("Split twenty-four into twenty and four, then multiply each part.",
        "চব্বিশকে বিশ ও চারে ভাগ করো, তারপর প্রতিটি অংশ গুণ করো।");
  A.text(400,180,'20 × 3 = 60',{size:28,c:GR});
  A.text(400,230,' 4 × 3 = 12',{size:28,c:GR});
  A.say("Add the parts: sixty plus twelve is seventy-two.",
        "অংশগুলো যোগ করো: ষাট যোগ বারো সমান বাহাত্তর।");
  A.text(400,305,'24 × 3 = 72',{size:40,c:AM});
  NOTE(A,432,'split big numbers to multiply easily.');
});

lesson('c3-06','Division','Sharing into equal groups',A=>{
  A.say("Division splits a number into equal groups.",
        "ভাগ একটি সংখ্যাকে সমান দলে ভাগ করে।");
  for(let g=0;g<3;g++){
    A.rect(130+g*160,110,130,120,{c:MU,w:2},.2);
    for(let i=0;i<8;i++) dot(A,155+g*160+(i%4)*32,140+Math.floor(i/4)*46,SK,11);
  }
  A.say("Seventy-two shared into three equal groups gives twenty-four in each group.",
        "বাহাত্তরকে তিনটি সমান দলে ভাগ করলে প্রতিটিতে চব্বিশ হয়।");
  A.text(400,300,'72 ÷ 3 = 24',{size:42,c:GR});
  A.say("Division is also the opposite of multiplication.",
        "ভাগ গুণেরও বিপরীত।");
  A.text(400,365,'24 × 3 = 72',{size:26,c:MU});
  NOTE(A,432,'divide: share equally or find how many groups.');
});

lesson('c3-07','Multiplication and Division Facts','Fact families',A=>{
  A.say("Multiplication and division also form fact families.",
        "গুণ ও ভাগও তথ্য-পরিবার গঠন করে।");
  A.text(400,110,'7 × 8 = 56',{size:40,c:AM});
  A.say("From this one fact we can write the other facts.",
        "এই একটি তথ্য থেকে বাকি তথ্যগুলো লিখতে পারি।");
  A.text(400,185,'8 × 7 = 56',{size:30,c:MU});
  A.say("Now divide the product by each factor.",
        "এখন গুণফলকে প্রতিটি উৎপাদক দিয়ে ভাগ করো।");
  A.text(400,255,'56 ÷ 8 = 7',{size:30,c:GR});
  A.text(400,315,'56 ÷ 7 = 8',{size:30,c:GR});
  NOTE(A,432,'two multiplied numbers make a product; divide to get back.');
});

lesson('c3-08','Four Operations in Problems','Multi-step word problems',A=>{
  A.say("Some problems need more than one operation. Read in steps.",
        "কিছু সমস্যায় একাধিক ক্রিয়া লাগে। ধাপে ধাপে পড়ো।");
  A.say("A shop has five boxes with twelve mangoes in each box.",
        "দোকানে পাঁচটি বাক্স আছে, প্রতিটিতে বারোটি আম।");
  A.text(400,170,'5 × 12 = 60',{size:30,c:SK});
  A.say("Then sixteen mangoes are sold. How many remain? Subtract.",
        "তারপর ষোলোটি আম বিক্রি হলো। কত বাকি? বিয়োগ করো।");
  A.text(400,240,'60 - 16 = 44',{size:30,c:PK});
  A.say("Forty-four mangoes remain. Always check what the question asks.",
        "চুয়াল্লিশটি আম বাকি। প্রশ্ন কী চায় তা সবসময় মিলাও।");
  A.text(400,310,'Answer: 44 mangoes',{size:28,c:GR});
  NOTE(A,432,'solve step by step, one operation at a time.');
});

lesson('c3-09','Fractions','Numerator and denominator',A=>{
  A.say("A fraction shows equal parts of a whole.",
        "ভগ্নাংশ একটি সম্পূর্ণের সমান অংশ দেখায়।");
  fracBar(A,140,120,260,70,4,3,SK);
  A.text(470,150,'3 / 4',{size:44,c:AM,anchor:'start'});
  A.say("The bottom number, four, is the denominator: how many equal parts.",
        "নিচের সংখ্যা চার হলো হর: কতটি সমান অংশ।");
  A.say("The top number, three, is the numerator: how many parts we take.",
        "উপরের সংখ্যা তিন হলো লব: কতটি অংশ নিই।");
  A.text(400,300,'3 of 4 parts are shaded',{size:22,c:MU});
  A.text(400,355,'numerator 3  /  denominator 4',{size:20,c:SK});
  NOTE(A,432,'denominator shows total parts, numerator shows taken parts.');
});

lesson('c3-10','Bangladeshi Currency','Notes, coins and change',A=>{
  A.say("We use taka and paisa in Bangladesh.",
        "বাংলাদেশে আমরা টাকা ও পয়সা ব্যবহার করি।");
  noteBill(A,120,110,150,85,SK,'100');
  noteBill(A,300,110,140,85,GR,'50');
  coin(A,500,150,42,PK,'20');
  A.say("One hundred plus fifty plus twenty is one hundred seventy taka.",
        "একশ যোগ পঞ্চাশ যোগ বিশ সমান একশ সত্তর টাকা।");
  A.text(400,250,'100 + 50 + 20 = 170',{size:28,c:AM});
  A.say("If you pay two hundred taka, the change is thirty taka.",
        "দুইশ টাকা দিলে খুচরা ত্রিশ টাকা।");
  A.text(400,320,'200 - 170 = 30',{size:32,c:GR});
  NOTE(A,432,'add the cost, then subtract from the money given.');
});

lesson('c3-11','Measurement','Length, weight and volume',A=>{
  A.say("One metre is one hundred centimetres, and one kilogram is one thousand grams.",
        "এক মিটার একশ সেন্টিমিটার, আর এক কিলোগ্রাম এক হাজার গ্রাম।");
  A.text(400,115,'1 m = 100 cm',{size:32,c:SK});
  A.text(400,175,'1 kg = 1000 g',{size:32,c:GR});
  A.say("One litre is one thousand millilitres.",
        "এক লিটার এক হাজার মিলিলিটার।");
  A.text(400,240,'1 L = 1000 mL',{size:32,c:PK});
  A.say("To change units, multiply or divide by the right number.",
        "একক বদলাতে সঠিক সংখ্যা দিয়ে গুণ বা ভাগ করো।");
  A.text(400,315,'2 m = 200 cm',{size:28,c:AM});
  A.text(400,365,'3 kg = 3000 g',{size:28,c:AM});
  NOTE(A,432,'big unit to small unit: multiply.');
});

lesson('c3-12','Geometry','Lines, angles and symmetry',A=>{
  A.say("A line goes straight. Two lines can meet at a point.",
        "রেখা সোজা যায়। দুইটি রেখা একটি বিন্দুতে মিলতে পারে।");
  A.line(120,120,420,120,{c:SK,w:4},.4);
  A.circle(470,120,5,{c:AM,w:2,fill:AM,fo:1},.1);
  A.text(470,90,'point',{size:16,c:AM});
  A.say("A right angle is a square corner. It measures ninety degrees.",
        "সমকোণ একটি বর্গাকার কোণ। এর মাপ নব্বই ডিগ্রি।");
  A.pts([[170,200],[170,290],[260,290]],{c:GR,w:4},.4);
  A.rect(170,265,25,25,{c:GR,w:2},.1);
  A.text(215,225,'90°',{size:20,c:GR});
  A.say("A shape is symmetric when a fold line makes two matching halves.",
        "ভাঁজ রেখা দুইটি মিলন্ত অর্ধেক তৈরি করলে আকৃতি প্রতিসম।");
  A.pts([[430,195],[510,195],[520,285],[420,285],[430,195]],{c:PK,w:3,fill:PK,fo:.12},.4);
  A.line(470,185,470,295,{c:RD,w:2,fo:.8},.4);
  NOTE(A,432,'right angle equals a square corner.');
});

lesson('c3-13','Data','Read and make charts',A=>{
  A.say("Data is information we collect, like favourite sports.",
        "উপাত্ত হলো আমরা সংগ্রহ করা তথ্য, যেমন প্রিয় খেলা।");
  bars(A,140,330,320,180,[6,4,8,3],[SK,GR,PK,AM],['cricket','football','chess','running']);
  A.say("The tallest bar shows the most popular sport.",
        "সবচেয়ে উঁচু দণ্ড সবচেয়ে জনপ্রিয় খেলা দেখায়।");
  A.say("We read the height of each bar to compare the counts.",
        "প্রতিটি দণ্ডের উচ্চতা পড়ে গণনা তুলনা করি।");
  A.text(530,300,'chess: 8',{size:20,c:PK,anchor:'start'});
  NOTE(A,432,'charts make numbers easy to compare.');
});

lesson('c4-01','Place Value (to lakh)','Large numbers and expanded form',A=>{
  A.say("Large numbers in Bangladesh are grouped in lakhs and thousands.",
        "বাংলাদেশে বড় সংখ্যা লাখ ও হাজারে ভাগ করা হয়।");
  A.text(400,120,'4,52,306',{size:48,c:SK});
  A.say("Read it as four lakh fifty-two thousand three hundred six.",
        "পড়ো: চার লাখ বায়ান্ন হাজার তিনশ ছয়।");
  A.text(400,205,'4,00,000 + 50,000 + 2,000 + 300 + 6',{size:22,c:GR});
  A.say("The place of each digit tells its value.",
        "প্রতিটি অঙ্কের স্থান তার মান বলে দেয়।");
  A.text(400,275,'4 lakh  5 ten-thousand  2 thousand',{size:20,c:MU});
  A.say("To compare large numbers, start from the leftmost place.",
        "বড় সংখ্যা তুলনায় বাঁদিকের স্থান থেকে শুরু করো।");
  A.text(400,345,'4,52,306  >  4,50,999',{size:28,c:AM});
  NOTE(A,432,'more digits means a larger number.');
});

lesson('c4-02','Addition and Subtraction','Large numbers with carrying and borrowing',A=>{
  A.say("Add large numbers column by column, starting from the ones.",
        "একক থেকে শুরু করে কলামে কলামে বড় সংখ্যা যোগ করো।");
  A.text(360,105,' 4 5 6 7 8',{size:32,c:SK,anchor:'end'});
  A.text(360,155,'+2 3 4 5 6',{size:32,c:GR,anchor:'end'});
  A.line(240,180,380,180,{c:MU,w:2},.2);
  A.say("Each time a column passes nine, carry one to the next place.",
        "প্রতিবার কলাম নয় ছাড়ালে পরের স্থানে এক হাতে রাখো।");
  A.text(360,235,' 6 9 1 3 4',{size:32,c:AM,anchor:'end'});
  A.say("For subtraction, borrow from the next place when the top digit is smaller.",
        "বিয়োগে উপরের অঙ্ক ছোট হলে পরের স্থান থেকে ধার নাও।");
  A.text(400,325,'70,000 - 28,456 = 41,544',{size:28,c:GR});
  NOTE(A,432,'align the places before adding or subtracting.');
});

lesson('c4-03','Multiplication','Multiply two-digit numbers',A=>{
  A.say("To multiply twenty-three by fourteen, split fourteen into ten and four.",
        "তেইশকে চৌদ্দ দিয়ে গুণ করতে চৌদ্দকে দশ ও চারে ভাগ করো।");
  A.text(400,105,'23 × 14',{size:40,c:SK});
  A.say("First multiply by the ten: twenty-three times ten is two hundred thirty.",
        "আগে দশ দিয়ে গুণ করো: তেইশ গুণ দশ সমান দুইশ ত্রিশ।");
  A.text(400,180,'23 × 10 = 230',{size:28,c:MU});
  A.say("Then multiply by the four: twenty-three times four is ninety-two.",
        "তারপর চার দিয়ে গুণ করো: তেইশ গুণ চার সমান বিরানব্বই।");
  A.text(400,240,'23 × 4  = 92',{size:28,c:MU});
  A.say("Add the two answers: two hundred thirty plus ninety-two is three hundred twenty-two.",
        "দুই উত্তর যোগ করো: দুইশ ত্রিশ যোগ বিরানব্বই সমান তিনশ বাইশ।");
  A.text(400,315,'23 × 14 = 322',{size:38,c:AM});
  NOTE(A,432,'split the second number and add the parts.');
});

lesson('c4-04','Division','Long division and remainder',A=>{
  A.say("In division, the remainder is what is left over.",
        "ভাগে ভাগশেষ হলো যা বাকি থাকে।");
  A.text(400,105,'145 ÷ 6',{size:42,c:SK});
  A.say("Six goes into fourteen two times: two sixes are twelve, remainder two.",
        "ছয় চৌদ্দতে দুইবার যায়: দুই ছয় সমান বারো, ভাগশেষ দুই।");
  A.say("Bring down five to make twenty-five. Six goes in four times: twenty-four.",
        "পাঁচ নামাও, হয় পঁচিশ। ছয় চারবার যায়: চব্বিশ।");
  A.text(400,220,'24 remainder 1',{size:32,c:GR});
  A.say("So one hundred forty-five divided by six is twenty-four remainder one.",
        "তাই একশ পঁয়তাল্লিশ ভাগ ছয় সমান চব্বিশ, ভাগশেষ এক।");
  A.text(400,300,'24 × 6 + 1 = 145',{size:30,c:AM});
  NOTE(A,432,'check: divisor × quotient + remainder = dividend.');
});

lesson('c4-05','Mathematical Sentences','Brackets and order of operations',A=>{
  A.say("A mathematical sentence uses numbers and signs, like an equation.",
        "গাণিতিক বাক্যে সংখ্যা ও চিহ্ন থাকে, যেমন সমীকরণ।");
  A.say("Work inside brackets first, then multiply or divide, then add or subtract.",
        "আগে বন্ধনীর ভিতর, তারপর গুণ বা ভাগ, তারপর যোগ বা বিয়োগ।");
  A.text(400,165,'(12 + 8) × 3',{size:34,c:SK});
  A.text(400,225,'= 20 × 3',{size:28,c:MU});
  A.text(400,275,'= 60',{size:32,c:GR});
  A.say("Without the brackets, twenty minus three times four is twenty minus twelve, which is eight.",
        "বন্ধনী ছাড়া বিশ বিয়োগ তিন গুণ চার সমান বিশ বিয়োগ বারো, যা আট।");
  A.text(400,350,'20 - 3 × 4 = 8',{size:30,c:AM});
  NOTE(A,432,'brackets change what we do first.');
});

lesson('c4-06','Multiples, Factors and Primes','Finding them',A=>{
  A.say("Multiples are what we get by multiplying a number: six, twelve, eighteen, twenty-four.",
        "গুণিতক হলো গুণ করে যা পাই: ছয়, বারো, আঠারো, চব্বিশ।");
  A.text(400,100,'multiples of 6:  6, 12, 18, 24',{size:22,c:SK});
  A.say("Factors divide a number exactly. The factors of twelve are one, two, three, four, six and twelve.",
        "উৎপাদক সংখ্যাকে নিঃশেষে ভাগ করে। বারোর উৎপাদক এক, দুই, তিন, চার, ছয় ও বারো।");
  A.text(400,180,'factors of 12:  1, 2, 3, 4, 6, 12',{size:22,c:GR});
  A.say("A prime number has only two factors: one and itself.",
        "মৌলিক সংখ্যার মাত্র দুইটি উৎপাদক: এক ও নিজে।");
  A.text(400,265,'primes:  2, 3, 5, 7, 11',{size:28,c:PK});
  A.say("One is not prime, because it has only one factor.",
        "এক মৌলিক নয়, কারণ এর উৎপাদক মাত্র একটি।");
  NOTE(A,432,'multiples grow; factors divide exactly.');
});

lesson('c4-07','Common Fractions','Equivalent and comparing',A=>{
  A.say("Equivalent fractions look different but have the same value.",
        "সমতুল্য ভগ্নাংশ ভিন্ন দেখায় কিন্তু মান একই।");
  fracBar(A,110,165,150,56,2,1,SK);
  A.text(185,248,'1/2',{size:24,c:SK});
  fracBar(A,330,165,150,56,4,2,GR);
  A.text(405,248,'2/4',{size:24,c:GR});
  fracBar(A,550,165,150,56,8,4,PK);
  A.text(625,248,'4/8',{size:24,c:PK});
  A.say("Multiply the top and bottom by the same number to make an equivalent fraction.",
        "সমতুল্য ভগ্নাংশ পেতে উপর ও নিচকে একই সংখ্যা দিয়ে গুণ করো।");
  A.text(400,310,'1/2 = 2/4 = 4/8',{size:28,c:AM});
  A.say("With the same denominator, the larger numerator is the larger fraction.",
        "হর একই হলে বড় লব বড় ভগ্নাংশ।");
  A.text(400,365,'3/8 < 5/8',{size:30,c:GR});
  NOTE(A,432,'same value, different parts.');
});

lesson('c4-08','Decimals','Tenths and hundredths',A=>{
  A.say("A decimal point separates whole numbers from parts.",
        "দশমিক বিন্দু পূর্ণসংখ্যাকে অংশ থেকে আলাদা করে।");
  A.text(400,110,'3.45',{size:52,c:SK});
  A.say("Three point four five means three wholes, four tenths and five hundredths.",
        "তিন দশমিক চার পাঁচ মানে তিন পূর্ণ, চার দশমাংশ ও পাঁচ শতাংশ।");
  A.text(400,195,'3 + 0.4 + 0.05',{size:28,c:MU});
  A.say("Line up the decimal points when adding.",
        "যোগ করার সময় দশমিক বিন্দু সারিবদ্ধ করো।");

/* =====================================================================
   COMMENT BUBBLES (English / বাংলা) + VOICE
   ===================================================================== */
const feeds=[],cmKey=[];
function renderCm(i,t){
  const feed=feeds[i]; if(!feed) return;
  const caps=VISUALS[i].caps, idx=capIdx(caps,t), lang=S.lang;
  const cur=idx>=0?caps[idx]:null, n=cur?Math.floor((t-cur[0])*45):0;
  const key=idx+':'+(cur?Math.min(n,300):0)+':'+lang;
  if(cmKey[i]===key) return; cmKey[i]=key;
  if(idx<0){feed.innerHTML='<div class="cm-hint">Press play — Bolt will explain here.<br><span class="bnf">প্লে চাপো — বোল্ট এখানে বুঝিয়ে দেবে।</span></div>';return;}
  let h='';
  for(let k=Math.max(0,idx-2);k<=idx;k++){
    const c=caps[k], last=k===idx;
    let en=c[1], bn=c[2], enC='', bnC='';
    if(last){
      if(lang==='both'){
        if(n<en.length){en=en.slice(0,n);enC='<i>▍</i>';bn='';}
        else if(n-en.length<bn.length){bn=bn.slice(0,n-en.length);bnC='<i>▍</i>';}
      }else if(lang==='en'){ if(n<en.length){en=en.slice(0,n);enC='<i>▍</i>';} }
      else { if(n<bn.length){bn=bn.slice(0,n);bnC='<i>▍</i>';} }
    }
    let body='';
    if(lang!=='bn' && en) body+='<span class="en">'+esc(en)+enC+'</span>';
    if(lang!=='en' && (bn||bnC)) body+='<span class="bn">'+esc(bn)+bnC+'</span>';
    h+='<div class="cm'+(last?'':' old')+'"><div class="cm-av">🤖</div><div class="cm-bb">'+body+'</div></div>';
  }
  feed.innerHTML=h;
}

function speakCap(c){
  if(!('speechSynthesis' in window)) return;
  const ss=window.speechSynthesis; ss.cancel();
  const parts=S.lang==='en'?[['en',c[1]]]:S.lang==='bn'?[['bn',c[2]]]:[['en',c[1]],['bn',c[2]]];
  const vs=ss.getVoices();
  parts.forEach(([lg,tx])=>{
    const u=new SpeechSynthesisUtterance(tx);
    u.lang=lg==='bn'?'bn-BD':'en-US';
    const v=vs.find(x=>x.lang.toLowerCase().replace('_','-').startsWith(lg));
    if(v) u.voice=v;
    u.rate=.95; u.pitch=1.1;
    ss.speak(u);
  });
}
function stopVoice(){ if('speechSynthesis' in window) window.speechSynthesis.cancel(); S.sp=null; }
function checkSpeak(){
  if(!S.voice||!S.playing) return;
  const caps=VISUALS[S.vi].caps, i=capIdx(caps,S.t), key=S.vi+':'+S.mi+':'+i;
  if(i<0||key===S.sp) return;
  S.sp=key; speakCap(caps[i]);
}
function voiceNote(){
  const el=$('#vcVoiceNote');
  if(!('speechSynthesis' in window)){el.textContent='Voice is not supported in this browser.';return;}
  const hasBn=speechSynthesis.getVoices().some(v=>/^bn/i.test(v.lang));
  el.textContent=hasBn?'':'No Bangla voice found on this device. Install one in your system settings to hear Bangla.';
}

/* =====================================================================
   CAROUSEL ENGINE
   ===================================================================== */
const track=$('#vcTrack'),view=$('#vcView'),svgs=[],slides=[];
const cur=()=>VISUALS[S.vi].modes[S.mi];
const previewT=v=>v.modes[0].duration*.92;

function rebuild(){
  track.innerHTML='';svgs.length=0;slides.length=0;feeds.length=0;cmKey.length=0;
  VISUALS.forEach((v,i)=>{
    const sl=document.createElement('div');sl.className='vc-slide';
    sl.innerHTML='<div class="vc-head"><span class="vc-count">'+(i+1)+' / '+VISUALS.length+'</span><b>'+esc(v.title)+'</b></div>'
      +'<div class="vc-body"><div class="vc-stage"><svg viewBox="0 0 800 480" role="img" aria-label="'+esc(v.title)+'"></svg></div>'
      +'<div class="vc-cm"><div class="cm-in"><div class="cm-top"><span>🤖</span> Bolt says · <span class="bnf">বোল্ট বলছে</span></div><div class="cm-feed" aria-live="polite"></div></div></div></div>';
    sl.onclick=()=>{if(i!==S.vi) go(i);};
    track.appendChild(sl);slides.push(sl);svgs.push(sl.querySelector('svg'));feeds.push(sl.querySelector('.cm-feed'));
  });
  buildDots();buildModes();buildLang();layout();renderAll();ui();
}
function layout(){
  const w=view.clientWidth||800, sw=w<700?w*.9:Math.min(w*.84,1120), gap=22;
  slides.forEach((sl,i)=>{sl.style.flexBasis=sw+'px';sl.classList.toggle('on',i===S.vi);sl.classList.toggle('stack',sw<860);});
  track.style.transform='translateX('+((w-sw)/2-S.vi*(sw+gap))+'px)';
}
function renderAll(){
  VISUALS.forEach((v,i)=>{
    const act=i===S.vi, m=act?cur():v.modes[0], t=act?Math.min(S.t,m.duration):previewT(v);
    svgs[i].innerHTML=m.frame(t);cmKey[i]=null;renderCm(i,t);
  });
  progress();
}
function render(){
  const m=cur(), t=Math.min(S.t,m.duration);
  svgs[S.vi].innerHTML=m.frame(t);
  renderCm(S.vi,t);
  progress();
}
function progress(){
  const m=cur();
  $('#vcFill').style.width=(clamp(S.t/m.duration)*100)+'%';
  $('#vcInfo').textContent='Lesson '+(S.vi+1)+' of '+VISUALS.length+'  ·  '+Math.floor(S.t)+'s / '+Math.round(m.duration)+'s';
}
function ui(){
  $('#bPlay').textContent=S.playing?'⏸ Pause':'▶ Play';
  const bv=$('#bVoice');bv.textContent=S.voice?'🔊 Voice on':'🔇 Voice off';bv.classList.toggle('on',S.voice);
}
function buildModes(){
  const v=VISUALS[S.vi],box=$('#vcModes');box.innerHTML='';
  v.modes.forEach((m,i)=>{
    const b=document.createElement('button');b.textContent=m.label;b.className=i===S.mi?'on':'';
    b.onclick=()=>{S.mi=i;S.t=0;clearTimeout(S.adv);stopVoice();buildModes();renderAll();if(!S.playing) play();};
    box.appendChild(b);
  });
}
function buildLang(){
  const box=$('#vcLang');box.innerHTML='';
  [['en','English'],['bn','বাংলা'],['both','English + বাংলা']].forEach(([id,label])=>{
    const b=document.createElement('button');b.textContent=label;b.className=id===S.lang?'on':'';
    b.onclick=()=>{S.lang=id;S.sp=null;if('speechSynthesis' in window) speechSynthesis.cancel();buildLang();renderAll();};
    box.appendChild(b);
  });
}
function buildDots(){
  const d=$('#vcDots');d.innerHTML='';
  VISUALS.forEach((v,i)=>{
    const b=document.createElement('button');b.title=v.title;b.setAttribute('aria-label',v.title);
    b.className=i===S.vi?'on':'';b.onclick=()=>go(i);d.appendChild(b);
  });
}
function tick(ts){
  if(!S.playing) return;
  S.t+=(ts-S.last)/1000;S.last=ts;
  if(S.t>=cur().duration){S.t=cur().duration;S.playing=false;render();ui();onEnd();return;}
  checkSpeak();render();requestAnimationFrame(tick);
}
function play(){
  if(S.playing) return;
  clearTimeout(S.adv);S.manual=false;
  if(S.t>=cur().duration){S.t=0;S.sp=null;}
  S.playing=true;S.last=performance.now();ui();requestAnimationFrame(tick);
}
function pause(manual=true){S.playing=false;if(manual) S.manual=true;clearTimeout(S.adv);stopVoice();ui();}
function onEnd(){clearTimeout(S.adv);S.adv=setTimeout(()=>{if(!S.manual) go(S.vi+1);},2200);}
function go(i,auto=true){
  if(S.busy||!VISUALS.length) return;
  S.busy=true;clearTimeout(S.adv);S.playing=false;stopVoice();
  S.vi=(i+VISUALS.length)%VISUALS.length;S.t=0;
  buildDots();buildModes();layout();renderAll();ui();
  setTimeout(()=>{S.busy=false;if(auto) play();},560);
}

$('#bPlay').onclick=()=>S.playing?pause(true):play();
$('#bRep').onclick=()=>{clearTimeout(S.adv);stopVoice();S.t=0;if(S.playing) render();else play();};
$('#bVoice').onclick=()=>{S.voice=!S.voice;S.sp=null;if(!S.voice) stopVoice();ui();voiceNote();};
$('#bNext').onclick=$('#aNext').onclick=()=>go(S.vi+1);
$('#bPrev').onclick=$('#aPrev').onclick=()=>go(S.vi-1);
$('#vcCar').onkeydown=e=>{if(e.key==='ArrowRight') go(S.vi+1);if(e.key==='ArrowLeft') go(S.vi-1);};
let sx=null;
view.addEventListener('pointerdown',e=>{sx=e.clientX;});
view.addEventListener('pointerup',e=>{
  if(sx===null) return; const dx=e.clientX-sx; sx=null;
  if(Math.abs(dx)>50) go(S.vi+(dx<0?1:-1));
});
window.addEventListener('resize',layout);
if('speechSynthesis' in window){ speechSynthesis.addEventListener('voiceschanged',voiceNote); }
voiceNote();

const qp=new URLSearchParams(location.search);
if(qp.has('lesson')){S.vi=clamp((parseInt(qp.get('lesson'),10)||1)-1,0,VISUALS.length-1);S.manual=true;}
if(qp.has('t')){S.t=Math.max(0,parseFloat(qp.get('t'))||0);}
if(qp.has('static')){const st=document.createElement('style');st.textContent='.vc-track,.vc-slide{transition:none!important}';document.head.appendChild(st);}
S.ready=true;rebuild();

new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){
    if(!S.manual&&!S.playing&&!S.busy){ S.t>=cur().duration?go(S.vi+1):play(); }
  } else if(S.playing){ pause(false); }
}),{threshold:.4}).observe($('#vcCar'));
})();
</script>
</body>
</html>

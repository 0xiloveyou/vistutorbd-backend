  A.rect(130,330,540,50,{c:PK,w:2,fill:PK,fo:.10},.35);
  A.text(400,362,'13 / 8 = 1.625   and   21 / 13 = 1.615',{size:18,c:PK});
  A.say('Spirals in shells and the arrangement of many petals follow this same ratio.',
        'শামুকের খোলসের সর্পিল ও অনেক ফুলের পাপড়ির সজ্জা এই অনুপাতই অনুসরণ করে।');
  NOTE(A,415,'two starting values are needed before the rule can run.');
});

/* --- Class 8 · Profits --- */

lesson('c68-169','Profit percent on cost price','Profit divided by cost price',A=>{
  A.say('Percentage profit compares the profit with the cost price, never with the selling price.',
        'শতকরা লাভ লাভকে ক্রয়মূল্যের সঙ্গে তুলনা করে, বিক্রয়মূল্যের সঙ্গে নয়।');
  A.rect(150,130,500,60,{c:SK,w:2.5,fill:SK,fo:.12},.4);
  A.text(400,168,'cost price = 400 taka',{size:21,c:SK});
  A.rect(150,210,500,60,{c:GR,w:2.5,fill:GR,fo:.12},.4);
  A.text(400,248,'selling price = 460 taka',{size:21,c:GR});
  A.say('The profit is sixty taka, found by subtracting the cost price from the selling price.',
        'লাভ ষাট টাকা, বিক্রয়মূল্য থেকে ক্রয়মূল্য বিয়োগ করে পাওয়া যায়।');
  A.text(400,308,'profit = 460 - 400 = 60',{size:22,c:AM});
  A.say('Divide the profit by the cost price and multiply by one hundred.',
        'লাভকে ক্রয়মূল্য দিয়ে ভাগ করে ১০০ দিয়ে গুণ করো।');
  A.text(400,352,'profit % = 60/400 × 100 = 15%',{size:23,c:PK});
  A.say('A fifteen percent profit means fifteen taka gained on every hundred taka spent.',
        'পনেরো শতাংশ লাভ মানে প্রতি একশো টাকায় পনেরো টাকা লাভ।');
  A.rect(150,382,220,45,{c:GR,w:2,fill:GR,fo:.10},.3);
  A.text(260,411,'divide by cost',{size:16,c:GR});
  A.rect(430,382,220,45,{c:PK,w:2,fill:PK,fo:.10},.3);
  A.text(540,411,'not by selling',{size:16,c:PK});
  NOTE(A,458,'profit percent always uses the cost price as the base.');
});

lesson('c68-170','Discount then profit','Two changes in one sale',A=>{
  A.say('A discount and a profit are different ideas, so keep the order of the steps clear.',
        'ছাড় ও লাভ আলাদা ধারণা, তাই ধাপের ক্রম পরিষ্কার রাখো।');
  A.text(400,100,'marked price 500, discount 20%',{size:21,c:AM});
  A.arrow(400,120,400,158,{c:MU,w:2},.3);
  A.text(400,188,'selling price = 500 - 100 = 400',{size:21,c:SK});
  A.say('The discount lowers the marked price to four hundred taka.',
        'ছাড় নির্ধারিত দাম কমিয়ে চারশো টাকা করে।');
  A.text(400,232,'the shop had paid 320 taka',{size:20,c:MU});
  A.arrow(400,252,400,290,{c:MU,w:2},.3);
  A.say('If the shop paid three hundred and twenty, the profit is eighty taka.',
        'দোকান তিনশো বিশ টাকা দিলে লাভ আশি টাকা।');
  A.text(400,320,'profit = 400 - 320 = 80',{size:22,c:GR});
  A.say('The profit percent uses the cost price, so it is eighty over three hundred and twenty.',
        'শতকরা লাভ ক্রয়মূল্যের উপর হিসাব হয়, তাই আশি ভাগ তিনশো বিশ।');
  A.text(400,365,'profit % = 80/320 × 100 = 25%',{size:21,c:PK});
  A.rect(120,392,250,45,{c:GR,w:2,fill:GR,fo:.10},.3);
  A.text(245,421,'discount on marked',{size:16,c:GR});
  A.rect(430,392,250,45,{c:PK,w:2,fill:PK,fo:.10},.3);
  A.text(555,421,'profit on cost',{size:16,c:PK});
  NOTE(A,458,'each percentage uses its own base.');
});

lesson('c68-171','Simple interest','Interest grows with time',A=>{
  A.say('Simple interest is calculated only on the original amount, called the principal.',
        'সরল মুনাফা কেবল মূলধনের উপর হিসাব হয়।');
  axes(A,140,390,60,560,300,40);
  A.text(400,92,'principal 1000 taka at 10% per year',{size:19,c:AM});
  A.line(140,390,620,302,{c:GR,w:3.5},.8);
  A.circle(260,368,6,{c:GR,w:2,fill:GR,fo:1},.2);
  A.circle(380,346,6,{c:GR,w:2,fill:GR,fo:1},.2);
  A.circle(500,324,6,{c:GR,w:2,fill:GR,fo:1},.2);
  A.text(268,352,'1 yr: 100',{size:16,c:GR});
  A.text(388,330,'2 yr: 200',{size:16,c:GR});
  A.text(508,308,'3 yr: 300',{size:16,c:GR});
  A.say('Each year adds the same one hundred taka, so the graph is a straight line.',
        'প্রতি বছর একই একশো টাকা যোগ হয়, তাই লেখচিত্র সরলরেখা।');
  A.text(400,425,'I = P × r × t / 100',{size:24,c:SK});
  A.say('After three years the interest is three hundred and the amount is one thousand three hundred.',
        'তিন বছর পর মুনাফা তিনশো এবং মোট অর্থ এক হাজার তিনশো।');
  A.text(400,458,'amount = principal + interest',{size:17,c:MU});
  NOTE(A,470-12,'simple interest never earns interest on itself.');
});

/* --- Class 8 · Measurement --- */

lesson('c68-172','Area of a triangle','Half of base times height',A=>{
  A.say('The area of a triangle is half the base multiplied by the perpendicular height.',
        'ত্রিভুজের ক্ষেত্রফল ভূমি ও লম্ব উচ্চতার গুণফলের অর্ধেক।');
  A.pts([[180,340],[600,340],[420,145],[180,340]],{c:SK,w:3,fill:SK,fo:.10},.8);
  A.dashed(420,145,420,340,{c:PK,w:2},.6);
  A.rect(420,322,18,18,{c:GR,w:2},.2);
  A.text(390,385,'base = 14 cm',{size:19,c:AM});
  A.text(438,250,'height = 9 cm',{size:18,c:PK,anchor:'start'});
  A.say('The height must meet the base at a right angle, not run along a sloping side.',
        'উচ্চতা ভূমির সঙ্গে সমকোণে মিলতে হবে, হেলানো বাহু বরাবর নয়।');
  A.say('Half of fourteen times nine is sixty-three square centimetres.',
        'চৌদ্দ গুণ নয়ের অর্ধেক সমান তেষট্টি বর্গ সেন্টিমিটার।');
  A.text(400,98,'area = 1/2 × base × height',{size:21,c:AM});
  A.text(400,422,'= 1/2 × 14 × 9 = 63 cm²',{size:23,c:GR});
  A.say('A triangle is exactly half of the rectangle with the same base and height.',
        'একই ভূমি ও উচ্চতার আয়তক্ষেত্রের ঠিক অর্ধেক একটি ত্রিভুজ।');
  NOTE(A,460-4,'use the perpendicular height, not a slant side.');
});

lesson('c68-173','Area of a trapezium','Average the parallel sides',A=>{
  A.say('A trapezium has one pair of parallel sides, and they are called its bases.',
        'ট্রাপিজিয়ামে এক জোড়া সমান্তরাল বাহু থাকে, তাদের ভূমি বলা হয়।');
  A.pts([[200,330],[620,330],[540,155],[280,155],[200,330]],{c:GR,w:3,fill:GR,fo:.10},.8);
  A.dashed(280,155,280,330,{c:MU,w:2},.5);
  A.dashed(540,155,540,330,{c:MU,w:2},.5);
  A.text(255,360,'a = 12 cm',{size:18,c:SK});
  A.text(410,140,'b = 8 cm',{size:18,c:PK});
  A.text(270,250,'h',{size:20,c:MU,anchor:'end'});
  A.say('Average the two bases and multiply by the height between them.',
        'দুই ভূমির গড় নাও, তারপর তাদের মধ্যবর্তী উচ্চতা দিয়ে গুণ করো।');
  A.text(400,390,'area = (a + b)/2 × h',{size:22,c:AM});
  A.say('With bases twelve and eight and height five, the area is fifty square centimetres.',
        'ভূমি বারো ও আট এবং উচ্চতা পাঁচ হলে ক্ষেত্রফল পঞ্চাশ বর্গ সেন্টিমিটার।');
  A.text(400,432,'= (12 + 8)/2 × 5 = 50 cm²',{size:21,c:GR});
  A.say('Two copies of the trapezium join to make a parallelogram of area one hundred.',
        'ট্রাপিজিয়ামের দুই কপি জুড়লে একশো ক্ষেত্রফলের সামান্তরিক হয়।');
  NOTE(A,458,'the two bases must be the parallel sides.');
});

lesson('c68-174','Volume of a rectangular prism','Length times width times height',A=>{
  A.say('Volume measures the space inside a solid, measured in cubic units.',
        'আয়তন ঘন এককে কঠিন বস্তুর ভেতরের জায়গা মাপে।');
  A.rect(220,180,300,170,{c:SK,w:2.5,fill:SK,fo:.12},.6);
  A.pts([[220,180],[300,110],[600,110],[520,180],[220,180]],{c:SK,w:2.5,fill:SK,fo:.10},.6);
  A.pts([[520,180],[600,110],[600,280],[520,350]],{c:SK,w:2.5,fill:SK,fo:.10},.6);
  A.dashed(300,110,300,280,{c:MU,w:1.5},.35);
  A.dashed(300,280,520,280,{c:MU,w:1.5},.35);
  A.dashed(220,350,300,280,{c:MU,w:1.5},.35);
  A.text(370,375,'length = 10 cm',{size:18,c:AM});
  A.text(205,265,'width = 6 cm',{size:17,c:PK,anchor:'end'});
  A.text(612,240,'height = 5 cm',{size:16,c:GR,anchor:'start'});
  A.say('Multiply the three edge lengths to get the volume.',
        'তিনটি প্রান্তের দৈর্ঘ্য গুণ করলে আয়তন পাওয়া যায়।');
  A.text(400,85,'V = l × w × h',{size:23,c:AM});
  A.say('Three hundred cubes of one centimetre each would fill the box.',
        'এক সেন্টিমিটারের তিনশো ঘনক এই বাক্স ভরাতে পারবে।');
  A.text(400,428,'V = 10 × 6 × 5 = 300 cm³',{size:22,c:GR});
  A.say('Doubling one edge doubles the volume, so volume grows quickly.',
        'একটি প্রান্ত দ্বিগুণ করলে আয়তনও দ্বিগুণ হয়, তাই আয়তন দ্রুত বাড়ে।');
  NOTE(A,470-8,'volume always uses cubic units.');
});

lesson('c68-175','Units of area and volume','Square the linear factor',A=>{
  A.say('Length converts with one factor, but area and volume use its square and cube.',
        'দৈর্ঘ্য এক গুণিতকে বদলায়, কিন্তু ক্ষেত্রফল ও আয়তনে তার বর্গ ও ঘন লাগে।');
  A.text(400,100,'1 m = 100 cm',{size:22,c:AM});
  A.say('A square metre is a square one metre on each side, so it holds many small squares.',
        'এক বর্গমিটার এক মিটার বাহুর বর্গ, তাই এতে অনেক ছোট বর্গ ধরে।');
  A.rect(150,140,180,180,{c:SK,w:2,fill:SK,fo:.10},.5);
  for(let i=1;i<4;i++){
    A.line(150+i*45,140,150+i*45,320,{c:MU,w:1},.06);
    A.line(150,140+i*45,330,140+i*45,{c:MU,w:1},.06);
  }
  A.text(240,345,'1 m² = 10,000 cm²',{size:19,c:GR});
  A.say('Area multiplies by one hundred squared, which is ten thousand.',
        'ক্ষেত্রফল একশোর বর্গ, অর্থাৎ দশ হাজার দিয়ে গুণ হয়।');
  A.text(560,180,'1 m² = 100 × 100 cm²',{size:17,c:MU});
  A.text(560,225,'1 m³ = 100³ cm³',{size:17,c:MU});
  A.text(560,265,'= 10,00,000 cm³',{size:17,c:GR});
  A.say('Volume multiplies by one hundred cubed, which is ten lakh.',
        'আয়তন একশোর ঘন, অর্থাৎ দশ লক্ষ দিয়ে গুণ হয়।');
  A.rect(140,375,520,45,{c:PK,w:2,fill:PK,fo:.10},.3);
  A.text(400,404,'length ×100, area ×10,000, volume ×10,00,000',{size:16,c:PK});
  A.say('Using the linear factor for area is a common and costly mistake.',
        'ক্ষেত্রফলে দৈর্ঘ্যের গুণিতক ব্যবহার করা সাধারণ ও ব্যয়বহুল ভুল।');
  NOTE(A,458,'square the factor for area and cube it for volume.');
});

/* --- Class 8 · Algebraic formulae --- */

lesson('c68-176','Difference of squares','a² - b² = (a + b)(a - b)',A=>{
  A.say('A difference of two squares factorises into a sum times a difference.',
        'দুই বর্গের অন্তর যোগ ও বিয়োগের গুণফলে উৎপাদকে ভাঙে।');
  A.rect(150,140,220,220,{c:SK,w:2.5,fill:SK,fo:.10},.6);
  A.rect(270,260,100,100,{c:MU,w:2.5,fill:RD,fo:.28},.5);
  A.text(320,315,'b²',{size:20,c:INK});
  A.text(250,320,'a²',{size:22,c:SK});
  A.say('Take a small square of side b out of a larger square of side a.',
        'a বাহুর বড় বর্গ থেকে b বাহুর ছোট বর্গ বাদ দাও।');
  A.arrow(390,250,445,250,{c:AM,w:2.5},.4);
  A.say('The L shaped piece can be cut and rearranged into a rectangle.',
        'L আকৃতির টুকরাটি কেটে আয়তক্ষেত্রে সাজানো যায়।');
  A.rect(470,210,260,120,{c:GR,w:2.5,fill:GR,fo:.14},.6);
  A.text(600,195,'a + b',{size:18,c:GR});
  A.text(455,275,'a - b',{size:18,c:GR,anchor:'end'});
  A.say('Its sides are a plus b and a minus b, so the area is their product.',
        'এর বাহু a যোগ b ও a বিয়োগ b, তাই ক্ষেত্রফল তাদের গুণফল।');
  A.text(400,368,'a² - b² = (a + b)(a - b)',{size:24,c:AM});
  A.text(400,410,'49 - 9 = (7 + 3)(7 - 3) = 40',{size:20,c:SK});
  A.say('Numbers follow the same rule, so forty-nine minus nine is forty.',
        'সংখ্যাও একই নিয়ম মানে, তাই ৪৯ বিয়োগ ৯ সমান ৪০।');
  NOTE(A,452,'this identity has no middle term.');
});

lesson('c68-177','Factorising by grouping','Four terms become two brackets',A=>{
  A.say('When four terms have no common factor, group them in pairs and factor each pair.',
        'চার পদে সাধারণ উৎপাদক না থাকলে জোড়ায় ভাগ করে প্রতিটি জোড়ার উৎপাদক নাও।');
  A.text(400,98,'x² + 3x + 2x + 6',{size:28,c:SK});
  A.say('Group the first two terms together and the last two terms together.',
        'প্রথম দুই পদ একসঙ্গে ও শেষ দুই পদ একসঙ্গে জোড়া করো।');
  A.rect(150,125,250,55,{c:SK,w:2,fill:SK,fo:.10},.3);
  A.rect(410,125,250,55,{c:GR,w:2,fill:GR,fo:.10},.3);
  A.text(275,160,'x² + 3x',{size:20,c:SK});
  A.text(535,160,'2x + 6',{size:20,c:GR});
  A.say('The first pair gives x times x plus three, and the second gives two times x plus three.',
        'প্রথম জোড়া হয় x গুণ x যোগ তিন, দ্বিতীয় জোড়া হয় দুই গুণ x যোগ তিন।');
  A.text(400,220,'= x(x + 3) + 2(x + 3)',{size:22,c:MU});
  A.say('Both parts contain the bracket x plus three, so take it out as a common factor.',
        'দুই অংশেই বন্ধনী x যোগ তিন আছে, তাই এটি সাধারণ উৎপাদক হিসেবে নাও।');
  A.text(400,275,'= (x + 3)(x + 2)',{size:28,c:GR});
  A.text(400,325,'check: x² + 5x + 6',{size:20,c:AM});
  A.say('Expanding the answer returns the original expression, so the factorisation is right.',
        'উত্তর বিস্তৃত করলে মূল রাশি ফিরে আসে, তাই উৎপাদকে বিশ্লেষণ সঠিক।');
  A.text(400,382,'the shared bracket must appear in both groups',{size:18,c:MU});
  NOTE(A,428,'grouping works only when a common bracket appears.');
});

lesson('c68-178','Squaring numbers near 100','Use (100 + 2)²',A=>{
  A.say('The identity for a sum of squares turns a hard product into easy ones.',
        'যোগফলের বর্গের অভেদ কঠিন গুণকে সহজ গুণে বদলে দেয়।');
  A.text(400,100,'102² = (100 + 2)²',{size:28,c:AM});
  A.say('Write one hundred and two as one hundred plus two.',
        'একশো দুই-কে একশো যোগ দুই হিসেবে লেখো।');
  A.text(400,152,'= 100² + 2 × 100 × 2 + 2²',{size:21,c:SK});
  A.text(400,200,'= 10,000 + 400 + 4',{size:22,c:MU});
  A.text(400,248,'= 10,404',{size:30,c:GR});
  A.say('The three parts are ten thousand, four hundred and four.',
        'তিনটি অংশ দশ হাজার, চারশো ও চার।');
  A.rect(110,285,280,75,{c:SK,w:2,fill:SK,fo:.10},.3);
  A.text(250,315,'(a + b)²',{size:20,c:SK});
  A.text(250,345,'a² + 2ab + b²',{size:16,c:SK});
  A.rect(410,285,280,75,{c:GR,w:2,fill:GR,fo:.10},.3);
  A.text(550,315,'98² = (100 - 2)²',{size:17,c:GR});
  A.text(550,345,'= 9,604',{size:17,c:GR});
  A.say('The same trick with a minus sign gives nine thousand six hundred four.',
        'একই কৌশল বিয়োগ চিহ্ন দিয়ে নয় হাজার ছয়শো চার দেয়।');
  NOTE(A,398,'choose the nearest round number for a.');
});

lesson('c68-179','Checking an identity','Test values, then look for a counterexample',A=>{
  A.say('An identity is true for every value, so one test can find errors but cannot prove it.',
        'অভেদ প্রতিটি মানে সত্য, তাই একটি পরীক্ষা ভুল ধরতে পারে, প্রমাণ করতে পারে না।');
  A.text(400,100,'(a + b)² = a² + 2ab + b²',{size:24,c:AM});
  A.line(140,145,660,145,{c:MU,w:2},.2);
  A.line(140,185,660,185,{c:MU,w:2},.2);
  A.line(140,225,660,225,{c:MU,w:2},.2);
  A.line(140,265,660,265,{c:MU,w:2},.2);
  A.text(230,170,'a',{size:18,c:MU});
  A.text(360,170,'b',{size:18,c:MU});
  A.text(480,170,'left',{size:18,c:MU});
  A.text(600,170,'right',{size:18,c:MU});
  A.text(230,210,'2',{size:18,c:SK});
  A.text(360,210,'3',{size:18,c:SK});
  A.text(480,210,'25',{size:18,c:GR});
  A.text(600,210,'25',{size:18,c:GR});
  A.text(230,250,'-2',{size:18,c:SK});
  A.text(360,250,'5',{size:18,c:SK});
  A.text(480,250,'9',{size:18,c:GR});
  A.text(600,250,'9',{size:18,c:GR});
  A.say('Both sides agree for each pair of values in the table.',
        'সারণির প্রতিটি মান জোড়ায় দুই পাশ মিলে যায়।');
  A.say('Now test the false rule that squares the two parts separately.',
        'এখন ভুল নিয়ম পরীক্ষা করো, যা দুই অংশকে আলাদা বর্গ করে।');
  A.text(400,310,'(2 + 3)² = 25   but   2² + 3² = 13',{size:20,c:PK});
  A.say('One counterexample is enough to reject a false identity.',
        'একটি বিপরীত উদাহরণই ভুল অভেদ বাতিল করতে যথেষ্ট।');
  A.rect(150,335,500,50,{c:PK,w:2,fill:PK,fo:.10},.3);
  A.text(400,366,'a² + b² is missing the 2ab term',{size:18,c:PK});
  NOTE(A,415,'one counterexample disproves; many checks do not prove.');
});

/* --- Class 8 · Algebraic fractions --- */

lesson('c68-180','Subtracting algebraic fractions','Use one common denominator',A=>{
  A.say('Subtraction needs the same common denominator as addition, but the signs need care.',
        'বিয়োগেও যোগের মতো সাধারণ হর লাগে, তবে চিহ্নে সতর্ক থাকতে হয়।');
  A.text(300,120,'3',{size:26,c:SK});
  A.line(255,142,345,142,{c:SK,w:2.5},.2);
  A.text(300,172,'x + 1',{size:21,c:SK});
  A.text(360,150,'-',{size:28,c:INK});
  A.text(455,120,'2',{size:26,c:GR});
  A.line(410,142,500,142,{c:GR,w:2.5},.2);
  A.text(455,172,'x - 1',{size:21,c:GR});
  A.say('The common denominator is x plus one times x minus one.',
        'সাধারণ হর হলো x যোগ এক গুণ x বিয়োগ এক।');
  A.text(400,235,'= (3(x - 1) - 2(x + 1)) / ((x + 1)(x - 1))',{size:17,c:MU});
  A.say('Multiply each numerator by the missing factor, and keep the subtraction in brackets.',
        'প্রতিটি লবকে অনুপস্থিত উৎপাদক দিয়ে গুণ করো, বিয়োগটি বন্ধনীতে রাখো।');
  A.text(400,285,'= (3x - 3 - 2x - 2) / (x² - 1)',{size:19,c:AM});
  A.text(400,335,'= (x - 5) / (x² - 1)',{size:26,c:GR});
  A.say('The numerator becomes x minus five and the denominator x squared minus one.',
        'লব হয় x বিয়োগ পাঁচ, হর হয় x² বিয়োগ এক।');
  A.text(400,385,'x ≠ 1,   x ≠ -1',{size:19,c:PK});
  NOTE(A,430,'subtract the whole numerator, so use brackets.');
});

lesson('c68-181','Three term denominators','Find the LCM of three expressions',A=>{
  A.say('With three denominators, take the highest power of every factor that appears.',
        'তিনটি হর থাকলে যে উৎপাদক যতবার আসে তার সর্বোচ্চ ঘাত নাও।');
  A.text(400,100,'1/(2x) + 1/(3x²) - 1/(6x)',{size:21,c:AM});
  A.say('The denominators are two x, three x squared and six x.',
        'হরগুলো হলো দুই x, তিন x² এবং ছয় x।');
  A.text(400,155,'2x = 2 · x',{size:19,c:SK});
  A.text(400,190,'3x² = 3 · x²',{size:19,c:GR});
  A.text(400,225,'6x = 2 · 3 · x',{size:19,c:PK});
  A.say('The LCM needs two, three and x squared, so it is six x squared.',
        'লসাগুতে দুই, তিন ও x² লাগে, তাই তা ছয় x²।');
  A.text(400,278,'LCM = 2 · 3 · x² = 6x²',{size:25,c:GR});
  A.text(400,328,'= (3x + 2 - x) / 6x²',{size:21,c:AM});
  A.say('Multiply each numerator by the missing factor, then combine the numerators.',
        'প্রতিটি লবকে অনুপস্থিত উৎপাদক দিয়ে গুণ করো, তারপর লব একত্র করো।');
  A.text(400,375,'= (2x + 2) / 6x²',{size:23,c:SK});
  A.text(400,418,'= (x + 1) / 3x²',{size:24,c:GR});
  NOTE(A,458,'the LCM takes the highest power of each factor.');
});

lesson('c68-182','Where a denominator is zero','Excluded values of x',A=>{
  A.say('A fraction is undefined when its denominator equals zero.',
        'হর শূন্য হলে ভগ্নাংশটি অসংজ্ঞায়িত হয়।');
  A.text(400,110,'(x + 2) / ((x - 3)(x + 5))',{size:25,c:SK});
  A.say('Set each factor of the denominator equal to zero.',
        'হরের প্রতিটি উৎপাদক শূন্যের সমান ধরো।');
  A.text(240,175,'x - 3 = 0',{size:21,c:PK});
  A.text(560,175,'x + 5 = 0',{size:21,c:PK});
  A.arrow(240,195,240,235,{c:MU,w:2},.3);
  A.arrow(560,195,560,235,{c:MU,w:2},.3);
  A.say('The two excluded values are three and minus five.',
        'দুই নিষিদ্ধ মান তিন ও বিয়োগ পাঁচ।');
  A.text(240,262,'x = 3',{size:24,c:PK});
  A.text(560,262,'x = -5',{size:24,c:PK});
  A.rect(140,290,520,55,{c:PK,w:2,fill:PK,fo:.10},.4);
  A.text(400,325,'undefined at x = 3 and x = -5',{size:19,c:PK});
  A.say('These values are not part of the domain, so they must be stated with the answer.',
        'এই মানগুলো ডোমেনের অংশ নয়, তাই উত্তরের সঙ্গে লিখতে হয়।');
  A.text(400,392,'domain: all real x except 3 and -5',{size:19,c:MU});
  A.text(400,430,'the numerator may be zero safely',{size:18,c:GR});
  NOTE(A,458,'a zero denominator breaks the fraction.');
});

/* --- Class 8 · Simple simultaneous equations --- */

lesson('c68-183','Elimination by adding','Add the equations to remove y',A=>{
  A.say('When the coefficients of one variable are opposites, adding removes that variable.',
        'এক চলকের সহগ বিপরীত হলে যোগ করলে সেই চলক চলে যায়।');
  A.rect(140,105,250,55,{c:SK,w:2,fill:SK,fo:.10},.35);
  A.text(265,140,'x + y = 9',{size:20,c:SK});
  A.rect(410,105,250,55,{c:GR,w:2,fill:GR,fo:.10},.35);
  A.text(535,140,'x - y = 1',{size:20,c:GR});
  A.text(400,190,'+',{size:28,c:INK});
  A.say('The plus y and the minus y cancel when the two equations are added.',
        'দুই সমীকরণ যোগ করলে যোগ y ও বিয়োগ y কেটে যায়।');
  A.line(140,215,660,215,{c:MU,w:2},.4);
  A.text(400,255,'2x = 10',{size:28,c:AM});
  A.text(400,303,'x = 5',{size:30,c:PK});
  A.say('Divide by two to get x equals five, then substitute back to find y.',
        'দুই দিয়ে ভাগ করলে x সমান পাঁচ, তারপর বসিয়ে y বের করো।');
  A.text(400,350,'5 + y = 9   so   y = 4',{size:22,c:GR});
  A.say('The solution is five and four. Check the second equation: five minus four is one.',
        'সমাধান পাঁচ ও চার। দ্বিতীয় সমীকরণ মিলাও: পাঁচ বিয়োগ চার সমান এক।');
  A.text(400,400,'(5, 4)',{size:24,c:AM});
  NOTE(A,445,'adding works only when one variable cancels.');
});

lesson('c68-184','The substitution method','Replace y with an expression',A=>{
  A.say('Substitution expresses one variable from one equation and puts it into the other.',
        'প্রতিস্থাপনে এক সমীকরণ থেকে চলক প্রকাশ করে অন্যটিতে বসানো হয়।');
  A.rect(150,100,500,55,{c:SK,w:2,fill:SK,fo:.10},.35);
  A.text(400,135,'y = 2x + 1    and    3x + y = 16',{size:19,c:SK});
  A.say('The first equation already gives y in terms of x, so put that into the second.',
        'প্রথম সমীকরণেই x দিয়ে y দেওয়া আছে, তাই তা দ্বিতীয়টিতে বসাও।');
  A.text(400,190,'3x + (2x + 1) = 16',{size:23,c:AM});
  A.text(400,235,'5x + 1 = 16',{size:23,c:MU});
  A.text(400,280,'5x = 15',{size:23,c:SK});
  A.say('Solve for x to get three, then use y equals two x plus one.',
        'x-এর মান তিন পাওয়া যায়, তারপর y সমান দুই x যোগ এক ব্যবহার করো।');
  A.text(400,325,'x = 3',{size:27,c:PK});
  A.text(400,370,'y = 2(3) + 1 = 7',{size:22,c:GR});
  A.say('The pair three and seven satisfies both equations.',
        'তিন ও সাত জোড়াটি দুই সমীকরণই সিদ্ধ করে।');
  A.text(400,415,'check: 3(3) + 7 = 16',{size:19,c:MU});
  NOTE(A,455,'substitute into the simpler equation.');
});

lesson('c68-185','Parallel lines and no solution','Same slope, different intercept',A=>{
  A.say('Two linear equations may have one solution, no solution, or infinitely many.',
        'দুই রৈখিক সমীকরণের এক সমাধান, কোনো সমাধান না, বা অসীম সমাধান থাকতে পারে।');
  axes(A,160,400,80,470,300,40);
  A.line(160,140,590,390,{c:SK,w:3.5},.8);
  A.line(250,140,680,390,{c:GR,w:3.5},.8);
  A.text(590,125,'y = x + 1',{size:17,c:SK});
  A.text(690,180,'y = x + 4',{size:17,c:GR});
  A.say('These lines have the same slope but different intercepts, so they never meet.',
        'এই রেখার ঢাল সমান কিন্তু ছেদবিন্দু আলাদা, তাই তারা কখনো মেলে না।');
  A.text(400,92,'parallel means no intersection',{size:19,c:PK});
  A.say('With no crossing point, the pair of equations has no common solution.',
        'ছেদবিন্দু না থাকলে সমীকরণ জোড়ার কোনো সাধারণ সমাধান নেই।');
  A.text(400,432,'same slope, different intercept',{size:18,c:MU});
  A.say('If the equations were identical, the lines would lie on each other and every point would solve them.',
        'সমীকরণ দুটি অভিন্ন হলে রেখা একটির উপর আরেকটি থাকত এবং প্রতিটি বিন্দুই সমাধান হতো।');
  NOTE(A,458,'parallel lines never meet.');
});

/* --- Class 8 · Set --- */

lesson('c68-186','Three set Venn diagram','Eight regions in all',A=>{
  A.say('Three overlapping circles create eight regions, including the outside one.',
        'তিনটি ছেদকারী বৃত্ত আটটি অঞ্চল তৈরি করে, বাইরেরটিসহ।');
  A.ell(330,220,105,105,{c:SK,w:3,fill:SK,fo:.12},.8);
  A.ell(470,220,105,105,{c:GR,w:3,fill:GR,fo:.12},.8);
  A.ell(400,315,105,105,{c:PK,w:3,fill:PK,fo:.12},.8);
  A.text(252,128,'A',{size:21,c:SK});
  A.text(548,128,'B',{size:21,c:GR});
  A.text(400,442,'C',{size:21,c:PK});
  A.say('The middle region belongs to all three sets at once.',
        'মাঝের অঞ্চলটি একসঙ্গে তিন সেটেরই।');
  A.text(400,258,'1',{size:19,c:AM});
  A.text(320,245,'2',{size:18,c:INK});
  A.text(480,245,'3',{size:18,c:INK});
  A.text(400,340,'4',{size:18,c:INK});
  A.say('Each pair of circles has its own region, and each circle has a part of its own.',
        'প্রতি জোড়া বৃত্তের নিজস্ব অঞ্চল আছে, আর প্রতিটি বৃত্তের আলাদা অংশও আছে।');
  A.text(400,395,'count the eight regions one by one',{size:17,c:MU});
  A.say('Counting region by region stops any element from being counted twice.',
        'অঞ্চল ধরে ধরে গুনলে কোনো উপাদান দুইবার গোনা হয় না।');
  NOTE(A,458,'start at the triple overlap and work outward.');
});

lesson('c68-187','A survey problem','Use the union formula',A=>{
  A.say('In a survey of forty students, twenty-five like tea and twenty like coffee.',
        'চল্লিশ জনের জরিপে পঁচিশ জন চা পছন্দ করে আর বিশ জন কফি।');
  A.rect(110,110,580,190,{c:MU,w:2,fill:MU,fo:.04},.5);
  A.ell(330,205,95,85,{c:SK,w:3,fill:SK,fo:.14},.7);
  A.ell(470,205,95,85,{c:GR,w:3,fill:GR,fo:.14},.7);
  A.say('Twelve like both drinks, so that number belongs in the overlap.',
        'বারো জন দুই পানীয়ই পছন্দ করে, তাই সেই সংখ্যা ছেদে বসে।');
  A.text(400,210,'12',{size:22,c:AM});
  A.text(268,210,'13',{size:20,c:SK});
  A.text(532,210,'8',{size:20,c:GR});
  A.say('Tea only is twenty-five minus twelve, and coffee only is twenty minus twelve.',
        'কেবল চা হলো পঁচিশ বিয়োগ বারো, আর কেবল কফি বিশ বিয়োগ বারো।');
  A.text(300,340,'tea only = 25 - 12 = 13',{size:19,c:SK});
  A.text(300,378,'coffee only = 20 - 12 = 8',{size:19,c:GR});
  A.say('The union is thirteen plus twelve plus eight, which is thirty-three.',
        'সংযোগ হলো তেরো যোগ বারো যোগ আট, অর্থাৎ তেত্রিশ।');
  A.text(400,422,'n(A ∪ B) = 25 + 20 - 12 = 33',{size:19,c:AM});
  A.say('Seven students like neither drink, because forty minus thirty-three is seven.',
        'সাত জন কোনো পানীয়ই পছন্দ করে না, কারণ চল্লিশ বিয়োগ তেত্রিশ সাত।');
  NOTE(A,458,'subtract the overlap once, not twice.');
});

lesson('c68-188','Number of subsets','Each element has two choices',A=>{
  A.say('A set with n elements has two to the power n subsets.',
        'n উপাদানের সেটের উপসেট সংখ্যা দুই-এর n ঘাত।');
  A.text(400,100,'A = {a, b, c}',{size:28,c:AM});
  A.say('For each element there are two choices: take it or leave it out.',
        'প্রতিটি উপাদানের জন্য দুইটি সুযোগ: নাও বা বাদ দাও।');
  A.text(400,148,'3 elements give 2 × 2 × 2 choices',{size:19,c:MU});
  A.text(170,200,'{}',{size:20,c:MU});
  A.text(320,200,'{a}',{size:20,c:SK});
  A.text(470,200,'{b}',{size:20,c:SK});
  A.text(620,200,'{c}',{size:20,c:SK});
  A.text(170,245,'{a,b}',{size:20,c:GR});
  A.text(320,245,'{a,c}',{size:20,c:GR});
  A.text(470,245,'{b,c}',{size:20,c:GR});
  A.text(620,245,'{a,b,c}',{size:20,c:GR});
  A.say('The eight subsets are listed here, from the empty set to the whole set.',
        'আটটি উপসেট এখানে লেখা, শূন্য সেট থেকে সম্পূর্ণ সেট পর্যন্ত।');
  A.text(400,305,'2³ = 8 subsets',{size:28,c:GR});
  A.say('The set itself and the empty set are both counted as subsets.',
        'সেটটি নিজে ও শূন্য সেট দুটিই উপসেট হিসেবে গোনা হয়।');
  A.text(400,350,'proper subsets = 8 - 1 = 7',{size:20,c:PK});
  NOTE(A,400,'raise 2 to the number of elements.');
});

/* --- Class 8 · Quadrilateral --- */

lesson('c68-189','Rectangle, rhombus and square','One property apart',A=>{
  A.say('A rectangle has four right angles, and its diagonals are equal.',
        'আয়তক্ষেত্রে চারটি সমকোণ, আর এর কর্ণগুলো সমান।');
  A.rect(110,140,220,140,{c:SK,w:3,fill:SK,fo:.10},.5);
  A.line(110,140,330,280,{c:AM,w:2},.4);
  A.line(330,140,110,280,{c:AM,w:2},.4);
  A.text(220,320,'diagonals equal',{size:17,c:AM});
  A.say('A rhombus has four equal sides, and its diagonals meet at right angles.',
        'রম্বসে চারটি সমান বাহু, আর এর কর্ণগুলো সমকোণে মেলে।');
  A.pts([[450,270],[530,140],[670,150],[590,280],[450,270]],{c:GR,w:3,fill:GR,fo:.10},.6);
  A.line(450,270,670,150,{c:AM,w:2},.4);
  A.line(530,140,590,280,{c:AM,w:2},.4);
  A.text(560,320,'diagonals bisect at 90°',{size:16,c:AM});
  A.say('A square is both at once: four right angles and four equal sides.',
        'বর্গ একসঙ্গে দুইটিই: চারটি সমকোণ ও চারটি সমান বাহু।');

  });
  A.say('Both classes have a mean of twenty, because both sets are balanced around it.',
        'দুই শ্রেণিরই গড় বিশ, কারণ দুই সেটই এর চারপাশে ভারসাম্যপূর্ণ।');
  A.dashed(80,base-20*unit,720,base-20*unit,{c:AM,w:2},.6);
  A.text(660,base-20*unit-10,'mean 20',{size:16,c:AM});
  A.text(200,398,'class A',{size:17,c:SK});
  A.text(520,398,'class B',{size:17,c:GR});
  A.say('Class A is tightly packed, with a range of only four marks.',
        'A শ্রেণি ঘনসন্নিবিষ্ট, পরিসর মাত্র চার নম্বর।');
  A.text(200,428,'range 4',{size:17,c:SK});
  A.say('Class B stretches from ten to thirty, so its range is twenty marks.',
        'B শ্রেণি দশ থেকে ত্রিশ পর্যন্ত, তাই পরিসর বিশ নম্বর।');
  A.text(520,428,'range 20',{size:17,c:GR});
  A.say('The mean hides the spread, so always compare the range as well.',
        'গড় ছড়ানোর পরিমাণ লুকিয়ে রাখে, তাই পরিসরও তুলনা করো।');
  NOTE(A,458,'same centre, different spread.');
});

// __C678_APPEND__

/* =====================================================================
   COMMENT BUBBLES (English / বাংলা) + VOICE
   ===================================================================== */
const feeds=[],cmKey=[];
function renderCm(i,t){
  const feed=feeds[i]; if(!feed) return;
  const caps=VISUALS[i].caps, idx=capIdx(caps,t), lang=S.lang;
  const cur=idx>=0?caps[idx]:null, n=cur?Math.floor((t-cur[0])*45):0;
  const key=idx+':'+(cur?Math.min(n,300):0)+':'+lang;
  if(cmKey[i]===key) return; cmKey[i]=key;
  if(idx<0){feed.innerHTML='<div class="cm-hint">Press play — Bolt will explain here.<br><span class="bnf">প্লে চাপো — বোল্ট এখানে বুঝিয়ে দেবে।</span></div>';return;}
  let h='';
  for(let k=Math.max(0,idx-2);k<=idx;k++){
    const c=caps[k], last=k===idx;
    let en=c[1], bn=c[2], enC='', bnC='';
    if(last){
      if(lang==='both'){
        if(n<en.length){en=en.slice(0,n);enC='<i>▍</i>';bn='';}
        else if(n-en.length<bn.length){bn=bn.slice(0,n-en.length);bnC='<i>▍</i>';}
      }else if(lang==='en'){ if(n<en.length){en=en.slice(0,n);enC='<i>▍</i>';} }
      else { if(n<bn.length){bn=bn.slice(0,n);bnC='<i>▍</i>';} }
    }
    let body='';
    if(lang!=='bn' && en) body+='<span class="en">'+esc(en)+enC+'</span>';
    if(lang!=='en' && (bn||bnC)) body+='<span class="bn">'+esc(bn)+bnC+'</span>';
    h+='<div class="cm'+(last?'':' old')+'"><div class="cm-av">🤖</div><div class="cm-bb">'+body+'</div></div>';
  }
  feed.innerHTML=h;
}

function speakCap(c){
  if(!('speechSynthesis' in window)) return;
  const ss=window.speechSynthesis; ss.cancel();
  const parts=S.lang==='en'?[['en',c[1]]]:S.lang==='bn'?[['bn',c[2]]]:[['en',c[1]],['bn',c[2]]];
  const vs=ss.getVoices();
  parts.forEach(([lg,tx])=>{
    const u=new SpeechSynthesisUtterance(tx);
    u.lang=lg==='bn'?'bn-BD':'en-US';
    const v=vs.find(x=>x.lang.toLowerCase().replace('_','-').startsWith(lg));
    if(v) u.voice=v;
    u.rate=.95; u.pitch=1.1;
    ss.speak(u);
  });
}
function stopVoice(){ if('speechSynthesis' in window) window.speechSynthesis.cancel(); S.sp=null; }
function checkSpeak(){
  if(!S.voice||!S.playing) return;
  const caps=VISUALS[S.vi].caps, i=capIdx(caps,S.t), key=S.vi+':'+S.mi+':'+i;
  if(i<0||key===S.sp) return;
  S.sp=key; speakCap(caps[i]);
}
function voiceNote(){
  const el=$('#vcVoiceNote');
  if(!('speechSynthesis' in window)){el.textContent='Voice is not supported in this browser.';return;}
  const hasBn=speechSynthesis.getVoices().some(v=>/^bn/i.test(v.lang));
  el.textContent=hasBn?'':'No Bangla voice found on this device. Install one in your system settings to hear Bangla.';
}

/* =====================================================================
   CAROUSEL ENGINE
   ===================================================================== */
const track=$('#vcTrack'),view=$('#vcView'),svgs=[],slides=[];
const cur=()=>VISUALS[S.vi].modes[S.mi];
const previewT=v=>v.modes[0].duration*.92;

function rebuild(){
  track.innerHTML='';svgs.length=0;slides.length=0;feeds.length=0;cmKey.length=0;
  VISUALS.forEach((v,i)=>{
    const sl=document.createElement('div');sl.className='vc-slide';
    sl.innerHTML='<div class="vc-head"><span class="vc-count">'+(i+1)+' / '+VISUALS.length+'</span><b>'+esc(v.title)+'</b></div>'
      +'<div class="vc-body"><div class="vc-stage"><svg viewBox="0 0 800 480" role="img" aria-label="'+esc(v.title)+'"></svg></div>'
      +'<div class="vc-cm"><div class="cm-in"><div class="cm-top"><span>🤖</span> Bolt says · <span class="bnf">বোল্ট বলছে</span></div><div class="cm-feed" aria-live="polite"></div></div></div></div>';
    sl.onclick=()=>{if(i!==S.vi) go(i);};
    track.appendChild(sl);slides.push(sl);svgs.push(sl.querySelector('svg'));feeds.push(sl.querySelector('.cm-feed'));
  });
  buildDots();buildModes();buildLang();layout();renderAll();ui();
}
function layout(){
  const w=view.clientWidth||800, sw=w<700?w*.9:Math.min(w*.84,1120), gap=22;
  slides.forEach((sl,i)=>{sl.style.flexBasis=sw+'px';sl.classList.toggle('on',i===S.vi);sl.classList.toggle('stack',sw<860);});
  track.style.transform='translateX('+((w-sw)/2-S.vi*(sw+gap))+'px)';
}
function renderAll(){
  VISUALS.forEach((v,i)=>{
    const act=i===S.vi, m=act?cur():v.modes[0], t=act?Math.min(S.t,m.duration):previewT(v);
    svgs[i].innerHTML=m.frame(t);cmKey[i]=null;renderCm(i,t);
  });
  progress();
}
function render(){
  const m=cur(), t=Math.min(S.t,m.duration);
  svgs[S.vi].innerHTML=m.frame(t);
  renderCm(S.vi,t);
  progress();
}
function progress(){
  const m=cur();
  $('#vcFill').style.width=(clamp(S.t/m.duration)*100)+'%';
  $('#vcInfo').textContent='Lesson '+(S.vi+1)+' of '+VISUALS.length+'  ·  '+Math.floor(S.t)+'s / '+Math.round(m.duration)+'s';
}
function ui(){
  $('#bPlay').textContent=S.playing?'⏸ Pause':'▶ Play';
  const bv=$('#bVoice');bv.textContent=S.voice?'🔊 Voice on':'🔇 Voice off';bv.classList.toggle('on',S.voice);
}
function buildModes(){
  const v=VISUALS[S.vi],box=$('#vcModes');box.innerHTML='';
  v.modes.forEach((m,i)=>{
    const b=document.createElement('button');b.textContent=m.label;b.className=i===S.mi?'on':'';
    b.onclick=()=>{S.mi=i;S.t=0;clearTimeout(S.adv);stopVoice();buildModes();renderAll();if(!S.playing) play();};
    box.appendChild(b);
  });
}
function buildLang(){
  const box=$('#vcLang');box.innerHTML='';
  [['en','English'],['bn','বাংলা'],['both','English + বাংলা']].forEach(([id,label])=>{
    const b=document.createElement('button');b.textContent=label;b.className=id===S.lang?'on':'';
    b.onclick=()=>{S.lang=id;S.sp=null;if('speechSynthesis' in window) speechSynthesis.cancel();buildLang();renderAll();};
    box.appendChild(b);
  });
}
function buildDots(){
  const d=$('#vcDots');d.innerHTML='';
  VISUALS.forEach((v,i)=>{
    const b=document.createElement('button');b.title=v.title;b.setAttribute('aria-label',v.title);
    b.className=i===S.vi?'on':'';b.onclick=()=>go(i);d.appendChild(b);
  });
}
function tick(ts){
  if(!S.playing) return;
  S.t+=(ts-S.last)/1000;S.last=ts;
  if(S.t>=cur().duration){S.t=cur().duration;S.playing=false;render();ui();onEnd();return;}
  checkSpeak();render();requestAnimationFrame(tick);
}
function play(){
  if(S.playing) return;
  clearTimeout(S.adv);S.manual=false;
  if(S.t>=cur().duration){S.t=0;S.sp=null;}
  S.playing=true;S.last=performance.now();ui();requestAnimationFrame(tick);
}
function pause(manual=true){S.playing=false;if(manual) S.manual=true;clearTimeout(S.adv);stopVoice();ui();}
function onEnd(){clearTimeout(S.adv);S.adv=setTimeout(()=>{if(!S.manual) go(S.vi+1);},2200);}
function go(i,auto=true){
  if(S.busy||!VISUALS.length) return;
  S.busy=true;clearTimeout(S.adv);S.playing=false;stopVoice();
  S.vi=(i+VISUALS.length)%VISUALS.length;S.t=0;
  buildDots();buildModes();layout();renderAll();ui();
  setTimeout(()=>{S.busy=false;if(auto) play();},560);
}

$('#bPlay').onclick=()=>S.playing?pause(true):play();
$('#bRep').onclick=()=>{clearTimeout(S.adv);stopVoice();S.t=0;if(S.playing) render();else play();};
$('#bVoice').onclick=()=>{S.voice=!S.voice;S.sp=null;if(!S.voice) stopVoice();ui();voiceNote();};
$('#bNext').onclick=$('#aNext').onclick=()=>go(S.vi+1);
$('#bPrev').onclick=$('#aPrev').onclick=()=>go(S.vi-1);
$('#vcCar').onkeydown=e=>{if(e.key==='ArrowRight') go(S.vi+1);if(e.key==='ArrowLeft') go(S.vi-1);};
let sx=null;
view.addEventListener('pointerdown',e=>{sx=e.clientX;});
view.addEventListener('pointerup',e=>{
  if(sx===null) return; const dx=e.clientX-sx; sx=null;
  if(Math.abs(dx)>50) go(S.vi+(dx<0?1:-1));
});
window.addEventListener('resize',layout);
if('speechSynthesis' in window){ speechSynthesis.addEventListener('voiceschanged',voiceNote); }
voiceNote();

const qp=new URLSearchParams(location.search);
if(qp.has('lesson')){S.vi=clamp((parseInt(qp.get('lesson'),10)||1)-1,0,VISUALS.length-1);S.manual=true;}
if(qp.has('t')){S.t=Math.max(0,parseFloat(qp.get('t'))||0);}
if(qp.has('static')){const st=document.createElement('style');st.textContent='.vc-track,.vc-slide{transition:none!important}';document.head.appendChild(st);}
S.ready=true;rebuild();

new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){
    if(!S.manual&&!S.playing&&!S.busy){ S.t>=cur().duration?go(S.vi+1):play(); }
  } else if(S.playing){ pause(false); }
}),{threshold:.4}).observe($('#vcCar'));
})();
</script>

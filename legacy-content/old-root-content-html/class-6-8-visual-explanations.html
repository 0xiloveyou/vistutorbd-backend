<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Class 6-8 with Bolt</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f1f5f9;color:#0f172a}
  .bnf{font-family:"Noto Sans Bengali","Nirmala UI","Kalpurush","SolaimanLipi",system-ui,sans-serif}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .top{text-align:center;padding:30px 16px 0}
  .top h1{margin:0;font-size:clamp(22px,3.4vw,34px)}
  .top p{margin:8px 0 0;color:#64748b;font-size:15px}

  /* ===== visual lessons carousel ===== */
  .vc{padding:18px 0 72px;background:linear-gradient(#f1f5f9,#e2e8f0);overflow:hidden}
  .vc-wrap{max-width:none;margin:0 auto;padding:0 16px}

  .vc-carousel{position:relative;outline:none}
  .vc-viewport{overflow:hidden;padding:18px 0 26px;touch-action:pan-y}
  .vc-track{display:flex;gap:22px;transition:transform .55s cubic-bezier(.65,0,.25,1);will-change:transform}
  .vc-slide{flex:0 0 auto;background:#111a2e;border-radius:22px;padding:14px;box-shadow:0 18px 50px #0f172a33;
    opacity:.42;transform:scale(.92);filter:saturate(.6);cursor:pointer;
    transition:opacity .5s,transform .5s,filter .5s}
  .vc-slide.on{opacity:1;transform:none;filter:none;cursor:default}
  .vc-head{display:flex;align-items:center;gap:10px;color:#e6edf7;padding:2px 6px 12px}
  .vc-count{background:#1e293b;color:#38bdf8;font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px}
  .vc-head b{font-size:16px}

  .vc-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}
  .vc-slide.stack .vc-body{grid-template-columns:1fr}
  .vc-stage{border-radius:14px;overflow:hidden;background-color:#0b1220;
    background-image:linear-gradient(rgba(148,163,184,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.07) 1px,transparent 1px);
    background-size:32px 32px}
  .vc-stage svg{display:block;width:100%;height:auto}
  .vc-stage svg text{font-family:"Segoe UI","Segoe UI Symbol","Cambria Math",system-ui,sans-serif}

  /* Bolt's comment panel */
  .vc-cm{position:relative;background:#0b1220;border-radius:14px;overflow:hidden;min-height:0}
  .vc-slide.stack .vc-cm{height:250px}
  .cm-in{position:absolute;inset:0;display:flex;flex-direction:column;padding:10px 10px 12px}
  .cm-top{display:flex;align-items:center;gap:8px;color:#94a3b8;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0 2px 8px;border-bottom:1px solid #1e293b}
  .cm-feed{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;overflow:hidden;padding-top:8px;
    -webkit-mask-image:linear-gradient(transparent,#000 18%);mask-image:linear-gradient(transparent,#000 18%)}
  .cm{display:flex;gap:8px;align-items:flex-end}
  .cm-av{flex:0 0 30px;width:30px;height:30px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:17px}
  .cm-bb{background:#1e293b;color:#f1f5f9;border-radius:14px 14px 14px 4px;padding:8px 11px;font-size:14px;line-height:1.45;min-width:0}
  .cm.old .cm-bb{opacity:.55}
  .cm-bb .en,.cm-bb .bn{display:block;overflow-wrap:anywhere}
  .cm-bb .bn{font-family:"Noto Sans Bengali","Nirmala UI","Kalpurush","SolaimanLipi",system-ui,sans-serif;color:#fde68a;font-size:15px}
  .cm-bb .en + .bn{margin-top:6px;padding-top:6px;border-top:1px dashed #334155}
  .cm-bb i{font-style:normal;color:#38bdf8}
  .cm-hint{color:#64748b;font-size:13px;text-align:center;padding:6px}

  .vc-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:46px;height:46px;border-radius:50%;
    border:0;background:#fff;color:#0f172a;font-size:28px;line-height:1;cursor:pointer;box-shadow:0 6px 18px #0f172a30;
    display:flex;align-items:center;justify-content:center;padding:0 0 4px}
  .vc-arrow:hover{background:#38bdf8}
  .vc-arrow.prev{left:6px}.vc-arrow.next{right:6px}

  .vc-dots{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin:0 0 26px;padding:0 16px}
  .vc-dots button{width:10px;height:10px;padding:0;border:0;border-radius:999px;background:#94a3b8;cursor:pointer;transition:.3s}
  .vc-dots button.on{width:30px;background:#0ea5e9}

  .vc-panel{max-width:980px;margin:0 auto;background:#fff;border:1px solid #e2e8f0;border-radius:20px;
    padding:16px 18px;box-shadow:0 10px 30px #0f172a14;display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 26px;justify-content:space-between}
  .vc-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#94a3b8;font-weight:700;margin-bottom:6px}
  .vc-btns,.vc-modes{display:flex;gap:8px;flex-wrap:wrap}
  .vc-btns button,.vc-modes button{border:1px solid #cbd5e1;background:#f8fafc;color:#0f172a;padding:9px 14px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;font-family:inherit}
  .vc-modes button.on{background:#0f172a;border-color:#0f172a;color:#fff}
  .vc-btns button:hover,.vc-modes button:hover{background:#e0f2fe;border-color:#38bdf8}
  .vc-modes button.on:hover{background:#0f172a}
  .vc-btns button.main{background:#0ea5e9;border-color:#0ea5e9;color:#fff}
  .vc-btns button.main:hover{background:#0284c7}
  #bVoice.on{background:#16a34a;border-color:#16a34a;color:#fff}
  .vc-note{font-size:11px;color:#b45309;margin-top:6px;max-width:230px;line-height:1.3}
  .vc-info{flex:1 1 100%;display:flex;align-items:center;gap:12px;color:#64748b;font-size:13px}
  .vc-prog{flex:1;height:5px;background:#e2e8f0;border-radius:5px;overflow:hidden}
  .vc-prog i{display:block;height:100%;width:0;background:#0ea5e9}
  @media(max-width:640px){.vc-arrow{width:38px;height:38px;font-size:22px}.vc-btns button,.vc-modes button{padding:8px 10px;font-size:13px}}
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>Class 6-8 Visual Explanations</h1>
    <p>Class 6&ndash;8 &middot; 30 chapters &middot; Bolt draws, speaks and comments in English and <span class="bnf">বাংলা</span></p>
  </header>

  <section id="vc" class="vc" aria-label="Classes 6 to 8: animated lessons">
    <h2 class="sr">Classes 6, 7 and 8 with Bolt the robot</h2>
    <div class="vc-wrap">

      <div class="vc-carousel" id="vcCar" tabindex="0" aria-roledescription="carousel">
        <button class="vc-arrow prev" id="aPrev" aria-label="Previous lesson">&#8249;</button>
        <div class="vc-viewport" id="vcView"><div class="vc-track" id="vcTrack"></div></div>
        <button class="vc-arrow next" id="aNext" aria-label="Next lesson">&#8250;</button>
      </div>
      <div class="vc-dots" id="vcDots"></div>

      <div class="vc-panel">
        <div>
          <div class="vc-label">Playback</div>
          <div class="vc-btns">
            <button id="bPrev" aria-label="Previous lesson">⏮ Back</button>
            <button id="bPlay" class="main" aria-label="Pause or play">⏸ Pause</button>
            <button id="bRep"  aria-label="Watch again">⟲ Watch again</button>
            <button id="bNext" aria-label="Next lesson">Next ⏭</button>
          </div>
        </div>
        <div>
          <div class="vc-label">Language</div>
          <div class="vc-modes bnf" id="vcLang"></div>
        </div>
        <div>
          <div class="vc-label">Voice</div>
          <div class="vc-btns"><button id="bVoice" aria-label="Turn Bolt's voice on or off">🔇 Voice off</button></div>
          <div class="vc-note" id="vcVoiceNote"></div>
        </div>
        <div id="vcModeBox">
          <div class="vc-label">Style</div>
          <div class="vc-modes" id="vcModes"></div>
        </div>
        <div class="vc-info"><span id="vcInfo"></span><div class="vc-prog"><i id="vcFill"></i></div></div>
      </div>
    </div>
  </section>
</main>

<script>
(function(){
/* =====================================================================
   HOW TO ADD A NEW LESSON
   lesson('id','Slide title','Heading drawn on the board',A=>{
     A.say('English comment','বাংলা মন্তব্য');          // comment bubble + voice + talking
     A.text(x,y,'hello',{size:22,c:'#fbbf24'});          // Bolt writes it with the pen
     const g=A.mat(cx,cy,[[1,2],[3,4]],{cw:56,rh:44,size:24,col:(i,j)=>...});   // matrix (optional)
     A.box(g.cell(i,j),colour);  A.arrow(..); A.circle(..); A.rect(..); A.line(..); A.ell(..); A.pts([[x,y],..],{c,w,fill,fo});
   });
   Everything is drawn by Bolt's pen in the order you call it. The stage is 800 x 480.
   ===================================================================== */
const VISUALS=[];
const S={vi:0,mi:0,t:0,playing:false,manual:false,last:0,adv:null,busy:false,ready:false,lang:'both',voice:false,sp:null};
window.registerVisual=v=>{VISUALS.push(v);if(S.ready) rebuild();};

/* ---------- tiny helpers ---------- */
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const lerp=(a,b,k)=>a+(b-a)*k;
const f=n=>Math.round(n*10)/10;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function path(d,o={}){
  const {stroke='#e2e8f0',w=2,fill='none',fo=1,op=1,draw=1}=o;
  if(draw<=0) return '';
  const dash=draw<1?` stroke-dasharray="1" stroke-dashoffset="${1-draw}"`:'';
  return `<path d="${d}" pathLength="1" fill="${fill}" fill-opacity="${fo}" stroke="${stroke}" stroke-width="${w}" opacity="${op}" stroke-linejoin="round" stroke-linecap="round"${dash}/>`;
}
function txt(x,y,s,o={}){
  const {size=18,fill='#e2e8f0',anchor='middle',op=1,weight=700}=o;
  if(op<=0) return '';
  return `<text x="${f(x)}" y="${f(y)}" font-size="${size}" fill="${fill}" text-anchor="${anchor}" opacity="${op}" font-weight="${weight}">${esc(s)}</text>`;
}
const cap=(list,t)=>{let c=null;for(const e of list) if(e[0]<=t) c=e;return c;};
const capIdx=(list,t)=>{let k=-1;for(let i=0;i<list.length;i++) if(list[i][0]<=t) k=i;return k;};
/* how long one comment stays on screen (same for every language mode, so timing never changes) */
const ctime=c=>(c[1].length+c[2].length)/20+.35;

const AM='#fbbf24',SK='#38bdf8',GR='#4ade80',PK='#f472b6',VI='#c4b5fd',RD='#f87171',INK='#e2e8f0',MU='#94a3b8';

/* =====================================================================
   BOLT: cute robot with rocket shoes, holding a pen
   ===================================================================== */
function robotSvg(t,cx,cy,tilt,sgn,spd,pen,talking,happy,ink,s){
  const th=tilt*Math.PI/180;
  const ox=34*sgn, oy=-20;
  const sx=cx+s*(ox*Math.cos(th)-oy*Math.sin(th)), sy=cy+s*(ox*Math.sin(th)+oy*Math.cos(th));
  const hx=pen[0]+16, hy=pen[1]-30;
  const dist=Math.hypot(hx-sx,hy-sy), sag=Math.min(36,dist*.28);
  const mx=(sx+hx)/2, my=(sy+hy)/2+sag;
  const fl=30+Math.sin(t*25)*5+clamp(spd/10,0,26);
  const blink=(t%3.8)>3.65?.12:1, mo=talking?4+Math.abs(Math.sin(t*17))*8:3;
  const ex=clamp((pen[0]-cx)/90,-1,1)*3, ey=clamp((pen[1]-cy)/120,-1,1)*2;
  let b='';
  [-14,14].forEach(x=>{
    const sd=x<0?-1:1;
    b+=`<path d="M${x-7} 70Q${x-3} ${f(70+fl*.6)} ${x} ${f(70+fl)}Q${x+3} ${f(70+fl*.6)} ${x+7} 70Z" fill="#fb923c"/><path d="M${x-3} 70L${x} ${f(70+fl*.62)}L${x+3} 70Z" fill="#fde047"/>`;
    b+=`<rect x="${x-4}" y="34" width="8" height="16" fill="#94a3b8"/>`;
    b+=`<rect x="${x-6}" y="64" width="12" height="7" rx="2" fill="#475569"/><rect x="${x-12}" y="48" width="24" height="18" rx="6" fill="#f87171" stroke="#b91c1c" stroke-width="2"/>`;
    b+=`<path d="M${x+sd*12} 52L${x+sd*23} 67L${x+sd*12} 64Z" fill="#fbbf24" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round"/>`;
  });
  b+=`<path d="M${-ox} -20Q${f(-ox*1.45)} 4 ${f(-ox*1.25)} 24" fill="none" stroke="#94a3b8" stroke-width="9" stroke-linecap="round"/><circle cx="${f(-ox*1.25)}" cy="26" r="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2.5"/>`;
  b+=`<rect x="-36" y="-42" width="72" height="78" rx="16" fill="#cbd5e1" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="0" cy="-8" r="11" fill="#38bdf8" opacity="${f(.6+.4*Math.sin(t*4))}"/>
  <rect x="-8" y="-52" width="16" height="12" fill="#94a3b8"/>
  <line x1="0" y1="-114" x2="0" y2="-132" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="0" cy="-137" r="7" fill="#f472b6"/>
  <rect x="-46" y="-114" width="92" height="66" rx="22" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
  <rect x="-35" y="-104" width="70" height="46" rx="14" fill="#0f172a"/>
  <ellipse cx="${f(-15+ex)}" cy="${f(-86+ey)}" rx="7" ry="${f(7*blink)}" fill="#38bdf8"/>
  <ellipse cx="${f(15+ex)}" cy="${f(-86+ey)}" rx="7" ry="${f(7*blink)}" fill="#38bdf8"/>
  <rect x="-9" y="-72" width="18" height="${f(mo)}" rx="3" fill="#38bdf8"/>
  <circle cx="-27" cy="-74" r="4" fill="#f472b6" opacity=".6"/><circle cx="27" cy="-74" r="4" fill="#f472b6" opacity=".6"/>`;
  const px=pen[0],py=pen[1];
  let o=`<g transform="translate(${f(cx)} ${f(cy)}) rotate(${f(tilt)}) scale(${s})">${b}</g>`;
  o+=`<path d="M${f(sx)} ${f(sy)}Q${f(mx)} ${f(my)} ${f(hx)} ${f(hy)}" fill="none" stroke="#94a3b8" stroke-width="9" stroke-linecap="round"/>`;
  o+=`<line x1="${f(px+5)}" y1="${f(py-10)}" x2="${f(px+27)}" y2="${f(py-52)}" stroke="#f472b6" stroke-width="8" stroke-linecap="round"/>`;
  o+=`<path d="M${f(px)} ${f(py)}L${f(px+2)} ${f(py-10)}L${f(px+9)} ${f(py-8)}Z" fill="#e2e8f0"/>`;
  if(ink) o+=`<circle cx="${f(px)}" cy="${f(py)}" r="9" fill="${ink}" opacity=".25"/><circle cx="${f(px)}" cy="${f(py)}" r="3.5" fill="${ink}"/>`;
  o+=`<circle cx="${f(hx)}" cy="${f(hy)}" r="11" fill="#fde68a" stroke="#f59e0b" stroke-width="3"/>`;
  return o;
}

/* =====================================================================
   LESSON ENGINE: every element is drawn by the pen, in order.
   ===================================================================== */
function mkP(pts){const cum=[0];for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return {pts,cum,len:cum[cum.length-1]||1};}
function ptAt(P,u){
  const g=u*P.len;let i=1;
  while(i<P.pts.length-1&&P.cum[i]<g) i++;
  const a=P.pts[i-1],b=P.pts[i],sl=P.cum[i]-P.cum[i-1]||1,k=clamp((g-P.cum[i-1])/sl);
  return [a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k];
}
const epts=(cx,cy,rx,ry,n=48)=>{const p=[];for(let i=0;i<=n;i++){const a=-Math.PI/2+i*2*Math.PI/n;p.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)]);}return p;};
const rpts=(x,y,w,h)=>[[x,y],[x+w,y],[x+w,y+h],[x,y+h],[x,y]];
const dstr=pts=>'M'+pts.map(p=>f(p[0])+' '+f(p[1])).join('L');

function elPos(e,u){return e.k==='s'?ptAt(e.P,u):[e.xs+e.w*u,e.yy];}
function penAt(L,t){
  const E=L.els,R=L.rest;let i=-1;
  for(let k=0;k<E.length;k++){if(E[k].t0<=t) i=k; else break;}
  if(i<0){const e=E[0],u=ease(prog(t,e.t0-e.tr,e.t0));return [lerp(R[0],e.start[0],u),lerp(R[1],e.start[1],u)];}
  const e=E[i];
  if(t<=e.t1) return elPos(e,prog(t,e.t0,e.t1));
  const nx=E[i+1];
  if(!nx){const u=ease(prog(t,e.t1+.6,e.t1+2.4));return [lerp(e.end[0],R[0],u),lerp(e.end[1],R[1],u)];}
  const u=ease(prog(t,nx.t0-nx.tr,nx.t0));
  return [lerp(e.end[0],nx.start[0],u),lerp(e.end[1],nx.start[1],u)];
}
function bodyAt(L,t){
  let x=0,y=0,sd=0;const N=9;
  for(let j=0;j<N;j++){
    const p=penAt(L,Math.max(0,t-j*.11)), side=clamp((640-p[0])/60,-1,1);
    x+=p[0]+side*85; y+=p[1]-48; sd+=side;
  }
  x=clamp(x/N,62,738); y=clamp(y/N,168,330); sd/=N;
  const E=L.els,last=E[E.length-1];
  const u=Math.max(1-ease(prog(t,.2,E[0].t0)),ease(prog(t,last.t1+.6,last.t1+2.4)));
  return [lerp(x,L.park[0],u),lerp(y,L.park[1],u),lerp(sd,1,u),lerp(.72,.5,u)];
}
function drawEl(e,t){
  const p=prog(t,e.t0,e.t1); if(p<=0) return '';
  if(e.k==='s'){
    let s='';
    if(e.fill){const q=prog(t,e.t1,e.t1+.5);if(q>0) s+=path(e.d+'Z',{stroke:'none',fill:e.fill,fo:e.fo*q,w:0});}
    return s+path(e.d,{stroke:e.c,w:e.w,draw:p});
  }
  const n=Math.floor(p*e.s.length+1e-6); if(n<=0) return '';
  const body=n>=e.s.length?esc(e.s):`${esc(e.s.slice(0,n))}<tspan opacity="0">${esc(e.s.slice(n))}</tspan>`;
  return `<text x="${f(e.x)}" y="${f(e.y)}" font-size="${e.size}" fill="${e.c}" text-anchor="${e.anchor}" font-weight="${e.weight}">${body}</text>`;
}

function lesson(id,title,head,build){
  const els=[],caps=[];let c=.5,last=null,ls=null,park=[762,100];
  const restOf=()=>[park[0]-26,park[1]+46];
  const add=(e,dur)=>{
    if(!last) last=restOf();
    const d=Math.hypot(e.start[0]-last[0],e.start[1]-last[1]);
    e.tr=clamp(d/520,.08,1); e.t0=c+e.tr; e.t1=e.t0+dur; c=e.t1+.04; last=e.end; els.push(e);
  };
  const A={
    park(x,y){park=[x,y];},
    say(en,bn){ if(ls) c=Math.max(c,ls[0]+ctime(ls)); const e=[c,en,bn]; caps.push(e); ls=e; },
    pts(P,o={},dur=.8){
      add({k:'s',d:dstr(P),c:o.c||INK,w:o.w||3,fill:o.fill,fo:o.fo||.2,P:mkP(P),start:P[0],end:P[P.length-1]},dur);
    },
    line(x1,y1,x2,y2,o={},dur=.5){A.pts([[x1,y1],[x2,y2]],o,dur);},
    arrow(x1,y1,x2,y2,o={},dur=.5){
      A.line(x1,y1,x2,y2,o,dur);
      const a=Math.atan2(y2-y1,x2-x1),h=11;
      A.pts([[x2-h*Math.cos(a-.5),y2-h*Math.sin(a-.5)],[x2,y2],[x2-h*Math.cos(a+.5),y2-h*Math.sin(a+.5)]],o,.2);
    },
    dashed(x1,y1,x2,y2,o={},dur=.9){
      const l=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/l,uy=(y2-y1)/l;let d='';
      for(let k=0;k<l;k+=11){const e=Math.min(k+6,l);d+=`M${f(x1+ux*k)} ${f(y1+uy*k)}L${f(x1+ux*e)} ${f(y1+uy*e)}`;}
      add({k:'s',d,c:o.c||INK,w:o.w||2,P:mkP([[x1,y1],[x2,y2]]),start:[x1,y1],end:[x2,y2]},dur);
    },
    circle(cx,cy,r,o={},dur=.8){A.pts(epts(cx,cy,r,r),o,dur);},
    ell(cx,cy,rx,ry,o={},dur=1){A.pts(epts(cx,cy,rx,ry),o,dur);},
    rect(x,y,w,h,o={},dur=.8){A.pts(rpts(x,y,w,h),o,dur);},
    text(x,y,s,o={},dur){
      const size=o.size||20,anchor=o.anchor||'middle',w=s.length*size*.56;
      const xs=anchor==='middle'?x-w/2:anchor==='end'?x-w:x, yy=y-size*.3;
      add({k:'t',x,y,s,size,c:o.c||INK,anchor,weight:o.weight||700,xs,w,yy,start:[xs,yy],end:[xs+w,yy]},dur||(.25+s.length*.05));
    },
    /* a matrix: brackets (or |bars|) + entries, drawn by the pen. returns its geometry */
    mat(cx,cy,M,o={},dur=.16){
      const cw=o.cw||56,rh=o.rh||44,size=o.size||22,R=M.length,C=M[0].length,W=C*cw,H=R*rh,x0=cx-W/2,y0=cy-H/2;
      const col=o.col||(()=>INK),bc=o.bc||MU;
      if(o.bar){
        A.line(x0,y0-4,x0,y0+H+4,{c:bc,w:3},.3); A.line(x0+W,y0-4,x0+W,y0+H+4,{c:bc,w:3},.3);
      }else{
        A.pts([[x0+8,y0-4],[x0-2,y0-4],[x0-2,y0+H+4],[x0+8,y0+H+4]],{c:bc,w:3},.35);
        A.pts([[x0+W-8,y0-4],[x0+W+2,y0-4],[x0+W+2,y0+H+4],[x0+W-8,y0+H+4]],{c:bc,w:3},.35);
      }
      M.forEach((r,i)=>r.forEach((v,j)=>{
        A.text(x0+cw*(j+.5),y0+rh*(i+.5)+size*.35,String(v),{size,c:col(i,j,v)},dur);
      }));
      return {x0,y0,W,H,cw,rh,cx:j=>x0+cw*(j+.5),cy:i=>y0+rh*(i+.5),cell:(i,j)=>[x0+cw*j+3,y0+rh*i+3,cw-6,rh-6]};
    },
    box(r,c){A.rect(r[0],r[1],r[2],r[3],{c,w:2.5,fill:c,fo:.17},.3);}
  };
  build(A);
  const endT=Math.max(c,ls?ls[0]+ctime(ls):0), D=endT+3.4;
  const L={els,caps,D,head,park,rest:restOf()};
  const mk=robot=>t=>{
    let s=txt(400,34,head,{size:22});
    els.forEach(e=>{s+=drawEl(e,t);});
    if(!robot) return s;
    const pen=penAt(L,t), body=bodyAt(L,t), bq=bodyAt(L,Math.max(0,t-.1));
    const vx=(body[0]-bq[0])/.1, vy=(body[1]-bq[1])/.1;
    let ink=null;
    for(const e of els) if(e.t0<=t&&t<=e.t1){ink=e.c;break;}
    const cp=cap(caps,t), talking=!!cp&&(t-cp[0])<ctime(cp);
    const happy=t>=D-3.2, bob=happy?-Math.abs(Math.sin(t*6))*12:Math.sin(t*2.2)*4;
    s+=robotSvg(t,body[0],body[1]+bob,clamp(vx*.03,-12,12),-body[2],Math.hypot(vx,vy),pen,talking,happy,ink,body[3]);
    return s;
  };
  registerVisual({id,title,caps,modes:[
    {id:'robot',label:'🤖 Bolt draws',duration:D,frame:mk(true)},
    {id:'art',label:'✏️ Line art',duration:D,frame:mk(false)}]});
}

const axes=(A,ox,oy,L,R,U,D)=>{A.arrow(ox-L,oy,ox+R,oy,{c:MU,w:2},.4);A.arrow(ox,oy+D,ox,oy-U,{c:MU,w:2},.4);};
const NOTE=(A,y,s)=>A.text(400,y,'Note: '+s,{size:18,c:AM});
const angDeg=(c,p)=>Math.atan2(p[1]-c[1],p[0]-c[0])*180/Math.PI;
function arcPts(cx,cy,r,a0,a1,n=24){
  const pts=[]; for(let i=0;i<=n;i++){const t=(a0+(a1-a0)*i/n)*Math.PI/180;pts.push([cx+r*Math.cos(t),cy+r*Math.sin(t)]);}
  return pts;
}

lesson('c7-01','Integers','Multiplying and dividing integers',A=>{

/* 3 ─────────────────────────────────────────── Congruence and similarity */

        "সদৃশ আকৃতির কোণগুলো সমান, তবে বাহুর দৈর্ঘ্য ভিন্ন হতে পারে।");
  A.pts([[470,300],[530,300],[500,230],[470,300]],{c:GR,w:3,fill:GR,fo:.12},.8);

  A.say("In similar shapes the matching sides are in the same ratio. The matching angles are equal.",
        "সদৃশ আকৃতিতে অনুরূপ বাহুগুলো একই অনুপাতে থাকে। অনুরূপ কোণগুলো সমান।");
  A.text(400,410,'congruent: same shape and size',{size:18,c:SK});
  A.text(400,440,'similar: same shape, proportional sides',{size:18,c:GR});
  NOTE(A,470,'congruent shapes are a special case of similar shapes.');
});

/* 4 ─────────────────────────────────────────── Multiplication and division of algebraic expressions */
lesson('c7-04','Algebraic multiplication','Area model for (x + 2)(x + 3)',A=>{
  A.say("Multiply algebraic expressions by using an area model. Each rectangle is one product.",
        "বীজগাণিতিক রাশি গুণ করতে ক্ষেত্রফল মডেল ব্যবহার করো। প্রতিটি আয়তক্ষেত্র একটি গুণফল।");
  A.rect(200,100,180,180,{c:SK,w:2.5,fill:SK,fo:.15},.4);
  A.rect(380,100,60,180,{c:AM,w:2.5,fill:AM,fo:.15},.4);
  A.rect(200,280,180,90,{c:GR,w:2.5,fill:GR,fo:.15},.4);
  A.rect(380,280,60,90,{c:PK,w:2.5,fill:PK,fo:.15},.4);

  A.text(290,325,'3x',{size:24,c:GR});
  A.text(410,325,'6',{size:24,c:PK});
  A.say("The side lengths are x + 2 and x + 3. The four small areas are x squared, 2x, 3x and 6.",
        "বাহুর দৈর্ঘ্য x + ২ ও x + ৩। চারটি ছোট ক্ষেত্রফল x², ২x, ৩x ও ৬।");
  A.text(290,88,'x',{size:19,c:SK});
  A.text(410,88,'2',{size:19,c:AM});
  A.text(185,190,'x',{size:19,c:GR,anchor:'end'});
  A.text(185,325,'3',{size:19,c:PK,anchor:'end'});
  A.say("Add the four areas and collect like terms. The two middle terms combine into 5x.",
        "চারটি ক্ষেত্রফল যোগ করে সদৃশ পদ একত্র করো। দুই মধ্যপদ মিলে ৫x হয়।");
  A.text(620,170,'(x + 2)(x + 3)',{size:21,c:AM});
  A.text(620,215,'= x² + 5x + 6',{size:21,c:GR});
  A.text(620,260,'x² + 2x + 3x + 6',{size:18,c:MU});
  A.say("This model also works for division: factor the area and match the known side.",
        "এই মডেল ভাগেও কাজ করে: ক্ষেত্রফল উৎপাদকে ভেঙে জানা বাহুর সঙ্গে মিলাও।");
  NOTE(A,430,'multiply every part by every part, then add like terms.');
});

/* 5 ─────────────────────────────────────────── Algebraic fractions */
lesson('c7-05','Algebraic fractions','Simplify by factoring, then cancel',A=>{
  A.say("An algebraic fraction has a polynomial on top and a polynomial below the line.",
        "বীজগাণিতিক ভগ্নাংশের উপরে ও নিচে বহুপদ থাকে।");
  A.text(400,120,'x² - 9',{size:30,c:SK});
  A.line(325,142,475,142,{c:SK,w:2.5},.2);
  A.text(400,175,'x + 3',{size:26,c:SK});
  A.say("Factor the top. x squared minus nine is a difference of squares: (x - 3)(x + 3).",
        "উপরের রাশি উৎপাদকে ভাঙো। x² বিয়োগ ৯ একটি বর্গের অন্তর: (x - ৩)(x + ৩)।");
  A.text(400,235,'= (x - 3)(x + 3) / (x + 3)',{size:22,c:MU});
  A.say("The factor x plus 3 appears on the top and the bottom, so cancel it.",
        "x যোগ ৩ উৎপাদকটি উপরে ও নিচে আছে, তাই সেটি কেটে দাও।");
  A.text(400,295,'= x - 3',{size:32,c:GR});
  A.text(400,340,'x ≠ -3',{size:22,c:PK});
  A.say("State the excluded value. x cannot be minus three, because it makes the denominator zero.",
        "নিষিদ্ধ মান লেখো। x ঋণাত্মক তিন হতে পারে না, কারণ তখন হর শূন্য হয়।");
  A.text(400,385,'cancel a common factor, not a common term',{size:18,c:AM});
  NOTE(A,430,'factor first, then cancel common factors.');
});

/* 6 ─────────────────────────────────────────── Simple equations */
lesson('c7-06','Simple equations','Solve by doing the same to both sides',A=>{
  A.say("Solve an equation by undoing operations. Keep both sides balanced at every step.",
        "সমীকরণ সমাধান করতে ক্রিয়াগুলো উল্টাও। প্রতিটি ধাপে দুই পাশ সমান রাখো।");
  A.rect(280,110,240,55,{c:SK,w:2.5,fill:SK,fo:.12},.4);
  A.text(400,143,'2x - 5 = 11',{size:26,c:SK});
  A.arrow(400,165,400,205,{c:AM,w:2.5},.3);
  A.text(510,185,'add 5',{size:17,c:AM});
  A.say("First add five to both sides. The minus five disappears and the right side becomes sixteen.",
        "প্রথমে দুই পাশে পাঁচ যোগ করো। বিয়োগ পাঁচ চলে যায় এবং ডান পাশ হয় ষোলো।");
  A.rect(280,205,240,55,{c:GR,w:2.5,fill:GR,fo:.12},.4);
  A.text(400,238,'2x = 16',{size:26,c:GR});
  A.arrow(400,260,400,300,{c:AM,w:2.5},.3);
  A.text(520,280,'divide by 2',{size:17,c:AM});
  A.say("Then divide both sides by two. The coefficient of x becomes one, so x is eight.",
        "তারপর দুই পাশকে দুই দিয়ে ভাগ করো। x-এর সহগ এক হয়, তাই x আট।");
  A.rect(280,300,240,55,{c:PK,w:2.5,fill:PK,fo:.12},.4);
  A.text(400,333,'x = 8',{size:30,c:PK});
  A.say("Check the answer in the original equation: two times eight minus five is eleven.",
        "মূল সমীকরণে উত্তর মিলাও: দুই গুণ আট বিয়োগ পাঁচ সমান এগারো।");
  A.text(400,395,'check: 2(8) - 5 = 11',{size:20,c:MU});
  NOTE(A,440,'undo operations in reverse order.');
});

/* 7 ─────────────────────────────────────────── Set */

  A.say("The overlapping part is the intersection. It contains the elements that are in both sets.",

  A.text(400,425,'A ∩ B = {3}',{size:20,c:GR});

  NOTE(A,468,'the intersection is shared by both sets.');

/* 1 ─────────────────────────────────────────── Patterns */
lesson('c8-01','Patterns','Find the rule and the nth term',A=>{
  A.say("A number pattern follows a rule. Here each term is four more than the one before.",
        "সংখ্যার প্যাটার্ন একটি নিয়ম অনুসরণ করে। এখানে প্রতিটি পদ আগেরটির চেয়ে চার বেশি।");
  [3,7,11,15,19].forEach((v,i)=>{
    A.rect(90+i*110,150,80,60,{c:SK,w:2.5,fill:SK,fo:.14},.35);
    A.text(130+i*110,188,String(v),{size:24,c:SK});
    if(i<4){
      A.arrow(170+i*110,180,200+i*110,180,{c:AM,w:2},.25);
      A.text(185+i*110,135,'+4',{size:16,c:AM});
    }
  });
  A.say("The common difference is four. A pattern with a constant difference is linear.",
        "সাধারণ অন্তর চার। যে প্যাটার্নে অন্তর সমান থাকে সেটি রৈখিক।");
  A.text(400,285,'nth term = 4n - 1',{size:30,c:AM});
  A.say("Test the rule: for n = 1 it gives 3, and for n = 5 it gives 19.",
        "নিয়মটি মিলাও: n = ১ হলে ৩, আর n = ৫ হলে ১৯ হয়।");
  A.text(400,335,'n = 5  →  4(5) - 1 = 19',{size:20,c:GR});
  A.text(400,380,'start at 3 and add 4 each time',{size:20,c:MU});
  A.say("Once you know the rule, you can find any term without listing every term before it.",
        "নিয়ম জানলে আগের সব পদ না লিখেও যেকোনো পদ বের করা যায়।");
  NOTE(A,430,'a linear pattern has a constant difference.');
});

  NOTE(A,468,'a parallelogram has two pairs of parallel sides.');
});

/* 9 ─────────────────────────────────────────── Pythagoras theorem */
lesson('c8-09','Pythagoras theorem','Prove Pythagoras with areas',A=>{
  A.say("Pythagoras can be seen with squares built on the three sides of a right triangle.",
        "সমকোণী ত্রিভুজের তিন বাহুর উপর বর্গ আঁকলে পিথাগোরাসের সূত্র দেখা যায়।");
  A.pts([[230,230],[320,230],[320,320],[230,320],[230,230]],{c:SK,w:2.5,fill:SK,fo:.16},.7);
  A.text(275,275,'9',{size:24,c:SK});
  A.pts([[320,320],[440,320],[440,440],[320,440],[320,320]],{c:GR,w:2.5,fill:GR,fo:.16},.7);
  A.text(380,380,'16',{size:24,c:GR});
  A.pts([[320,230],[410,110],[530,200],[440,320],[320,230]],{c:PK,w:2.5,fill:PK,fo:.16},.8);
  A.text(425,215,'25',{size:24,c:PK});
  A.pts([[320,230],[440,320],[320,320],[320,230]],{c:AM,w:3,fill:AM,fo:.10},.8);
  A.text(305,275,'3',{size:19,c:AM,anchor:'end'});
  A.text(380,337,'4',{size:19,c:AM});
  A.text(375,297,'5',{size:19,c:AM});
  A.say("The square on the vertical leg has area nine. The square on the horizontal leg has area sixteen.",
        "লম্ব পাদের উপর বর্গের ক্ষেত্রফল নয়। অনুভূমিক পাদের উপর বর্গের ক্ষেত্রফল ষোলো।");
  A.say("The square on the hypotenuse has area twenty-five. Nine plus sixteen equals twenty-five.",
        "অতিভুজের উপর বর্গের ক্ষেত্রফল পঁচিশ। নয় যোগ ষোলো সমান পঁচিশ।");
  A.text(650,300,'9 + 16 = 25',{size:22,c:AM});
  A.text(650,340,'3² + 4² = 5²',{size:20,c:GR});
  A.say("This is why the squares of the two legs add to the square of the hypotenuse.",
        "এই কারণেই দুই পাদের বর্গের যোগফল অতিভুজের বর্গের সমান।");
  NOTE(A,465,'the square on the hypotenuse equals the sum of the other two squares.');
});

/* 11 ────────────────────────────────────────── Information and data */

  A.say("A histogram groups data into intervals and shows the frequency of each interval.",
        "হিস্টোগ্রাম উপাত্তকে শ্রেণিতে ভাগ করে প্রতিটি শ্রেণির কম্পাঙ্ক দেখায়।");

  A.rect(250,240,70,140,{c:GR,w:2,fill:GR,fo:.30},.35);
  A.rect(340,200,70,180,{c:AM,w:2,fill:AM,fo:.30},.35);
  A.rect(430,260,70,120,{c:PK,w:2,fill:PK,fo:.30},.35);

  A.say("Histogram bars touch because the intervals are continuous on the number line.",
        "হিস্টোগ্রামের বারগুলো স্পর্শ করে, কারণ শ্রেণিগুলো সংখ্যারেখায় ধারাবাহিক।");
  NOTE(A,470,'bar height shows frequency, not the value.');
});

lesson('c68-101','Place value up to crores','Place value chart from ones to crores',A=>{
  A.say('Every digit in a number has a place, and the place fixes its value.',
        'সংখ্যার প্রতিটি অঙ্কের একটি স্থান আছে, আর সেই স্থানই তার মান নির্ধারণ করে।');
  const col=['Crore','Lakh','Thousand','Hundred','Ten','One'];
  const val=['10,000,000','100,000','1,000','100','10','1'];
  col.forEach((s,i)=>{
    A.rect(68+i*112,135,104,62,{c:SK,w:2,fill:SK,fo:.12},.25);
    A.text(120+i*112,173,s,{size:16,c:INK});
    A.text(120+i*112,222,val[i],{size:13,c:MU});
  });
  A.say('From the right each place is ten times the place before it.',
        'ডান দিক থেকে প্রতিটি স্থান তার আগের স্থানের দশ গুণ।');
  A.text(400,285,'4,25,63,081',{size:34,c:AM});
  A.say('Indian grouping uses three digits, then two, then two: crore, lakh, thousand.',
        'ভারতীয় গ্রুপিংয়ে তিন, তারপর দুই, তারপর দুই অঙ্ক: কোটি, লক্ষ, হাজার।');
  A.arrow(400,305,208,245,{c:PK,w:2},.3);
  A.text(400,350,'4 in the crore place means 4,00,00,000',{size:19,c:GR});
  A.text(400,395,'1 in the ones place means just 1',{size:19,c:MU});
  A.say('The same digit can mean a crore or a single one, depending on where it stands.',
        'একই অঙ্ক কোটি বা এক বোঝাতে পারে, সে কোথায় দাঁড়িয়ে আছে তার উপর নির্ভর করে।');
  NOTE(A,445,'each place value is ten times the one on its right.');
});

lesson('c68-102','Divisibility rules','Four quick tests before dividing',A=>{
  A.say('A divisibility rule tests a number quickly, without any long division.',
        'বিভাজ্যতার নিয়ম লম্বা ভাগ না করেই দ্রুত সংখ্যা পরীক্ষা করে।');
  const rows=[['by 2','last digit is even'],['by 3','digit sum divisible by 3'],
              ['by 5','last digit is 0 or 5'],['by 9','digit sum divisible by 9']];
  rows.forEach((r,i)=>{
    A.rect(70,100+i*60,290,48,{c:AM,w:2,fill:AM,fo:.10},.25);
    A.text(215,130+i*60,r[0],{size:21,c:AM});
    A.rect(380,100+i*60,360,48,{c:SK,w:2,fill:SK,fo:.10},.25);
    A.text(560,130+i*60,r[1],{size:17,c:SK});
  });
  A.say('Test 348. The last digit is even and 3 + 4 + 8 = 15, so 2 and 3 divide it.',
        '৩৪৮ পরীক্ষা করো। শেষ অঙ্ক জোড় এবং ৩+৪+৮=১৫, তাই ২ ও ৩ দিয়ে বিভাজ্য।');
  A.text(235,375,'348',{size:26,c:GR});
  A.text(590,375,'2 yes, 3 yes, 5 no, 9 no',{size:18,c:GR});
  A.say('Test 765. It ends in 5 and 7 + 6 + 5 = 18, so 3, 5 and 9 all divide it.',
        '৭৬৫ পরীক্ষা করো। শেষে ৫ এবং ৭+৬+৫=১৮, তাই ৩, ৫ ও ৯ সবই ভাগ করে।');
  A.text(235,415,'765',{size:26,c:PK});
  A.text(590,415,'3 yes, 5 yes, 9 yes',{size:18,c:PK});
  NOTE(A,452,'a rule gives a quick yes or no, not the quotient.');
});

lesson('c68-103','Prime factorisation tree','Break 84 into prime factors',A=>{
  A.say('A factor tree splits a number until every branch ends at a prime.',
        'উৎপাদক বৃক্ষ সংখ্যাকে ভাঙতে থাকে যতক্ষণ প্রতিটি শাখা মৌলিক সংখ্যায় শেষ না হয়।');

  A.line(412,102,500,148,{c:MU,w:2},.3);
  A.text(300,175,'4',{size:26,c:SK});
  A.text(500,175,'21',{size:26,c:SK});
  A.say('Eighty-four splits into four and twenty-one. Neither is prime, so keep going.',
        '৮৪ ভাগ হয় ৪ ও ২১-এ। কোনোটিই মৌলিক নয়, তাই আরও ভাঙতে হবে।');
  A.line(290,185,240,228,{c:MU,w:2},.3);
  A.line(310,185,360,228,{c:MU,w:2},.3);
  A.text(240,255,'2',{size:26,c:GR});

  A.line(490,185,450,228,{c:MU,w:2},.3);
  A.line(510,185,560,228,{c:MU,w:2},.3);
  A.text(450,255,'3',{size:26,c:GR});
  A.text(560,255,'7',{size:26,c:GR});
  A.say('Two, two, three and seven are all prime. Multiply them back to check.',
        '২, ২, ৩ ও ৭ সবাই মৌলিক। গুণ করে মিলিয়ে নাও।');
  A.text(400,320,'84 = 2 × 2 × 3 × 7',{size:26,c:GR});
  A.text(400,362,'= 2² × 3 × 7',{size:22,c:AM});
  A.say('The answer is the same whichever order you choose to split in.',
        'যে ক্রমেই ভাঙো, উত্তর একই হয়।');
  NOTE(A,420,'every number above 1 has only one prime factorisation.');

lesson('c68-104','Adding fractions with unlike denominators','Find a common denominator first',A=>{
  A.say('Halves and thirds cannot be added directly, because the pieces are different sizes.',
        'অর্ধ ও তৃতীয়াংশ সরাসরি যোগ করা যায় না, কারণ টুকরোগুলোর আকার আলাদা।');
  A.rect(100,115,300,50,{c:SK,w:2,fill:SK,fo:.18},.3);
  A.line(250,115,250,165,{c:INK,w:2},.2);
  A.text(175,148,'1/2',{size:20,c:SK});
  A.rect(100,195,300,50,{c:GR,w:2,fill:GR,fo:.18},.3);
  A.line(200,195,200,245,{c:INK,w:2},.2);
  A.line(300,195,300,245,{c:INK,w:2},.2);
  A.text(150,228,'1/3',{size:20,c:GR});
  A.text(400,285,'+',{size:26,c:INK});
  A.say('Six is a common denominator, because both two and three divide six.',
        'ছয় একটি সাধারণ হর, কারণ ২ ও ৩ উভয়েই ছয়কে ভাগ করে।');
  A.rect(100,310,600,60,{c:AM,w:2,fill:AM,fo:.10},.4);
  for(let i=1;i<6;i++) A.line(100+i*100,310,100+i*100,370,{c:MU,w:1.5},.12);
  A.say('One half is three sixths, and one third is two sixths.',
        'এক-অর্ধ হলো তিন-ষষ্ঠাংশ, আর এক-তৃতীয়াংশ হলো দুই-ষষ্ঠাংশ।');
  A.text(250,348,'3/6',{size:20,c:SK});
  A.text(450,348,'2/6',{size:20,c:GR});
  A.text(400,410,'3/6 + 2/6 = 5/6',{size:28,c:AM});
  A.say('Add the numerators and keep the denominator. Five sixths is already simplest.',
        'লবগুলো যোগ করো, হর অপরিবর্তিত রাখো। পাঁচ-ষষ্ঠাংশ আরও সরল হয় না।');

/* --- Class 6 · Ratios and percentages --- */

lesson('c68-105','Sharing in a given ratio','Divide 120 in the ratio 2 : 3',A=>{
  A.say('A ratio says how many equal shares each person receives. Here the shares are two and three.',
        'অনুপাত বলে প্রত্যেকে কতটি সমান ভাগ পাবে। এখানে ভাগ দুটি দুই ও তিন।');
  A.rect(100,135,200,60,{c:SK,w:2.5,fill:SK,fo:.22},.4);
  A.rect(300,135,300,60,{c:GR,w:2.5,fill:GR,fo:.22},.4);
  A.text(200,173,'2 shares',{size:19,c:SK});
  A.text(450,173,'3 shares',{size:19,c:GR});
  A.say('There are five shares in total, and the whole amount is one hundred and twenty.',
        'মোট পাঁচটি ভাগ, আর সম্পূর্ণ পরিমাণ একশো বিশ।');
  A.text(400,240,'2 + 3 = 5 shares',{size:22,c:AM});
  A.text(400,285,'120 ÷ 5 = 24 per share',{size:24,c:SK});
  A.say('One share is twenty-four. Multiply by each ratio number to get the parts.',
        'এক ভাগ চব্বিশ। প্রতিটি অনুপাত সংখ্যা দিয়ে গুণ করে অংশ পাওয়া যায়।');
  A.text(400,335,'2 × 24 = 48',{size:22,c:SK});
  A.text(400,375,'3 × 24 = 72',{size:22,c:GR});
  A.say('Check: forty-eight plus seventy-two is one hundred and twenty.',
        'মিলাও: আটচল্লিশ যোগ বাহাত্তর সমান একশো বিশ।');
  A.text(400,420,'48 : 72 = 2 : 3',{size:22,c:GR});
  NOTE(A,455,'add the ratio numbers to get the total shares.');

lesson('c68-106','The unitary method','Find the value of one, then scale up',A=>{
  A.say('The unitary method first finds the value of a single item.',
        'ঐকিক নিয়মে প্রথমে একটি বস্তুর মান বের করা হয়।');

  A.text(400,192,'1 pen costs 60 ÷ 5 = 12 taka',{size:22,c:SK});
  A.say('Divide by the number of items to get the price of one item.',
        'একটি বস্তুর দাম পেতে বস্তুর সংখ্যা দিয়ে ভাগ করো।');
  A.arrow(400,212,400,255,{c:MU,w:2},.3);
  A.text(400,285,'8 pens cost 8 × 12 = 96 taka',{size:24,c:GR});
  A.say('Then multiply by the new number of items. The same idea works for any rate.',
        'তারপর নতুন সংখ্যা দিয়ে গুণ করো। একই ভাব যেকোনো হারে কাজ করে।');
  A.rect(120,325,220,58,{c:SK,w:2,fill:SK,fo:.12},.3);
  A.text(230,361,'divide first',{size:18,c:SK});
  A.rect(460,325,220,58,{c:GR,w:2,fill:GR,fo:.12},.3);
  A.text(570,361,'multiply next',{size:18,c:GR});
  A.say('Write the two steps in order so that the working is easy to check.',
        'দুই ধাপ ক্রমে লেখো, যাতে হিসাব সহজে মিলানো যায়।');
  NOTE(A,425,'find one unit, then multiply for many.');
});

lesson('c68-107','Percentage of a quantity','Find 15% of 240',A=>{
  A.say('Percent means per hundred, so fifteen percent is fifteen out of every hundred.',
        'শতকরা মানে প্রতি একশোয়, তাই পনেরো শতাংশ মানে প্রতি একশোয় পনেরো।');
  A.rect(100,105,400,62,{c:SK,w:2,fill:SK,fo:.15},.4);
  A.rect(100,105,60,62,{c:AM,w:2,fill:AM,fo:.55},.3);
  A.text(130,143,'15',{size:20,c:INK});
  A.text(330,143,'15 out of 100',{size:19,c:MU});
  A.say('To find fifteen percent of two hundred and forty, take fifteen hundredths of it.',
        '২৪০-এর ১৫% বের করতে এর ১৫/১০০ অংশ নাও।');
  A.text(400,220,'15% of 240 = 15/100 × 240',{size:24,c:AM});
  A.text(400,265,'= 15 × 2.4',{size:22,c:MU});
  A.text(400,310,'= 36',{size:32,c:GR});
  A.say('A quick check: ten percent of two hundred and forty is twenty-four, and half of it is twelve.',
        'দ্রুত মিলাও: ২৪০-এর দশ শতাংশ ২৪, তার অর্ধেক ১২।');
  A.text(400,360,'10% = 24   and   5% = 12',{size:20,c:SK});
  A.say('Twenty-four plus twelve is thirty-six, which matches the answer.',
        '২৪ যোগ ১২ সমান ৩৬, যা উত্তরের সঙ্গে মেলে।');
  NOTE(A,415,'split an awkward percentage into ten and five percent parts.');
});

lesson('c68-108','Discount and VAT','Two percentage steps on a shop bill',A=>{
  A.say('A discount lowers the marked price, while VAT is a tax added to the bill.',
        'ছাড় নির্ধারিত দাম কমায়, আর ভ্যাট হলো বিলের সঙ্গে যোগ হওয়া কর।');

lesson('c68-119','Types of angles','Acute, right, obtuse and straight',A=>{
  A.say('An angle measures the turn between two rays that share a vertex.',
        'কোণ দুই রশ্মির মধ্যে ঘোরার পরিমাণ মাপে, যাদের একটি সাধারণ শীর্ষবিন্দু আছে।');
  A.line(90,250,240,250,{c:MU,w:3},.4);
  A.line(90,250,190,175,{c:SK,w:3},.4);
  A.pts(arcPts(90,250,55,-45,0,18),{c:SK,w:2},.3);
  A.text(125,228,'acute',{size:16,c:SK});
  A.say('An acute angle is smaller than ninety degrees.',
        'সূক্ষ্মকোণ ৯০ ডিগ্রির চেয়ে ছোট।');
  A.line(330,250,480,250,{c:MU,w:3},.4);
  A.line(330,250,330,140,{c:GR,w:3},.4);
  A.rect(330,232,18,18,{c:GR,w:2},.2);
  A.text(378,228,'right',{size:16,c:GR});
  A.say('A right angle is exactly ninety degrees, marked with a small square.',
        'সমকোণ ঠিক ৯০ ডিগ্রি, ছোট বর্গ দিয়ে চিহ্নিত হয়।');
  A.line(560,250,720,250,{c:MU,w:3},.4);
  A.line(640,250,556,168,{c:PK,w:3},.4);
  A.pts(arcPts(640,250,55,-135,0,20),{c:PK,w:2},.3);
  A.text(600,222,'obtuse',{size:16,c:PK});
  A.say('An obtuse angle is more than ninety but less than one hundred and eighty.',
        'স্থূলকোণ ৯০-এর বেশি কিন্তু ১৮০-এর কম।');
  A.text(400,300,'acute < 90°',{size:21,c:SK});
  A.text(400,338,'right = 90°',{size:21,c:GR});
  A.text(400,376,'obtuse > 90°',{size:21,c:PK});
  A.text(400,414,'straight = 180°',{size:21,c:AM});
  NOTE(A,452,'the angle size does not depend on how long the rays are.');
});

lesson('c68-120','Complementary and supplementary','Pairs that make 90° and 180°',A=>{
  A.say('Two angles that add to ninety degrees are called complementary.',
        'দুটি কোণ যোগ করে ৯০ ডিগ্রি হলে তাদের পূরক কোণ বলা হয়।');
  A.line(110,215,300,215,{c:MU,w:3},.4);
  A.line(110,215,240,120,{c:SK,w:3},.4);
  A.pts(arcPts(110,215,60,-37,0,18),{c:SK,w:2},.3);
  A.pts(arcPts(110,215,78,-90,-37,18),{c:AM,w:2},.3);
  A.text(152,192,'37°',{size:17,c:SK});
  A.text(150,148,'53°',{size:17,c:AM});
  A.text(215,262,'37° + 53° = 90°',{size:18,c:GR});
  A.say('Here thirty-seven and fifty-three make a right angle together.',
        'এখানে ৩৭ ও ৫৩ মিলে সমকোণ তৈরি করে।');
  A.say('Two angles that add to one hundred and eighty are supplementary.',
        'দুটি কোণ যোগ করে ১৮০ ডিগ্রি হলে তাদের সম্পূরক কোণ বলা হয়।');
  A.line(440,275,690,275,{c:MU,w:3},.5);
  A.line(440,275,550,195,{c:PK,w:3},.4);
  A.pts(arcPts(440,275,60,-140,0,20),{c:PK,w:2},.3);
  A.text(492,250,'120°',{size:17,c:PK});
  A.text(625,305,'60°',{size:17,c:GR});
  A.text(560,345,'120° + 60° = 180°',{size:18,c:GR});
  A.say('Supplementary angles form a straight line when placed side by side.',
        'সম্পূরক কোণ পাশাপাশি বসালে সরলরেখা তৈরি করে।');
  A.text(400,392,'complement: sum 90°',{size:21,c:SK});
  A.text(400,430,'supplement: sum 180°',{size:21,c:PK});
  NOTE(A,458,'C for corner 90, S for straight 180.');
});

lesson('c68-121','Vertical angles at a crossing','Opposite angles are equal',A=>{
  A.say('When two straight lines cross, four angles are formed at the crossing point.',
        'দুইটি সরলরেখা ছেদ করলে ছেদবিন্দুতে চারটি কোণ তৈরি হয়।');
  A.line(150,180,650,360,{c:SK,w:3},.7);
  A.line(150,360,650,180,{c:GR,w:3},.7);
  A.circle(400,270,6,{c:AM,w:2,fill:AM,fo:1},.2);
  A.say('The angles opposite each other are vertical angles, and they are always equal.',
        'পরস্পর বিপরীতে থাকা কোণগুলো উল্লম্ব কোণ, এবং তারা সর্বদা সমান।');
  A.pts(arcPts(400,270,52,-20,20,18),{c:PK,w:2.5},.3);
  A.pts(arcPts(400,270,52,160,200,18),{c:PK,w:2.5},.3);
  A.text(455,278,'a',{size:19,c:PK});
  A.text(345,278,'a',{size:19,c:PK});
  A.say('The other pair is also equal, and any two adjacent angles add to one hundred and eighty.',
        'অন্য জোড়াটিও সমান, আর যেকোনো দুই সন্নিহিত কোণ যোগ করে ১৮০ ডিগ্রি হয়।');
  A.pts(arcPts(400,270,72,20,160,20),{c:AM,w:2.5},.3);
  A.pts(arcPts(400,270,72,200,340,20),{c:AM,w:2.5},.3);
  A.text(400,212,'b',{size:19,c:AM});
  A.text(400,342,'b',{size:19,c:AM});
  A.say('So the two a angles match, and a plus b makes a straight angle.',
        'তাই দুই a কোণ মিলে যায়, আর a যোগ b সরলকোণ তৈরি করে।');
  A.text(400,405,'a = a   and   a + b = 180°',{size:22,c:GR});
  NOTE(A,450,'vertical angles are equal, not supplementary.');
});

lesson('c68-122','Angle sum of a triangle','Three angles make 180°',A=>{
  A.say('In every triangle the three interior angles add to one hundred and eighty degrees.',
        'প্রতিটি ত্রিভুজের তিনটি অন্তঃকোণ যোগ করে ১৮০ ডিগ্রি হয়।');
  A.pts([[180,360],[520,360],[330,160],[180,360]],{c:GR,w:3,fill:GR,fo:.10},.8);
  A.pts(arcPts(180,360,55,-50,0,18),{c:SK,w:2},.3);
  A.pts(arcPts(520,360,55,144,180,18),{c:PK,w:2},.3);
  A.pts(arcPts(330,160,50,52,122,18),{c:AM,w:2},.3);
  A.text(222,342,'40°',{size:17,c:SK});
  A.text(480,342,'60°',{size:17,c:PK});
  A.text(330,218,'80°',{size:17,c:AM});
  A.say('These three angles are forty, sixty and eighty degrees.',
        'এই তিন কোণ হলো ৪০, ৬০ ও ৮০ ডিগ্রি।');
  A.text(400,400,'40° + 60° + 80° = 180°',{size:23,c:GR});
  A.say('For a general proof, draw a line through the top vertex parallel to the base.',
        'সাধারণ প্রমাণের জন্য শীর্ষবিন্দু দিয়ে ভূমির সমান্তরাল রেখা আঁকো।');
  A.dashed(120,160,540,160,{c:MU,w:2},.6);
  A.text(400,295,'alternate angles copy the base angles',{size:17,c:MU});
  A.say('The three angles at the top then form a straight angle, which is one hundred and eighty.',
        'তখন উপরের তিন কোণ মিলে সরলকোণ হয়, যা ১৮০ ডিগ্রি।');
  NOTE(A,445,'a triangle cannot have two right angles.');
});

lesson('c68-123','Perpendicular bisector','Compass arcs cut the segment in half',A=>{
  A.say('A perpendicular bisector cuts a segment into two equal parts at a right angle.',
        'লম্ব সমদ্বিখণ্ডক একটি রেখাংশকে সমকোণে দুই সমান ভাগে ভাগ করে।');
  A.line(230,250,570,250,{c:AM,w:4},.5);
  A.circle(230,250,5,{c:AM,w:2,fill:AM,fo:1},.2);
  A.circle(570,250,5,{c:AM,w:2,fill:AM,fo:1},.2);
  A.text(215,275,'A',{size:20,c:AM});
  A.text(585,275,'B',{size:20,c:AM});
  A.say('Open the compass wider than half of AB, then draw an arc from A and from B.',
        'কম্পাস AB-এর অর্ধেকের বেশি খুলে A থেকে ও B থেকে চাপ আঁকো।');
  A.pts(arcPts(230,250,210,-70,70,26),{c:SK,w:2.5},.6);
  A.pts(arcPts(570,250,210,110,250,26),{c:GR,w:2.5},.6);
  A.say('The two arcs meet above and below the segment.',
        'দুই চাপ রেখাংশের উপরে ও নিচে মিলিত হয়।');
  A.circle(400,127,6,{c:PK,w:2,fill:PK,fo:1},.25);
  A.circle(400,373,6,{c:PK,w:2,fill:PK,fo:1},.25);
  A.say('Join the two crossing points. That line is perpendicular to AB and halves it.',
        'দুই ছেদবিন্দু যোগ করো। সেই রেখা AB-এর উপর লম্ব এবং একে সমদ্বিখণ্ডিত করে।');
  A.dashed(400,127,400,373,{c:PK,w:2.5},.7);
  A.rect(400,232,18,18,{c:GR,w:2},.2);
  A.text(492,360,'equal halves',{size:18,c:MU});
  NOTE(A,430,'every point on the bisector is the same distance from A and B.');
});

lesson('c68-124','Constructing a 60 degree angle','Two equal arcs make an equilateral triangle',A=>{
  A.say('Start with a ray OA. With the compass at O, draw an arc that cuts OA at P.',
        'রশ্মি OA দিয়ে শুরু করো। O-তে কম্পাস রেখে OA-কে P-তে ছেদ করা একটি চাপ আঁকো।');
  A.line(200,380,660,380,{c:GR,w:3},.6);
  A.pts(arcPts(200,380,220,-40,0,22),{c:AM,w:2.5},.5);
  A.circle(200,380,6,{c:GR,w:2,fill:GR,fo:1},.2);
  A.text(185,405,'O',{size:20,c:GR});
  A.circle(420,380,6,{c:AM,w:2,fill:AM,fo:1},.25);
  A.text(420,405,'P',{size:19,c:AM});
  A.say('Keep the same radius and draw an arc from P. It meets the first arc at Q.',
        'একই ব্যাসার্ধে P থেকে আরেকটি চাপ আঁকো। এটি প্রথম চাপকে Q-তে মেলে।');
  A.pts(arcPts(420,380,220,190,250,26),{c:SK,w:2.5},.6);
  A.circle(310,190,6,{c:PK,w:2,fill:PK,fo:1},.3);
  A.text(295,175,'Q',{size:19,c:PK});
  A.say('Join O to Q. Since OQ equals OP equals PQ, the triangle is equilateral.',
        'O থেকে Q যোগ করো। যেহেতু OQ = OP = PQ, ত্রিভুজটি সমবাহু।');
  A.line(200,380,310,190,{c:PK,w:3},.6);
  A.line(420,380,310,190,{c:MU,w:2},.4);
  A.pts(arcPts(200,380,62,-60,0,18),{c:PK,w:2.5},.3);
  A.text(252,352,'60°',{size:19,c:PK});
  A.say('Every angle of an equilateral triangle is sixty degrees, so angle POQ is sixty.',
        'সমবাহু ত্রিভুজের প্রতিটি কোণ ৬০ ডিগ্রি, তাই কোণ POQ সমান ৬০ ডিগ্রি।');
  NOTE(A,440,'the compass width must not change during the construction.');
});

lesson('c68-125','Constructing a triangle from three sides','SSS construction with compass arcs',A=>{
  A.say('Three side lengths decide a triangle completely, which is the SSS idea.',
        'তিনটি বাহুর দৈর্ঘ্য ত্রিভুজকে সম্পূর্ণ নির্ধারণ করে, এটাই বাহু-বাহু-বাহু ধারণা।');
  A.line(200,380,500,380,{c:AM,w:4},.5);
  A.text(350,405,'6 cm',{size:18,c:AM});
  A.text(188,400,'A',{size:19,c:AM});
  A.text(510,400,'B',{size:19,c:AM});
  A.say('Draw the base AB of six centimetres. Then set the compass to five and to four.',
        'ছয় সেন্টিমিটারের ভূমি AB আঁকো। তারপর কম্পাস পাঁচ ও চারে সেট করো।');
  A.pts(arcPts(200,380,250,-75,-10,24),{c:SK,w:2.5},.6);
  A.pts(arcPts(500,380,200,200,252,24),{c:GR,w:2.5},.6);
  A.say('The arc of radius five from A and the arc of radius four from B cross at C.',
        'A থেকে পাঁচ ব্যাসার্ধের চাপ ও B থেকে চার ব্যাসার্ধের চাপ C-তে ছেদ করে।');
  A.circle(388,215,6,{c:PK,w:2,fill:PK,fo:1},.3);
  A.text(378,200,'C',{size:19,c:PK});
  A.line(200,380,388,215,{c:SK,w:3},.6);
  A.line(500,380,388,215,{c:GR,w:3},.6);
  A.say('Join A to C and B to C. The triangle has sides six, five and four centimetres.',
        'A থেকে C ও B থেকে C যোগ করো। ত্রিভুজের বাহু ছয়, পাঁচ ও চার সেন্টিমিটার।');
  A.text(285,300,'5 cm',{size:18,c:SK});
  A.text(455,300,'4 cm',{size:18,c:GR});
  A.say('Only one triangle shape fits these three lengths, up to reflection.',
        'এই তিন দৈর্ঘ্যে কেবল একটি ত্রিভুজের আকৃতিই মেলে, প্রতিফলন বাদে।');
  NOTE(A,445,'the arcs must be long enough to cross each other.');
});

lesson('c68-126','Pie chart from percentages','Turn percentages into angles',A=>{
  A.say('A pie chart shares one full turn of three hundred and sixty degrees among the parts.',
        'পাই চার্ট এক পূর্ণ ঘূর্ণন, অর্থাৎ ৩৬০ ডিগ্রি, অংশগুলোর মধ্যে ভাগ করে।');
  const cx=270,cy=245,r=130;
  let a=-90;
  [[40,SK,'40%'],[35,GR,'35%'],[25,PK,'25%']].forEach(s=>{
    const a1=a+s[0]*3.6;
    A.pts([[cx,cy]].concat(arcPts(cx,cy,r,a,a1,40)).concat([[cx,cy]]),{c:s[1],w:2.5,fill:s[1],fo:.28},.7);
    const mid=(a+a1)/2*Math.PI/180;
    A.text(cx+r*.6*Math.cos(mid),cy+r*.6*Math.sin(mid)+6,s[2],{size:17,c:INK});
    a=a1;
  });
  A.say('Forty percent of three hundred and sixty is one hundred and forty-four degrees.',
        '৩৬০-এর ৪০ শতাংশ হলো ১৪৪ ডিগ্রি।');
  A.text(560,150,'40% × 360° = 144°',{size:19,c:SK});
  A.text(560,200,'35% × 360° = 126°',{size:19,c:GR});
  A.text(560,250,'25% × 360° = 90°',{size:19,c:PK});
  A.say('Multiply each percentage by three point six, or take its fraction of three sixty.',
        'প্রতিটি শতাংশকে ৩.৬ দিয়ে গুণ করো, অথবা ৩৬০-এর ভগ্নাংশ নাও।');
  A.text(560,305,'total = 360°',{size:20,c:AM});
  A.say('The angles must add to a full turn, which is a good check on your work.',
        'কোণগুলোর যোগফল পূর্ণ ঘূর্ণন হবে, এটি হিসাব মেলানোর ভালো উপায়।');
  NOTE(A,380,'percentages and slice angles are proportional.');
});

lesson('c68-127','Mean of a small data set','The mean balances the data',A=>{
  A.say('The mean is the total divided by how many values there are.',
        'গড় হলো মোট যোগফলকে মানের সংখ্যা দিয়ে ভাগ করা ফল।');
  const vals=[6,8,10,12,14], base=360, unit=14;
  vals.forEach((v,i)=>{
    A.rect(180+i*90,base-v*unit,58,v*unit,{c:SK,w:2,fill:SK,fo:.30},.35);
    A.text(209+i*90,base+28,String(v),{size:19,c:INK});
  });
  A.line(130,base,700,base,{c:MU,w:2},.3);
  A.say('The five values are six, eight, ten, twelve and fourteen.',
        'পাঁচটি মান হলো ৬, ৮, ১০, ১২ ও ১৪।');
  A.dashed(130,base-10*unit,700,base-10*unit,{c:AM,w:2.5},.6);
  A.text(650,base-10*unit-12,'mean = 10',{size:19,c:AM});
  A.say('Add them to get fifty, then divide by five to get ten.',
        'সব যোগ করলে ৫০, তারপর পাঁচ দিয়ে ভাগ করলে ১০।');
  A.text(400,90,'(6 + 8 + 10 + 12 + 14) ÷ 5 = 10',{size:20,c:GR});
  A.say('The mean line sits in the middle because the gaps below and above cancel.',
        'গড় রেখাটি মাঝখানে বসে, কারণ নিচের ও উপরের ব্যবধান কেটে যায়।');
  A.arrow(209,150,209,215,{c:PK,w:2},.3);
  A.arrow(569,215,569,150,{c:GR,w:2},.3);
  NOTE(A,435,'the mean need not be one of the data values.');
});

lesson('c68-128','How an outlier moves the mean','One extreme value pulls the average',A=>{
  A.say('An outlier is a value far away from the rest of the data.',
        'চরম মান হলো এমন মান যা বাকি উপাত্ত থেকে অনেক দূরে।');
  const base=330, unit=10;
  [4,5,5,6].forEach((v,i)=>{
    A.rect(180+i*66,base-v*unit,40,v*unit,{c:SK,w:2,fill:SK,fo:.30},.3);
    A.text(200+i*66,base+26,String(v),{size:18,c:INK});
  });
  A.say('These four values are close together, and their mean is five.',
        'এই চারটি মান কাছাকাছি, আর তাদের গড় পাঁচ।');
  A.dashed(150,base-5*unit,470,base-5*unit,{c:AM,w:2},.5);
  A.text(300,base-5*unit-12,'mean = 5',{size:18,c:AM});
  A.say('Now add one more value, fifteen, which is much larger than the others.',
        'এখন আরেকটি মান ১৫ যোগ করো, যা বাকিগুলোর চেয়ে অনেক বড়।');
  A.rect(460,base-15*unit,40,15*unit,{c:PK,w:2,fill:PK,fo:.30},.35);
  A.text(480,base+26,'15',{size:18,c:PK});
  A.say('The new total is thirty-five over five values, so the mean jumps to seven.',
        'নতুন যোগফল পাঁচটি মানে ৩৫, তাই গড় লাফিয়ে সাত হয়।');
  A.dashed(150,base-7*unit,640,base-7*unit,{c:GR,w:2.5},.6);

lesson('c68-131','Multiplying integers by patterns','Watch the products step down',A=>{
  A.say('A pattern of products can show why a negative times a negative is positive.',
        'গুণফলের ধারা দেখায় কেন ঋণাত্মক গুণ ঋণাত্মক ধনাত্মক হয়।');

  });
  A.say('As the second number drops by one, the product drops by three each time.',
        'দ্বিতীয় সংখ্যা এক করে কমলে গুণফল প্রতিবার তিন করে কমে।');
  A.arrow(480,110,480,300,{c:AM,w:2},.4);
  A.text(560,200,'step -3',{size:18,c:AM});
  A.say('Now start a pattern with minus one times two and keep decreasing the second number.',
        'এখন বিয়োগ এক গুণ দুই দিয়ে ধারা শুরু করো এবং দ্বিতীয় সংখ্যা কমাতে থাকো।');
  const rows2=[['(-1) × 2','-2'],['(-1) × 1','-1'],['(-1) × 0','0'],['(-1) × (-1)','1']];
  rows2.forEach((r,i)=>{
    A.text(250,335+i*32,r[0],{size:18,c:PK});

  });
  A.say('This pattern rises by one, so minus one times minus one must be plus one.',
        'এই ধারা এক করে বাড়ে, তাই বিয়োগ এক গুণ বিয়োগ এক অবশ্যই যোগ এক।');
  NOTE(A,458,'a constant step explains the sign rule.');
});

        'ক্রম না মিলিয়ে অক্ষর লিখলে ভুল অনুরূপ অংশ বোঝাবে।');
  NOTE(A,460,'the order of letters carries the matching information.');
});

lesson('c68-138','Multiply a monomial by a polynomial','2x(3x + 4) as two rectangles',A=>{
  A.say('Distribute the outside term to every term inside the bracket.',
        'বাইরের পদটি বন্ধনীর ভেতরের প্রতিটি পদে ভাগ করে দাও।');
  A.rect(180,120,240,150,{c:SK,w:2.5,fill:SK,fo:.16},.4);
  A.rect(420,120,80,150,{c:AM,w:2.5,fill:AM,fo:.16},.4);
  A.text(300,205,'3x × 2x',{size:21,c:SK});
  A.text(460,205,'4 × 2x',{size:19,c:AM});
  A.text(300,105,'3x',{size:18,c:SK});
  A.text(460,105,'4',{size:18,c:AM});
  A.text(155,205,'2x',{size:22,c:GR,anchor:'end'});
  A.say('The height is two x and the widths are three x and four.',
        'উচ্চতা দুই x, আর প্রস্থ তিন x ও চার।');
  A.text(400,300,'2x(3x + 4)',{size:26,c:AM});
  A.text(400,345,'= 2x × 3x + 2x × 4',{size:22,c:MU});
  A.text(400,390,'= 6x² + 8x',{size:28,c:GR});
  A.say('Multiply the numbers and add the powers of the same letter.',
        'সংখ্যাগুলো গুণ করো এবং একই অক্ষরের ঘাত যোগ করো।');
  A.say('The result has two terms, because the original bracket had two terms.',
        'ফলে দুইটি পদ হয়, কারণ মূল বন্ধনীতে দুইটি পদ ছিল।');
  NOTE(A,440,'x times x gives x squared, not 2x.');
});

lesson('c68-139','Expanding two brackets by a grid','(2x + 1)(x - 4) with four cells',A=>{
  A.say('A two by two grid multiplies every term of the first bracket by every term of the second.',
        'দুই বাই দুই গ্রিড প্রথম বন্ধনীর প্রতিটি পদকে দ্বিতীয়টির প্রতিটি পদ দিয়ে গুণ করে।');
  A.line(220,140,620,140,{c:MU,w:2},.3);
  A.line(220,220,620,220,{c:MU,w:2},.3);
  A.line(220,300,620,300,{c:MU,w:2},.3);
  A.line(420,100,420,300,{c:MU,w:2},.3);
  A.text(320,175,'2x²',{size:24,c:SK});
  A.text(520,175,'-8x',{size:24,c:PK});
  A.text(320,262,'x',{size:24,c:GR});
  A.text(520,262,'-4',{size:24,c:AM});
  A.say('The four products are two x squared, minus eight x, x and minus four.',
        'চারটি গুণফল হলো ২x², বিয়োগ ৮x, x এবং বিয়োগ ৪।');
  A.text(208,175,'2x',{size:18,c:SK,anchor:'end'});
  A.text(208,262,'1',{size:18,c:GR,anchor:'end'});
  A.text(320,128,'x',{size:18,c:MU});
  A.text(520,128,'-4',{size:18,c:MU});
  A.say('Add the like terms minus eight x and plus x to get minus seven x.',
        'সদৃশ পদ বিয়োগ ৮x ও যোগ x যোগ করলে বিয়োগ ৭x হয়।');
  A.text(400,340,'(2x + 1)(x - 4)',{size:23,c:AM});
  A.text(400,382,'= 2x² - 8x + x - 4',{size:21,c:MU});
  A.text(400,424,'= 2x² - 7x - 4',{size:26,c:GR});
  A.say('The grid keeps the signs visible, which prevents lost minus signs.',
        'গ্রিড চিহ্নগুলো দৃশ্যমান রাখে, ফলে বিয়োগ চিহ্ন হারায় না।');
  NOTE(A,460,'multiply all four pairs, then collect like terms.');
});

lesson('c68-140','Checking an expansion by substitution','Test x = 3 on both forms',A=>{
  A.say('An expansion can be checked by putting one number into both the original and the answer.',
        'মূল রাশি ও উত্তরে একটি সংখ্যা বসিয়ে বিস্তৃতি মিলানো যায়।');
  A.text(400,110,'(x + 5)(x - 2) = x² + 3x - 10',{size:22,c:AM});
  A.say('Take x equals three. The left side becomes eight times one.',
        'x সমান তিন ধরো। বাঁ পাশ হয় আট গুণ এক।');
  A.rect(100,155,280,90,{c:SK,w:2,fill:SK,fo:.10},.4);
  A.text(240,190,'left side',{size:18,c:MU});
  A.text(240,225,'(3 + 5)(3 - 2) = 8',{size:20,c:SK});
  A.rect(430,155,280,90,{c:GR,w:2,fill:GR,fo:.10},.4);
  A.text(570,190,'right side',{size:18,c:MU});
  A.text(570,225,'9 + 9 - 10 = 8',{size:20,c:GR});
  A.say('The right side gives nine plus nine minus ten, which is also eight.',
        'ডান পাশে নয় যোগ নয় বিয়োগ দশ, যা-ও আট।');
  A.circle(400,200,10,{c:PK,w:2.5},.3);
  A.text(400,290,'8 = 8',{size:30,c:GR});
  A.say('One matching value is good evidence but not a proof, so test a second value.',
        'একটি মান মিললেও তা প্রমাণ নয়, তাই আরেকটি মান পরীক্ষা করো।');
  A.text(400,345,'x = 0: (-5) from both forms',{size:19,c:MU});
  A.text(400,385,'x = -5: 0 from both forms',{size:19,c:MU});
  A.say('The identity holds for every value, which is why both forms are equal.',
        'অভেদটি প্রতিটি মানে সত্য, তাই দুই রূপ সমান।');
  NOTE(A,435,'substitution is a fast check, not a full proof.');
});

/* --- Class 7 · Algebraic fractions --- */

lesson('c68-141','Reducing algebraic fractions','Divide top and bottom by the common factor',A=>{
  A.say('An algebraic fraction is reduced by dividing both parts by a common factor.',
        'লব ও হরকে সাধারণ উৎপাদক দিয়ে ভাগ করলে বীজগাণিতিক ভগ্নাংশ সরল হয়।');
  A.text(400,110,'6x²',{size:30,c:SK});
  A.line(350,132,450,132,{c:SK,w:2.5},.2);
  A.text(400,168,'9x',{size:28,c:SK});
  A.say('Six and nine share the factor three, and both terms contain x.',
        'ছয় ও নয়ের সাধারণ উৎপাদক তিন, আর দুই পদেই x আছে।');
  A.text(400,228,'= (3 × 2 × x × x) / (3 × 3 × x)',{size:20,c:MU});
  A.text(400,275,'= 2x / 3',{size:30,c:GR});
  A.say('Cancel three and one x, so the simplest form is two x over three.',
        'তিন ও একটি x কেটে দাও, তাই সরলতম রূপ দুই x ভাগ তিন।');
  A.rect(130,305,250,60,{c:PK,w:2,fill:PK,fo:.10},.3);
  A.text(255,342,'x = 4 gives 96/36',{size:17,c:PK});
  A.rect(430,305,250,60,{c:GR,w:2,fill:GR,fo:.10},.3);
  A.text(555,342,'both equal 2.67',{size:17,c:GR});
  A.say('Substituting one value into both forms gives the same number, so the reduction is correct.',
        'দুই রূপে একটি মান বসালে একই সংখ্যা আসে, তাই সরলীকরণ সঠিক।');
  NOTE(A,400,'cancel factors, never individual terms.');
});

lesson('c68-142','Multiplying algebraic fractions','Multiply across, then cancel',A=>{
  A.say('To multiply two algebraic fractions, multiply numerators and multiply denominators.',
        'দুই বীজগাণিতিক ভগ্নাংশ গুণ করতে লবের সঙ্গে লব ও হরের সঙ্গে হর গুণ করো।');
  A.text(250,125,'x',{size:28,c:SK});
  A.line(215,147,285,147,{c:SK,w:2.5},.2);
  A.text(250,180,'3',{size:24,c:SK});
  A.text(340,155,'×',{size:28,c:INK});
  A.text(430,125,'9',{size:28,c:GR});
  A.line(395,147,465,147,{c:GR,w:2.5},.2);
  A.text(430,180,'x²',{size:24,c:GR});
  A.say('Nothing can be cancelled safely until the product is written as a single fraction.',
        'গুণফল এক ভগ্নাংশে লেখার আগে নিরাপদে কিছু কাটা যায় না।');
  A.text(400,245,'= (x × 9) / (3 × x²)',{size:22,c:MU});
  A.text(400,295,'= 9x / 3x²',{size:24,c:AM});
  A.say('Now cancel the common factor three x from the top and the bottom.',
        'এখন উপরে ও নিচে সাধারণ উৎপাদক তিন x কেটে দাও।');
  A.text(400,350,'= 3 / x',{size:32,c:GR});
  A.say('The answer is three over x, which is valid for every x except zero.',
        'উত্তর তিন ভাগ x, যা শূন্য ছাড়া প্রতিটি x-এর জন্য প্রযোজ্য।');
  A.text(400,400,'x ≠ 0',{size:20,c:PK});
  NOTE(A,440,'cancel only after multiplying, and state excluded values.');
});

lesson('c68-143','Dividing algebraic fractions','Flip the second fraction and multiply',A=>{
  A.say('Dividing by a fraction is the same as multiplying by its reciprocal.',
        'একটি ভগ্নাংশ দিয়ে ভাগ করা তার বিপরীত ভগ্নাংশ দিয়ে গুণ করার সমান।');
  A.text(230,130,'x',{size:28,c:SK});
  A.line(195,152,265,152,{c:SK,w:2.5},.2);
  A.text(230,185,'4',{size:24,c:SK});
  A.text(305,155,'÷',{size:28,c:INK});
  A.text(390,130,'x²',{size:28,c:GR});
  A.line(355,152,425,152,{c:GR,w:2.5},.2);
  A.text(390,185,'8',{size:24,c:GR});
  A.say('Keep the first fraction, change the division to multiplication, and flip the second.',
        'প্রথম ভগ্নাংশ রাখো, ভাগকে গুণে বদলাও, আর দ্বিতীয়টি উল্টে দাও।');
  A.text(400,250,'= x/4 × 8/x²',{size:25,c:AM});
  A.say('Multiply across to get eight x over four x squared.',
        'আড়াআড়ি গুণ করলে আট x ভাগ চার x² পাওয়া যায়।');
  A.text(400,300,'= 8x / 4x²',{size:23,c:MU});
  A.text(400,345,'= 2 / x',{size:32,c:GR});
  A.say('Cancel four x, leaving two over x. The reciprocal step is what makes it work.',
        'চার x কেটে দিলে দুই ভাগ x থাকে। বিপরীত ভগ্নাংশের ধাপেই এটি কাজ করে।');
  NOTE(A,398,'flip only the fraction you are dividing by.');
});

lesson('c68-144','Common denominator of expressions','Add 1/(2x) and 1/(3x²)',A=>{
  A.say('Find the lowest common multiple of the denominators before adding.',
        'যোগ করার আগে হরগুলোর লঘিষ্ঠ সাধারণ গুণিতক বের করো।');
  A.text(255,130,'1',{size:26,c:SK});
  A.line(195,152,315,152,{c:SK,w:2.5},.2);
  A.text(255,182,'2x',{size:22,c:SK});
  A.text(350,160,'+',{size:28,c:INK});
  A.text(455,130,'1',{size:26,c:GR});
  A.line(390,152,520,152,{c:GR,w:2.5},.2);
  A.text(455,182,'3x²',{size:22,c:GR});
  A.say('The denominators are two x and three x squared.',
        'হরগুলো হলো দুই x ও তিন x²।');
  A.text(400,240,'LCM of 2x and 3x² is 6x²',{size:21,c:AM});
  A.say('Take the highest power of every factor: two times three is six, and x squared is highest.',
        'প্রতিটি উৎপাদকের সর্বোচ্চ ঘাত নাও: দুই গুণ তিনে ছয়, আর x-এর সর্বোচ্চ ঘাত x²।');
  A.text(400,295,'= 3x/(6x²) + 2/(6x²)',{size:22,c:MU});
  A.text(400,345,'= (3x + 2) / 6x²',{size:26,c:GR});
  A.say('Each numerator is multiplied by the factor its denominator was missing.',
        'প্রতিটি লবকে তার হরে যে উৎপাদক অনুপস্থিত ছিল তা দিয়ে গুণ করা হয়।');
  A.text(400,395,'2x needs 3x,   3x² needs 2',{size:18,c:MU});
  NOTE(A,438,'the LCM uses the highest power of each factor.');
});

lesson('c68-145','Variable on both sides','5x - 3 = 2x + 12',A=>{
  A.say('Collect the variable terms on one side and the numbers on the other.',
        'চলকযুক্ত পদ এক পাশে আর সংখ্যাগুলো অন্য পাশে একত্র করো।');
  A.rect(250,100,300,55,{c:SK,w:2.5,fill:SK,fo:.12},.4);
  A.text(400,135,'5x - 3 = 2x + 12',{size:22,c:SK});
  A.arrow(400,160,400,195,{c:AM,w:2.5},.3);
  A.text(540,180,'subtract 2x',{size:17,c:AM});
  A.say('Subtract two x from both sides, so the right side loses its variable term.',
        'দুই পাশ থেকে দুই x বিয়োগ করো, ফলে ডান পাশের চলক পদ চলে যায়।');
  A.rect(250,200,300,55,{c:GR,w:2.5,fill:GR,fo:.12},.4);
  A.text(400,235,'3x - 3 = 12',{size:24,c:GR});
  A.arrow(400,260,400,295,{c:AM,w:2.5},.3);
  A.text(540,280,'add 3',{size:17,c:AM});
  A.say('Then add three to both sides to free the three x.',
        'তারপর দুই পাশে তিন যোগ করে তিন x-কে মুক্ত করো।');
  A.rect(250,300,300,55,{c:AM,w:2.5,fill:AM,fo:.12},.4);
  A.text(400,335,'3x = 15',{size:24,c:AM});
  A.say('Divide by three to get x equals five. Check: both sides give twenty-two.',
        'তিন দিয়ে ভাগ করলে x সমান পাঁচ। মিলাও: দুই পাশই বাইশ দেয়।');
  A.text(400,390,'x = 5   and   5(5) - 3 = 2(5) + 12',{size:18,c:PK});
  NOTE(A,435,'moving a term across the equals sign changes its sign.');
});

lesson('c68-146','Equations with brackets','3(x - 2) = 2(x + 1)',A=>{
  A.say('Expand the brackets first, then solve the equation in the usual way.',
        'প্রথমে বন্ধনী খোলো, তারপর সাধারণ নিয়মে সমীকরণ সমাধান করো।');
  A.rect(220,100,360,55,{c:SK,w:2.5,fill:SK,fo:.12},.4);
  A.text(400,135,'3(x - 2) = 2(x + 1)',{size:22,c:SK});
  A.arrow(400,160,400,195,{c:AM,w:2.5},.3);
  A.text(560,180,'expand',{size:17,c:AM});
  A.say('Three times x minus two is three x minus six, and two times x plus one is two x plus two.',
        'তিন গুণ x বিয়োগ দুই হলো তিন x বিয়োগ ছয়, আর দুই গুণ x যোগ এক হলো দুই x যোগ দুই।');
  A.rect(220,200,360,55,{c:GR,w:2.5,fill:GR,fo:.12},.4);
  A.text(400,235,'3x - 6 = 2x + 2',{size:22,c:GR});
  A.arrow(400,260,400,295,{c:AM,w:2.5},.3);
  A.text(555,280,'collect terms',{size:17,c:AM});
  A.say('Subtract two x and add six to both sides, so x equals eight.',
        'দুই x বিয়োগ ও ছয় যোগ করো দুই পাশে, ফলে x সমান আট।');
  A.rect(250,300,300,55,{c:PK,w:2.5,fill:PK,fo:.12},.4);
  A.text(400,335,'x = 8',{size:30,c:PK});
  A.say('Check both sides: three times six is eighteen, and two times nine is eighteen.',
        'দুই পাশ মিলাও: তিন গুণ ছয় আঠারো, আর দুই গুণ নয় আঠারো।');
  A.text(400,395,'3(6) = 18   and   2(9) = 18',{size:19,c:MU});
  NOTE(A,440,'expand before collecting terms.');
});

lesson('c68-147','Fraction equations','Clear the denominators by multiplying',A=>{
  A.say('Multiply every term by the common denominator to remove the fractions.',
        'প্রতিটি পদকে সাধারণ হর দিয়ে গুণ করলে ভগ্নাংশগুলো চলে যায়।');
  A.text(400,115,'x/2 + x/3 = 5',{size:30,c:SK});
  A.say('The denominators are two and three, so the common denominator is six.',
        'হরগুলো দুই ও তিন, তাই সাধারণ হর ছয়।');
  A.text(400,175,'multiply by 6:   3x + 2x = 30',{size:22,c:GR});
  A.text(400,225,'5x = 30',{size:26,c:AM});
  A.say('Divide by five to get x equals six.',
        'পাঁচ দিয়ে ভাগ করলে x সমান ছয়।');
  A.text(400,280,'x = 6',{size:32,c:PK});
  A.say('Check the original: six halves plus six thirds is three plus two, which is five.',
        'মূল সমীকরণে মিলাও: ছয়-অর্ধ যোগ ছয়-তৃতীয়াংশ সমান তিন যোগ দুই, যা পাঁচ।');
  A.rect(120,315,250,58,{c:SK,w:2,fill:SK,fo:.10},.3);
  A.text(245,352,'6/2 = 3',{size:19,c:SK});
  A.rect(430,315,250,58,{c:GR,w:2,fill:GR,fo:.10},.3);
  A.text(555,352,'6/3 = 2',{size:19,c:GR});
  A.text(400,412,'3 + 2 = 5',{size:20,c:AM});
  NOTE(A,452,'multiplying by the LCD keeps the equation balanced.');
});

/* --- Class 7 · Set --- */

lesson('c68-148','Set notation','Roster form and the symbol for belongs',A=>{
  A.say('A set is written in roster form with braces, and commas separate the elements.',
        'সেটকে তালিকা পদ্ধতিতে দ্বিতীয় বন্ধনী দিয়ে লেখা হয়, আর কমা উপাদানগুলো আলাদা করে।');
  A.text(400,105,'A = {2, 4, 6, 8}',{size:30,c:AM});
  A.text(400,145,'the even numbers below ten',{size:17,c:MU});
  A.say('The symbol with a bar means is an element of, and the crossed bar means is not.',
        'দাগ দেওয়া প্রতীক মানে উপাদান, আর কাটা দাগ মানে উপাদান নয়।');
  A.text(300,215,'4 ∈ A',{size:28,c:GR});
  A.text(300,262,'5 ∉ A',{size:28,c:PK});
  A.text(520,215,'four is in A',{size:16,c:MU});
  A.text(520,262,'five is not in A',{size:16,c:MU});
  A.say('A set never repeats an element, and the order of writing does not matter.',
        'সেটে উপাদান পুনরাবৃত্তি হয় না, আর লেখার ক্রম গুরুত্বপূর্ণ নয়।');
  A.text(400,320,'{1, 2, 3} is the same set as {3, 1, 2}',{size:19,c:SK});
  A.say('Every element of B lies inside A here, so B is a subset of A.',
        'এখানে B-এর প্রতিটি উপাদান A-এর ভেতরে, তাই B হলো A-এর উপসেট।');
  A.text(400,365,'B = {2, 6}   so   B ⊂ A',{size:22,c:GR});
  A.text(400,415,'n(A) = 4 elements',{size:19,c:MU});
  NOTE(A,455,'braces list a set; order and repetition do not change it.');
});

lesson('c68-149','Difference of two sets','Keep what is in A but not in B',A=>{
  A.say('The difference A minus B keeps the elements of A that are not in B.',
        'A বিয়োগ B-তে A-এর সেই উপাদানগুলো থাকে যা B-তে নেই।');
  A.rect(90,120,620,220,{c:MU,w:2,fill:MU,fo:.03},.5);
  A.ell(310,235,105,105,{c:SK,w:3,fill:SK,fo:.14},.8);
  A.ell(460,235,105,105,{c:GR,w:3,fill:GR,fo:.14},.8);
  A.text(205,150,'A',{size:22,c:SK});
  A.text(560,150,'B',{size:22,c:GR});
  A.text(260,240,'1, 2',{size:19,c:INK});
  A.text(385,240,'3',{size:21,c:AM});
  A.text(500,240,'4, 5',{size:19,c:INK});
  A.say('The element three sits in the overlap, so the difference removes it.',
        'উপাদান তিন ছেদ অংশে আছে, তাই বিয়োগে তা বাদ পড়ে।');
  A.pts(arcPts(310,235,72,110,250,24),{c:PK,w:3},.5);
  A.say('What remains is the left crescent, where one and two belong to A alone.',
        'যা থাকে তা বাঁ দিকের অংশ, যেখানে এক ও দুই কেবল A-এর।');
  A.text(400,380,'A - B = {1, 2}',{size:24,c:PK});
  A.text(400,420,'B - A = {4, 5}',{size:24,c:GR});
  A.say('The difference is not symmetric, so the order of the sets matters.',
        'বিয়োগ বিনিময়যোগ্য নয়, তাই সেটের ক্রম গুরুত্বপূর্ণ।');
  NOTE(A,456,'A - B is not the same as B - A.');
});

lesson('c68-150','Complement of a set','Everything outside A in the universal set',A=>{
  A.say('The complement of A holds every element of the universal set that is not in A.',
        'A-এর পূরক সেটে সার্বিক সেটের সেই সব উপাদান থাকে যা A-তে নেই।');
  A.rect(100,110,600,190,{c:MU,w:2.5,fill:MU,fo:.05},.6);
  A.ell(400,205,130,80,{c:SK,w:3,fill:SK,fo:.18},.9);
  A.text(122,136,'U',{size:22,c:MU,anchor:'start'});
  A.text(400,212,'A',{size:24,c:SK});
  A.say('The shaded ring is the part of U that lies outside the circle.',
        'ছায়াযুক্ত অংশ হলো U-এর সেই ভাগ যা বৃত্তের বাইরে।');
  A.text(400,335,'A′ = U - A',{size:26,c:PK});
  A.text(400,372,'if U = {1,2,3,4,5} and A = {2,4}',{size:18,c:MU});
  A.say('With those two sets, the complement of A is one, three and five.',
        'সেই দুই সেটে A-এর পূরক হলো এক, তিন ও পাঁচ।');
  A.text(400,412,'A′ = {1, 3, 5}',{size:22,c:GR});
  A.say('A set and its complement share nothing and together rebuild the whole universal set.',
        'সেট ও তার পূরক কিছুই ভাগ করে না, আর একসঙ্গে সার্বিক সেট তৈরি করে।');
  NOTE(A,452,'A′ depends on which universal set you chose.');
});

lesson('c68-151','Counting regions in a Venn diagram','Fill the overlap first',A=>{
  A.say('In a two set problem the overlap belongs to both sets, so fill it in first.',
        'দুই সেটের সমস্যায় ছেদ অংশ দুই সেটেরই, তাই আগে সেটি পূরণ করো।');
  A.rect(90,110,620,220,{c:MU,w:2,fill:MU,fo:.03},.5);
  A.ell(310,215,100,88,{c:SK,w:3,fill:SK,fo:.14},.8);
  A.ell(470,215,100,88,{c:GR,w:3,fill:GR,fo:.14},.8);
  A.text(255,220,'12',{size:21,c:SK});
  A.text(390,220,'8',{size:23,c:AM});
  A.text(525,220,'15',{size:21,c:GR});
  A.text(650,290,'7',{size:20,c:MU});
  A.say('Eight like both subjects, twelve like only the first, and fifteen only the second.',
        'আট জন দুই বিষয়ই পছন্দ করে, বারো জন কেবল প্রথমটি, পনেরো জন কেবল দ্বিতীয়টি।');
  A.say('The total in A is twelve plus eight, which is twenty.',
        'A-তে মোট বারো যোগ আট, অর্থাৎ বিশ।');
  A.text(400,362,'n(A) = 12 + 8 = 20',{size:20,c:SK});
  A.text(400,397,'n(B) = 15 + 8 = 23',{size:20,c:GR});
  A.say('Adding the totals counts the overlap twice, so subtract it once for the union.',
        'দুই যোগফল যোগ করলে ছেদ দুইবার গোনা হয়, তাই সংযোগের জন্য একবার বিয়োগ করো।');
  A.text(400,437,'n(A ∪ B) = 20 + 23 - 8 = 35',{size:19,c:AM});
  A.say('The seven outside both sets are part of the universal set but not of the union.',
        'দুই সেটের বাইরে থাকা সাত জন সার্বিক সেটের অংশ, কিন্তু সংযোগের নয়।');
  NOTE(A,458,'the overlap is counted in both set totals.');
});

/* --- Class 7 · Quadrilateral --- */

lesson('c68-152','The quadrilateral family','Parallelogram, rectangle, rhombus, square',A=>{
  A.say('Quadrilaterals are grouped by which pairs of sides are parallel and equal.',
        'কোন জোড়া বাহু সমান্তরাল ও সমান তার ভিত্তিতে চতুর্ভুজকে ভাগ করা হয়।');
  A.rect(100,120,200,105,{c:SK,w:3,fill:SK,fo:.12},.5);
  A.text(200,180,'parallelogram',{size:16,c:SK});
  A.text(200,105,'two pairs parallel',{size:14,c:MU});
  A.say('A rectangle adds four right angles, while a rhombus adds four equal sides.',
        'আয়তক্ষেত্রে চারটি সমকোণ যোগ হয়, আর রম্বসে চারটি সমান বাহু যোগ হয়।');
  A.rect(430,120,200,105,{c:GR,w:3,fill:GR,fo:.12},.5);
  A.text(530,180,'rectangle',{size:16,c:GR});
  A.rect(430,265,200,105,{c:PK,w:3,fill:PK,fo:.12},.5);
  A.text(530,325,'rhombus',{size:16,c:PK});
  A.say('A square carries both extra properties, so it is a rectangle and a rhombus at once.',
        'বর্গে দুই অতিরিক্ত ধর্মই আছে, তাই এটি একসঙ্গে আয়তক্ষেত্র ও রম্বস।');
  A.rect(230,300,150,80,{c:AM,w:3,fill:AM,fo:.18},.5);
  A.text(305,348,'square',{size:16,c:AM});
  A.text(400,425,'trapezium: exactly one pair of parallel sides',{size:18,c:MU});
  A.say('A trapezium sits outside this group, because only one pair of sides is parallel.',
        'ট্রাপিজিয়াম এই দলের বাইরে, কারণ কেবল এক জোড়া বাহু সমান্তরাল।');
  NOTE(A,458,'a square passes every test that a rectangle passes.');
});

lesson('c68-153','Diagonals of a parallelogram','They bisect each other',A=>{
  A.say('The two diagonals of a parallelogram cut each other exactly in half.',
        'সামান্তরিকের দুই কর্ণ পরস্পরকে ঠিক দুই সমান ভাগে কাটে।');
  A.pts([[200,330],[380,170],[620,170],[440,330],[200,330]],{c:GR,w:3,fill:GR,fo:.08},.8);
  A.line(200,330,620,170,{c:PK,w:2.5},.6);
  A.line(440,330,380,170,{c:SK,w:2.5},.6);
  A.circle(410,250,7,{c:AM,w:2,fill:AM,fo:1},.3);
  A.text(432,242,'M',{size:19,c:AM});
  A.say('Both diagonals pass through the same middle point M.',
        'দুই কর্ণই একই মধ্যবিন্দু M দিয়ে যায়।');
  A.line(205,322,217,320,{c:MU,w:3},.2);
  A.line(607,178,619,176,{c:MU,w:3},.2);
  A.line(431,322,443,320,{c:MU,w:3},.2);
  A.line(371,178,383,176,{c:MU,w:3},.2);
  A.say('The tick marks show AM equal to MC and BM equal to MD.',
        'টিক চিহ্ন দেখায় AM সমান MC এবং BM সমান MD।');
  A.text(400,390,'AM = MC   and   BM = MD',{size:21,c:GR});
  A.say('The two triangles made by a diagonal are congruent, which proves the bisecting.',
        'একটি কর্ণে গঠিত দুই ত্রিভুজ সর্বসম, এটাই সমদ্বিখণ্ডন প্রমাণ করে।');
  A.text(400,430,'diagonals bisect each other',{size:19,c:AM});
  NOTE(A,458,'the meeting point is the centre of the parallelogram.');
});

lesson('c68-154','Co-interior angles in a parallelogram','Adjacent angles add to 180°',A=>{
  A.say('In a parallelogram each pair of adjacent angles lies between parallel sides.',
        'সামান্তরিকে প্রতিটি সন্নিহিত কোণ জোড়া সমান্তরাল বাহুর মধ্যে থাকে।');
  A.pts([[180,320],[400,180],[680,180],[460,320],[180,320]],{c:GR,w:3,fill:GR,fo:.08},.8);
  A.say('Take the angle at the bottom left and the angle at the top left.',
        'নিচের বাঁ কোণ ও উপরের বাঁ কোণ নাও।');
  A.pts(arcPts(180,320,58,-37,0,18),{c:SK,w:2.5},.3);
  A.pts(arcPts(400,180,55,143,180,18),{c:PK,w:2.5},.3);
  A.text(230,300,'65°',{size:18,c:SK});
  A.text(352,218,'115°',{size:18,c:PK});
  A.say('Sixty-five plus one hundred and fifteen is one hundred and eighty.',
        'পঁয়ষট্টি যোগ একশো পনেরো সমান একশো আশি।');
  A.text(400,372,'65° + 115° = 180°',{size:23,c:AM});
  A.say('These co-interior angles are supplementary because the top and bottom sides are parallel.',
        'উপর ও নিচের বাহু সমান্তরাল বলে এই সহ-অন্তঃকোণগুলো সম্পূরক।');
  A.dashed(150,350,700,350,{c:MU,w:1.5},.4);
  A.text(400,412,'co-interior angles between parallel lines',{size:17,c:MU});
  A.say('The same rule finds a missing angle in any parallelogram.',
        'একই নিয়ম যেকোনো সামান্তরিকে অজানা কোণ বের করে।');
  NOTE(A,452,'adjacent angles of a parallelogram are supplementary.');
});

/* --- Class 7 · Pythagoras theorem --- */

lesson('c68-155','Finding the hypotenuse','6² + 8² = c²',A=>{
  A.say('The hypotenuse is the side opposite the right angle, and it is the longest side.',
        'অতিভুজ সমকোণের বিপরীত বাহু, এবং এটি বৃহত্তম বাহু।');
  A.pts([[240,360],[240,180],[540,360],[240,360]],{c:SK,w:3,fill:SK,fo:.10},.8);
  A.rect(240,342,18,18,{c:MU,w:2},.2);
  A.text(226,275,'6',{size:20,c:AM,anchor:'end'});
  A.text(390,385,'8',{size:20,c:AM});
  A.text(415,265,'c',{size:22,c:PK});
  A.say('The two legs are six and eight, and the hypotenuse is unknown.',
        'দুই পাদ ছয় ও আট, অতিভুজ অজানা।');
  A.text(400,105,'c² = 6² + 8²',{size:28,c:AM});
  A.text(400,145,'c² = 36 + 64 = 100',{size:22,c:GR});
  A.say('Add the squares to get one hundred, then take the square root.',
        'বর্গগুলো যোগ করলে একশো, তারপর বর্গমূল নাও।');
  A.text(400,190,'c = √100 = 10',{size:26,c:PK});
  A.say('The hypotenuse is ten, which is longer than either leg, as it must be.',
        'অতিভুজ দশ, যা অবশ্যই যেকোনো পাদের চেয়ে বড়।');
  A.text(400,410,'6 + 8 > 10, so the triangle is possible',{size:18,c:MU});
  NOTE(A,445,'the hypotenuse is always the longest side.');
});

lesson('c68-156','Finding a missing leg','13² - 5² = b²',A=>{
  A.say('When the hypotenuse is known, subtract the square of the given leg.',
        'অতিভুজ জানা থাকলে প্রদত্ত পাদের বর্গ বিয়োগ করো।');
  A.pts([[220,350],[220,150],[520,350],[220,350]],{c:GR,w:3,fill:GR,fo:.10},.8);
  A.rect(220,332,18,18,{c:MU,w:2},.2);
  A.text(206,258,'b',{size:22,c:PK,anchor:'end'});
  A.text(370,378,'5',{size:20,c:AM});
  A.text(390,240,'13',{size:20,c:AM});
  A.say('The hypotenuse is thirteen and one leg is five.',
        'অতিভুজ তেরো আর একটি পাদ পাঁচ।');
  A.text(400,105,'b² = 13² - 5²',{size:28,c:GR});
  A.text(400,145,'b² = 169 - 25 = 144',{size:22,c:SK});
  A.text(400,188,'b = 12',{size:30,c:PK});
  A.say('The missing leg is twelve, so the triple is five, twelve, thirteen.',
        'অজানা পাদ বারো, তাই ত্রয়ী পাঁচ, বারো, তেরো।');
  A.text(400,405,'5² + 12² = 25 + 144 = 169 = 13²',{size:18,c:AM});
  A.say('This check confirms the answer without drawing anything new.',
        'এই মিলিয়ে দেখা নতুন কিছু না এঁকেই উত্তর নিশ্চিত করে।');
  NOTE(A,445,'always subtract the smaller square from the largest.');
});

lesson('c68-157','The converse test','Is the triangle right angled?',A=>{
  A.say('The converse says that if a squared plus b squared equals c squared, the angle is right.',
        'বিপরীত উপপাদ্য বলে যদি a² যোগ b² সমান c² হয়, তবে কোণটি সমকোণ।');
  A.text(400,100,'7² + 24² = 49 + 576 = 625 = 25²',{size:20,c:GR});
  A.pts([[160,340],[160,180],[400,340],[160,340]],{c:SK,w:2.5,fill:SK,fo:.10},.7);
  A.rect(160,322,16,16,{c:MU,w:2},.2);
  A.text(146,265,'7',{size:18,c:SK,anchor:'end'});
  A.text(280,365,'24',{size:18,c:SK});
  A.text(300,245,'25',{size:18,c:SK});
  A.say('The sides seven, twenty-four and twenty-five pass the test, so the triangle has a right angle.',
        'বাহু সাত, চব্বিশ ও পঁচিশ পরীক্ষায় উত্তীর্ণ, তাই ত্রিভুজে সমকোণ আছে।');
  A.pts([[460,340],[460,200],[680,340],[460,340]],{c:PK,w:2.5,fill:PK,fo:.10},.6);
  A.text(570,370,'not right angled',{size:16,c:PK});
  A.text(560,185,'6',{size:18,c:PK});
  A.say('The sides four, five and six fail, because sixteen plus twenty-five is forty-one, not thirty-six.',
        'বাহু চার, পাঁচ ও ছয় ব্যর্থ, কারণ ১৬ যোগ ২৫ সমান ৪১, ৩৬ নয়।');
  A.text(400,410,'4² + 5² = 41, but 6² = 36',{size:19,c:PK});
  A.say('The longest side must play the role of c, otherwise the test means nothing.',
        'বৃহত্তম বাহুকে c ধরতে হবে, নাহলে পরীক্ষার অর্থ নেই।');
  NOTE(A,450,'the converse proves a right angle from the sides alone.');
});

/* --- Class 7 · Circle --- */

lesson('c68-158','Circumference and pi','C = πd for every circle',A=>{
  A.say('The circumference is the distance around a circle, and the diameter is twice the radius.',
        'পরিধি বৃত্তের চারদিকের দূরত্ব, আর ব্যাস ব্যাসার্ধের দ্বিগুণ।');
  A.circle(270,235,105,{c:SK,w:3,fill:SK,fo:.06},.9);
  A.line(165,235,375,235,{c:AM,w:3},.5);
  A.circle(270,235,5,{c:AM,w:2,fill:AM,fo:1},.2);
  A.text(270,262,'d = 14 cm',{size:17,c:AM});
  A.say('For every circle the circumference divided by the diameter gives the same number, pi.',
        'প্রতিটি বৃত্তে পরিধি ভাগ ব্যাস একই সংখ্যা দেয়, যা পাই।');
  A.text(600,160,'C / d = π',{size:24,c:AM});
  A.text(600,205,'π ≈ 3.14',{size:20,c:MU});
  A.say('Multiply pi by the diameter, so pi times fourteen is about forty-four.',
        'পাই-কে ব্যাস দিয়ে গুণ করো, তাই পাই গুণ চৌদ্দ প্রায় চুয়াল্লিশ।');
  A.text(400,355,'C = πd = 3.14 × 14 ≈ 44 cm',{size:21,c:GR});
  A.say('Using the radius instead gives the formula two pi r.',
        'ব্যাসার্ধ ব্যবহার করলে সূত্র হয় দুই পাই r।');
  A.text(400,400,'C = 2πr',{size:26,c:PK});
  A.text(400,440,'a bigger circle keeps the same ratio',{size:18,c:MU});
  NOTE(A,458,'pi is a constant, not the measurement of one circle.');
});

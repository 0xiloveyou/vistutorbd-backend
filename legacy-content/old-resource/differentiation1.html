<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Differentiation with Bolt</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f1f5f9;color:#0f172a}
  .bnf{font-family:"Noto Sans Bengali","Nirmala UI","Kalpurush","SolaimanLipi",system-ui,sans-serif}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .top{text-align:center;padding:30px 16px 0}
  .top h1{margin:0;font-size:clamp(22px,3.4vw,34px)}
  .top p{margin:8px 0 0;color:#64748b;font-size:15px}

  /* ===== visual lessons carousel ===== */
  .vc{padding:18px 0 72px;background:linear-gradient(#f1f5f9,#e2e8f0);overflow:hidden}
  .vc-wrap{max-width:none;margin:0 auto;padding:0 16px}

  .vc-carousel{position:relative;outline:none}
  .vc-viewport{overflow:hidden;padding:18px 0 26px;touch-action:pan-y}
  .vc-track{display:flex;gap:22px;transition:transform .55s cubic-bezier(.65,0,.25,1);will-change:transform}
  .vc-slide{flex:0 0 auto;background:#111a2e;border-radius:22px;padding:14px;box-shadow:0 18px 50px #0f172a33;
    opacity:.42;transform:scale(.92);filter:saturate(.6);cursor:pointer;
    transition:opacity .5s,transform .5s,filter .5s}
  .vc-slide.on{opacity:1;transform:none;filter:none;cursor:default}
  .vc-head{display:flex;align-items:center;gap:10px;color:#e6edf7;padding:2px 6px 12px}
  .vc-count{background:#1e293b;color:#38bdf8;font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px}
  .vc-head b{font-size:16px}

  .vc-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}
  .vc-slide.stack .vc-body{grid-template-columns:1fr}
  .vc-stage{border-radius:14px;overflow:hidden;background-color:#0b1220;
    background-image:linear-gradient(rgba(148,163,184,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.07) 1px,transparent 1px);
    background-size:32px 32px}
  .vc-stage svg{display:block;width:100%;height:auto}
  .vc-stage svg text{font-family:"Segoe UI","Segoe UI Symbol","Cambria Math",system-ui,sans-serif}

  /* Bolt's comment panel */
  .vc-cm{position:relative;background:#0b1220;border-radius:14px;overflow:hidden;min-height:0}
  .vc-slide.stack .vc-cm{height:250px}
  .cm-in{position:absolute;inset:0;display:flex;flex-direction:column;padding:10px 10px 12px}
  .cm-top{display:flex;align-items:center;gap:8px;color:#94a3b8;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0 2px 8px;border-bottom:1px solid #1e293b}
  .cm-feed{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;overflow:hidden;padding-top:8px;
    -webkit-mask-image:linear-gradient(transparent,#000 18%);mask-image:linear-gradient(transparent,#000 18%)}
  .cm{display:flex;gap:8px;align-items:flex-end}
  .cm-av{flex:0 0 30px;width:30px;height:30px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:17px}
  .cm-bb{background:#1e293b;color:#f1f5f9;border-radius:14px 14px 14px 4px;padding:8px 11px;font-size:14px;line-height:1.45;min-width:0}
  .cm.old .cm-bb{opacity:.55}
  .cm-bb .en,.cm-bb .bn{display:block;overflow-wrap:anywhere}
  .cm-bb .bn{font-family:"Noto Sans Bengali","Nirmala UI","Kalpurush","SolaimanLipi",system-ui,sans-serif;color:#fde68a;font-size:15px}
  .cm-bb .en + .bn{margin-top:6px;padding-top:6px;border-top:1px dashed #334155}
  .cm-bb i{font-style:normal;color:#38bdf8}
  .cm-hint{color:#64748b;font-size:13px;text-align:center;padding:6px}

  .vc-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:46px;height:46px;border-radius:50%;
    border:0;background:#fff;color:#0f172a;font-size:28px;line-height:1;cursor:pointer;box-shadow:0 6px 18px #0f172a30;
    display:flex;align-items:center;justify-content:center;padding:0 0 4px}
  .vc-arrow:hover{background:#38bdf8}
  .vc-arrow.prev{left:6px}.vc-arrow.next{right:6px}

  .vc-dots{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin:0 0 26px;padding:0 16px}
  .vc-dots button{width:10px;height:10px;padding:0;border:0;border-radius:999px;background:#94a3b8;cursor:pointer;transition:.3s}
  .vc-dots button.on{width:30px;background:#0ea5e9}

  .vc-panel{max-width:980px;margin:0 auto;background:#fff;border:1px solid #e2e8f0;border-radius:20px;
    padding:16px 18px;box-shadow:0 10px 30px #0f172a14;display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 26px;justify-content:space-between}
  .vc-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#94a3b8;font-weight:700;margin-bottom:6px}
  .vc-btns,.vc-modes{display:flex;gap:8px;flex-wrap:wrap}
  .vc-btns button,.vc-modes button{border:1px solid #cbd5e1;background:#f8fafc;color:#0f172a;padding:9px 14px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;font-family:inherit}
  .vc-modes button.on{background:#0f172a;border-color:#0f172a;color:#fff}
  .vc-btns button:hover,.vc-modes button:hover{background:#e0f2fe;border-color:#38bdf8}
  .vc-modes button.on:hover{background:#0f172a}
  .vc-btns button.main{background:#0ea5e9;border-color:#0ea5e9;color:#fff}
  .vc-btns button.main:hover{background:#0284c7}
  #bVoice.on{background:#16a34a;border-color:#16a34a;color:#fff}
  .vc-note{font-size:11px;color:#b45309;margin-top:6px;max-width:230px;line-height:1.3}
  .vc-info{flex:1 1 100%;display:flex;align-items:center;gap:12px;color:#64748b;font-size:13px}
  .vc-prog{flex:1;height:5px;background:#e2e8f0;border-radius:5px;overflow:hidden}
  .vc-prog i{display:block;height:100%;width:0;background:#0ea5e9}
  @media(max-width:640px){.vc-arrow{width:38px;height:38px;font-size:22px}.vc-btns button,.vc-modes button{padding:8px 10px;font-size:13px}}
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>Differentiation with Bolt</h1>
    <p>Class 11 &amp; 12 &middot; Limits first &middot; Bolt draws, speaks and comments in English and <span class="bnf">বাংলা</span></p>
  </header>

  <section id="vc" class="vc" aria-label="Differentiation: animated lessons">
    <h2 class="sr">Differentiation with Bolt the robot</h2>
    <div class="vc-wrap">

      <div class="vc-carousel" id="vcCar" tabindex="0" aria-roledescription="carousel">
        <button class="vc-arrow prev" id="aPrev" aria-label="Previous lesson">&#8249;</button>
        <div class="vc-viewport" id="vcView"><div class="vc-track" id="vcTrack"></div></div>
        <button class="vc-arrow next" id="aNext" aria-label="Next lesson">&#8250;</button>
      </div>
      <div class="vc-dots" id="vcDots"></div>

      <div class="vc-panel">
        <div>
          <div class="vc-label">Playback</div>
          <div class="vc-btns">
            <button id="bPrev" aria-label="Previous lesson">⏮ Back</button>
            <button id="bPlay" class="main" aria-label="Pause or play">⏸ Pause</button>
            <button id="bRep"  aria-label="Watch again">⟲ Watch again</button>
            <button id="bNext" aria-label="Next lesson">Next ⏭</button>
          </div>
        </div>
        <div>
          <div class="vc-label">Language</div>
          <div class="vc-modes bnf" id="vcLang"></div>
        </div>
        <div>
          <div class="vc-label">Voice</div>
          <div class="vc-btns"><button id="bVoice" aria-label="Turn Bolt's voice on or off">🔇 Voice off</button></div>
          <div class="vc-note" id="vcVoiceNote"></div>
        </div>
        <div id="vcModeBox">
          <div class="vc-label">Style</div>
          <div class="vc-modes" id="vcModes"></div>
        </div>
        <div class="vc-info"><span id="vcInfo"></span><div class="vc-prog"><i id="vcFill"></i></div></div>
      </div>
    </div>
  </section>
</main>

<script>
(function(){
/* =====================================================================
   HOW TO ADD A NEW LESSON
   lesson('id','Slide title','Heading drawn on the board',A=>{
     A.say('English comment','বাংলা মন্তব্য');          // comment bubble + voice + talking
     A.text(x,y,'hello',{size:22,c:'#fbbf24'});          // Bolt writes it with the pen
     const g=A.mat(cx,cy,[[1,2],[3,4]],{cw:56,rh:44,size:24,col:(i,j)=>...});   // matrix (optional)
     A.box(g.cell(i,j),colour);  A.arrow(..); A.circle(..); A.rect(..); A.line(..); A.ell(..); A.pts([[x,y],..],{c,w,fill,fo});
   });
   Everything is drawn by Bolt's pen in the order you call it. The stage is 800 x 480.
   ===================================================================== */
const VISUALS=[];
const S={vi:0,mi:0,t:0,playing:false,manual:false,last:0,adv:null,busy:false,ready:false,lang:'both',voice:false,sp:null};
window.registerVisual=v=>{VISUALS.push(v);if(S.ready) rebuild();};

/* ---------- tiny helpers ---------- */
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const lerp=(a,b,k)=>a+(b-a)*k;
const f=n=>Math.round(n*10)/10;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function path(d,o={}){
  const {stroke='#e2e8f0',w=2,fill='none',fo=1,op=1,draw=1}=o;
  if(draw<=0) return '';
  const dash=draw<1?` stroke-dasharray="1" stroke-dashoffset="${1-draw}"`:'';
  return `<path d="${d}" pathLength="1" fill="${fill}" fill-opacity="${fo}" stroke="${stroke}" stroke-width="${w}" opacity="${op}" stroke-linejoin="round" stroke-linecap="round"${dash}/>`;
}
function txt(x,y,s,o={}){
  const {size=18,fill='#e2e8f0',anchor='middle',op=1,weight=700}=o;
  if(op<=0) return '';
  return `<text x="${f(x)}" y="${f(y)}" font-size="${size}" fill="${fill}" text-anchor="${anchor}" opacity="${op}" font-weight="${weight}">${esc(s)}</text>`;
}
const cap=(list,t)=>{let c=null;for(const e of list) if(e[0]<=t) c=e;return c;};
const capIdx=(list,t)=>{let k=-1;for(let i=0;i<list.length;i++) if(list[i][0]<=t) k=i;return k;};
/* how long one comment stays on screen (same for every language mode, so timing never changes) */
const ctime=c=>(c[1].length+c[2].length)/20+.35;

const AM='#fbbf24',SK='#38bdf8',GR='#4ade80',PK='#f472b6',VI='#c4b5fd',RD='#f87171',INK='#e2e8f0',MU='#94a3b8';

/* =====================================================================
   BOLT: cute robot with rocket shoes, holding a pen
   ===================================================================== */
function robotSvg(t,cx,cy,tilt,sgn,spd,pen,talking,happy,ink,s){
  const th=tilt*Math.PI/180;
  const ox=34*sgn, oy=-20;
  const sx=cx+s*(ox*Math.cos(th)-oy*Math.sin(th)), sy=cy+s*(ox*Math.sin(th)+oy*Math.cos(th));
  const hx=pen[0]+16, hy=pen[1]-30;
  const dist=Math.hypot(hx-sx,hy-sy), sag=Math.min(36,dist*.28);
  const mx=(sx+hx)/2, my=(sy+hy)/2+sag;
  const fl=30+Math.sin(t*25)*5+clamp(spd/10,0,26);
  const blink=(t%3.8)>3.65?.12:1, mo=talking?4+Math.abs(Math.sin(t*17))*8:3;
  const ex=clamp((pen[0]-cx)/90,-1,1)*3, ey=clamp((pen[1]-cy)/120,-1,1)*2;
  let b='';
  [-14,14].forEach(x=>{
    const sd=x<0?-1:1;
    b+=`<path d="M${x-7} 70Q${x-3} ${f(70+fl*.6)} ${x} ${f(70+fl)}Q${x+3} ${f(70+fl*.6)} ${x+7} 70Z" fill="#fb923c"/><path d="M${x-3} 70L${x} ${f(70+fl*.62)}L${x+3} 70Z" fill="#fde047"/>`;
    b+=`<rect x="${x-4}" y="34" width="8" height="16" fill="#94a3b8"/>`;
    b+=`<rect x="${x-6}" y="64" width="12" height="7" rx="2" fill="#475569"/><rect x="${x-12}" y="48" width="24" height="18" rx="6" fill="#f87171" stroke="#b91c1c" stroke-width="2"/>`;
    b+=`<path d="M${x+sd*12} 52L${x+sd*23} 67L${x+sd*12} 64Z" fill="#fbbf24" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round"/>`;
  });
  b+=`<path d="M${-ox} -20Q${f(-ox*1.45)} 4 ${f(-ox*1.25)} 24" fill="none" stroke="#94a3b8" stroke-width="9" stroke-linecap="round"/><circle cx="${f(-ox*1.25)}" cy="26" r="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2.5"/>`;
  b+=`<rect x="-36" y="-42" width="72" height="78" rx="16" fill="#cbd5e1" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="0" cy="-8" r="11" fill="#38bdf8" opacity="${f(.6+.4*Math.sin(t*4))}"/>
  <rect x="-8" y="-52" width="16" height="12" fill="#94a3b8"/>
  <line x1="0" y1="-114" x2="0" y2="-132" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="0" cy="-137" r="7" fill="#f472b6"/>
  <rect x="-46" y="-114" width="92" height="66" rx="22" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
  <rect x="-35" y="-104" width="70" height="46" rx="14" fill="#0f172a"/>
  <ellipse cx="${f(-15+ex)}" cy="${f(-86+ey)}" rx="7" ry="${f(7*blink)}" fill="#38bdf8"/>
  <ellipse cx="${f(15+ex)}" cy="${f(-86+ey)}" rx="7" ry="${f(7*blink)}" fill="#38bdf8"/>
  <rect x="-9" y="-72" width="18" height="${f(mo)}" rx="3" fill="#38bdf8"/>
  <circle cx="-27" cy="-74" r="4" fill="#f472b6" opacity=".6"/><circle cx="27" cy="-74" r="4" fill="#f472b6" opacity=".6"/>`;
  const px=pen[0],py=pen[1];
  let o=`<g transform="translate(${f(cx)} ${f(cy)}) rotate(${f(tilt)}) scale(${s})">${b}</g>`;
  o+=`<path d="M${f(sx)} ${f(sy)}Q${f(mx)} ${f(my)} ${f(hx)} ${f(hy)}" fill="none" stroke="#94a3b8" stroke-width="9" stroke-linecap="round"/>`;
  o+=`<line x1="${f(px+5)}" y1="${f(py-10)}" x2="${f(px+27)}" y2="${f(py-52)}" stroke="#f472b6" stroke-width="8" stroke-linecap="round"/>`;
  o+=`<path d="M${f(px)} ${f(py)}L${f(px+2)} ${f(py-10)}L${f(px+9)} ${f(py-8)}Z" fill="#e2e8f0"/>`;
  if(ink) o+=`<circle cx="${f(px)}" cy="${f(py)}" r="9" fill="${ink}" opacity=".25"/><circle cx="${f(px)}" cy="${f(py)}" r="3.5" fill="${ink}"/>`;
  o+=`<circle cx="${f(hx)}" cy="${f(hy)}" r="11" fill="#fde68a" stroke="#f59e0b" stroke-width="3"/>`;
  return o;
}

/* =====================================================================
   LESSON ENGINE: every element is drawn by the pen, in order.
   ===================================================================== */
function mkP(pts){const cum=[0];for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return {pts,cum,len:cum[cum.length-1]||1};}
function ptAt(P,u){
  const g=u*P.len;let i=1;
  while(i<P.pts.length-1&&P.cum[i]<g) i++;
  const a=P.pts[i-1],b=P.pts[i],sl=P.cum[i]-P.cum[i-1]||1,k=clamp((g-P.cum[i-1])/sl);
  return [a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k];
}
const epts=(cx,cy,rx,ry,n=48)=>{const p=[];for(let i=0;i<=n;i++){const a=-Math.PI/2+i*2*Math.PI/n;p.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)]);}return p;};
const rpts=(x,y,w,h)=>[[x,y],[x+w,y],[x+w,y+h],[x,y+h],[x,y]];
const dstr=pts=>'M'+pts.map(p=>f(p[0])+' '+f(p[1])).join('L');

function elPos(e,u){return e.k==='s'?ptAt(e.P,u):[e.xs+e.w*u,e.yy];}
function penAt(L,t){
  const E=L.els,R=L.rest;let i=-1;
  for(let k=0;k<E.length;k++){if(E[k].t0<=t) i=k; else break;}
  if(i<0){const e=E[0],u=ease(prog(t,e.t0-e.tr,e.t0));return [lerp(R[0],e.start[0],u),lerp(R[1],e.start[1],u)];}
  const e=E[i];
  if(t<=e.t1) return elPos(e,prog(t,e.t0,e.t1));
  const nx=E[i+1];
  if(!nx){const u=ease(prog(t,e.t1+.6,e.t1+2.4));return [lerp(e.end[0],R[0],u),lerp(e.end[1],R[1],u)];}
  const u=ease(prog(t,nx.t0-nx.tr,nx.t0));
  return [lerp(e.end[0],nx.start[0],u),lerp(e.end[1],nx.start[1],u)];
}
function bodyAt(L,t){
  let x=0,y=0,sd=0;const N=9;
  for(let j=0;j<N;j++){
    const p=penAt(L,Math.max(0,t-j*.11)), side=clamp((640-p[0])/60,-1,1);
    x+=p[0]+side*85; y+=p[1]-48; sd+=side;
  }
  x=clamp(x/N,62,738); y=clamp(y/N,168,330); sd/=N;
  const E=L.els,last=E[E.length-1];
  const u=Math.max(1-ease(prog(t,.2,E[0].t0)),ease(prog(t,last.t1+.6,last.t1+2.4)));
  return [lerp(x,L.park[0],u),lerp(y,L.park[1],u),lerp(sd,1,u),lerp(.72,.5,u)];
}
function drawEl(e,t){
  const p=prog(t,e.t0,e.t1); if(p<=0) return '';
  if(e.k==='s'){
    let s='';
    if(e.fill){const q=prog(t,e.t1,e.t1+.5);if(q>0) s+=path(e.d+'Z',{stroke:'none',fill:e.fill,fo:e.fo*q,w:0});}
    return s+path(e.d,{stroke:e.c,w:e.w,draw:p});
  }
  const n=Math.floor(p*e.s.length+1e-6); if(n<=0) return '';
  const body=n>=e.s.length?esc(e.s):`${esc(e.s.slice(0,n))}<tspan opacity="0">${esc(e.s.slice(n))}</tspan>`;
  return `<text x="${f(e.x)}" y="${f(e.y)}" font-size="${e.size}" fill="${e.c}" text-anchor="${e.anchor}" font-weight="${e.weight}">${body}</text>`;
}

function lesson(id,title,head,build){
  const els=[],caps=[];let c=.5,last=null,ls=null,park=[762,100];
  const restOf=()=>[park[0]-26,park[1]+46];
  const add=(e,dur)=>{
    if(!last) last=restOf();
    const d=Math.hypot(e.start[0]-last[0],e.start[1]-last[1]);
    e.tr=clamp(d/520,.08,1); e.t0=c+e.tr; e.t1=e.t0+dur; c=e.t1+.04; last=e.end; els.push(e);
  };
  const A={
    park(x,y){park=[x,y];},
    say(en,bn){ if(ls) c=Math.max(c,ls[0]+ctime(ls)); const e=[c,en,bn]; caps.push(e); ls=e; },
    pts(P,o={},dur=.8){
      add({k:'s',d:dstr(P),c:o.c||INK,w:o.w||3,fill:o.fill,fo:o.fo||.2,P:mkP(P),start:P[0],end:P[P.length-1]},dur);
    },
    line(x1,y1,x2,y2,o={},dur=.5){A.pts([[x1,y1],[x2,y2]],o,dur);},
    arrow(x1,y1,x2,y2,o={},dur=.5){
      A.line(x1,y1,x2,y2,o,dur);
      const a=Math.atan2(y2-y1,x2-x1),h=11;
      A.pts([[x2-h*Math.cos(a-.5),y2-h*Math.sin(a-.5)],[x2,y2],[x2-h*Math.cos(a+.5),y2-h*Math.sin(a+.5)]],o,.2);
    },
    dashed(x1,y1,x2,y2,o={},dur=.9){
      const l=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/l,uy=(y2-y1)/l;let d='';
      for(let k=0;k<l;k+=11){const e=Math.min(k+6,l);d+=`M${f(x1+ux*k)} ${f(y1+uy*k)}L${f(x1+ux*e)} ${f(y1+uy*e)}`;}
      add({k:'s',d,c:o.c||INK,w:o.w||2,P:mkP([[x1,y1],[x2,y2]]),start:[x1,y1],end:[x2,y2]},dur);
    },
    circle(cx,cy,r,o={},dur=.8){A.pts(epts(cx,cy,r,r),o,dur);},
    ell(cx,cy,rx,ry,o={},dur=1){A.pts(epts(cx,cy,rx,ry),o,dur);},
    rect(x,y,w,h,o={},dur=.8){A.pts(rpts(x,y,w,h),o,dur);},
    text(x,y,s,o={},dur){
      const size=o.size||20,anchor=o.anchor||'middle',w=s.length*size*.56;
      const xs=anchor==='middle'?x-w/2:anchor==='end'?x-w:x, yy=y-size*.3;
      add({k:'t',x,y,s,size,c:o.c||INK,anchor,weight:o.weight||700,xs,w,yy,start:[xs,yy],end:[xs+w,yy]},dur||(.25+s.length*.05));
    },
    /* a matrix: brackets (or |bars|) + entries, drawn by the pen. returns its geometry */
    mat(cx,cy,M,o={},dur=.16){
      const cw=o.cw||56,rh=o.rh||44,size=o.size||22,R=M.length,C=M[0].length,W=C*cw,H=R*rh,x0=cx-W/2,y0=cy-H/2;
      const col=o.col||(()=>INK),bc=o.bc||MU;
      if(o.bar){
        A.line(x0,y0-4,x0,y0+H+4,{c:bc,w:3},.3); A.line(x0+W,y0-4,x0+W,y0+H+4,{c:bc,w:3},.3);
      }else{
        A.pts([[x0+8,y0-4],[x0-2,y0-4],[x0-2,y0+H+4],[x0+8,y0+H+4]],{c:bc,w:3},.35);
        A.pts([[x0+W-8,y0-4],[x0+W+2,y0-4],[x0+W+2,y0+H+4],[x0+W-8,y0+H+4]],{c:bc,w:3},.35);
      }
      M.forEach((r,i)=>r.forEach((v,j)=>{
        A.text(x0+cw*(j+.5),y0+rh*(i+.5)+size*.35,String(v),{size,c:col(i,j,v)},dur);
      }));
      return {x0,y0,W,H,cw,rh,cx:j=>x0+cw*(j+.5),cy:i=>y0+rh*(i+.5),cell:(i,j)=>[x0+cw*j+3,y0+rh*i+3,cw-6,rh-6]};
    },
    box(r,c){A.rect(r[0],r[1],r[2],r[3],{c,w:2.5,fill:c,fo:.17},.3);}
  };
  build(A);
  const endT=Math.max(c,ls?ls[0]+ctime(ls):0), D=endT+3.4;
  const L={els,caps,D,head,park,rest:restOf()};
  const mk=robot=>t=>{
    let s=txt(400,34,head,{size:22});
    els.forEach(e=>{s+=drawEl(e,t);});
    if(!robot) return s;
    const pen=penAt(L,t), body=bodyAt(L,t), bq=bodyAt(L,Math.max(0,t-.1));
    const vx=(body[0]-bq[0])/.1, vy=(body[1]-bq[1])/.1;
    let ink=null;
    for(const e of els) if(e.t0<=t&&t<=e.t1){ink=e.c;break;}
    const cp=cap(caps,t), talking=!!cp&&(t-cp[0])<ctime(cp);
    const happy=t>=D-3.2, bob=happy?-Math.abs(Math.sin(t*6))*12:Math.sin(t*2.2)*4;
    s+=robotSvg(t,body[0],body[1]+bob,clamp(vx*.03,-12,12),-body[2],Math.hypot(vx,vy),pen,talking,happy,ink,body[3]);
    return s;
  };
  registerVisual({id,title,caps,modes:[
    {id:'robot',label:'🤖 Bolt draws',duration:D,frame:mk(true)},
    {id:'art',label:'✏️ Line art',duration:D,frame:mk(false)}]});
}

const axes=(A,ox,oy,L,R,U,D)=>{A.arrow(ox-L,oy,ox+R,oy,{c:MU,w:2},.4);A.arrow(ox,oy+D,ox,oy-U,{c:MU,w:2},.4);};
const curve=(g,x0,x1,n=36)=>{const p=[];for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;p.push([x,g(x)]);}return p;};
const NOTE=(A,y,s)=>A.text(400,y,'Note: '+s,{size:18,c:AM});

lesson('d1','What is Calculus?','Calculus: the mathematics of change',A=>{
  A.say("Calculus is the branch of mathematics that studies how things change.",
        "ক্যালকুলাস হলো গণিতের সেই শাখা, যা বস্তুর পরিবর্তন নিয়ে আলোচনা করে।");
  axes(A,110,400,20,330,250,10);
  A.pts(curve(x=>400-(x-110)*.2-Math.pow((x-110)/60,2)*3.2+((x-110)>150?0:0),130,420),{c:SK,w:3.5},1);
  A.say("Differential calculus measures how fast something changes, like speed or the slope of a curve.",
        "অন্তরীকরণ (differential calculus) পরিবর্তনের হার মাপে, যেমন বেগ বা বক্ররেখার ঢাল।");
  A.text(600,140,'Differential calculus',{size:22,c:AM});
  A.text(600,174,'rate of change · slope',{size:18,c:INK});
  A.say("Integral calculus adds up small pieces, like finding an area. We start with differential.",
        "যোজনীকরণ (integral calculus) ছোট ছোট অংশ যোগ করে, যেমন ক্ষেত্রফল নির্ণয়। আমরা শুরু করব অন্তরীকরণ দিয়ে।");
  A.text(600,250,'Integral calculus',{size:22,c:GR});
  A.text(600,284,'total · area',{size:18,c:INK});
  NOTE(A,440,'limit is the foundation of both branches.');
});

lesson('d2','What is a variable?','Variable: a quantity that changes',A=>{
  A.say("A variable is a quantity that can take different values. We usually name it x, y or t.",
        "চলক (variable) হলো এমন রাশি যার মান পরিবর্তিত হতে পারে। সাধারণত একে x, y বা t দিয়ে লেখা হয়।");
  A.text(400,110,'x = 1,  2,  3.5,  −4, ...',{size:30,c:AM});
  A.say("Example: in y = 2x, both x and y change. When x = 1, y = 2; when x = 3, y = 6.",
        "উদাহরণ: y = 2x-এ x ও y দুটিই বদলায়। x = 1 হলে y = 2; x = 3 হলে y = 6।");
  A.text(400,190,'y = 2x',{size:28,c:VI});
  A.text(250,250,'x = 1  →  y = 2',{size:22});
  A.text(550,250,'x = 3  →  y = 6',{size:22});
  A.say("Real life: temperature, time and the speed of a car are all variables.",
        "বাস্তবে তাপমাত্রা, সময় ও গাড়ির বেগ সবই চলক।");
  A.text(400,340,'temperature · time · speed',{size:24,c:GR});
  NOTE(A,420,'x is the independent variable, y the dependent one.');
});

lesson('d3','What is a constant?','Constant: a quantity that never changes',A=>{
  A.say("A constant has one fixed value that never changes, like 5, −3 or π.",
        "ধ্রুবক (constant) হলো এমন রাশি যার মান সবসময় একই থাকে, যেমন 5, −3 বা π।");
  A.text(400,110,'5 ,   −3 ,   π ,   ½',{size:32,c:AM});
  A.say("Its graph is a flat horizontal line: y = 3 stays at 3 for every x.",
        "এর লেখচিত্র একটি অনুভূমিক সরলরেখা: y = 3 সব x-এর জন্য 3-ই থাকে।");
  axes(A,160,390,20,500,170,10);
  A.line(160,290,640,290,{c:SK,w:4},.8);
  A.text(680,296,'y = 3',{size:22,c:SK,anchor:'start'});
  A.say("Letters like a, b, c can also be constants: they are fixed in one problem. And the limit of a constant is the constant itself.",
        "a, b, c অক্ষরও ধ্রুবক হতে পারে — একটি সমস্যায় এরা স্থির থাকে। ধ্রুবকের লিমিট ধ্রুবকটিই।");
  A.text(400,430,'lim c = c',{size:26,c:GR});
});

lesson('d4','Continuous variable','Continuous variable: no gaps',A=>{
  A.say("A continuous variable can take every value in an interval, with no gaps, like 1.5, 1.51, 1.512.",
        "নিরবচ্ছিন্ন চলক কোনো ব্যবধির সব মান নিতে পারে, কোনো ফাঁক থাকে না — যেমন 1.5, 1.51, 1.512।");
  A.text(400,120,'1 ≤ x ≤ 4',{size:30,c:AM});
  A.line(150,200,650,200,{c:SK,w:6},1);
  A.circle(150,200,8,{c:SK,w:3,fill:SK,fo:1},.3);
  A.circle(650,200,8,{c:SK,w:3,fill:SK,fo:1},.3);
  A.text(150,240,'1',{size:22});
  A.text(650,240,'4',{size:22});
  A.say("Compare: the number of students is a discrete variable. It jumps 1, 2, 3 and never takes 2.5.",
        "তুলনা: ছাত্রসংখ্যা বিচ্ছিন্ন চলক। এটি 1, 2, 3 এভাবে লাফায়, কখনো 2.5 হয় না।");
  [0,1,2,3].forEach(k=>A.circle(200+k*130,340,7,{c:PK,w:3,fill:PK,fo:1},.25));
  A.text(400,390,'discrete: separate dots',{size:20,c:PK});
  NOTE(A,440,'limits are defined for continuous variables.');
});

lesson('d5','What is lim?','lim = limit',A=>{
  A.say("lim is short for limit. It tells us what value an expression gets close to.",
        "lim হলো limit (সীমা)-এর সংক্ষিপ্ত রূপ। এটি বলে একটি রাশি কোন মানের কাছে যাচ্ছে।");
  A.text(400,120,'lim   (x + 1)',{size:34,c:AM});
  A.text(400,160,'x → 2',{size:20,c:SK});
  A.say("x → 2 is read: x tends to 2. Look at the table: as x gets closer to 2, x + 1 gets closer to 3.",
        "x → 2 পড়া হয়: x, 2-এর দিকে অগ্রসর হয়। ছকটি দেখো: x যত 2-এর কাছে আসে, x + 1 তত 3-এর কাছে যায়।");
  A.text(250,240,'x',{size:22,c:SK}); A.text(550,240,'x + 1',{size:22,c:GR});
  [['1.9','2.9'],['1.99','2.99'],['1.999','2.999']].forEach((r,i)=>{
    A.text(250,280+i*38,r[0],{size:22}); A.text(550,280+i*38,r[1],{size:22});
  });
  A.text(400,420,'lim (x + 1) = 3',{size:28,c:GR});
  NOTE(A,455,'x gets near 2 but does not have to equal 2.');
});

lesson('d6','Limit of a variable','Limit of a variable: x → a',A=>{
  A.say("When a variable x moves closer and closer to a constant a, we say x tends to a and write x → a.",
        "চলক x যখন ধ্রুবক a-এর ক্রমশ কাছে আসে, আমরা বলি x, a-এর দিকে অগ্রসর হয় এবং লিখি x → a।");
  A.line(100,220,700,220,{c:MU,w:3},.6);
  A.circle(560,220,8,{c:AM,w:3,fill:AM,fo:1},.3);
  A.text(560,260,'a',{size:26,c:AM});
  A.say("Take x = 2 + 1/n. For n = 1, 2, 4, 8 the points 3, 2.5, 2.25, 2.125 crowd around a = 2.",
        "x = 2 + 1/n ধরি। n = 1, 2, 4, 8 হলে বিন্দুগুলো 3, 2.5, 2.25, 2.125 — a = 2-এর কাছে ভিড় করে।");
  [180,300,400,480].forEach((x,i)=>{A.circle(x,220,6,{c:SK,w:3,fill:SK,fo:1},.25);});
  A.text(400,330,'|x − a| becomes as small as we like',{size:24,c:GR});
  NOTE(A,420,'x → a means x ≠ a. It only gets arbitrarily close.');
});

lesson('d7','Left hand limit','Left hand limit (LHL)',A=>{
  A.say("The left hand limit is the value f(x) approaches when x comes towards a from the left, that is x < a.",
        "বামপক্ষের লিমিট (LHL) হলো x যখন a-এর বাম দিক থেকে আসে (x < a), তখন f(x) যে মানের দিকে যায়।");
  axes(A,100,420,20,520,330,10);
  A.pts(curve(x=>420-(x-100)*.5,140,300,10),{c:SK,w:4},.9);
  A.circle(300,270,7,{c:SK,w:3},.3);
  A.dashed(300,270,300,420,{c:MU},.5);
  A.text(300,448,'a = 2',{size:20,c:AM});
  A.say("We write it lim x→a⁻ f(x). Here f(x) = x for x < 2, so from the left f(x) goes to 2.",
        "লিখি lim x→a⁻ f(x)। এখানে x < 2 হলে f(x) = x, তাই বাম দিক থেকে f(x) যায় 2-এর দিকে।");
  A.text(560,120,'lim  f(x)',{size:28,c:SK});
  A.text(560,150,'x → 2⁻',{size:18,c:SK});
  A.text(560,200,'LHL = 2',{size:28,c:GR});
  NOTE(A,60,'the small minus sign means "from the left".');
});

lesson('d8','Right hand limit','Right hand limit (RHL)',A=>{
  A.say("The right hand limit is the value f(x) approaches when x comes towards a from the right, that is x > a.",
        "ডানপক্ষের লিমিট (RHL) হলো x যখন a-এর ডান দিক থেকে আসে (x > a), তখন f(x) যে মানের দিকে যায়।");
  axes(A,100,420,20,520,330,10);
  A.pts(curve(x=>420-(x-100)*.5-100,300,500,10),{c:PK,w:4},.9);
  A.circle(300,170,7,{c:PK,w:3},.3);
  A.dashed(300,170,300,420,{c:MU},.5);
  A.text(300,448,'a = 2',{size:20,c:AM});
  A.say("We write it lim x→a⁺ f(x). Here f(x) = x + 2 for x > 2, so from the right f(x) goes to 4.",
        "লিখি lim x→a⁺ f(x)। এখানে x > 2 হলে f(x) = x + 2, তাই ডান দিক থেকে f(x) যায় 4-এর দিকে।");
  A.text(560,120,'lim  f(x)',{size:28,c:PK});
  A.text(560,150,'x → 2⁺',{size:18,c:PK});
  A.text(560,200,'RHL = 4',{size:28,c:GR});
  NOTE(A,60,'the small plus sign means "from the right".');
});

lesson('d9','What is slope?','Slope: steepness of a line',A=>{
  A.say("Slope tells how steep a line is. It is rise divided by run: m = (y₂ − y₁) / (x₂ − x₁).",
        "ঢাল (slope) বলে একটি রেখা কতটা খাড়া। ঢাল = উল্লম্ব বৃদ্ধি ÷ আনুভূমিক বৃদ্ধি: m = (y₂ − y₁)/(x₂ − x₁)।");
  axes(A,100,420,20,380,300,10);
  A.line(140,380,420,170,{c:SK,w:4},.8);
  A.circle(180,350,6,{c:AM,w:3,fill:AM,fo:1},.3);
  A.circle(380,200,6,{c:AM,w:3,fill:AM,fo:1},.3);
  A.say("Between these points run = 200 and rise = 150, so the slope is 150 / 200 = 3/4.",
        "এই দুই বিন্দুর মধ্যে আনুভূমিক = 200 এবং উল্লম্ব = 150, তাই ঢাল = 150/200 = 3/4।");
  A.line(180,350,380,350,{c:GR,w:3},.5);
  A.line(380,350,380,200,{c:PK,w:3},.5);
  A.text(280,378,'run',{size:20,c:GR}); A.text(410,280,'rise',{size:20,c:PK,anchor:'start'});
  A.text(610,160,'m = rise / run',{size:24,c:AM});
  A.text(610,200,'= 3 / 4',{size:24,c:GR});
  A.say("A curve bends, so its slope changes at every point. Differentiation finds that slope.",
        "বক্ররেখা বাঁকা, তাই প্রতিটি বিন্দুতে ঢাল আলাদা। অন্তরীকরণ সেই ঢাল বের করে।");
  NOTE(A,455,'vertical line: slope undefined · flat line: slope 0.');
});

lesson('d10','Limit of a function','Limit of a function: lim f(x) = L',A=>{
  A.say("lim x→a f(x) = L means: as x gets close to a, the value f(x) gets close to L.",
        "lim x→a f(x) = L মানে: x যত a-এর কাছে আসে, f(x) তত L-এর কাছে যায়।");
  A.text(400,100,'lim   f(x) = L',{size:30,c:AM});
  A.text(400,128,'x → a',{size:18,c:SK});
  A.say("Example: f(x) = (x² − 4)/(x − 2) is undefined at x = 2. But for x ≠ 2 it equals x + 2.",
        "উদাহরণ: f(x) = (x² − 4)/(x − 2) এর x = 2-এ মান অনির্ণেয়। কিন্তু x ≠ 2 হলে এটি x + 2-এর সমান।");
  axes(A,120,430,20,420,210,10);
  A.line(160,380,500,210,{c:SK,w:4},.8);
  A.circle(330,295,8,{c:RD,w:3,fill:'#0b1220',fo:1},.4);
  A.say("So near x = 2 the graph heads to height 4. The limit is 4, even though f(2) does not exist.",
        "তাই x = 2-এর কাছে লেখচিত্র 4 উচ্চতার দিকে যায়। f(2) না থাকলেও লিমিট 4।");
  A.text(640,250,'lim (x² − 4)/(x − 2)',{size:22,c:GR});
  A.text(640,285,'= lim (x + 2) = 4',{size:22,c:GR});
  NOTE(A,462,'a limit cares about nearby values, not the value at a.');
});

lesson('d11','Single side limit','One-sided limits and existence',A=>{
  A.say("LHL and RHL are the single side (one-sided) limits. The limit exists only when both are equal.",
        "LHL ও RHL হলো একপার্শ্বিক লিমিট। দুটি সমান হলেই কেবল লিমিট থাকে।");
  A.text(400,100,'lim f(x) exists  ⇔  LHL = RHL',{size:28,c:AM});
  A.say("Case 1: f(x) = x². From both sides f(x) goes to 4. LHL = RHL = 4, so the limit is 4.",
        "ক্ষেত্র ১: f(x) = x²। উভয় দিক থেকে f(x) যায় 4-এর দিকে। LHL = RHL = 4, তাই লিমিট 4।");
  A.text(210,180,'f(x) = x²,  x → 2',{size:21,c:SK});
  A.text(210,218,'LHL = 4',{size:22}); A.text(210,252,'RHL = 4',{size:22});
  A.text(210,292,'limit = 4 ✓',{size:24,c:GR});
  A.say("Case 2: f(x) = |x|/x at 0. From the left it is −1, from the right it is +1. They differ, so the limit does not exist.",
        "ক্ষেত্র ২: 0-তে f(x) = |x|/x। বাম দিকে −1, ডান দিকে +1। দুটি আলাদা, তাই লিমিট নেই।");
  A.text(590,180,'f(x) = |x| / x,  x → 0',{size:21,c:PK});
  A.text(590,218,'LHL = −1',{size:22}); A.text(590,252,'RHL = +1',{size:22});
  A.text(590,292,'limit does not exist ✗',{size:22,c:RD});
  A.say("The jump graph from before had LHL = 2 and RHL = 4, so its limit at x = 2 also does not exist.",
        "আগের লাফ-সম্বলিত লেখচিত্রে LHL = 2 ও RHL = 4, তাই x = 2-এ তার লিমিটও নেই।");
  NOTE(A,420,'differentiation needs this idea: left and right slopes must match.');
});

lesson('d12','Alpha (α) limit','Limit at α: x → α',A=>{
  A.say("α (alpha) is just a Greek letter used for the number x approaches. lim x→α f(x) means the same as lim x→a.",
        "α (আলফা) একটি গ্রিক অক্ষর, x যে সংখ্যার দিকে যায় তার নাম। lim x→α f(x) আর lim x→a একই অর্থ।");
  A.text(400,110,'lim   f(x)',{size:32,c:AM});
  A.text(400,142,'x → α',{size:20,c:SK});
  A.say("For a nice function we just put x = α. Example: lim x→α (3x + 1) = 3α + 1. For α = 2 this is 7.",
        "সুন্দর ফাংশনে সরাসরি x = α বসাই। উদাহরণ: lim x→α (3x + 1) = 3α + 1। α = 2 হলে মান 7।");
  A.text(400,215,'lim (3x + 1) = 3α + 1',{size:26,c:GR});
  A.text(400,255,'α = 2  →  3(2) + 1 = 7',{size:24,c:GR});
  A.say("α can also be ∞. x → ∞ means x grows without bound. Then 1/x gets closer to 0.",
        "α অসীমও (∞) হতে পারে। x → ∞ মানে x সীমাহীনভাবে বাড়ে। তখন 1/x যায় 0-এর দিকে।");
  A.text(400,345,'lim 1/x = 0',{size:28,c:PK});
  A.text(400,372,'x → ∞',{size:18,c:PK});
  NOTE(A,440,'if substituting α gives 0/0, simplify first (like d10).');
});

lesson('d13','Five basic limit laws','5 limit laws: lim f(x) = L, lim g(x) = M',A=>{
  A.say("Suppose lim f(x) = L and lim g(x) = M as x → a. Five basic laws let us split a limit into easy pieces.",
        "ধরি x → a হলে lim f(x) = L এবং lim g(x) = M। পাঁচটি মৌলিক সূত্র দিয়ে লিমিটকে সহজ অংশে ভাঙা যায়।");
  A.say("Law 1, sum and difference: the limit of f(x) ± g(x) is L ± M.",
        "সূত্র ১, যোগ-বিয়োগ: f(x) ± g(x)-এর লিমিট = L ± M।");
  A.text(400,100,'1.  lim [ f(x) ± g(x) ] = L ± M',{size:25,c:AM});
  A.say("Law 2, constant multiple: a constant c comes out of the limit.",
        "সূত্র ২, ধ্রুবক গুণিতক: ধ্রুবক c লিমিটের বাইরে আসে।");
  A.text(400,160,'2.  lim [ c · f(x) ] = c · L',{size:25,c:SK});
  A.say("Law 3, product: the limit of a product is the product of the limits.",
        "সূত্র ৩, গুণফল: গুণফলের লিমিট = লিমিটগুলোর গুণফল।");
  A.text(400,220,'3.  lim [ f(x) · g(x) ] = L · M',{size:25,c:GR});
  A.say("Law 4, quotient: the limit of a ratio is L / M, but only when M is not zero.",
        "সূত্র ৪, ভাগফল: ভাগফলের লিমিট = L / M, কিন্তু শুধু যখন M ≠ 0।");
  A.text(400,280,'4.  lim [ f(x) / g(x) ] = L / M,   M ≠ 0',{size:25,c:PK});
  A.say("Law 5, power: the limit of f(x) to the power n is L to the power n.",
        "সূত্র ৫, ঘাত: f(x)ⁿ-এর লিমিট = Lⁿ।");
  A.text(400,340,'5.  lim [ f(x) ]ⁿ = Lⁿ',{size:25,c:VI});
  A.say("Two helpers: lim c = c and lim x = a. Together with these laws, most limits become simple substitution.",
        "দুটি সহায়ক: lim c = c এবং lim x = a। এগুলোর সঙ্গে সূত্রগুলো মিলিয়ে অধিকাংশ লিমিট সরল বসানোয় পরিণত হয়।");
  A.text(400,395,'lim c = c      lim x = a',{size:22,c:GR});
  NOTE(A,445,'laws 1 and 3 extend to any number of functions; law 4 fails if M = 0.');
});

lesson('p1','Proof: sin x / x = 1','Why sin x / x → 1  (x in radians)',A=>{
  A.say("Draw a circle of radius 1. Walk a tiny distance x along its edge. That curved path has length exactly x.",
        "ব্যাসার্ধ 1-এর একটি বৃত্ত আঁকো। কিনারা ধরে অল্প x দূরত্ব হাঁটো। বাঁকা পথের দৈর্ঘ্য ঠিক x।");
  A.circle(220,300,140,{c:MU,w:2.5},1);
  A.line(220,300,380,300,{c:MU,w:2},.4);
  A.pts(curve(t=>300-140*Math.sin(t),0,.6,12).map(p=>[220+140*Math.cos(p[0]),p[1]]),{c:AM,w:5},.6);
  A.line(220,300,335.5,220.9,{c:MU,w:2.5},.4);
  A.text(395,262,'arc = x',{size:20,c:AM});
  A.say("Now drop a straight line down from that point. Its height is sin x. See? The curved path and the straight drop are almost equal.",
        "এবার বিন্দু থেকে সোজা নিচে রেখা নামাও। এর উচ্চতা sin x। দেখো, বাঁকা পথ ও সোজা রেখা প্রায় সমান!");
  A.line(335.5,220.9,335.5,300,{c:PK,w:5},.5);
  A.text(300,262,'sin x',{size:20,c:PK,anchor:'end'});
  A.say("The smaller x is, the closer they get, so sin x ÷ x is almost 1. Check the table.",
        "x যত ছোট, দুটি তত কাছাকাছি, তাই sin x ÷ x প্রায় 1। ছকটি দেখো।");
  TAB(A,620,130,['x','sin x / x'],[['0.5','0.9589'],['0.1','0.99833'],['0.01','0.99998']],GR);
  A.text(620,320,'sin x / x → 1',{size:28,c:GR});
  NOTE(A,455,'x must be in radians. This is the picture proof; books use the squeeze theorem.');
});

lesson('p2','Proof: (eˣ − 1) / x = 1','Why (eˣ − 1)/x → 1',A=>{
  A.say("Look at y = eˣ. At x = 0 it is at height 1. Pick another point on the curve and join the two with a straight line.",
        "y = eˣ দেখো। x = 0-তে উচ্চতা 1। বক্ররেখায় আরেকটি বিন্দু নিয়ে দুটিকে সরলরেখায় জোড়ো।");
  axes(A,260,370,190,300,300,10);
  A.pts(curve(u=>370-100*Math.exp(u),-1.5,1,30).map(p=>[260+100*p[0],p[1]]),{c:SK,w:3.5},1);
  A.line(260,270,360,98,{c:AM,w:3},.6);
  A.text(420,120,'x = 1',{size:18,c:AM,anchor:'start'});
  A.say("The slope of that line is rise ÷ run = (eˣ − 1) ÷ x. Now slide the second point closer to 0. The line turns and gets less steep.",
        "ওই রেখার ঢাল = (eˣ − 1) ÷ x। দ্বিতীয় বিন্দুকে 0-এর দিকে সরাও। রেখা ঘুরে কম খাড়া হয়।");
  A.line(260,270,310,205,{c:PK,w:3},.6);
  A.text(440,190,'x = 0.5',{size:18,c:PK,anchor:'start'});
  A.say("At last the line just touches the curve at 0 with slope exactly 1. So (eˣ − 1) ÷ x → 1.",
        "শেষে রেখাটি 0-তে বক্ররেখাকে স্পর্শ করে, ঢাল ঠিক 1। তাই (eˣ − 1) ÷ x → 1।");
  A.line(180,350,380,150,{c:GR,w:3},.7);
  TAB(A,670,130,['x','slope'],[['1','1.718'],['0.5','1.297'],['0.1','1.052']],AM);
  A.text(670,320,'→ 1',{size:30,c:GR});
  NOTE(A,455,'the number e is defined as the base whose curve has slope 1 at 0.');
});

lesson('p3','Proof: ln(1+x) / x = 1','Why ln(1+x)/x → 1',A=>{
  A.say("ln undoes eˣ. So y = ln(1 + x) is the mirror twin of y = eˣ − 1. A mirror keeps the slope 1 at the corner.",
        "ln হলো eˣ-এর বিপরীত। তাই y = ln(1 + x) হলো y = eˣ − 1-এর আয়নার প্রতিবিম্ব। আয়নায় 0-তে ঢাল 1-ই থাকে।");
  axes(A,260,300,120,300,200,150);
  A.pts(curve(u=>300-100*Math.log(1+u),-.7,2.2,30).map(p=>[260+100*p[0],p[1]]),{c:SK,w:3.5},1);
  A.say("Join the origin to a point on the curve. The slope of that line is ln(1 + x) ÷ x.",
        "মূলবিন্দু থেকে বক্ররেখার একটি বিন্দু জোড়ো। ওই রেখার ঢাল = ln(1 + x) ÷ x।");
  A.line(260,300,460,190,{c:AM,w:3},.6);
  A.text(470,180,'x = 2',{size:18,c:AM,anchor:'start'});
  A.line(260,300,310,259.5,{c:PK,w:3},.6);
  A.say("Slide the point towards 0. The slope climbs 0.55, 0.81, 0.95 and settles at the touching line y = x, slope 1.",
        "বিন্দুটি 0-এর দিকে সরাও। ঢাল বাড়ে 0.55, 0.81, 0.95 এবং স্পর্শক y = x-এর ঢাল 1-এ থামে।");
  A.line(160,400,400,160,{c:GR,w:3},.7);
  TAB(A,670,130,['x','ln(1+x)/x'],[['2','0.549'],['0.5','0.811'],['0.1','0.953']],AM);
  A.text(670,320,'→ 1',{size:30,c:GR});
  NOTE(A,455,'here x → 0 from both sides, and the answer is the same.');
});

lesson('p4','Proof: ((1+x)ⁿ − 1) / x = n','Why ((1+x)ⁿ − 1)/x → n',A=>{
  A.say("Take n = 3 and open the bracket. (1 + x)³ = 1 + 3x + 3x² + x³.",
        "n = 3 ধরে বন্ধনী খোলো। (1 + x)³ = 1 + 3x + 3x² + x³।");
  A.text(400,120,'(1 + x)³ = 1 + 3x + 3x² + x³',{size:28});
  A.say("Subtract 1: the 1 vanishes. Divide by x: every term loses one x.",
        "1 বিয়োগ করো: 1 উধাও। x দিয়ে ভাগ করো: প্রতিটি পদ থেকে একটি x কমে।");
  A.text(400,190,'(1+x)³ − 1  =  3x + 3x² + x³',{size:26,c:SK});
  A.text(400,250,'÷ x   →   3 + 3x + x²',{size:30,c:AM});
  A.say("Now make x tiny, like 0.01. Then 3x and x² are tiny and vanish. Only the 3 stays. In general it is n.",
        "এবার x খুব ছোট করো, যেমন 0.01। তখন 3x ও x² ছোট হয়ে হারিয়ে যায়। শুধু 3 থাকে। সাধারণভাবে থাকে n।");
  A.text(400,320,'x = 0.01:   3 + 0.03 + 0.0001 = 3.0301',{size:22});
  A.text(400,380,'lim  ((1+x)ⁿ − 1) / x = n',{size:30,c:GR});
  NOTE(A,440,'the same works for any n, even ½ or −2.');
});

lesson('p5','Proof: (xⁿ − aⁿ)/(x − a) = n aⁿ⁻¹','Why (xⁿ − aⁿ)/(x − a) → n·aⁿ⁻¹',A=>{
  A.say("Take n = 3. The expression x³ − a³ breaks into two parts: (x − a) times (x² + xa + a²).",
        "n = 3 ধরি। x³ − a³ দুই অংশে ভাঙে: (x − a) গুণ (x² + xa + a²)।");
  A.text(400,110,'x³ − a³ = (x − a)(x² + xa + a²)',{size:28});
  A.say("Divide by (x − a). It cancels! Only three pieces are left, one for each power: n = 3 pieces.",
        "(x − a) দিয়ে ভাগ করো। এটি কেটে যায়! থাকে তিনটি টুকরো — n = 3টি।");
  A.text(400,170,'(x³ − a³) / (x − a) = x² + xa + a²',{size:25,c:SK});
  [[240,'x²',AM],[400,'xa',PK],[560,'a²',GR]].forEach(([x,s,c])=>{
    A.rect(x-60,215,120,60,{c,w:3,fill:c,fo:.15},.5); A.text(x,255,s,{size:28,c});
  });
  A.say("Now let x come to a. Every piece turns into a². Three pieces of a² make 3a². In general: n pieces of aⁿ⁻¹.",
        "এবার x → a করো। প্রতিটি টুকরো হয়ে যায় a²। তিনটি a² মিলে 3a²। সাধারণভাবে n টুকরো aⁿ⁻¹ = n·aⁿ⁻¹।");
  A.text(400,330,'x → a:   a² + a² + a² = 3a²',{size:26,c:GR});
  A.text(400,385,'lim = n · aⁿ⁻¹',{size:32,c:GR});
  NOTE(A,440,'this is exactly the derivative of xⁿ. Differentiation starts here!');
});

lesson('p6','Proof: (1 + 1/n)ⁿ = e','Why (1 + 1/n)ⁿ → e',A=>{
  A.say("Put 1 taka in a bank paying 100% a year. If interest is added once, you get 2 taka. Add it twice a year, in halves, and you get 2.25.",
        "ব্যাংকে 1 টাকা রাখো, বছরে 100% সুদ। একবার সুদ যোগ হলে 2 টাকা। বছরে দুইবার, অর্ধেক করে, যোগ হলে 2.25 টাকা।");
  A.text(400,70,'money after 1 year = (1 + 1/n)ⁿ',{size:22,c:AM});
  const V=[[1,2],[2,2.25],[5,2.4883],[10,2.5937],[100,2.7048],[1000,2.7169]];
  V.forEach(([n,v],i)=>{const x=130+i*108,h=v*105;
    A.rect(x-35,410-h,70,h,{c:SK,w:2.5,fill:SK,fo:.25},.4);
    A.text(x,432,'n = '+n,{size:16,c:INK},.3);
    A.text(x,402-h,String(v),{size:16,c:GR},.3);
    if(i===1) A.say("Pay interest more often, like monthly or daily, and the money grows, but slower and slower.",
                    "সুদ আরও ঘনঘন যোগ হলে, যেমন মাসে বা দিনে, টাকা বাড়ে — কিন্তু ক্রমশ ধীরে।");
  });
  A.say("It never crosses a ceiling: 2.71828..., the number e. So (1 + 1/n)ⁿ → e as n → ∞.",
        "এটি কখনো একটি সীমা পার হয় না: 2.71828..., অর্থাৎ e। তাই n → ∞ হলে (1 + 1/n)ⁿ → e।");
  A.dashed(90,125,760,125,{c:GR,w:3},.8);
  A.text(740,112,'e = 2.71828…',{size:20,c:GR,anchor:'end'});
  NOTE(A,462,'e is a fixed irrational number, like π.');
});

lesson('c1112-101','Intervals on the number line','Intervals: closed, open and half-open',A=>{
  A.say('An interval is one continuous stretch of the real line. Each end can be included or excluded.','ব্যবধি (interval) হলো সংখ্যারেখার একটি অবিচ্ছিন্ন অংশ। প্রতিটি প্রান্ত ধরা বা বাদ দেওয়া যায়।');

  A.line(X(1),160,X(4),160,{c:GR,w:9},.6);
  A.circle(X(1),160,7,{c:GR,w:2,fill:GR,fo:1},.25); A.circle(X(4),160,7,{c:GR,w:2,fill:GR,fo:1},.25);
  A.text(610,125,'[1, 4] closed',{size:18,c:GR});
  A.say('A closed interval [1, 4] includes both endpoints, so solid dots are used.','বদ্ধ ব্যবধি [1, 4]-এ দুই প্রান্তই অন্তর্ভুক্ত, তাই ভরাট বিন্দু ব্যবহার হয়।');
  A.arrow(80,275,710,275,{c:MU,w:2},.5);
  for(let k=0;k<=6;k++){A.line(X(k),267,X(k),283,{c:MU,w:1.5},.15);A.text(X(k),303,String(k),{size:15});}
  A.line(X(2),275,X(5),275,{c:PK,w:9},.6);
  A.circle(X(2),275,7,{c:PK,w:3,fill:'#0b1220',fo:1},.25); A.circle(X(5),275,7,{c:PK,w:3,fill:'#0b1220',fo:1},.25);
  A.text(610,240,'(2, 5) open',{size:18,c:PK});
  A.say('An open interval (2, 5) leaves both ends out, so the dots are hollow.','খোলা ব্যবধি (2, 5)-এ দুই প্রান্তই বাদ, তাই বিন্দুগুলো ফাঁপা।');
  A.arrow(80,390,710,390,{c:MU,w:2},.5);
  for(let k=0;k<=6;k++){A.line(X(k),382,X(k),398,{c:MU,w:1.5},.15);A.text(X(k),418,String(k),{size:15});}
  A.line(X(3),390,X(6),390,{c:VI,w:9},.6);
  A.circle(X(3),390,7,{c:VI,w:2,fill:VI,fo:1},.25); A.circle(X(6),390,7,{c:VI,w:3,fill:'#0b1220',fo:1},.25);
  A.text(610,355,'[3, 6) half-open',{size:18,c:VI});
  NOTE(A,452,'a−r < x < a+r is an open interval; the modulus form is shorter.');
});

lesson('c1112-102','Solving a linear inequality','2x + 3 < 11, solved on the line',A=>{
  A.say('A linear inequality is solved just like an equation, but the answer is a range, not one number.','রৈখিক অসমতা সমীকরণের মতোই সমাধান হয়, তবে উত্তর একটি সংখ্যা নয়, একটি পরিসর।');
  A.text(400,105,'2x + 3 < 11',{size:32,c:AM});
  A.text(400,150,'2x < 8    (subtract 3 from both sides)',{size:22});
  A.say('Divide by +2 and the direction stays the same: x < 4.','+2 দিয়ে ভাগ করলে দিক একই থাকে: x < 4।');
  A.text(400,195,'x < 4      (divide by +2)',{size:26,c:GR});
  const X=v=>140+v*70;
  A.arrow(80,300,710,300,{c:MU,w:2},.5);
  for(let k=0;k<=6;k++){A.line(X(k),292,X(k),308,{c:MU,w:1.5},.15);A.text(X(k),328,String(k),{size:16});}
  A.arrow(X(4),300,80,300,{c:GR,w:6},.8);
  A.circle(X(4),300,8,{c:GR,w:3,fill:'#0b1220',fo:1},.3);
  A.text(520,380,'all numbers left of 4',{size:20,c:GR});
  A.say('The open circle at 4 says 4 itself is not included. The arrow runs to minus infinity.','4-এ ফাঁপা বৃত্ত বলে 4 নিজে অন্তর্ভুক্ত নয়। তীরটি ঋণাত্মক অসীম পর্যন্ত যায়।');
  A.text(400,405,'x ∈ (−∞, 4)',{size:24,c:SK});
  NOTE(A,452,'always test one number, such as x = 0, to check the shaded side.');
});

lesson('c1112-103','The sign flip mistake','Dividing by a negative flips the sign',A=>{
  A.say('Here is the one step that catches everyone: multiplying or dividing an inequality by a negative number flips the sign.','এই ধাপেই সবাই আটকায়: অসমতাকে ঋণাত্মক সংখ্যা দিয়ে গুণ বা ভাগ করলে চিহ্ন উল্টে যায়।');
  A.text(400,100,'−2x > 6',{size:32,c:AM});
  A.text(400,145,'divide both sides by −2',{size:22});
  A.text(400,190,'x < −3',{size:32,c:GR});
  A.arrow(600,105,680,105,{c:RD,w:4},.4);
  A.arrow(680,135,600,135,{c:RD,w:4},.4);
  A.text(640,165,'flip',{size:18,c:RD});
  const X=v=>340+v*70;
  A.arrow(80,300,710,300,{c:MU,w:2},.5);
  for(let k=-4;k<=5;k++){A.line(X(k),292,X(k),308,{c:MU,w:1.5},.12);A.text(X(k),328,String(k),{size:15});}
  A.arrow(X(-3),300,80,300,{c:GR,w:6},.8);
  A.circle(X(-3),300,8,{c:GR,w:3,fill:'#0b1220',fo:1},.3);
  A.say('Why? Take x = −4. Then −2x = 8, and 8 > 6 is true, so x = −4 must be allowed.','কেন? x = −4 নাও। তখন −2x = 8, এবং 8 > 6 সত্য, তাই x = −4 অবশ্যই গ্রহণযোগ্য।');
  A.text(430,385,'check x = −4:  8 > 6  ✓',{size:22,c:SK});
  A.say('Writing x > −3 instead would wrongly reject every number that works.','x > −3 লিখলে যেসব সংখ্যা কাজ করে, সেগুলোই ভুলভাবে বাদ পড়বে।');
  NOTE(A,445,'the flip happens only for a negative multiplier, never for adding or subtracting.');
});

lesson('c1112-104','Modulus as distance','|x − a| < r is an interval',A=>{
  A.say('The modulus |x − 3| measures the distance from x to 3 on the number line.','মডুলাস |x − 3| সংখ্যারেখায় x থেকে 3-এর দূরত্ব মাপে।');
  A.text(400,100,'|x − 3| < 2',{size:34,c:AM});
  A.text(400,145,'distance from x to 3 is less than 2',{size:20,c:SK});
  const X=v=>440+(v-3)*80;
  A.arrow(90,300,710,300,{c:MU,w:2},.5);
  for(let k=0;k<=6;k++){A.line(X(k),292,X(k),308,{c:MU,w:1.5},.12);A.text(X(k),328,String(k),{size:16});}
  A.line(X(1),230,X(5),230,{c:GR,w:8},.7);
  A.dashed(X(1),230,X(1),300,{c:MU},.4); A.dashed(X(5),230,X(5),300,{c:MU},.4);
  A.circle(X(1),300,8,{c:GR,w:3,fill:'#0b1220',fo:1},.3); A.circle(X(5),300,8,{c:GR,w:3,fill:'#0b1220',fo:1},.3);
  A.circle(X(3),300,8,{c:AM,w:3,fill:AM,fo:1},.3);
  A.text(X(2),205,'r = 2',{size:18,c:GR}); A.text(X(4),205,'r = 2',{size:18,c:GR});
  A.text(X(3),265,'a = 3',{size:18,c:AM});
  A.say('So the inequality describes every point within 2 units of 3: the open interval (1, 5).','তাই অসমতাটি 3 থেকে 2 একক দূরের সব বিন্দু বোঝায়: খোলা ব্যবধি (1, 5)।');
  A.say('In general |x − a| < r means a − r < x < a + r, and the greater-than case gives two outer rays.','সাধারণভাবে |x − a| < r মানে a − r < x < a + r; বড়-হলে দুটি বাইরের রশ্মি পাওয়া যায়।');
  A.text(400,385,'|x − a| < r   ⇔   a − r < x < a + r',{size:24,c:VI});
  NOTE(A,445,'distance on a line is always non-negative, so |x − a| can never be negative.');
});

lesson('c1112-105','Quadratic inequality sign chart','x² − 4 < 0: the parabola dips below',A=>{
  A.say('A quadratic inequality is about where the parabola sits above or below the x-axis.','দ্বিঘাত অসমতা বলে প্যারাবোলা x-অক্ষের উপরে না নিচে থাকে।');
  A.arrow(80,330,730,330,{c:MU,w:2},.4); A.arrow(400,430,400,100,{c:MU,w:2},.4);
  const X=x=>400+90*x, Y=y=>330-25*y;
  A.pts(PLOT(X,Y,x=>x*x-4,-3.4,3.4),{c:SK,w:3.5},1);
  A.circle(X(-2),Y(0),7,{c:RD,w:3,fill:RD,fo:1},.25); A.circle(X(2),Y(0),7,{c:RD,w:3,fill:RD,fo:1},.25);
  A.text(X(-2)-14,362,'−2',{size:18,c:RD}); A.text(X(2)+14,362,'2',{size:18,c:RD});
  A.say('Factor it: x² − 4 = (x − 2)(x + 2). The roots split the line into three zones.','উৎপাদকে ভাঙো: x² − 4 = (x − 2)(x + 2)। মূল দুটি রেখাকে তিন অংশে ভাগ করে।');
  A.line(X(-2),330,X(2),330,{c:GR,w:9},.7);
  A.text(400,110,'x² − 4 < 0   ⇔   (x − 2)(x + 2) < 0',{size:22,c:AM});
  A.say('Left of −2 both factors are negative, so the product is positive. Between the roots one factor is negative, so the product is negative.','−2-এর বাঁয়ে দুই উৎপাদকই ঋণাত্মক, তাই গুণফল ধনাত্মক। মূল দুটির মাঝে একটি ঋণাত্মক, তাই গুণফল ঋণাত্মক।');
  A.text(X(-3.3),395,'+',{size:26,c:GR}); A.text(400,395,'−',{size:26,c:RD}); A.text(X(3.3),395,'+',{size:26,c:GR});
  A.text(400,425,'answer:  −2 < x < 2',{size:24,c:GR});
  NOTE(A,455,'the sign chart is just the picture of the parabola, read left to right.');
});

/* ---------- chapter 2: linear programming ---------- */
lesson('c1112-106','Building the feasible region','Feasible region from four constraints',A=>{
  A.say('Linear programming starts with constraints. Each inequality keeps one side of a line, and all of them together keep a region.','রৈখিক প্রোগ্রামিং শুরু হয় শর্ত দিয়ে। প্রতিটি অসমতা একটি রেখার এক পাশ রাখে, সব মিলে একটি অঞ্চল রাখে।');
  const X=x=>120+68*x, Y=y=>410-52*y;
  A.arrow(105,410,720,410,{c:MU,w:2},.4); A.arrow(120,425,120,90,{c:MU,w:2},.4);
  A.line(X(0),Y(6),X(6),Y(0),{c:SK,w:3},.8);
  A.line(X(1),Y(6),X(4),Y(0),{c:PK,w:3},.8);
  A.pts([[X(0),Y(0)],[X(0),Y(6)],[X(2),Y(4)],[X(4),Y(0)],[X(0),Y(0)]],{c:GR,w:2,fill:GR,fo:.18},.9);
  [[0,0],[0,6],[2,4],[4,0]].forEach(p=>A.circle(X(p[0]),Y(p[1]),6,{c:AM,w:3,fill:AM,fo:1},.25));
  A.text(560,150,'x + y = 6',{size:18,c:SK,anchor:'start'});
  A.text(460,300,'2x + y = 8',{size:18,c:PK,anchor:'start'});
  A.say('With x ≥ 0 and y ≥ 0 we stay in the first quadrant. The two slanted lines cut off a four-sided region.','x ≥ 0 ও y ≥ 0 হলে আমরা প্রথম চতুর্ভাগে থাকি। দুটি তির্যক রেখা চার বাহুর একটি অঞ্চল কেটে দেয়।');
  A.text(300,360,'feasible region',{size:22,c:GR});
  A.say('Every point inside satisfies all four inequalities at once, so it is a possible plan.','ভিতরের প্রতিটি বিন্দু চারটি অসমতাই একসঙ্গে মেনে চলে, তাই এটি একটি সম্ভাব্য পরিকল্পনা।');
  A.text(560,395,'x ≥ 0',{size:17,c:MU}); A.text(150,120,'y ≥ 0',{size:17,c:MU});
  NOTE(A,450,'the region is closed and bounded here, so a best corner is guaranteed.');
});

lesson('c1112-107','Corner points of the region','Vertices: solve pairs of lines',A=>{
  A.say('The corners of the feasible region are where two boundary lines cross.','সম্ভাব্য অঞ্চলের কোণগুলো হলো যেখানে দুটি সীমানা রেখা ছেদ করে।');
  const X=x=>120+68*x, Y=y=>410-52*y;
  A.arrow(105,410,720,410,{c:MU,w:2},.4); A.arrow(120,425,120,90,{c:MU,w:2},.4);
  A.line(X(0),Y(6),X(6),Y(0),{c:SK,w:2.5},.7); A.line(X(1),Y(6),X(4),Y(0),{c:PK,w:2.5},.7);
  [[0,0],[0,6],[2,4],[4,0]].forEach(p=>{A.circle(X(p[0]),Y(p[1]),7,{c:AM,w:3,fill:AM,fo:1},.25);});
  A.text(X(0)+38,Y(0)-12,'(0, 0)',{size:17}); A.text(X(0)+38,Y(6)+6,'(0, 6)',{size:17});
  A.text(X(2)+46,Y(4)+4,'(2, 4)',{size:17,c:GR}); A.text(X(4)+8,Y(0)-16,'(4, 0)',{size:17});
  A.say('The axes give two easy corners. The other two need a pair of equations solved together.','অক্ষ দুইটি সহজ দুটি কোণ দেয়। বাকি দুটির জন্য দুই সমীকরণ একসঙ্গে সমাধান করতে হয়।');
  A.text(400,95,'x + y = 6  and  2x + y = 8',{size:20,c:SK});
  A.text(400,128,'subtract:  x = 2,  so  y = 4',{size:20,c:GR});
  A.say('Corner points turn an infinite region into a short list of candidates.','কোণ বিন্দুগুলো অসীম অঞ্চলকে অল্প কয়েকটি প্রার্থীর তালিকায় বদলে দেয়।');
  [['(0, 0)','0'],['(0, 6)','6'],['(2, 4)','4'],['(4, 0)','4']].forEach((r,i)=>{
    A.text(600,210+i*34,r[0],{size:18,c:AM}); A.text(680,210+i*34,r[1],{size:18,c:MU});
  });
  A.text(640,175,'x      y',{size:17,c:MU});
  NOTE(A,450,'always check that a corner also satisfies the other constraints.');
});

lesson('c1112-108','Sweeping the objective line','Maximise Z = 3x + 2y',A=>{
  A.say('The objective Z = 3x + 2y is constant along each line 3x + 2y = k. We slide that line outward.','লক্ষ্য Z = 3x + 2y প্রতিটি 3x + 2y = k রেখার উপর স্থির। আমরা রেখাটি বাইরের দিকে সরাই।');
  const X=x=>120+68*x, Y=y=>410-52*y;
  A.arrow(105,410,720,410,{c:MU,w:2},.4); A.arrow(120,425,120,90,{c:MU,w:2},.4);
  A.pts([[X(0),Y(0)],[X(0),Y(6)],[X(2),Y(4)],[X(4),Y(0)],[X(0),Y(0)]],{c:GR,w:2,fill:GR,fo:.14},.8);
  A.line(X(2),Y(0),X(0),Y(3),{c:SK,w:2.5},.6);
  A.line(X(4),Y(0),X(0),Y(6),{c:SK,w:2.5},.6);
  A.line(X(14/3),Y(0),X(1),Y(5.5),{c:AM,w:3},.6);
  A.arrow(X(1.2),Y(1.2),X(2.4),Y(.4),{c:RD,w:3},.5);
  A.text(X(4.7),Y(2.2),'Z increases',{size:18,c:RD,anchor:'start'});
  A.say('It finally leaves the region at the corner (2, 4). There Z = 6 + 8 = 14.','শেষে এটি (2, 4) কোণে অঞ্চল ছেড়ে যায়। সেখানে Z = 6 + 8 = 14।');
  A.circle(X(2),Y(4),9,{c:AM,w:3,fill:AM,fo:.35},.3);
  A.text(400,95,'Z = 3x + 2y',{size:26,c:AM});
  A.text(620,190,'(0, 6): 12',{size:18,c:INK}); A.text(620,225,'(2, 4): 14  max',{size:18,c:GR}); A.text(620,260,'(4, 0): 12',{size:18,c:INK});
  A.say('All four corners give 0, 12, 14, 12, so the maximum is 14 at (2, 4).','চার কোণে পাওয়া যায় 0, 12, 14, 12, তাই সর্বোচ্চ 14, বিন্দু (2, 4)-এ।');
  NOTE(A,450,'a minimum would be found by sliding the same line the other way.');
});

lesson('c1112-109','Why the best point is a corner','Linear means corners win',A=>{
  A.say('On a straight edge, Z changes at a steady rate, so its largest value on that edge must be at an end.','সরল প্রান্তে Z সমান হারে বদলায়, তাই ওই প্রান্তে তার সর্বোচ্চ মান অবশ্যই এক প্রান্তে।');
  A.pts([[140,330],[190,170],[320,130],[420,230],[360,380],[140,330]],{c:SK,w:3,fill:SK,fo:.13},1);
  A.line(320,130,420,230,{c:GR,w:6},.6);
  A.circle(320,130,6,{c:AM,w:3,fill:AM,fo:1},.25); A.circle(420,230,6,{c:AM,w:3,fill:AM,fo:1},.25);
  A.say('Walk along the green edge from one corner to the other. Z is a linear function of your position.','সবুজ প্রান্ত ধরে এক কোণ থেকে অন্য কোণে হাঁটো। তোমার অবস্থানের সাপেক্ষে Z রৈখিক।');
  A.text(400,95,'along an edge:  Z(t) = A + Bt',{size:22,c:GR});
  A.line(140,400,420,400,{c:MU,w:2},.4);
  A.line(140,400,420,360,{c:PK,w:4},.7);
  A.circle(140,400,5,{c:PK,w:2,fill:PK,fo:1},.2); A.circle(420,360,5,{c:PK,w:2,fill:PK,fo:1},.2);
  A.text(140,425,'3',{size:17}); A.text(420,345,'9',{size:17});
  A.text(560,150,'a linear function',{size:19,c:PK}); A.text(560,180,'on an interval',{size:19,c:PK});
  A.text(560,210,'has its extremes',{size:19}); A.text(560,240,'at the endpoints',{size:19});
  A.say('Apply this to every edge and the best point of the whole polygon must be a vertex.','প্রতিটি প্রান্তে এটি প্রয়োগ করলে গোটা বহুভুজের সেরা বিন্দু অবশ্যই একটি শীর্ষবিন্দু হবে।');
  A.text(560,300,'check all corners,',{size:18,c:GR}); A.text(560,326,'then compare values',{size:18,c:GR});
  NOTE(A,452,'this is the corner point theorem, and it is why the list stays short.');
});

lesson('c1112-110','No region, open region, many answers','Three special cases in linear programming',A=>{
  A.say('Not every linear program behaves neatly. The constraints can leave no region at all.','প্রতিটি রৈখিক প্রোগ্রাম সুন্দরভাবে চলে না। শর্তগুলো কোনো অঞ্চলই না রাখতে পারে।');
  A.text(155,115,'infeasible',{size:19,c:RD}); A.text(400,115,'unbounded',{size:19,c:AM}); A.text(645,115,'many optima',{size:19,c:GR});
  A.arrow(90,330,235,330,{c:MU,w:1.5},.3); A.arrow(110,340,110,175,{c:MU,w:1.5},.3);
  A.line(100,300,200,180,{c:SK,w:2.5},.5); A.line(120,310,220,190,{c:PK,w:2.5},.5);
  A.arrow(150,240,120,285,{c:RD,w:2},.3); A.arrow(170,250,200,205,{c:RD,w:2},.3);
  A.text(155,380,'no common point',{size:16,c:RD});
  A.arrow(315,330,470,330,{c:MU,w:1.5},.3); A.arrow(335,340,335,175,{c:MU,w:1.5},.3);
  A.line(335,300,445,180,{c:SK,w:2.5},.5);
  A.pts([[335,300],[445,180],[465,330],[335,330]],{c:AM,w:2,fill:AM,fo:.16},.6);
  A.arrow(420,250,465,200,{c:AM,w:2.5},.4);
  A.text(400,380,'Z grows forever',{size:16,c:AM});
  A.arrow(555,330,710,330,{c:MU,w:1.5},.3); A.arrow(575,340,575,175,{c:MU,w:1.5},.3);
  A.pts([[575,300],[640,190],[700,260],[660,320],[575,300]],{c:GR,w:2,fill:GR,fo:.14},.6);
  A.line(640,190,700,260,{c:GR,w:6},.5);
  A.text(645,380,'objective parallel',{size:16,c:GR});
  A.say('If two constraint lines leave no overlap, the program is infeasible and has no answer.','দুটি শর্ত রেখার কোনো সাধারণ অংশ না থাকলে প্রোগ্রামটি অসম্ভব, উত্তর নেই।');
  A.say('If the region runs off to infinity, Z may have no maximum. If the objective is parallel to an edge, every point of that edge is equally good.','অঞ্চল অসীমে গেলে Z-এর সর্বোচ্চ নাও থাকতে পারে। লক্ষ্য রেখা কোনো প্রান্তের সমান্তরাল হলে সেই প্রান্তের প্রতিটি বিন্দুই সমান ভালো।');
  NOTE(A,450,'a bounded region with an objective always has both a maximum and a minimum.');
});

/* ---------- chapter 3: complex numbers ---------- */
lesson('c1112-111','Argand plane: modulus and argument','z = 3 + 4i as a point and an arrow',A=>{
  A.say('A complex number z = a + bi is a point: a along the real axis, b along the imaginary axis.','জটিল সংখ্যা z = a + bi একটি বিন্দু: বাস্তব অক্ষে a, কাল্পনিক অক্ষে b।');
  A.arrow(160,360,720,360,{c:MU,w:2},.4); A.arrow(300,450,300,90,{c:MU,w:2},.4);
  const X=x=>300+55*x, Y=y=>360-55*y;
  A.arrow(300,360,X(3),Y(4),{c:AM,w:4},.7);
  A.dashed(X(3),360,X(3),Y(4),{c:MU,w:1.6},.5); A.dashed(300,Y(4),X(3),Y(4),{c:MU,w:1.6},.5);
  A.circle(X(3),Y(4),7,{c:AM,w:3,fill:AM,fo:1},.25);
  A.text(X(3)+50,Y(4)-6,'z = 3 + 4i',{size:19,c:AM,anchor:'start'});
  A.say('The arrow from the origin has length r = √(3² + 4²) = 5. That is the modulus |z|.','মূলবিন্দু থেকে তীরটির দৈর্ঘ্য r = √(3² + 4²) = 5। এটিই মডুলাস |z|।');
  A.text(400,120,'r = |z| = √(a² + b²) = 5',{size:22,c:GR});
  A.pts(Array.from({length:20},(_,i)=>{const a=i*0.927/19;return [300+58*Math.cos(a),360-58*Math.sin(a)];}),{c:SK,w:2},.4);
  A.text(372,342,'θ',{size:20,c:SK});
  A.say('The angle from the positive real axis is the argument: tan θ = 4/3, so θ ≈ 53°.','ধনাত্মক বাস্তব অক্ষ থেকে কোণটি হলো আর্গুমেন্ট: tan θ = 4/3, তাই θ ≈ 53°।');
  A.text(400,408,'z = r(cos θ + i sin θ)',{size:24,c:VI});
  NOTE(A,448,'the argument is measured anticlockwise, and it is only fixed up to 360°.');
});

lesson('c1112-112','Adding complex numbers as vectors','(2 + i) + (1 + 3i) = 3 + 4i',A=>{

  const X=x=>180+55*x, Y=y=>370-55*y;
  A.arrow(160,370,720,370,{c:MU,w:2},.4); A.arrow(180,440,180,95,{c:MU,w:2},.4);
  A.arrow(180,370,X(2),Y(1),{c:SK,w:3.5},.6);
  A.arrow(180,370,X(1),Y(3),{c:PK,w:3.5},.6);
  A.dashed(X(2),Y(1),X(3),Y(4),{c:SK,w:2},.5);
  A.dashed(X(1),Y(3),X(3),Y(4),{c:PK,w:2},.5);
  A.arrow(180,370,X(3),Y(4),{c:AM,w:4},.6);
  A.circle(X(3),Y(4),7,{c:AM,w:3,fill:AM,fo:1},.25);
  A.text(X(2)+6,Y(1)+24,'z₁',{size:20,c:SK}); A.text(X(1)-16,Y(3)-8,'z₂',{size:20,c:PK});
  A.text(X(3)+40,Y(4)-4,'z₁ + z₂',{size:19,c:AM,anchor:'start'});
  A.say('The dashed sides form a parallelogram, and the diagonal is the sum.','ড্যাশ করা বাহুগুলো একটি সামান্তরিক বানায়, আর কর্ণটিই যোগফল।');
  A.text(610,120,'z₁ = 2 + i',{size:19,c:SK}); A.text(610,152,'z₂ = 1 + 3i',{size:19,c:PK}); A.text(610,184,'sum = 3 + 4i',{size:19,c:AM});
  A.say('Real parts add, imaginary parts add: (2 + 1) + (1 + 3)i.','বাস্তব অংশ যোগ হয়, কাল্পনিক অংশ যোগ হয়: (2 + 1) + (1 + 3)i।');
  A.text(400,425,'subtraction runs the second arrow backwards',{size:19,c:GR});

lesson('c1112-113','Multiplication rotates and scales','Multiplying by i turns 90°',A=>{
  A.say('Multiplying by a complex number does two things at once: it scales the length and adds to the angle.','জটিল সংখ্যা দিয়ে গুণ একসঙ্গে দুটি কাজ করে: দৈর্ঘ্য বদলায় ও কোণ যোগ হয়।');
  A.circle(380,280,105,{c:MU,w:2},.8);
  const P=(r,a)=>[380+r*Math.cos(a),280-r*Math.sin(a)];
  A.arrow(380,280,...P(105,0.524),{c:SK,w:3.5},.6);
  A.arrow(380,280,...P(105,2.094),{c:PK,w:3.5},.6);
  A.arrow(380,280,...P(210,2.094),{c:GR,w:3.5},.6);
  A.pts(Array.from({length:18},(_,i)=>{const a=0.524+i*1.57/17;return P(140,a);}),{c:RD,w:2},.5);
  A.text(...P(120,.35),'z',{size:21,c:SK}); A.text(...P(120,2.2),'iz',{size:21,c:PK}); A.text(...P(225,2.0),'2iz',{size:21,c:GR});
  A.say('Take z at 30°. Multiplying by i gives the same length at 30° + 90° = 120°.','30°-তে z নাও। i দিয়ে গুণ করলে একই দৈর্ঘ্য নিয়ে কোণ হয় 30° + 90° = 120°।');
  A.say('Multiplying by 2i also doubles the length, so the point moves twice as far along that new direction.','2i দিয়ে গুণ করলে দৈর্ঘ্যও দ্বিগুণ হয়, তাই বিন্দুটি নতুন দিক ধরে দ্বিগুণ দূরে যায়।');
  A.text(660,240,'× i : rotate 90°',{size:18,c:PK}); A.text(660,270,'× 2 : double length',{size:18,c:GR}); A.text(660,300,'i² = −1',{size:20,c:AM});
  NOTE(A,450,'in general |z₁z₂| = |z₁||z₂| and arg(z₁z₂) = arg z₁ + arg z₂.');
});

lesson('c1112-114','The conjugate is a mirror','z and z̄ across the real axis',A=>{
  A.say('The conjugate of 3 + 2i is 3 − 2i: keep the real part and flip the sign of the imaginary part.','3 + 2i-এর অনুবন্ধী 3 − 2i: বাস্তব অংশ রাখো, কাল্পনিক অংশের চিহ্ন উল্টাও।');
  A.arrow(120,280,720,280,{c:MU,w:2},.4); A.arrow(350,430,350,100,{c:MU,w:2},.4);
  const X=x=>350+55*x, Y=y=>280-55*y;
  A.arrow(350,280,X(3),Y(2),{c:AM,w:3.5},.6);
  A.arrow(350,280,X(3),Y(-2),{c:PK,w:3.5},.6);
  A.dashed(X(3),Y(2),X(3),Y(-2),{c:MU,w:1.6},.5);
  A.circle(X(3),Y(2),7,{c:AM,w:3,fill:AM,fo:1},.25); A.circle(X(3),Y(-2),7,{c:PK,w:3,fill:PK,fo:1},.25);
  A.text(X(3)+16,Y(2)-8,'z = 3 + 2i',{size:19,c:AM,anchor:'start'});
  A.text(X(3)+16,Y(-2)+24,'z̄ = 3 − 2i',{size:19,c:PK,anchor:'start'});
  A.say('On the Argand plane the two points are mirror images in the real axis.','আর্গঁ সমতলে দুই বিন্দু বাস্তব অক্ষের সাপেক্ষে আয়নার প্রতিবিম্ব।');
  A.say('Add them and the imaginary parts cancel: z + z̄ = 6, a real number. Multiply them and you get 3² + 2² = 13.','যোগ করলে কাল্পনিক অংশ কেটে যায়: z + z̄ = 6, একটি বাস্তব সংখ্যা। গুণ করলে পাওয়া যায় 3² + 2² = 13।');
  A.text(180,130,'z + z̄ = 2a',{size:22,c:GR}); A.text(180,172,'z · z̄ = a² + b²',{size:22,c:VI});
  A.text(400,410,'z · z̄ = |z|²',{size:26,c:GR});
  NOTE(A,452,'conjugates turn division into multiplication by the conjugate of the denominator.');
});

lesson('c1112-115','Cube roots of unity','1, ω, ω² sit 120° apart',A=>{

  A.circle(380,270,140,{c:MU,w:2.5},.9);
  const P=a=>[380+140*Math.cos(a),270-140*Math.sin(a)];
  A.pts([P(-Math.PI/2),P(Math.PI/6),P(5*Math.PI/6),P(-Math.PI/2)],{c:SK,w:2.5},.7);
  A.arrow(380,270,...P(-Math.PI/2),{c:AM,w:3},.5);
  A.arrow(380,270,...P(Math.PI/6),{c:PK,w:3},.5);
  A.arrow(380,270,...P(5*Math.PI/6),{c:GR,w:3},.5);
  A.text(...P(-Math.PI/2),'1',{size:22,c:AM}); A.text(...P(Math.PI/6),'ω',{size:22,c:PK}); A.text(...P(5*Math.PI/6),'ω²',{size:22,c:GR});
  A.say('Each step is a rotation by 120°, which is one third of a full turn.','প্রতিটি ধাপ 120° ঘূর্ণন, অর্থাৎ পূর্ণ ঘূর্ণনের এক-তৃতীয়াংশ।');
  A.pts(Array.from({length:16},(_,i)=>{const a=i*2.094/15;return [380+58*Math.cos(a),270-58*Math.sin(a)];}),{c:RD,w:2},.5);
  A.text(400,95,'z³ = 1: three roots, 120° apart',{size:20,c:AM});
  A.say('The three arrows add to zero, which is the same statement as 1 + ω + ω² = 0.','তিনটি তীর যোগ হয়ে শূন্য হয়, যা 1 + ω + ω² = 0 লেখার সমান।');
  A.text(640,240,'1 + ω + ω² = 0',{size:19,c:GR}); A.text(640,280,'ω³ = 1',{size:19,c:SK}); A.text(640,320,'ω ≠ 1',{size:18,c:MU});
  NOTE(A,450,'multiplying by ω is a pure rotation, so powers of ω cycle with period three.');

lesson('c1112-116','Degree and end behaviour','Odd and even degree polynomials',A=>{
  A.say('The degree of a polynomial controls how the graph behaves far away from the origin.','বহুপদীর ডিগ্রি নিয়ন্ত্রণ করে মূলবিন্দু থেকে অনেক দূরে লেখচিত্র কেমন আচরণ করবে।');
  const X=x=>400+80*x, Y=y=>280-28*y;
  A.arrow(120,280,710,280,{c:MU,w:2},.4); A.arrow(400,405,400,110,{c:MU,w:2},.4);
  A.pts(PLOT(X,Y,x=>x*x*x-3*x,-2.2,2.2),{c:SK,w:3.5},1);
  A.circle(X(-1),Y(2),6,{c:AM,w:3,fill:AM,fo:1},.25); A.circle(X(1),Y(-2),6,{c:AM,w:3,fill:AM,fo:1},.25);
  A.text(400,100,'y = x³ − 3x   (odd degree)',{size:20,c:AM});
  A.say('For an odd degree the two ends run in opposite directions: down on the left, up on the right.','বিজোড় ডিগ্রিতে দুই প্রান্ত বিপরীত দিকে যায়: বাঁয়ে নিচে, ডানে উপরে।');
  A.text(650,390,'x → −∞, y → −∞',{size:17,c:SK}); A.text(650,150,'x → ∞, y → ∞',{size:17,c:SK});
  A.say('An even degree with a positive leading coefficient lifts both ends up, like a bowl.','জোড় ডিগ্রি ও ধনাত্মক প্রধান সহগে দুই প্রান্তই উপরে ওঠে, বাটির মতো।');
  A.text(400,425,'even degree: both ends same way',{size:19,c:GR});
  A.text(400,452,'odd degree: ends opposite',{size:19,c:PK});
  NOTE(A,60,'a polynomial of degree n has at most n − 1 turning points.');
});

lesson('c1112-117','Remainder theorem in a tableau','f(x) ÷ (x − 2): remainder f(2)',A=>{
  A.say('Dividing by x − 2 gives a remainder that is just f(2). Synthetic division shows it in one line.','x − 2 দিয়ে ভাগ করলে ভাগশেষ হয় শুধু f(2)। সিন্থেটিক ভাগে এটি এক লাইনেই দেখা যায়।');
  const xs=[210,310,410,510];
  [1,0,-4,2].forEach((v,i)=>A.text(xs[i],140,String(v),{size:26}));
  A.text(150,140,'2 |',{size:22,c:AM});
  A.line(190,158,560,158,{c:MU,w:2},.4);
  [2,4,0].forEach((v,i)=>A.text(xs[i+1],198,String(v),{size:22,c:PK}));
  A.line(190,218,560,218,{c:MU,w:2},.4);
  [1,2,0,2].forEach((v,i)=>A.text(xs[i],258,String(v),{size:26,c:i===3?GR:INK}));
  A.text(150,258,'sum',{size:18,c:MU});
  A.rect(xs[3]-28,230,56,42,{c:GR,w:2.5,fill:GR,fo:.15},.4);
  A.say('Bring down 1, multiply by 2, add, repeat. The last number is the remainder.','1 নামাও, 2 দিয়ে গুণ করো, যোগ করো, পুনরাবৃত্তি করো। শেষ সংখ্যাটিই ভাগশেষ।');
  A.text(400,320,'coefficients of  x³ + 0x² − 4x + 2',{size:19,c:SK});
  A.arrow(510,300,510,370,{c:GR,w:2},.4);
  A.say('So f(2) = 8 − 8 + 2 = 2, and the remainder is 2.','তাই f(2) = 8 − 8 + 2 = 2, ভাগশেষ 2।');
  A.text(400,395,'f(2) = 2  =  remainder',{size:24,c:GR});
  A.text(400,435,'no long division needed',{size:18,c:MU});
  NOTE(A,462,'if the remainder is 0, then x − 2 is a factor.');
});

lesson('c1112-118','Factor theorem and roots','f(x) = (x − 1)(x − 3)',A=>{
  A.say('A root of a polynomial is an x where f(x) = 0, and that is exactly where the graph cuts the x-axis.','বহুপদীর মূল হলো সেই x যেখানে f(x) = 0, ঠিক সেখানেই লেখচিত্র x-অক্ষ কাটে।');
  const X=x=>180+110*x, Y=y=>360-50*y;
  A.arrow(120,360,710,360,{c:MU,w:2},.4); A.arrow(180,435,180,105,{c:MU,w:2},.4);
  A.pts(PLOT(X,Y,x=>(x-1)*(x-3),0,4.5),{c:SK,w:3.5},1);
  A.circle(X(1),Y(0),7,{c:RD,w:3,fill:RD,fo:1},.25); A.circle(X(3),Y(0),7,{c:RD,w:3,fill:RD,fo:1},.25);
  A.text(X(1),392,'1',{size:19,c:RD}); A.text(X(3),392,'3',{size:19,c:RD});
  A.text(400,100,'f(x) = x² − 4x + 3 = (x − 1)(x − 3)',{size:21,c:AM});
  A.say('Put x = 1 into the factored form: one bracket is zero, so the whole product is zero.','x = 1 বসাও উৎপাদক রূপে: একটি বন্ধনী শূন্য, তাই গোটা গুণফল শূন্য।');
  A.say('The factor theorem says the reverse too: f(1) = 0 means (x − 1) divides f(x) exactly.','উৎপাদক উপপাদ্য উল্টোটাও বলে: f(1) = 0 মানে (x − 1) নিঃশেষে f(x)-কে ভাগ করে।');
  A.text(400,420,'f(1) = 0    f(3) = 0',{size:22,c:GR});
  A.text(400,450,'double root would only touch the axis',{size:18,c:VI});
  NOTE(A,60,'degree n has at most n real roots, counted with multiplicity.');
});

lesson('c1112-119','Long division of polynomials','x³ + 2x² − 5x − 6 by x + 1',A=>{
  A.say('Polynomial long division repeats three moves: divide, multiply, subtract.','বহুপদীর দীর্ঘ ভাগে তিনটি কাজ বারবার হয়: ভাগ, গুণ, বিয়োগ।');
  A.text(200,100,'x² + x − 6',{size:24,c:AM,anchor:'start'});
  A.text(120,142,'x + 1 )  x³ + 2x² − 5x − 6',{size:21,anchor:'start'});
  A.line(120,158,640,158,{c:MU,w:2},.4);
  A.text(240,192,'x³ + x²',{size:21,c:SK,anchor:'start'});
  A.line(240,208,560,208,{c:MU,w:1.5},.3);
  A.text(300,242,'x² − 5x',{size:21,c:SK,anchor:'start'});
  A.text(300,280,'x² + x',{size:21,c:SK,anchor:'start'});
  A.line(300,296,560,296,{c:MU,w:1.5},.3);
  A.text(360,330,'−6x − 6',{size:21,c:PK,anchor:'start'});
  A.text(360,368,'−6x − 6',{size:21,c:PK,anchor:'start'});
  A.line(360,384,620,384,{c:MU,w:1.5},.3);
  A.text(560,415,'0',{size:24,c:GR});
  A.say('Each subtraction removes the leading term, so the degree falls by one and the process must stop.','প্রতিটি বিয়োগে প্রধান পদ কেটে যায়, তাই ডিগ্রি এক এক করে কমে এবং প্রক্রিয়া থামতেই হয়।');
  A.say('The quotient is x² + x − 6, and the remainder is 0, so x + 1 is a factor.','ভাগফল x² + x − 6, ভাগশেষ 0, তাই x + 1 একটি উৎপাদক।');
  A.text(400,448,'x³+2x²−5x−6 = (x+1)(x−2)(x+3)',{size:19,c:GR});
  NOTE(A,60,'a zero remainder is the same as saying the divisor is a factor.');
});

lesson('c1112-120','Vieta: sum and product of roots','Coefficients know the roots',A=>{
  A.say('For ax² + bx + c = 0, you do not need the roots to know their sum and product.','ax² + bx + c = 0-এর জন্য মূল না জেনেও তাদের যোগফল ও গুণফল জানা যায়।');
  A.text(400,100,'ax² + bx + c = 0',{size:26,c:AM});

  A.say('Example: 2x² − 7x + 3 = 0. Here a = 2, b = −7, c = 3, so the sum is 7/2 and the product is 3/2.','উদাহরণ: 2x² − 7x + 3 = 0। এখানে a = 2, b = −7, c = 3, তাই যোগফল 7/2 ও গুণফল 3/2।');
  A.text(400,240,'2x² − 7x + 3 = 0',{size:24});
  A.text(400,282,'sum = 7/2      product = 3/2',{size:22,c:GR});
  const X=v=>400+(v-1.75)*150;
  A.arrow(120,340,700,340,{c:MU,w:2},.4);
  A.circle(X(0.5),340,8,{c:PK,w:3,fill:PK,fo:1},.3); A.circle(X(3),340,8,{c:SK,w:3,fill:SK,fo:1},.3);
  A.text(X(0.5),375,'α = 0.5',{size:18,c:PK}); A.text(X(3),375,'β = 3',{size:18,c:SK});
  A.dashed(X(1.75),300,X(1.75),340,{c:AM,w:2},.4);
  A.text(X(1.75),290,'midpoint 7/4',{size:17,c:AM});
  A.say('The roots 1/2 and 3 indeed add to 7/2 and multiply to 3/2, which checks the formulas.','মূল 1/2 ও 3 সত্যিই যোগ হয় 7/2 এবং গুণ হয় 3/2, যা সূত্র যাচাই করে।');
  A.text(400,430,'cubic: α+β+γ = −b/a,  αβγ = −d/a',{size:19,c:VI});
  NOTE(A,60,'Vieta is the fastest way to build an equation from its roots.');
});

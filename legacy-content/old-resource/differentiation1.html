const ARC=(cx,cy,r,a,b,n=20)=>Array.from({length:n+1},(_,i)=>{const t=a+(b-a)*i/n;return [cx+r*Math.cos(t),cy-r*Math.sin(t)];});

lesson('c1112-121','Pascal triangle and coefficients','Rows of (a + b)ⁿ build themselves',A=>{
  A.say('Each row of Pascal triangle gives the coefficients of (a + b)ⁿ. Every entry is the sum of the two above it.','প্যাসকেল ত্রিভুজের প্রতিটি সারি (a + b)ⁿ-এর সহগ দেয়। প্রতিটি সংখ্যা উপরের দুই সংখ্যার যোগফল।');
  const rows=[[1],[1,1],[1,2,1],[1,3,3,1],[1,4,6,4,1]];
  rows.forEach((r,n)=>{r.forEach((v,j)=>{const x=400+(j-n/2)*62,y=120+n*48;
    A.circle(x,y,18,{c:n===4&&j===2?AM:SK,w:2,fill:n===4&&j===2?AM:SK,fo:.2},.25);
    A.text(x,y+6,String(v),{size:18,c:n===4&&j===2?AM:INK});});});
  A.say('Follow the 6 in the last row: it is 3 + 3 from the row above.','শেষ সারির 6-টি দেখো: এটি উপরের সারির 3 + 3।');
  A.line(369,264,394,294,{c:AM,w:2},.3); A.line(431,264,406,294,{c:AM,w:2},.3);
  A.text(400,380,'C(4, 2) = 4! / (2! 2!) = 6',{size:23,c:GR});
  A.say('The row also carries the binomial coefficients C(n, r), which count ways to choose r things from n.','সারিটি দ্বিপদী সহগ C(n, r)-ও বহন করে, যা n থেকে r জিনিস বাছার উপায় গোনে।');
  A.text(400,422,'row 4:  1  4  6  4  1',{size:22,c:VI});
  NOTE(A,455,'row n has n + 1 entries and its total is 2ⁿ.');
});

lesson('c1112-122','The general term','Find the 4th term of (x + 2)⁶',A=>{
  A.say('Every term of (a + b)ⁿ has the same shape: choose r b factors, and the rest are a.','(a + b)ⁿ-এর প্রতিটি পদের একই গঠন: r সংখ্যক b নাও, বাকিগুলো a।');
  A.text(400,100,'Tᵣ₊₁ = C(n, r) · aⁿ⁻ʳ · bʳ',{size:28,c:AM});
  A.say('For (x + 2)⁶ the fourth term has r = 3, because the count starts at r = 0.','(x + 2)⁶-এ চতুর্থ পদের r = 3, কারণ গণনা r = 0 থেকে শুরু।');
  for(let i=0;i<=6;i++){const x=130+i*75;
    A.rect(x-32,230,64,54,{c:i===3?AM:MU,w:i===3?3:1.8,fill:i===3?AM:'#0b1220',fo:i===3?.18:1},.3);
    A.text(x,264,'T'+(i+1),{size:17,c:i===3?AM:INK});
    A.text(x,310,'r = '+i,{size:15,c:MU});
  }
  A.arrow(355,320,355,350,{c:AM,w:2},.35);
  A.say('So the term is C(6, 3) x³ 2³ = 20 × 8 x³ = 160x³.','তাই পদটি C(6, 3) x³ 2³ = 20 × 8 x³ = 160x³।');
  A.text(400,378,'C(6,3) x³ 2³  =  20 · 8 · x³',{size:24,c:SK});
  A.text(400,418,'= 160x³',{size:28,c:GR});
  NOTE(A,455,'aⁿ⁻ʳ falls as bʳ rises, so the powers always add up to n.');
});

lesson('c1112-123','The middle term','(x + 1/x)⁸ has a constant middle term',A=>{
  A.say('When n is even there is one middle term. When n is odd there are two equal middle terms.','n জোড় হলে একটি মধ্যপদ থাকে। n বিজোড় হলে দুটি সমান মধ্যপদ থাকে।');
  A.text(400,100,'n = 8 is even  →  middle term is the 5th',{size:22,c:AM});
  for(let r=0;r<=8;r++){const x=120+r*68;
    A.rect(x-26,210,52,46,{c:r===4?GR:MU,w:r===4?3:1.6,fill:r===4?GR:'#0b1220',fo:r===4?.2:1},.25);
    A.text(x,240,String(r),{size:17,c:r===4?GR:INK});
    A.text(x,285,'T'+(r+1),{size:14,c:MU});
  }
  A.say('The middle term is T₅, so r = 4. Its powers are x⁸⁻⁴ and (1/x)⁴.','মধ্যপদ T₅, তাই r = 4। এর ঘাত x⁸⁻⁴ এবং (1/x)⁴।');
  A.text(400,340,'x⁴ · x⁻⁴ = x⁰ = 1',{size:24,c:SK});
  A.say('The x powers cancel, so the term is just the coefficient: C(8, 4) = 70.','x-এর ঘাত কেটে যায়, তাই পদটি শুধু সহগ: C(8, 4) = 70।');
  A.text(400,390,'middle term = C(8,4) = 70',{size:26,c:GR});
  A.text(400,430,'a constant term, free of x',{size:19,c:VI});
  NOTE(A,458,'for odd n both middle terms have the same coefficient C(n, (n−1)/2).');
});

lesson('c1112-124','Binomial approximation','(1.01)¹⁰ without a calculator',A=>{
  A.say('For small x, the first two terms already give a good answer: (1 + x)ⁿ ≈ 1 + nx.','ছোট x-এর জন্য প্রথম দুই পদই ভালো উত্তর দেয়: (1 + x)ⁿ ≈ 1 + nx।');
  A.text(400,100,'(1 + x)ⁿ = 1 + nx + n(n−1)x²/2! + …',{size:22,c:AM});
  A.say('Take x = 0.01 and n = 10. The terms shrink very fast, so the later ones hardly matter.','x = 0.01 ও n = 10 নাও। পদগুলো খুব দ্রুত ছোট হয়, তাই পরের পদগুলো প্রায় কিছুই বদলায় না।');
  const terms=[['1','1'],['10(0.01)','0.1'],['45(0.0001)','0.0045'],['120(0.000001)','0.00012']];
  terms.forEach((t,i)=>{const y=215+i*40;
    A.text(250,y,t[0],{size:19,c:SK,anchor:'end'}); A.text(330,y,'=',{size:19,c:MU}); A.text(380,y,t[1],{size:20,c:GR,anchor:'start'});
  });
  A.text(400,390,'sum ≈ 1.10462',{size:28,c:GR});
  A.say('The exact value is 1.104622…, so the four-term approximation is already correct to five places.','নিখুঁত মান 1.104622…, তাই চার পদের আসন্ন মান পাঁচ দশমিক স্থান পর্যন্ত সঠিক।');
  A.dashed(130,430,700,430,{c:MU,w:2},.4);
  A.circle(400,430,7,{c:AM,w:3,fill:AM,fo:1},.3);
  A.text(400,455,'1.10462 sits just past 1.1',{size:18,c:AM});
  NOTE(A,60,'the approximation is good only while |x| is small.');
});

lesson('c1112-125','Coefficient sums by substitution','Put x = 1 and x = −1',A=>{
  A.say('The sum of all coefficients of a polynomial is just its value at x = 1.','বহুপদীর সব সহগের যোগফল হলো x = 1-এ তার মান।');
  A.text(400,100,'(1 + 2x)⁴ = 1 + 8x + 24x² + 32x³ + 16x⁴',{size:21,c:AM});
  const c=[1,8,24,32,16];
  c.forEach((v,i)=>{const x=160+i*110;
    A.rect(x-40,165,80,52,{c:SK,w:2,fill:SK,fo:.14},.3); A.text(x,199,String(v),{size:24});
    A.text(x,245,i%2?'−':'+',{size:24,c:i%2?RD:GR});
  });
  A.say('Adding them gives 81, and that equals (1 + 2)⁴ = 3⁴. No expansion was needed.','সেগুলো যোগ করলে 81, যা (1 + 2)⁴ = 3⁴-এর সমান। কোনো বিস্তার লাগেনি।');
  A.text(400,320,'sum of coefficients = f(1) = 3⁴ = 81',{size:24,c:GR});
  A.say('Now substitute x = −1. The signs alternate, giving 1 − 8 + 24 − 32 + 16 = 1, which is (−1)⁴.','এবার x = −1 বসাও। চিহ্ন পালা করে বদলায়, পাওয়া যায় 1 − 8 + 24 − 32 + 16 = 1, অর্থাৎ (−1)⁴।');
  A.text(400,365,'alternating sum = f(−1) = (−1)⁴ = 1',{size:24,c:PK});
  A.text(400,415,'even coefficients: (81 + 1)/2 = 41',{size:20,c:VI});
  A.text(400,448,'odd coefficients: (81 − 1)/2 = 40',{size:20,c:VI});
  NOTE(A,60,'these two tricks answer most exam questions about coefficient sums.');
});

/* ---------- chapter 6: conics ---------- */
lesson('c1112-126','Slicing a cone','One cone, four conic sections',A=>{
  A.say('A double cone cut by a plane gives all the conic sections. The angle of the cut decides which one.','দ্বৈত শঙ্কুকে একটি সমতল দিয়ে কাটলে সব কনিক পাওয়া যায়। কাটার কোণই ঠিক করে কোনটি হবে।');
  A.text(210,90,'double cone',{size:18,c:MU});
  A.line(210,240,100,110,{c:MU,w:2.5},.5); A.line(210,240,320,110,{c:MU,w:2.5},.5);
  A.line(210,240,100,370,{c:MU,w:2.5},.5); A.line(210,240,320,370,{c:MU,w:2.5},.5);
  A.ell(210,110,110,20,{c:SK,w:2},.6); A.ell(210,370,110,20,{c:SK,w:2},.6);
  A.ell(210,200,34,8,{c:GR,w:4},.5);
  A.text(210,445,'a shallow cut gives a circle',{size:17,c:GR});
  A.say('A cut parallel to the base makes a circle. Tilting it a little stretches the circle into an ellipse.','ভূমির সমান্তরাল কাটা বৃত্ত বানায়। একটু কাত করলে বৃত্তটি প্রসারিত হয়ে উপবৃত্ত হয়।');
  A.circle(475,155,32,{c:SK,w:3},.6); A.ell(655,155,48,20,{c:PK,w:3},.6);
  A.text(475,220,'circle',{size:18,c:SK}); A.text(655,220,'ellipse',{size:18,c:PK});
  A.say('Tilt until the plane is parallel to a side and the curve never closes: a parabola. Steeper still gives both branches of a hyperbola.','যত কাত করবে যতক্ষণ সমতল একটি বাহুর সমান্তরাল হয়, বক্ররেখা আর বন্ধ হয় না: প্যারাবোলা। আরও খাড়া হলে অধিবৃত্তের দুই শাখা।');
  A.pts(Array.from({length:25},(_,i)=>{const x=-62+i*124/24;return [475+x,282-x*x/60];}),{c:AM,w:3},.6);
  const hbr=s=>Array.from({length:21},(_,i)=>{const t=-1.1+i*2.2/20;return [655+s*26*Math.cosh(t),230-62*Math.sinh(t)];});
  A.pts(hbr(1),{c:VI,w:3},.6); A.pts(hbr(-1),{c:VI,w:3},.6);
  A.text(475,390,'parabola',{size:18,c:AM}); A.text(655,390,'hyperbola',{size:18,c:VI});
  NOTE(A,60,'the conics are one family seen from different cutting angles.');
});

lesson('c1112-127','Parabola: focus and directrix','y² = 4x with a = 1',A=>{
  A.say('A parabola is the set of points equally far from a fixed point, the focus, and a fixed line, the directrix.','প্যারাবোলা হলো এমন বিন্দুর সেট যা একটি নির্দিষ্ট বিন্দু (ফোকাস) ও একটি নির্দিষ্ট রেখা (নিয়ামক) থেকে সমান দূরে।');
  const X=x=>220+55*x, Y=y=>300-55*y;
  A.arrow(140,300,700,300,{c:MU,w:2},.4); A.arrow(220,440,220,110,{c:MU,w:2},.4);
  A.pts([...Array(41)].map((_,i)=>{const y=-3+i*6/40;return [X(y*y/4),Y(y)];}),{c:SK,w:3.5},1);
  A.line(X(-1),120,X(-1),455,{c:PK,w:2.5},.6);
  A.circle(X(1),300,7,{c:AM,w:3,fill:AM,fo:1},.3);
  A.circle(X(1),Y(2),7,{c:GR,w:3,fill:GR,fo:1},.3);
  A.dashed(X(1),Y(2),X(-1),Y(2),{c:GR,w:2},.5);
  A.dashed(X(1),Y(2),X(1),Y(0),{c:AM,w:2},.5);
  A.text(X(-1)-10,135,'directrix x = −1',{size:17,c:PK,anchor:'end'});
  A.text(X(1)+14,285,'focus (1, 0)',{size:17,c:AM,anchor:'start'});
  A.text(X(1)+18,Y(2)-6,'P',{size:19,c:GR,anchor:'start'});
  A.say('Take the point P on the curve at height 2. Its distance to the focus is 2, and its distance to the directrix is also 2.','বক্ররেখার উপর উচ্চতা 2-এ P নাও। ফোকাস থেকে দূরত্ব 2, নিয়ামক থেকেও দূরত্ব 2।');
  A.text(560,120,'y² = 4ax,  a = 1',{size:21,c:SK});
  A.text(560,158,'PF = distance to line',{size:18,c:GR});
  A.say('That equal-distance rule is the definition, and it is why satellite dishes use a parabola.','এই সমদূরত্ব নিয়মই সংজ্ঞা, তাই স্যাটেলাইট ডিশে প্যারাবোলা ব্যবহার হয়।');
  A.text(560,210,'reflection: parallel rays',{size:17,c:VI}); A.text(560,236,'meet at the focus',{size:17,c:VI});
  NOTE(A,452,'for y² = 4ax the focus is (a, 0) and the directrix is x = −a.');
});

lesson('c1112-128','Ellipse: distances add up','PF₁ + PF₂ = 2a',A=>{
  A.say('An ellipse is the set of points whose distances to two fixed foci add up to a constant.','উপবৃত্ত হলো এমন বিন্দুর সেট যার দুই নির্দিষ্ট ফোকাস থেকে দূরত্বের যোগফল ধ্রুবক।');
  A.ell(380,270,200,120,{c:SK,w:3.5},1);
  A.dashed(180,270,580,270,{c:MU,w:1.6},.4);
  A.circle(220,270,7,{c:AM,w:3,fill:AM,fo:1},.3); A.circle(540,270,7,{c:AM,w:3,fill:AM,fo:1},.3);
  A.line(220,270,480,166,{c:PK,w:3},.5); A.line(540,270,480,166,{c:GR,w:3},.5);
  A.circle(480,166,7,{c:VI,w:3,fill:VI,fo:1},.3);
  A.text(220,300,'F₁',{size:19,c:AM}); A.text(540,300,'F₂',{size:19,c:AM});
  A.text(480,150,'P',{size:19,c:VI});
  A.say('Here F₁P = 280 and F₂P = 120, so the sum is 400, which is 2a. Move P anywhere and the sum stays 400.','এখানে F₁P = 280 ও F₂P = 120, যোগফল 400, অর্থাৎ 2a। P যেখানেই যাক, যোগফল 400-ই থাকে।');
  A.text(400,100,'PF₁ + PF₂ = 2a = 400',{size:24,c:GR});
  A.say('The pins-and-string drawing method uses exactly this: a loop of string keeps the sum fixed.','পিন ও সুতার আঁকা পদ্ধতি ঠিক এটি ব্যবহার করে: সুতার ফাঁস যোগফল স্থির রাখে।');
  A.text(400,415,'x²/a² + y²/b² = 1',{size:22,c:SK});
  A.text(400,448,'c² = a² − b²,  e = c/a = 0.8',{size:19,c:VI});
  NOTE(A,60,'when the two foci coincide, the ellipse becomes a circle.');
});

lesson('c1112-129','Hyperbola and its asymptotes','x²/a² − y²/b² = 1',A=>{
  A.say('In a hyperbola the difference of the two focal distances is constant, so you get two separate branches.','অধিবৃত্তে দুই ফোকাল দূরত্বের বিয়োগফল ধ্রুবক, তাই দুইটি আলাদা শাখা পাওয়া যায়।');
  A.line(140,459,660,81,{c:MU,w:1.6},.5); A.line(140,81,660,459,{c:MU,w:1.6},.5);
  const branch=s=>Array.from({length:25},(_,i)=>{const t=-1.2+i*2.4/24;return [400+s*110*Math.cosh(t),270-80*Math.sinh(t)];});
  A.pts(branch(1),{c:SK,w:3.5},.9); A.pts(branch(-1),{c:PK,w:3.5},.9);
  A.circle(264,270,7,{c:AM,w:3,fill:AM,fo:1},.3); A.circle(536,270,7,{c:AM,w:3,fill:AM,fo:1},.3);
  A.line(264,270,558,188,{c:GR,w:2},.5); A.line(536,270,558,188,{c:GR,w:2},.5);
  A.circle(558,188,6,{c:GR,w:3,fill:GR,fo:1},.3);
  A.text(600,80,'asymptotes',{size:18,c:MU});
  A.say('The branches creep close to two straight asymptotes, y = ±(b/a)x, but never touch them.','শাখাগুলো দুটি সরল অণুস্পর্শকের কাছে যায়, y = ±(b/a)x, কিন্তু কখনো ছোঁয় না।');
  A.text(400,100,'x²/a² − y²/b² = 1',{size:24,c:SK});
  A.text(400,422,'|PF₁ − PF₂| = 2a',{size:22,c:GR});
  A.say('The foci sit at (±c, 0) with c² = a² + b², which is the ellipse relation with a plus sign.','ফোকাস (±c, 0)-এ থাকে, c² = a² + b², অর্থাৎ উপবৃত্তের সম্পর্কে যোগচিহ্ন।');
  A.text(400,450,'c² = a² + b²,  e > 1',{size:19,c:VI});
  NOTE(A,60,'the plus sign in c² is what pushes the hyperbola outside the ellipse family.');
});

lesson('c1112-130','Eccentricity unifies the conics','One number e = c/a',A=>{
  A.say('Eccentricity e measures how far a conic is stretched. It runs from 0 to above 1.','উৎকেন্দ্রতা e মাপে কনিকটি কতটা প্রসারিত। এর মান 0 থেকে 1-এর বেশি পর্যন্ত যায়।');
  A.text(400,100,'e = c / a',{size:26,c:AM});
  A.circle(150,230,55,{c:SK,w:3},.8);
  A.ell(320,230,70,42,{c:PK,w:3},.8);
  A.pts(Array.from({length:25},(_,i)=>{const x=-60+i*120/24;return [490+x,290-x*x/32];}),{c:AM,w:3},.6);
  const hb=Array.from({length:21},(_,i)=>{const t=-0.8+i*1.6/20;return [660+30*Math.cosh(t),230-70*Math.sinh(t)];});
  const hb2=Array.from({length:21},(_,i)=>{const t=-0.8+i*1.6/20;return [660-30*Math.cosh(t),230-70*Math.sinh(t)];});
  A.pts(hb,{c:VI,w:3},.6); A.pts(hb2,{c:VI,w:3},.6);
  A.text(150,330,'e = 0',{size:19,c:SK}); A.text(320,330,'0 < e < 1',{size:19,c:PK});
  A.text(490,330,'e = 1',{size:19,c:AM}); A.text(660,330,'e > 1',{size:19,c:VI});
  A.text(150,365,'circle',{size:17,c:MU}); A.text(320,365,'ellipse',{size:17,c:MU}); A.text(490,365,'parabola',{size:17,c:MU}); A.text(660,365,'hyperbola',{size:17,c:MU});
  A.say('At e = 0 the foci merge into the centre and the ellipse is a circle. At e = 1 one focus escapes to infinity.','e = 0-তে ফোকাস দুইটি কেন্দ্রে মিলে যায়, উপবৃত্তটি বৃত্ত হয়। e = 1-এ একটি ফোকাস অসীমে চলে যায়।');
  A.say('Push e past 1 and the curve splits into two branches. The same focus-directrix rule still works.','e কে 1-এর বেশি করলে বক্ররেখা দুই শাখায় ভাগ হয়। একই ফোকাস-নিয়ামক নিয়ম তখনও কাজ করে।');
  A.text(400,430,'all conics: distance to focus = e × distance to directrix',{size:19,c:GR});
  NOTE(A,455,'a circle is an ellipse with e = 0, not a separate definition.');
});

/* ---------- chapter 7: inverse trigonometry ---------- */
lesson('c1112-131','Why sin needs a restricted domain','Many x give the same y',A=>{
  A.say('The sine curve repeats, so it is not one-to-one. Two different angles can give the same sine.','সাইন বক্ররেখা পুনরাবৃত্ত হয়, তাই এটি এক-এক নয়। দুই ভিন্ন কোণ একই সাইন দিতে পারে।');
  const X=x=>400+55*x, Y=y=>250-100*y;
  A.arrow(120,250,710,250,{c:MU,w:2},.4); A.arrow(400,385,400,110,{c:MU,w:2},.4);
  A.pts(PLOT(X,Y,Math.sin,-4.4,4.4),{c:MU,w:2.2},1);

lesson('c1112-132','The inverse is a mirror','sin⁻¹x reflected in y = x',A=>{

lesson('c1112-149','Sample space and the addition rule','Two dice: P(A ∪ B)',A=>{
  A.say('Two dice give 36 equally likely outcomes. Drawing them as a grid makes every event countable.','দুই ছক্কায় 36টি সমসম্ভাব্য ফল। গ্রিডে আঁকলে প্রতিটি ঘটনা গোনা যায়।');
  for(let i=0;i<6;i++){for(let j=0;j<6;j++){
    const x=200+i*52,y=150+j*44, sum=(i+1)+(j+1), first=i+1;
    const A1=sum===6, B1=first===3;
    A.circle(x,y,A1&&B1?8:A1||B1?7:4,{c:A1&&B1?RD:B1?SK:A1?AM:MU,w:2,fill:A1&&B1?RD:B1?SK:A1?AM:'#0b1220',fo:1},.12);
  }}
  for(let i=0;i<6;i++){A.text(200+i*52,120,String(i+1),{size:14,c:MU});A.text(172,154+i*44,String(i+1),{size:14,c:MU});}
  A.say('Event A is a total of 6, with 5 outcomes. Event B is first die 3, with 6 outcomes.','ঘটনা A হলো যোগফল 6, 5টি ফল। ঘটনা B হলো প্রথম ছক্কা 3, 6টি ফল।');
  A.text(600,130,'A: sum = 6',{size:17,c:AM,anchor:'start'});
  A.text(600,160,'B: first die = 3',{size:17,c:SK,anchor:'start'});
  A.text(600,190,'A ∩ B: (3,3)',{size:17,c:RD,anchor:'start'});
  A.say('One outcome is in both, so adding 5 + 6 would count it twice. Subtract the overlap.','একটি ফল দুইটিতেই আছে, তাই 5 + 6 যোগ করলে সেটি দুইবার গোনা হবে। সাধারণ অংশ বিয়োগ করো।');
  A.text(560,235,'P(A∪B) = 5/36 + 6/36',{size:15,c:GR,anchor:'start'});
  A.text(560,262,'− 1/36',{size:15,c:GR,anchor:'start'});
  A.text(560,295,'= 10/36 = 5/18',{size:18,c:GR,anchor:'start'});
  NOTE(A,455,'this overlap correction is the addition rule for any two events.');
});

/* ---------- chapter 11: vectors ---------- */
lesson('c1112-151','Magnitude and unit vector','a = 4i + 3j has length 5',A=>{
  A.say('A vector carries both size and direction. Its length comes from Pythagoras.','ভেক্টর একসঙ্গে আকার ও দিক বহন করে। এর দৈর্ঘ্য আসে পিথাগোরাস থেকে।');
  A.arrow(180,380,420,200,{c:AM,w:5},.7);
  A.dashed(420,380,420,200,{c:MU,w:1.6},.5); A.dashed(180,380,420,380,{c:MU,w:1.6},.5);
  A.pts([[420,380],[402,380],[402,362],[420,362],[420,380]],{c:MU,w:1.6},.4);
  A.text(300,405,'4i',{size:20,c:SK}); A.text(442,300,'3j',{size:20,c:PK,anchor:'start'}); A.text(330,270,'|a| = 5',{size:20,c:AM});
  A.text(400,100,'a = 4i + 3j',{size:26,c:AM});
  A.say('The magnitude is √(4² + 3²) = 5. The direction is given by tan θ = 3/4.','মান √(4² + 3²) = 5। দিক দেওয়া হয় tan θ = 3/4 দিয়ে।');
  A.text(400,142,'|a| = √(4² + 3²) = 5',{size:22,c:GR});
  A.say('Dividing by the length gives a unit vector: same direction, length exactly one.','দৈর্ঘ্য দিয়ে ভাগ করলে একক ভেক্টর পাওয়া যায়: একই দিক, দৈর্ঘ্য ঠিক এক।');
  A.arrow(180,380,252,326,{c:GR,w:4},.5);
  A.text(238,380,'a/|a|',{size:18,c:GR});
  A.text(400,440,'â = (4i + 3j)/5 = 0.8i + 0.6j',{size:20,c:VI});
  NOTE(A,70,'a unit vector has no units and is used only to point.');
});

lesson('c1112-152','Dot product and projection','a · b = |a||b| cos θ',A=>{
  A.say('The dot product multiplies the length of one vector by the projection of the other onto it.','ডট গুণফল এক ভেক্টরের দৈর্ঘ্যকে অন্যটির তার উপর অভিক্ষেপ দিয়ে গুণ করে।');
  A.arrow(200,360,480,360,{c:SK,w:4},.6);
  A.arrow(200,360,340,150,{c:PK,w:4},.6);
  A.dashed(340,150,340,360,{c:GR,w:2},.6);
  A.pts(ARC(200,360,62,0,0.983),{c:MU,w:2},.4);
  A.text(275,335,'θ',{size:18,c:MU});
  A.text(370,345,'projection = 2',{size:17,c:GR,anchor:'start'});
  A.text(400,390,'a = 4i,  b = 2i + 3j',{size:20,c:SK});
  A.say('Here a·b = 4×2 + 0×3 = 8. The projection of b on a has length 8/4 = 2.','এখানে a·b = 4×2 + 0×3 = 8। a-এর উপর b-এর অভিক্ষেপের দৈর্ঘ্য 8/4 = 2।');
  A.text(400,100,'a · b = a₁b₁ + a₂b₂',{size:23,c:AM});
  A.text(400,140,'a · b = |a||b| cos θ',{size:21,c:GR});
  A.say('A zero dot product means the vectors are perpendicular, because cos 90° = 0.','শূন্য ডট গুণফল মানে ভেক্টর দুটি লম্ব, কারণ cos 90° = 0।');
  A.text(400,430,'cos θ = 8 / (4√13) ≈ 0.555,  θ ≈ 56°',{size:18,c:VI});
  NOTE(A,70,'the dot product produces a scalar, not a vector.');
});

lesson('c1112-153','Cross product and area','|a × b| is the parallelogram area',A=>{
  A.say('The cross product of two vectors gives a vector perpendicular to both, and its size measures area.','দুই ভেক্টরের ক্রস গুণফল দুইটিরই লম্ব একটি ভেক্টর দেয়, আর তার আকার ক্ষেত্রফল মাপে।');
  A.arrow(200,360,480,360,{c:SK,w:4},.6);
  A.arrow(200,360,270,150,{c:PK,w:4},.6);
  A.pts([[200,360],[480,360],[550,150],[270,150],[200,360]],{c:MU,w:2,fill:MU,fo:.08},.7);
  A.dashed(270,150,270,360,{c:GR,w:2},.6);
  A.pts([[270,360],[288,360],[288,342],[270,342],[270,360]],{c:MU,w:1.6},.3);
  A.text(360,385,'base = 4',{size:18,c:SK}); A.text(248,265,'h = 3',{size:18,c:GR,anchor:'end'});
  A.text(430,240,'area = 12',{size:21,c:AM});
  A.say('The parallelogram has base 4 and height 3, so its area is 12. That equals |a×b|.','সামান্তরিকের ভূমি 4 ও উচ্চতা 3, তাই ক্ষেত্রফল 12। এটি |a×b|-এর সমান।');
  A.text(400,100,'|a × b| = |a||b| sin θ',{size:23,c:AM});
  A.say('Unlike the dot product, the cross product is a vector. Its direction is set by the right-hand rule.','ডট গুণফলের বিপরীতে ক্রস গুণফল ভেক্টর। এর দিক ডান-হাত নিয়মে ঠিক হয়।');
  A.text(400,430,'a × b = 0 when the vectors are parallel',{size:18,c:VI});
  NOTE(A,70,'in three dimensions a × b = (a₂b₃ − a₃b₂, a₃b₁ − a₁b₃, a₁b₂ − a₂b₁).');
});

lesson('c1112-154','Section formula with position vectors','P divides AB in the ratio 2 : 1',A=>{
  A.say('If P divides the segment AB in the ratio m : n, its position vector is a weighted average of a and b.','P যদি AB-কে m : n অনুপাতে ভাগ করে, তার অবস্থান ভেক্টর a ও b-এর ভারযুক্ত গড়।');
  A.arrow(110,430,180,380,{c:SK,w:3},.5); A.arrow(110,430,600,160,{c:PK,w:3},.5); A.arrow(110,430,460,233,{c:AM,w:3},.5);
  A.line(180,380,600,160,{c:MU,w:3},.7);
  A.circle(180,380,7,{c:SK,w:3,fill:SK,fo:1},.3); A.circle(600,160,7,{c:PK,w:3,fill:PK,fo:1},.3); A.circle(460,233,8,{c:AM,w:3,fill:AM,fo:1},.3);
  A.text(160,365,'A',{size:18,c:SK}); A.text(615,150,'B',{size:18,c:PK}); A.text(470,258,'P',{size:19,c:AM});
  A.text(300,260,'2',{size:18,c:AM}); A.text(540,210,'1',{size:18,c:AM});
  A.text(100,455,'O',{size:17,c:MU});
  A.say('AP : PB = 2 : 1, so P is twice as close to B as to A. The formula puts the larger weight on the opposite endpoint.','AP : PB = 2 : 1, তাই P, A-এর চেয়ে B-এর দ্বিগুণ কাছে। সূত্রে বড় ওজন বিপরীত প্রান্তে বসে।');
  A.text(400,100,'r = (m b + n a) / (m + n)',{size:26,c:AM});
  A.say('With a and b as position vectors, P = (2b + a)/3. The midpoint is the special case m = n.','a ও b অবস্থান ভেক্টর হলে P = (2b + a)/3। মধ্যবিন্দু হলো m = n বিশেষ ক্ষেত্র।');
  A.text(400,150,'m : n = 2 : 1',{size:21,c:GR});
  A.text(400,430,'midpoint: (a + b)/2',{size:20,c:VI});
  NOTE(A,70,'for external division the denominator becomes m − n.');
});

lesson('c1112-155','Vector equation of a line','r = a + t b',A=>{
  A.say('A line is fixed by one point on it and one direction. Every other point is that point plus some multiple of the direction.','একটি রেখা নির্ধারিত হয় তার একটি বিন্দু ও একটি দিক দিয়ে। অন্য প্রতিটি বিন্দু ওই বিন্দু যোগ দিকের কোনো গুণিতক।');
  A.line(140,390,560,180,{c:MU,w:2.5},.7);
  A.arrow(120,420,280,320,{c:SK,w:3.5},.6);
  A.arrow(280,320,420,250,{c:AM,w:3.5},.6);
  [0,1,2].forEach(t=>{const x=280+t*140,y=320-t*70;
    A.circle(x,y,6,{c:t===0?SK:t===1?AM:GR,w:3,fill:t===0?SK:t===1?AM:GR,fo:1},.25);
    A.text(x+12,y+22,'t = '+t,{size:15,c:MU,anchor:'start'});
  });
  A.text(400,100,'r = a + t b',{size:30,c:AM});
  A.say('Here a = (2, 3) and b = (2, −1). Changing t slides the point along the same line.','এখানে a = (2, 3) ও b = (2, −1)। t বদলালে বিন্দু একই রেখা ধরে সরে।');
  A.text(610,150,'x = 2 + 2t',{size:19,c:SK,anchor:'start'});
  A.text(610,185,'y = 3 − t',{size:19,c:PK,anchor:'start'});
  A.say('This pair of equations is the parametric form. Eliminating t gives the usual x-y equation.','এই দুই সমীকরণই পরামিতিক রূপ। t বাদ দিলে সাধারণ x-y সমীকরণ পাওয়া যায়।');
  A.text(610,240,'b is the direction,',{size:17,c:GR,anchor:'start'});
  A.text(610,266,'a is one known point',{size:17,c:GR,anchor:'start'});
  NOTE(A,450,'t can be any real number; each t gives exactly one point.');
});

/* ---------- chapter 12: straight lines ---------- */
lesson('c1112-156','Slope and intercept family','y = mx + c with the same c',A=>{
  A.say('In y = mx + c, the number c fixes where the line crosses the y-axis, and m fixes how steep it is.','y = mx + c-এ c ঠিক করে রেখাটি y-অক্ষ কোথায় কাটে, আর m ঠিক করে ঢাল কত খাড়া।');
  const X=x=>380+60*x, Y=y=>360-30*y;
  A.arrow(120,360,710,360,{c:MU,w:2},.4); A.arrow(380,420,380,110,{c:MU,w:2},.4);
  [[2,SK],[1,PK],[0.5,GR]].forEach(([m,c])=>{
    A.line(X(-2),Y(m*-2+1),X(2),Y(m*2+1),{c,w:3},.6);
    A.text(X(2)+10,Y(m*2+1),'m = '+m,{size:16,c,anchor:'start'});
  });
  A.circle(X(0),Y(1),7,{c:AM,w:3,fill:AM,fo:1},.3);
  A.text(320,325,'c = 1',{size:18,c:AM});
  A.say('All three lines pass through the same intercept (0, 1). Only their steepness differs.','তিনটি রেখাই একই ছেদবিন্দু (0, 1) দিয়ে যায়। শুধু তাদের ঢাল আলাদা।');
  A.say('A larger positive m makes the line climb faster. A negative m makes it fall from left to right.','বড় ধনাত্মক m রেখাকে দ্রুত উঠায়। ঋণাত্মক m বাঁ থেকে ডানে নামায়।');
  A.text(400,100,'y = mx + c',{size:30,c:AM});
  A.text(400,430,'m = slope,   c = y-intercept',{size:20,c:VI});
  NOTE(A,462,'vertical lines cannot be written in this form; their slope is undefined.');
});

lesson('c1112-157','Two-point form of a line','Through (2, 1) and (6, 4)',A=>{
  A.say('Two points decide a line, because they decide its slope.','দুটি বিন্দু একটি রেখা নির্ধারণ করে, কারণ তারা ঢাল নির্ধারণ করে।');
  const X=x=>160+70*x, Y=y=>400-55*y;
  A.arrow(130,400,700,400,{c:MU,w:2},.4); A.arrow(160,430,160,100,{c:MU,w:2},.4);
  A.line(X(1),Y(0.25),X(7),Y(4.75),{c:SK,w:3},.7);
  A.circle(X(2),Y(1),7,{c:AM,w:3,fill:AM,fo:1},.3); A.circle(X(6),Y(4),7,{c:PK,w:3,fill:PK,fo:1},.3);
  A.text(X(2)-6,Y(1)+24,'(2, 1)',{size:17,c:AM}); A.text(X(6)+6,Y(4)-12,'(6, 4)',{size:17,c:PK});
  A.dashed(X(2),Y(1),X(6),Y(1),{c:GR,w:2},.5); A.dashed(X(6),Y(1),X(6),Y(4),{c:PK,w:2},.5);
  A.text((X(2)+X(6))/2,Y(1)+26,'run = 4',{size:17,c:GR}); A.text(X(6)+12,(Y(1)+Y(4))/2,'rise = 3',{size:17,c:PK,anchor:'start'});
  A.say('The run is 4 and the rise is 3, so the slope is 3/4.','আনুভূমিক 4 ও উল্লম্ব 3, তাই ঢাল 3/4।');
  A.text(400,100,'m = (y₂ − y₁) / (x₂ − x₁) = 3/4',{size:20,c:AM});
  A.say('Now use one point and the slope: y − 1 = (3/4)(x − 2). That is the point-slope form.','এবার একটি বিন্দু ও ঢাল ব্যবহার করো: y − 1 = (3/4)(x − 2)। এটিই বিন্দু-ঢাল রূপ।');
  A.text(400,435,'y − y₁ = m(x − x₁)',{size:22,c:GR});
  NOTE(A,462,'expanding and tidying gives 3x − 4y = 2.');
});

lesson('c1112-158','Parallel and perpendicular lines','m₁ = m₂ and m₁m₂ = −1',A=>{
  A.say('Parallel lines climb at the same rate, so they have equal slopes.','সমান্তরাল রেখা একই হারে ওঠে, তাই তাদের ঢাল সমান।');
  const X=x=>380+50*x, Y=y=>300-40*y;
  A.arrow(120,300,710,300,{c:MU,w:2},.4); A.arrow(380,420,380,100,{c:MU,w:2},.4);
  A.line(X(-1.5),Y(-3),X(1.5),Y(3),{c:SK,w:3},.6);
  A.line(X(-1.5),Y(-1),X(1.5),Y(5),{c:PK,w:3},.6);
  A.line(X(-2),Y(1),X(2),Y(-1),{c:GR,w:3},.6);
  A.text(X(1.2),Y(2.4),'y = 2x',{size:17,c:SK,anchor:'start'});
  A.text(X(-1.4),Y(-0.6),'y = 2x + 2',{size:17,c:PK,anchor:'start'});
  A.text(X(1.5),Y(-1.6),'y = −x/2',{size:17,c:GR,anchor:'start'});
  A.say('The two blue and pink lines are parallel: both have slope 2.','নীল ও গোলাপি রেখা দুটি সমান্তরাল: দুইটিরই ঢাল 2।');
  A.say('The green line has slope −1/2. Multiply the slopes: 2 × (−1/2) = −1, so it is perpendicular to both.','সবুজ রেখার ঢাল −1/2। ঢাল গুণ করো: 2 × (−1/2) = −1, তাই এটি দুইটিরই লম্ব।');
  A.text(400,100,'parallel:  m₁ = m₂',{size:22,c:SK});
  A.text(400,138,'perpendicular:  m₁m₂ = −1',{size:22,c:GR});
  A.text(400,445,'a 90° turn makes a negative reciprocal',{size:18,c:VI});
  NOTE(A,70,'horizontal slope 0 is perpendicular to vertical, whose slope is undefined.');
});

lesson('c1112-159','Distance from a point to a line','The perpendicular drop',A=>{
  A.say('The shortest distance from a point to a line is measured along the perpendicular.','বিন্দু থেকে রেখার ন্যূনতম দূরত্ব লম্ব বরাবর মাপা হয়।');
  const X=x=>180+65*x, Y=y=>400-55*y;
  A.arrow(140,400,710,400,{c:MU,w:2},.4); A.arrow(180,430,180,100,{c:MU,w:2},.4);
  A.line(X(0),Y(3),X(4.6),Y(-0.45),{c:SK,w:3},.6);
  A.circle(X(6),Y(4),7,{c:AM,w:3,fill:AM,fo:1},.3);
  A.dashed(X(6),Y(4),X(3.36),Y(0.48),{c:GR,w:2.5},.6);
  A.pts([[X(3.36),Y(0.48)],[X(3.36)-14,Y(0.48)],[X(3.36)-14,Y(0.48)-12],[X(3.36),Y(0.48)-12],[X(3.36),Y(0.48)]],{c:MU,w:1.5},.3);
  A.text(X(6)+10,Y(4)+6,'P(6, 4)',{size:17,c:AM,anchor:'start'});
  A.text(X(4.3),Y(1.2),'3x + 4y = 12',{size:17,c:SK,anchor:'start'});
  A.text((X(6)+X(3.36))/2+16,(Y(4)+Y(0.48))/2,'d',{size:19,c:GR});
  A.say('Drop a perpendicular from P to the line. Its length is the distance we want.','P থেকে রেখার উপর লম্ব নামাও। এর দৈর্ঘ্যই কাঙ্ক্ষিত দূরত্ব।');
  A.text(400,100,'d = |ax₀ + by₀ + c| / √(a² + b²)',{size:21,c:AM});
  A.say('Here d = |3(6) + 4(4) − 12| / √(9 + 16) = 22/5 = 4.4.','এখানে d = |3(6) + 4(4) − 12| / √(9 + 16) = 22/5 = 4.4।');
  A.text(400,435,'d = 22 / 5 = 4.4',{size:24,c:GR});
  NOTE(A,462,'the modulus keeps the answer positive whichever side the point lies on.');
});

lesson('c1112-160','Angle between two lines','tan θ = |(m₂ − m₁)/(1 + m₁m₂)|',A=>{
  A.say('Two lines meeting at a point form two angles. The tangent formula gives the acute one.','এক বিন্দুতে মিলিত দুই রেখা দুই কোণ বানায়। স্পর্শক সূত্রটি সূক্ষ্মকোণ দেয়।');
  const X=x=>400+70*x, Y=y=>320-55*y;
  A.arrow(120,320,710,320,{c:MU,w:2},.4); A.arrow(400,430,400,100,{c:MU,w:2},.4);
  A.line(X(-4),Y(-2),X(4),Y(2),{c:SK,w:3.5},.7);
  A.line(X(-1),Y(-2),X(1.5),Y(3),{c:PK,w:3.5},.7);
  A.pts(ARC(400,320,75,0,0.6435),{c:AM,w:2.5},.5);
  A.text(470,300,'θ',{size:20,c:AM});
  A.text(X(2.8),Y(1.4)-10,'m₁ = 1/2',{size:17,c:SK,anchor:'start'});
  A.text(X(1.1),Y(2.2),'m₂ = 2',{size:17,c:PK,anchor:'start'});
  A.say('The slopes are 1/2 and 2. Put them into the formula to get tan θ = 0.75.','ঢাল 1/2 ও 2। সূত্রে বসালে tan θ = 0.75।');
  A.text(400,100,'tan θ = |(m₂ − m₁)/(1 + m₁m₂)|',{size:21,c:AM});
  A.text(400,145,'= |(2 − 0.5)/(1 + 1)| = 0.75',{size:20,c:GR});
  A.say('So θ ≈ 36.9°. If the product m₁m₂ = −1, the formula breaks down because the lines are perpendicular.','তাই θ ≈ 36.9°। m₁m₂ = −1 হলে সূত্র ভাঙে, কারণ রেখা দুটি লম্ব।');
  A.text(400,440,'θ ≈ 36.9°',{size:24,c:GR});
  NOTE(A,70,'take the absolute value so the answer is the acute angle.');
});

/* ---------- chapter 13: the circle ---------- */
lesson('c1112-161','Circle equation by completing the square','x² + y² − 6x + 4y − 12 = 0',A=>{
  A.say('A circle in general form hides its centre and radius. Completing the square brings them out.','সাধারণ রূপে বৃত্তের কেন্দ্র ও ব্যাসার্ধ লুকানো থাকে। পূর্ণ বর্গ করলে তারা বেরিয়ে আসে।');
  const X=x=>150+30*x, Y=y=>250-30*y;
  A.arrow(90,250,700,250,{c:MU,w:2},.4); A.arrow(150,440,150,90,{c:MU,w:2},.4);
  A.circle(240,310,150,{c:SK,w:3.5},1);
  A.circle(240,310,6,{c:AM,w:3,fill:AM,fo:1},.3);
  A.line(240,310,390,310,{c:GR,w:2.5},.5);

  A.text(450,110,'x² + y² − 6x + 4y − 12 = 0',{size:18,anchor:'start'});

  A.text(450,200,'(x − 3)² − 9 + (y + 2)² − 4 = 12',{size:17,c:SK,anchor:'start'});
  A.text(450,245,'(x − 3)² + (y + 2)² = 25',{size:18,c:GR,anchor:'start'});
  A.say('Half of −6 is −3, and half of 4 is 2. The right side becomes 12 + 9 + 4 = 25.','−6-এর অর্ধেক −3, 4-এর অর্ধেক 2। ডান পাশ হয় 12 + 9 + 4 = 25।');
  A.text(450,315,'centre = (3, −2)',{size:19,c:AM,anchor:'start'});

lesson('c1112-163','Line and circle: three cases','Secant, tangent, or no meeting',A=>{

  A.circle(150,240,60,{c:SK,w:3},.7); A.circle(400,240,60,{c:PK,w:3},.7); A.circle(650,240,60,{c:GR,w:3},.7);
  A.line(65,340,235,340,{c:MU,w:3},.5);
  A.line(315,300,485,300,{c:MU,w:3},.5);
  A.line(565,250,735,250,{c:MU,w:3},.5);
  A.circle(150,240,5,{c:AM,w:2,fill:AM,fo:1},.2); A.circle(400,240,5,{c:AM,w:2,fill:AM,fo:1},.2); A.circle(650,240,5,{c:AM,w:2,fill:AM,fo:1},.2);

  A.text(150,425,'no meeting',{size:16,c:MU}); A.text(400,425,'one point',{size:16,c:PK}); A.text(650,425,'two points',{size:16,c:GR});
  A.say('Far away the line misses. At distance r it just touches. Closer than r it cuts the circle twice.','অনেক দূরে রেখা বৃত্ত পায় না। দূরত্ব r হলে ঠিক ছোঁয়। r-এর কম হলে দুইবার কাটে।');
  A.text(400,100,'compare d with r',{size:22,c:AM});
  A.say('The same test appears in algebra: substitute the line into the circle and look at the discriminant.','একই পরীক্ষা বীজগণিতেও আসে: রেখাকে বৃত্তে বসিয়ে নিশ্চায়ক দেখো।');

lesson('c1112-167','Permutation slots','5P3 = 5 × 4 × 3',A=>{
  A.say('A permutation counts arrangements where order matters. Fill the seats one by one.','বিন্যাসে ক্রম গুরুত্বপূর্ণ। আসনগুলো এক এক করে ভরো।');
  [250,400,550].forEach((x,i)=>{A.rect(x-45,230,90,70,{c:SK,w:3,fill:SK,fo:.12},.4);A.text(x,270,'seat '+(i+1),{size:17});});

  A.text(400,100,'first 5 choices, then 4, then 3',{size:20,c:GR});
  A.say('After the first person sits, only 4 remain, then 3. The product is 60.','প্রথম ব্যক্তি বসলে 4 জন থাকে, তারপর 3 জন। গুণফল 60।');
  A.text(400,340,'5 × 4 × 3 = 60',{size:28,c:GR});
  A.say('The formula writes the same product with factorials: 5P3 = 5!/2! = 60.','সূত্র একই গুণফল ফ্যাক্টোরিয়ালে লেখে: 5P3 = 5!/2! = 60।');
  A.text(400,395,'nPr = n! / (n − r)!',{size:24,c:AM});
  A.text(400,440,'order matters: ABC and BAC differ',{size:17,c:VI});

});

lesson('c1112-168','Combination versus permutation','ABC is one group but six orders',A=>{

  A.arrow(420,220,520,220,{c:AM,w:3},.5);
  A.text(470,200,'÷ 3!',{size:19,c:AM});
  A.say('So one combination corresponds to 3! permutations. Divide the permutation count by 3! = 6.','তাই একটি সংচয় 3! বিন্যাসের সমান। বিন্যাস সংখ্যাকে 3! = 6 দিয়ে ভাগ করো।');
  A.text(400,100,'nCr = nPr / r!',{size:26,c:AM});
  A.text(400,320,'6 permutations  →  1 combination',{size:19,c:GR});
  A.text(400,365,'3C3 = 6/6 = 1',{size:21,c:PK});
  A.text(400,420,'C(n, r) = n! / (r!(n − r)!)',{size:19,c:VI});
  NOTE(A,458,'if order matters use nPr; if only the group matters use nCr.');
});

  A.say('Beyond 90° the coordinates become negative, and the same definitions still work.','90°-এর পরে স্থানাঙ্ক ঋণাত্মক হয়, তবু একই সংজ্ঞা কাজ করে।');
  A.text(400,440,'cos θ = x,  sin θ = y,  tan θ = y/x',{size:18,c:VI});
  NOTE(A,460,'the unit circle is the reference picture for all trigonometric signs.');
});

  A.text(600,330,'s = rθ',{size:24,c:AM,anchor:'start'});
  A.text(600,370,'A = ½r²θ',{size:22,c:PK,anchor:'start'});

  A.arrow(100,270,700,270,{c:MU,w:2},.4); A.arrow(380,440,380,100,{c:MU,w:2},.4);

  A.text(510,170,'ALL +',{size:22,c:GR});
  A.text(250,170,'SIN +',{size:22,c:SK});
  A.text(250,370,'TAN +',{size:22,c:AM});
  A.text(510,370,'COS +',{size:22,c:PK});

  A.text(400,415,'tan²θ + 1 = sec²θ',{size:21,c:SK});

lesson('c1112-176','Geometric proof of sin(A+B)','Projections add up',A=>{
  A.say('Put two angles A and B at the centre of a unit circle. The point at A+B is the one we study.','একক বৃত্তের কেন্দ্রে দুই কোণ A ও B বসাও। A+B কোণের বিন্দুটিই আলোচ্য।');

  A.say('Drop a perpendicular from the far point onto the first radius. That splits the height into two pieces.','দূরের বিন্দু থেকে প্রথম ব্যাসার্ধের উপর লম্ব নামাও। এটি উচ্চতাকে দুই টুকরোয় ভাগ করে।');

lesson('c1112-177','cos(A − B) from a chord','Two radii and the distance formula',A=>{
  A.say('Take two radii at angles A and B on the unit circle. The chord between their tips has a length we can compute twice.','একক বৃত্তে A ও B কোণে দুই ব্যাসার্ধ নাও। দুই প্রান্তের জ্যা-র দৈর্ঘ্য দুইভাবে হিসাব করা যায়।');
  A.circle(350,300,150,{c:MU,w:2},.8);
  const PA=[350+150*Math.cos(1.396),300-150*Math.sin(1.396)];
  const PB=[350+150*Math.cos(0.436),300-150*Math.sin(0.436)];
  A.arrow(350,300,PA[0],PA[1],{c:SK,w:2.5},.5); A.arrow(350,300,PB[0],PB[1],{c:PK,w:2.5},.5);
  A.line(PA[0],PA[1],PB[0],PB[1],{c:AM,w:3},.5);
  A.pts(ARC(350,300,60,0.436,1.396),{c:GR,w:2},.4);
  A.text(382,255,'A − B',{size:16,c:GR});
  A.text(PA[0]-10,PA[1]-10,'A',{size:16,c:SK,anchor:'end'}); A.text(PB[0]+10,PB[1]-8,'B',{size:16,c:PK,anchor:'start'});
  A.say('By the distance formula the chord squared is 2 − 2cos(A − B). By the law of cosines it is the same expression.','দূরত্ব সূত্রে জ্যা² = 2 − 2cos(A − B)। কোসাইন সূত্রেও একই রাশি আসে।');
  A.text(400,100,'cos(A − B) = cosA cosB + sinA sinB',{size:20,c:GR});
  A.say('Equating the two versions and tidying gives the subtraction formula for cosine.','দুই রূপ সমান করে সাজালে কোসাইনের বিয়োগ সূত্র পাওয়া যায়।');
  A.text(400,140,'cos(A + B) = cosA cosB − sinA sinB',{size:19,c:SK});
  A.text(400,430,'check: A = B gives cos0 = 1',{size:18,c:VI});
  NOTE(A,462,'the cosine formula has the opposite sign to the sine formula.');
});

lesson('c1112-178','Double angle formulas','Two waves that are identical',A=>{
  A.say('Put B = A in the addition formulas and the double angle results follow immediately.','সংযোগ সূত্রে B = A বসালেই দ্বিগুণ কোণের ফল পাওয়া যায়।');

  A.text(260,160,'peak at 2A = 90°',{size:16,c:GR});
  A.say('Cosine has three useful forms, and tangent follows from dividing sine by cosine.','কোসাইনের তিনটি কাজের রূপ আছে, আর সাইনকে কোসাইন দিয়ে ভাগ করলে ট্যানজেন্ট আসে।');
  A.text(400,410,'cos 2A = cos²A − sin²A = 1 − 2sin²A',{size:18,c:SK});
  A.text(400,445,'tan 2A = 2tanA / (1 − tan²A)',{size:18,c:VI});
  NOTE(A,458,'the double angle formulas are the fastest route to half angle formulas.');

lesson('c1112-179','tan(A+B) from sine and cosine','Divide and simplify',A=>{
  A.say('Tangent is sine over cosine, so the addition formula for tan comes from dividing two known formulas.','ট্যানজেন্ট হলো সাইন ভাগ কোসাইন, তাই জানা দুই সূত্র ভাগ করলে tan-এর যোগ সূত্র আসে।');
  A.text(400,100,'tan(A+B) = sin(A+B) / cos(A+B)',{size:21,c:AM});
  A.text(400,150,'= (sinA cosB + cosA sinB)',{size:19,c:SK});
  A.text(400,180,'/ (cosA cosB − sinA sinB)',{size:19,c:PK});
  A.line(230,196,570,196,{c:MU,w:2},.4);
  A.text(400,225,'divide every term by cosA cosB',{size:18,c:MU});
  A.say('Every term then turns into a tangent, because sin over cos is tan.','তখন প্রতিটি পদ ট্যানজেন্টে বদলে যায়, কারণ sin ভাগ cos হলো tan।');
  A.text(400,275,'tan(A+B) = (tanA + tanB) / (1 − tanA tanB)',{size:21,c:GR});
  A.say('For A = 45° and B = 30° the result is (1 + 1/√3)/(1 − 1/√3), which simplifies to 2 + √3.','A = 45° ও B = 30° হলে ফল (1 + 1/√3)/(1 − 1/√3), যা সরল হয়ে 2 + √3।');
  A.text(400,350,'A = 45°, B = 30°:',{size:19,c:SK});
  A.text(400,390,'tan 75° = 2 + √3 ≈ 3.732',{size:23,c:GR});
  A.text(400,435,'tan(A−B) has a plus sign in the denominator',{size:17,c:VI});
  NOTE(A,468,'if 1 − tanA tanB = 0, then A + B = 90° and tan is undefined.');
});

lesson('c1112-180','Harmonic form: a sinθ + b cosθ','3 sinθ + 4 cosθ = 5 sin(θ + 53°)',A=>{
  A.say('A sine and a cosine of the same angle always combine into one shifted wave.','একই কোণের সাইন ও কোসাইন সবসময় একটি সরা তরঙ্গে মিলে যায়।');
  const X=t=>130+t/360*520, Y=y=>260-28*y;
  A.arrow(100,260,700,260,{c:MU,w:2},.4); A.arrow(130,410,130,100,{c:MU,w:2},.4);
  A.pts(PLOT(X,Y,t=>3*Math.sin(t*Math.PI/180),0,360,60),{c:SK,w:1.8},.8);
  A.pts(PLOT(X,Y,t=>4*Math.cos(t*Math.PI/180),0,360,60),{c:PK,w:1.8},.8);
  A.pts(PLOT(X,Y,t=>5*Math.sin((t+53.13)*Math.PI/180),0,360,60),{c:AM,w:4},1);
  A.say('The blue wave has height 3 and the pink one height 4. Their sum is the thick amber wave.','নীল তরঙ্গের উচ্চতা 3, গোলাপি তরঙ্গের 4। তাদের যোগফল মোটা হলুদ তরঙ্গ।');
  A.text(400,100,'3 sinθ + 4 cosθ = 5 sin(θ + 53°)',{size:21,c:AM});
  A.text(400,140,'R = √(3² + 4²) = 5',{size:20,c:GR});
  A.say('The amplitude is R = √(a² + b²), and the phase shift is α with tan α = b/a.','বিস্তার R = √(a² + b²), দশা সরণ α যেখানে tan α = b/a।');
  A.text(400,410,'a sinθ + b cosθ = R sin(θ + α)',{size:20,c:GR});
  A.text(400,448,'largest value R, smallest −R',{size:19,c:VI});
  NOTE(A,462,'this is how two sound waves of the same frequency add to one wave.');
});

const feeds=[],cmKey=[];
function renderCm(i,t){
  const feed=feeds[i]; if(!feed) return;
  const caps=VISUALS[i].caps, idx=capIdx(caps,t), lang=S.lang;
  const cur=idx>=0?caps[idx]:null, n=cur?Math.floor((t-cur[0])*45):0;
  const key=idx+':'+(cur?Math.min(n,300):0)+':'+lang;
  if(cmKey[i]===key) return; cmKey[i]=key;
  if(idx<0){feed.innerHTML='<div class="cm-hint">Press play — Bolt will explain here.<br><span class="bnf">প্লে চাপো — বোল্ট এখানে বুঝিয়ে দেবে।</span></div>';return;}
  let h='';
  for(let k=Math.max(0,idx-2);k<=idx;k++){
    const c=caps[k], last=k===idx;
    let en=c[1], bn=c[2], enC='', bnC='';
    if(last){
      if(lang==='both'){
        if(n<en.length){en=en.slice(0,n);enC='<i>▍</i>';bn='';}
        else if(n-en.length<bn.length){bn=bn.slice(0,n-en.length);bnC='<i>▍</i>';}
      }else if(lang==='en'){ if(n<en.length){en=en.slice(0,n);enC='<i>▍</i>';} }
      else { if(n<bn.length){bn=bn.slice(0,n);bnC='<i>▍</i>';} }
    }
    let body='';
    if(lang!=='bn' && en) body+='<span class="en">'+esc(en)+enC+'</span>';
    if(lang!=='en' && (bn||bnC)) body+='<span class="bn">'+esc(bn)+bnC+'</span>';
    h+='<div class="cm'+(last?'':' old')+'"><div class="cm-av">🤖</div><div class="cm-bb">'+body+'</div></div>';
  }
  feed.innerHTML=h;
}

function speakCap(c){
  if(!('speechSynthesis' in window)) return;
  const ss=window.speechSynthesis; ss.cancel();
  const parts=S.lang==='en'?[['en',c[1]]]:S.lang==='bn'?[['bn',c[2]]]:[['en',c[1]],['bn',c[2]]];
  const vs=ss.getVoices();
  parts.forEach(([lg,tx])=>{
    const u=new SpeechSynthesisUtterance(tx);
    u.lang=lg==='bn'?'bn-BD':'en-US';
    const v=vs.find(x=>x.lang.toLowerCase().replace('_','-').startsWith(lg));
    if(v) u.voice=v;
    u.rate=.95; u.pitch=1.1;
    ss.speak(u);
  });
}
function stopVoice(){ if('speechSynthesis' in window) window.speechSynthesis.cancel(); S.sp=null; }
function checkSpeak(){
  if(!S.voice||!S.playing) return;
  const caps=VISUALS[S.vi].caps, i=capIdx(caps,S.t), key=S.vi+':'+S.mi+':'+i;
  if(i<0||key===S.sp) return;
  S.sp=key; speakCap(caps[i]);
}
function voiceNote(){
  const el=$('#vcVoiceNote');
  if(!('speechSynthesis' in window)){el.textContent='Voice is not supported in this browser.';return;}
  const hasBn=speechSynthesis.getVoices().some(v=>/^bn/i.test(v.lang));
  el.textContent=hasBn?'':'No Bangla voice found on this device. Install one in your system settings to hear Bangla.';
}

/* =====================================================================
   CAROUSEL ENGINE
   ===================================================================== */
const track=$('#vcTrack'),view=$('#vcView'),svgs=[],slides=[];
const cur=()=>VISUALS[S.vi].modes[S.mi];
const previewT=v=>v.modes[0].duration*.92;

function rebuild(){
  track.innerHTML='';svgs.length=0;slides.length=0;feeds.length=0;cmKey.length=0;
  VISUALS.forEach((v,i)=>{
    const sl=document.createElement('div');sl.className='vc-slide';
    sl.innerHTML='<div class="vc-head"><span class="vc-count">'+(i+1)+' / '+VISUALS.length+'</span><b>'+esc(v.title)+'</b></div>'
      +'<div class="vc-body"><div class="vc-stage"><svg viewBox="0 0 800 480" role="img" aria-label="'+esc(v.title)+'"></svg></div>'
      +'<div class="vc-cm"><div class="cm-in"><div class="cm-top"><span>🤖</span> Bolt says · <span class="bnf">বোল্ট বলছে</span></div><div class="cm-feed" aria-live="polite"></div></div></div></div>';
    sl.onclick=()=>{if(i!==S.vi) go(i);};
    track.appendChild(sl);slides.push(sl);svgs.push(sl.querySelector('svg'));feeds.push(sl.querySelector('.cm-feed'));
  });
  buildDots();buildModes();buildLang();layout();renderAll();ui();
}
function layout(){
  const w=view.clientWidth||800, sw=w<700?w*.9:Math.min(w*.84,1120), gap=22;
  slides.forEach((sl,i)=>{sl.style.flexBasis=sw+'px';sl.classList.toggle('on',i===S.vi);sl.classList.toggle('stack',sw<860);});
  track.style.transform='translateX('+((w-sw)/2-S.vi*(sw+gap))+'px)';
}
function renderAll(){
  VISUALS.forEach((v,i)=>{
    const act=i===S.vi, m=act?cur():v.modes[0], t=act?Math.min(S.t,m.duration):previewT(v);
    svgs[i].innerHTML=m.frame(t);cmKey[i]=null;renderCm(i,t);
  });
  progress();
}
function render(){
  const m=cur(), t=Math.min(S.t,m.duration);
  svgs[S.vi].innerHTML=m.frame(t);
  renderCm(S.vi,t);
  progress();
}
function progress(){
  const m=cur();
  $('#vcFill').style.width=(clamp(S.t/m.duration)*100)+'%';
  $('#vcInfo').textContent='Lesson '+(S.vi+1)+' of '+VISUALS.length+'  ·  '+Math.floor(S.t)+'s / '+Math.round(m.duration)+'s';
}
function ui(){
  $('#bPlay').textContent=S.playing?'⏸ Pause':'▶ Play';
  const bv=$('#bVoice');bv.textContent=S.voice?'🔊 Voice on':'🔇 Voice off';bv.classList.toggle('on',S.voice);
}
function buildModes(){
  const v=VISUALS[S.vi],box=$('#vcModes');box.innerHTML='';
  v.modes.forEach((m,i)=>{
    const b=document.createElement('button');b.textContent=m.label;b.className=i===S.mi?'on':'';
    b.onclick=()=>{S.mi=i;S.t=0;clearTimeout(S.adv);stopVoice();buildModes();renderAll();if(!S.playing) play();};
    box.appendChild(b);
  });
}
function buildLang(){
  const box=$('#vcLang');box.innerHTML='';
  [['en','English'],['bn','বাংলা'],['both','English + বাংলা']].forEach(([id,label])=>{
    const b=document.createElement('button');b.textContent=label;b.className=id===S.lang?'on':'';
    b.onclick=()=>{S.lang=id;S.sp=null;if('speechSynthesis' in window) speechSynthesis.cancel();buildLang();renderAll();};
    box.appendChild(b);
  });
}
function buildDots(){
  const d=$('#vcDots');d.innerHTML='';
  VISUALS.forEach((v,i)=>{
    const b=document.createElement('button');b.title=v.title;b.setAttribute('aria-label',v.title);
    b.className=i===S.vi?'on':'';b.onclick=()=>go(i);d.appendChild(b);
  });
}
function tick(ts){
  if(!S.playing) return;
  S.t+=(ts-S.last)/1000;S.last=ts;
  if(S.t>=cur().duration){S.t=cur().duration;S.playing=false;render();ui();onEnd();return;}
  checkSpeak();render();requestAnimationFrame(tick);
}
function play(){
  if(S.playing) return;
  clearTimeout(S.adv);S.manual=false;
  if(S.t>=cur().duration){S.t=0;S.sp=null;}
  S.playing=true;S.last=performance.now();ui();requestAnimationFrame(tick);
}
function pause(manual=true){S.playing=false;if(manual) S.manual=true;clearTimeout(S.adv);stopVoice();ui();}
function onEnd(){clearTimeout(S.adv);S.adv=setTimeout(()=>{if(!S.manual) go(S.vi+1);},2200);}
function go(i,auto=true){
  if(S.busy||!VISUALS.length) return;
  S.busy=true;clearTimeout(S.adv);S.playing=false;stopVoice();
  S.vi=(i+VISUALS.length)%VISUALS.length;S.t=0;
  buildDots();buildModes();layout();renderAll();ui();
  setTimeout(()=>{S.busy=false;if(auto) play();},560);
}

$('#bPlay').onclick=()=>S.playing?pause(true):play();
$('#bRep').onclick=()=>{clearTimeout(S.adv);stopVoice();S.t=0;if(S.playing) render();else play();};
$('#bVoice').onclick=()=>{S.voice=!S.voice;S.sp=null;if(!S.voice) stopVoice();ui();voiceNote();};
$('#bNext').onclick=$('#aNext').onclick=()=>go(S.vi+1);
$('#bPrev').onclick=$('#aPrev').onclick=()=>go(S.vi-1);
$('#vcCar').onkeydown=e=>{if(e.key==='ArrowRight') go(S.vi+1);if(e.key==='ArrowLeft') go(S.vi-1);};
let sx=null;
view.addEventListener('pointerdown',e=>{sx=e.clientX;});
view.addEventListener('pointerup',e=>{
  if(sx===null) return; const dx=e.clientX-sx; sx=null;
  if(Math.abs(dx)>50) go(S.vi+(dx<0?1:-1));
});
window.addEventListener('resize',layout);
if('speechSynthesis' in window){ speechSynthesis.addEventListener('voiceschanged',voiceNote); }
voiceNote();

S.ready=true;rebuild();

new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){
    if(!S.manual&&!S.playing&&!S.busy){ S.t>=cur().duration?go(S.vi+1):play(); }
  } else if(S.playing){ pause(false); }
}),{threshold:.4}).observe($('#vcCar'));
})();
</script>
</body>
</html>

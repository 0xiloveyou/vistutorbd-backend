<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fraction Pizza Shop (Class 1-5 example game)</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#fffbf2;--ink:#27304a;--muted:#5b6485;--line:#cfd9ee;--accent:#e4572e;--blue:#3a6ea5;
  --cheese:#f7b733;--base:#fff1d0;--bot:#e8ebff;--botline:#4a47c4;--screen:#171c38;--glow:#7ef0c9;--blush:#ff9fb2}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font:500 17px/1.5 "Baloo Da 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  background:var(--paper) repeating-linear-gradient(transparent 0 31px,#dfe8f7 31px 32px);
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:860px;margin:0 auto;padding:22px 18px 150px}
h1{font-size:30px;line-height:1.15;margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.score{font-weight:800;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 16px}
.styles{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}
.styles b{margin-right:4px}
button{font:inherit;color:var(--ink);cursor:pointer}
.styles button,.ctl button{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 14px;min-height:44px}
.styles button[aria-pressed=true]{background:var(--ink);color:#fff}
.ctl{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.ctl .go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:800}
button:focus-visible,.slice:focus-visible,.box:focus-visible,#robot:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.stage{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center;background:#fff;border:2px solid var(--ink);
  border-radius:20px;padding:20px;box-shadow:5px 5px 0 var(--ink)}
@media(max-width:620px){.stage{grid-template-columns:1fr}}
.ticket{border:2px dashed var(--muted);border-radius:14px;padding:12px;text-align:center;transition:.2s}
.ticket small{display:block;color:var(--muted)}
.frac{display:inline-grid;font-size:64px;font-weight:800;line-height:1}
.frac i{font-style:normal;padding:2px 14px}.frac i:first-child{border-bottom:5px solid var(--ink)}
#pizza{display:grid;place-items:center;border-radius:16px;padding:8px;transition:.2s}
.cmp-hl{background:#fff4c2;box-shadow:0 0 0 4px var(--cheese)}
svg.pz{width:100%;max-width:300px;height:auto}
.slice{cursor:pointer;stroke:var(--ink);stroke-width:3;stroke-linejoin:round;transition:fill .15s}
.slice:hover{filter:brightness(.97)}
body[data-style=line] .slice{stroke-width:2.2}
body[data-style=line] .draw path{animation:draw 1s ease-out}
.boxes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.box{width:48px;height:48px;border:2px solid var(--ink);border-radius:8px;background:#fff;font-size:22px;font-weight:800}
.box[aria-pressed=true]{background:var(--ink);color:#fff}
#cap{margin-top:16px;padding:12px 16px;background:#fff;border-left:8px solid var(--blue);border-radius:10px;min-height:54px}
body[data-style=text] #cap{border-left-color:var(--ink);font-family:Georgia,serif}
#cap[hidden]{display:none}

#robot{position:fixed;left:0;top:0;width:88px;height:106px;z-index:50;cursor:pointer;touch-action:manipulation;
  filter:drop-shadow(0 6px 7px rgba(0,0,0,.2));transition:left 1s cubic-bezier(.45,.05,.25,1),top 1s cubic-bezier(.45,.05,.25,1)}
#robot.nomove{transition:none}#robot[hidden]{display:none}
#rsvg{width:100%;height:100%;overflow:visible;transition:transform .35s}
#bob{animation:float 2.6s ease-in-out infinite}
#robot.fly #bob{animation:float .35s ease-in-out infinite}
.jet{transform-box:fill-box;transform-origin:50% 0;animation:flame .18s infinite alternate}
#tilt{transform-box:fill-box;transform-origin:50% 100%}
#arm{transform-origin:76px 78px;transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.eyes-h,.eyes-s,.m-open,.m-flat,.m-sad,.q,.cheek{display:none}
#robot[data-emo=happy] .eyes-n,#robot[data-emo=sad] .eyes-n{display:none}
#robot[data-emo=happy] .eyes-h,#robot[data-emo=sad] .eyes-s,#robot[data-emo=happy] .cheek{display:inline}
#robot[data-emo=sad] .m-smile,#robot[data-emo=think] .m-smile{display:none}
#robot[data-emo=sad] .m-sad,#robot[data-emo=think] .m-flat{display:inline}
#robot[data-emo=think] .bulb{animation:pulse .5s infinite alternate}
#robot[data-talk=on] .m-smile,#robot[data-talk=on] .m-flat,#robot[data-talk=on] .m-sad{display:none}
#robot[data-talk=on] .m-open{display:inline;transform-box:fill-box;transform-origin:center;animation:talk .22s infinite alternate}
#robot.shake #tilt{animation:shake .5s}
#robot.hop{animation:hop .6s}
.bubble{position:absolute;bottom:calc(100% + 8px);left:0;width:max-content;max-width:min(250px,72vw);background:#fff;
  border:2px solid var(--ink);border-radius:14px;padding:8px 12px;font-weight:700;font-size:15px;line-height:1.3;
  opacity:0;transform:scale(.9);transform-origin:bottom left;pointer-events:none;transition:.2s}
.bubble.show{opacity:1;transform:none}
.bubble::after{content:"";position:absolute;top:100%;left:30px;border:7px solid transparent;border-top-color:var(--ink)}
#robot.below .bubble{bottom:auto;top:calc(100% + 8px);transform-origin:top left}
#robot.below .bubble::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--ink)}
#robot.right .bubble{left:auto;right:0;transform-origin:bottom right}
#robot.right .bubble::after{left:auto;right:30px}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes flame{to{transform:scaleY(1.5)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes talk{to{transform:scaleY(.4)}}
@keyframes pulse{to{opacity:.35}}
@keyframes shake{20%{transform:rotate(-9deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}}
@keyframes hop{40%{transform:translateY(-22px)}70%{transform:translateY(0)}}
@keyframes draw{from{stroke-dasharray:700;stroke-dashoffset:700}to{stroke-dasharray:700;stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body data-style="robot">
<main>
  <div class="top">
    <h1 id="title">Fraction Pizza Shop</h1>
    <div class="score" id="score" aria-live="polite"></div>
  </div>

  <div class="styles" role="group" aria-label="Style">
    <b id="lblStyle">Style</b>
    <button data-s="robot" aria-pressed="true">🤖 <span data-k="sRobot">Robot explains</span></button>
    <button data-s="line" aria-pressed="false">✏️ <span data-k="sLine">Line art</span></button>
    <button data-s="text" aria-pressed="false">📝 <span data-k="sText">Text only</span></button>
  </div>

  <section class="stage">
    <div class="ticket" id="ticket">
      <small id="lblOrder">Customer order</small>
      <div class="frac" id="frac" aria-label="fraction"><i id="fa"></i><i id="fb"></i></div>
    </div>
    <div id="pizza"></div>
  </section>

  <div id="cap" role="status" aria-live="polite" hidden></div>

  <div class="ctl">
    <button class="go" id="check">✔ <span data-k="check">Check</span></button>
    <button id="how">▶ <span data-k="how">Show me how</span></button>
    <button id="hint">💡 <span data-k="hint">Suggestion</span></button>
    <button id="conf">🙋 <span data-k="conf">I didn’t understand</span></button>
    <button id="snd" aria-label="Sound">🔊</button>
    <button id="lng">EN / বাংলা</button>
  </div>
</main>

<!-- Companion: Bolt, flying with jet boots and a teaching pen -->
<div id="robot" data-emo="idle" data-talk="off" role="button" tabindex="0" aria-label="Bolt, your helper">
  <div class="bubble" id="bubble" role="status" aria-live="polite"></div>
  <svg id="rsvg" viewBox="0 0 100 120" aria-hidden="true">
    <ellipse cx="50" cy="119" rx="22" ry="3" fill="rgba(0,0,0,.15)"/>
    <g id="bob"><g id="tilt">
      <g class="jet"><ellipse cx="38" cy="112" rx="5" ry="7" fill="#ff8a3d"/><ellipse cx="38" cy="110" rx="2.5" ry="4" fill="#ffe066"/></g>
      <g class="jet"><ellipse cx="62" cy="112" rx="5" ry="7" fill="#ff8a3d"/><ellipse cx="62" cy="110" rx="2.5" ry="4" fill="#ffe066"/></g>
      <rect x="29" y="102" width="18" height="7" rx="3" fill="var(--botline)"/><rect x="53" y="102" width="18" height="7" rx="3" fill="var(--botline)"/>
      <rect x="28" y="72" width="44" height="32" rx="13" fill="var(--bot)" stroke="var(--botline)" stroke-width="3"/>
      <circle cx="50" cy="88" r="6" fill="var(--glow)" stroke="var(--botline)" stroke-width="2"/>
      <rect x="15" y="76" width="11" height="22" rx="5.5" fill="var(--bot)" stroke="var(--botline)" stroke-width="3"/>
      <line x1="50" y1="20" x2="50" y2="9" stroke="var(--botline)" stroke-width="3" stroke-linecap="round"/>
      <circle class="bulb" cx="50" cy="7" r="4.5" fill="var(--glow)" stroke="var(--botline)" stroke-width="2"/>
      <circle cx="12" cy="44" r="5" fill="var(--botline)"/><circle cx="88" cy="44" r="5" fill="var(--botline)"/>
      <rect x="15" y="20" width="70" height="50" rx="20" fill="var(--bot)" stroke="var(--botline)" stroke-width="3"/>
      <rect x="22" y="27" width="56" height="36" rx="14" fill="var(--screen)"/>
      <g class="eyes-n"><ellipse class="eye" cx="38" cy="43" rx="5" ry="6.5" fill="var(--glow)"/><ellipse class="eye" cx="62" cy="43" rx="5" ry="6.5" fill="var(--glow)"/></g>
      <g class="eyes-h" fill="none" stroke="var(--glow)" stroke-width="3.5" stroke-linecap="round"><path d="M33 46q5-9 10 0"/><path d="M57 46q5-9 10 0"/></g>
      <g class="eyes-s" fill="none" stroke="var(--glow)" stroke-width="3.5" stroke-linecap="round"><path d="M33 41q5 7 10 3"/><path d="M57 44q5 4 10-3"/></g>
      <circle class="cheek" cx="29" cy="53" r="4" fill="var(--blush)" opacity=".8"/><circle class="cheek" cx="71" cy="53" r="4" fill="var(--blush)" opacity=".8"/>
      <path class="m-smile" d="M42 53q8 7 16 0" fill="none" stroke="var(--glow)" stroke-width="3" stroke-linecap="round"/>
      <ellipse class="m-open" cx="50" cy="54" rx="5.5" ry="5" fill="var(--glow)"/>
      <path class="m-flat" d="M44 55h12" stroke="var(--glow)" stroke-width="3" stroke-linecap="round"/>
      <path class="m-sad" d="M42 58q8-7 16 0" fill="none" stroke="var(--glow)" stroke-width="3" stroke-linecap="round"/>
      <!-- pointing arm holding a pen: the pen tip is what aims at the target -->
      <g id="arm"><rect x="71" y="74" width="11" height="24" rx="5.5" fill="var(--bot)" stroke="var(--botline)" stroke-width="3"/>
        <circle cx="76.5" cy="99" r="5" fill="var(--accent)"/>
        <rect x="75" y="100" width="3" height="22" rx="1" fill="#ffd23f" stroke="var(--botline)" stroke-width=".8"/>
        <polygon points="75,122 78,122 76.5,128" fill="#27304a"/></g>
    </g></g>
  </svg>
</div>

<script>
(() => {
"use strict";
const CFG = { lang: "en", sound: true, chatEndpoint: null };   // chatEndpoint: POST {message, lang, context} -> {reply}
const ROUNDS = [[1, 2], [3, 4], [2, 3], [5, 6]];                // each round = [top, bottom]

const UI = {
 en: { title: "Fraction Pizza Shop", style: "Style", sRobot: "Robot explains", sLine: "Line art", sText: "Text only",
   check: "Check", how: "Show me how", hint: "Suggestion", conf: "I didn’t understand", order: "Customer order",
   score: "Order {r} of {t} · ⭐ {s}", hi: "Hi! I’m Bolt. Tap slices to match the order, or press Show me how.",
   plain: "Tap slices to match the order, then press Check.",
   s1: "The bottom number tells how many equal slices the whole pizza has: {b}.",
   s2: "Here is our pizza, cut into {b} equal slices.",
   s3: "The top number tells how many slices to take: {a}. Let’s colour {a}.",
   s4: "{a} out of {b} slices is the fraction {a}/{b}. Now press Check!",
   h1: "Look at the bottom number. It is the total number of slices: {b}.",
   h2: "Now the top number: colour exactly {a} slices, then press Check.",
   less: "You coloured {n}. The order needs {a}. Colour more.", more: "You coloured {n}. The order needs {a}. Take some away.",
   none: "Colour some slices first.", good: "Perfect! {a}/{b} of the pizza. 🍕", again: "No problem, let’s see that step again.",
   done: "All orders done! You earned {s} stars. 🎉", play: "Play again", next: "Next order" },
 bn: { title: "ফ্র্যাকশন পিৎজা শপ", style: "স্টাইল", sRobot: "রোবট বোঝাবে", sLine: "লাইন আর্ট", sText: "শুধু লেখা",
   check: "যাচাই", how: "দেখাও কীভাবে", hint: "ইঙ্গিত", conf: "আমি বুঝিনি", order: "গ্রাহকের অর্ডার",
   score: "অর্ডার {r}/{t} · ⭐ {s}", hi: "হ্যালো! আমি বোল্ট। অর্ডার মিলিয়ে স্লাইস ট্যাপ করো, অথবা “দেখাও কীভাবে” চাপো।",
   plain: "অর্ডার মিলিয়ে স্লাইস ট্যাপ করো, তারপর “যাচাই” চাপো।",
   s1: "নিচের সংখ্যা বলে পুরো পিৎজা কয়টি সমান টুকরোয় কাটা: {b}টি।",
   s2: "এই যে আমাদের পিৎজা, {b}টি সমান টুকরো।",
   s3: "ওপরের সংখ্যা বলে কয়টি টুকরো নিতে হবে: {a}টি। চলো {a}টি রং করি।",
   s4: "{b}টির মধ্যে {a}টি মানে ভগ্নাংশ {a}/{b}। এবার “যাচাই” চাপো!",
   h1: "নিচের সংখ্যা দেখো। এটাই মোট টুকরোর সংখ্যা: {b}।",
   h2: "এবার ওপরের সংখ্যা: ঠিক {a}টি টুকরো রং করে “যাচাই” চাপো।",
   less: "তুমি {n}টি রং করেছ। অর্ডারে লাগবে {a}টি। আরও রং করো।", more: "তুমি {n}টি রং করেছ। অর্ডারে লাগবে {a}টি। কিছু কমাও।",
   none: "আগে কয়েকটি টুকরো রং করো।", good: "চমৎকার! পিৎজার {a}/{b} অংশ। 🍕", again: "ঠিক আছে, ধাপটা আবার দেখাই।",
   done: "সব অর্ডার শেষ! তুমি {s}টি তারা পেয়েছ। 🎉", play: "আবার খেলো", next: "পরের অর্ডার" }
};
const L = () => UI[CFG.lang];
const nm = x => CFG.lang === "bn" ? String(x).replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]) : String(x);
const T = (k, v = {}) => L()[k].replace(/\{(\w+)\}/g, (m, x) => nm(v[x]));
const $ = (s, r = document) => r.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, reduce ? 20 : ms));
const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;

/* ---------- state ---------- */
let style = "robot", round = 0, score = 0, sel = new Set(), tries = 0, hintLvl = 0, busy = false, finished = false, stepNo = -1;
const cur = () => ROUNDS[round];
const robot = $("#robot"), bubble = $("#bubble"), arm = $("#arm"), svg = $("#rsvg"), cap = $("#cap");
const RW = 88, RH = 106;

/* ---------- sound ---------- */
let ac;
function beep(f, d = .12, type = "sine") {
  if (!CFG.sound) return;
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f; g.gain.value = .06;
    o.connect(g); g.connect(ac.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d); o.stop(ac.currentTime + d);
  } catch (e) {}
}
const SND = { pop: () => beep(520, .08), ding: () => { beep(880, .15); setTimeout(() => beep(1175, .2), 120); },
  oops: () => { beep(300, .2, "sawtooth"); setTimeout(() => beep(220, .3, "sawtooth"), 160); } };

/* ---------- companion (flies, points with pen, talks) ---------- */
let atHome = true, talkT, hideT;
const home = () => ({ x: 14, y: innerHeight - RH - 14 });
function setPos(x, y, instant) {
  robot.classList.toggle("nomove", !!instant);
  robot.style.left = x + "px"; robot.style.top = y + "px";
  if (instant) { void robot.offsetWidth; robot.classList.remove("nomove"); }
  robot.classList.toggle("below", y < 120); robot.classList.toggle("right", x + RW / 2 > innerWidth * .6);
}
const emotion = e => robot.dataset.emo = e || "idle";
function say(text, ms = 3200) {
  if (style === "robot") {
    clearTimeout(talkT); clearTimeout(hideT);
    bubble.textContent = text; bubble.classList.add("show"); robot.dataset.talk = "on";
    talkT = setTimeout(() => robot.dataset.talk = "off", Math.min(ms, 400 + text.length * 55));
    hideT = setTimeout(() => bubble.classList.remove("show"), ms);
  } else cap.textContent = text;
}
async function moveTo(sel_) {
  if (style !== "robot") return;
  const e = $(sel_); e.scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" }); await sleep(450);
  const r = e.getBoundingClientRect();
  let x = r.left - RW - 10; if (x < 8) x = r.right + 10;
  x = Math.max(8, Math.min(innerWidth - RW - 8, x));
  const y = Math.max(8, Math.min(innerHeight - RH - 8, r.top + r.height / 2 - RH / 2));
  atHome = false; robot.classList.add("fly"); setPos(x, y); await sleep(1050); robot.classList.remove("fly");
}
function point(sel_) {
  if (style !== "robot") return;
  const t = $(sel_).getBoundingClientRect(), r = robot.getBoundingClientRect();
  const dir = (t.left + t.width / 2) < (r.left + r.width / 2) ? -1 : 1;
  svg.style.transform = `scaleX(${dir})`;
  const px = dir === 1 ? r.left + r.width * .76 : r.left + r.width * .24, py = r.top + r.height * .65;
  const dx = (t.left + t.width / 2 - px) * dir, dy = t.top + t.height / 2 - py;
  arm.style.transform = `rotate(${Math.atan2(dy, dx) * 180 / Math.PI - 90}deg)`;
}
const unpoint = () => { arm.style.transform = "rotate(0deg)"; svg.style.transform = "scaleX(1)"; };
async function goHome() { if (style !== "robot") return; unpoint(); const h = home(); robot.classList.add("fly"); setPos(h.x, h.y); await sleep(1050); robot.classList.remove("fly"); atHome = true; emotion("idle"); }
const hl = (t, on) => $(t).classList.toggle("cmp-hl", on);

/* ---------- board rendering (changes with Style) ---------- */
function render() {
  const [a, b] = cur();
  $("#fa").textContent = nm(a); $("#fb").textContent = nm(b);
  $("#score").textContent = T("score", { r: round + 1, t: ROUNDS.length, s: score });
  const box = $("#pizza"); box.textContent = "";
  if (style === "text") {
    const w = document.createElement("div"); w.className = "boxes"; w.setAttribute("role", "group");
    for (let i = 0; i < b; i++) {
      const k = document.createElement("button"); k.className = "box"; k.textContent = sel.has(i) ? "■" : nm(i + 1);
      k.setAttribute("aria-pressed", sel.has(i)); k.setAttribute("aria-label", "slice " + (i + 1)); k.onclick = () => toggle(i); w.appendChild(k);
    }
    box.appendChild(w); return;
  }
  const C = 110, R = 98, ns = "http://www.w3.org/2000/svg", line = style === "line";
  const s = document.createElementNS(ns, "svg"); s.setAttribute("viewBox", "0 0 220 220"); s.setAttribute("class", "pz" + (line ? " draw" : ""));
  s.innerHTML = `<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#27304a" stroke-width="2"/></pattern></defs>`;
  for (let i = 0; i < b; i++) {
    const a0 = (-90 + i * 360 / b) * Math.PI / 180, a1 = (-90 + (i + 1) * 360 / b) * Math.PI / 180, am = (a0 + a1) / 2;
    const p = document.createElementNS(ns, "path");
    p.setAttribute("d", `M${C} ${C}L${C + R * Math.cos(a0)} ${C + R * Math.sin(a0)}A${R} ${R} 0 0 1 ${C + R * Math.cos(a1)} ${C + R * Math.sin(a1)}Z`);
    p.setAttribute("class", "slice"); p.setAttribute("tabindex", 0); p.setAttribute("role", "button"); p.setAttribute("aria-pressed", sel.has(i));
    p.setAttribute("aria-label", "slice " + (i + 1));
    p.setAttribute("fill", sel.has(i) ? (line ? "url(#hatch)" : "var(--cheese)") : (line ? "none" : "var(--base)"));
    p.onclick = () => toggle(i); p.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(i); } };
    s.appendChild(p);
    if (sel.has(i) && !line) {   // pepperoni on coloured slices
      const d = document.createElementNS(ns, "circle"); d.setAttribute("cx", C + R * .6 * Math.cos(am)); d.setAttribute("cy", C + R * .6 * Math.sin(am));
      d.setAttribute("r", 8); d.setAttribute("fill", "var(--accent)"); d.setAttribute("pointer-events", "none"); s.appendChild(d);
    }
  }
  box.appendChild(s);
}
function toggle(i) { if (busy || finished) return; sel.has(i) ? sel.delete(i) : sel.add(i); SND.pop(); render(); }

/* ---------- explanation steps ("Show me how") ---------- */
const steps = () => { const [a, b] = cur(); return [
  { t: "#frac", k: "s1", v: { b }, snd: "pop" },
  { t: "#pizza", k: "s2", v: { b }, snd: "pop" },
  { t: "#pizza", k: "s3", v: { a }, snd: "pop", after: () => { sel = new Set([...Array(a).keys()]); render(); } },
  { t: "#pizza", k: "s4", v: { a, b }, snd: "ding", emo: "happy" } ]; };
async function runStep(i, list) {
  const s = list[i]; stepNo = i;
  await moveTo(s.t); emotion(s.emo || "happy"); hl(s.t, true); point(s.t);
  if (s.snd) SND[s.snd](); say(T(s.k, s.v), 3400); if (s.after) s.after();
  await sleep(3400); hl(s.t, false);
}
async function how() {
  if (busy || finished) return; busy = true; sel = new Set(); render();
  const list = steps(); for (let i = 0; i < list.length; i++) await runStep(i, list);
  unpoint(); await goHome(); busy = false;
}
async function replay() {
  if (busy || finished) return;
  if (stepNo < 0) return how();
  busy = true; say(T("again"), 1800); await sleep(1400); await runStep(stepNo, steps()); unpoint(); await goHome(); busy = false;
}
async function hint() {
  if (busy || finished) return; busy = true; const [a, b] = cur();
  const lvl = Math.min(hintLvl++, 1), t = lvl ? "#pizza" : "#frac";
  await moveTo(t); emotion("think"); hl(t, true); point(t); say(T(lvl ? "h2" : "h1", { a, b }), 3600); await sleep(3600);
  hl(t, false); unpoint(); emotion("idle"); await goHome(); busy = false;
}

/* ---------- checking & rounds ---------- */
async function check() {
  if (busy) return;
  if (finished) return restart();
  const [a, b] = cur(), n = sel.size;
  if (!n) { say(T("none"), 2500); emotion("confused"); return; }
  busy = true;
  if (n === a) {
    score++; emotion("happy"); SND.ding(); robot.classList.add("hop"); say(T("good", { a, b }), 2200);
    $("#score").textContent = T("score", { r: round + 1, t: ROUNDS.length, s: score });
    await sleep(1800); robot.classList.remove("hop");
    if (round < ROUNDS.length - 1) { round++; newRound(); } else { finish(); }
  } else {
    tries++; emotion("sad"); SND.oops(); robot.classList.add("shake"); say(T(n < a ? "less" : "more", { n, a }), 3000);
    await sleep(600); robot.classList.remove("shake"); await sleep(2400); emotion("idle");
    if (tries >= 3) { busy = false; tries = 0; await how(); return; }   // 3 wrong tries: companion solves it on screen
  }
  busy = false;
}
function newRound() { sel = new Set(); tries = 0; hintLvl = 0; stepNo = -1; render(); say(T(style === "robot" ? "hi" : "plain"), 3000); emotion("idle"); }
function finish() {
  finished = true; sel = new Set(); render(); emotion("happy"); say(T("done", { s: score }), 5000); SND.ding();
  $("#check span").textContent = L().play;
}
function restart() { finished = false; round = 0; score = 0; applyLang(); newRound(); }

/* ---------- Style switch: robot / line art / text ---------- */
function setStyle(s) {
  style = s; document.body.dataset.style = s;
  document.querySelectorAll(".styles button").forEach(b => b.setAttribute("aria-pressed", b.dataset.s === s));
  robot.hidden = s !== "robot"; cap.hidden = s === "robot"; bubble.classList.remove("show");
  render();
  if (s === "robot") { const h = home(); setPos(h.x, h.y, true); atHome = true; robot.classList.add("hop"); setTimeout(() => robot.classList.remove("hop"), 650); emotion("happy"); say(T("hi"), 3500); SND.pop(); }
  else cap.textContent = T("plain");
}
document.querySelectorAll(".styles button").forEach(b => b.onclick = () => { if (!busy) setStyle(b.dataset.s); });

/* ---------- language / wiring ---------- */
function applyLang() {
  const l = L(); document.documentElement.lang = CFG.lang;
  $("#title").textContent = l.title; $("#lblStyle").textContent = l.style; $("#lblOrder").textContent = l.order;
  document.querySelectorAll("[data-k]").forEach(e => e.textContent = l[e.dataset.k]);
  render();
}
$("#lng").onclick = () => { CFG.lang = CFG.lang === "en" ? "bn" : "en"; applyLang(); };
$("#snd").onclick = e => { CFG.sound = !CFG.sound; e.currentTarget.textContent = CFG.sound ? "🔊" : "🔇"; };
$("#check").onclick = check; $("#how").onclick = how; $("#hint").onclick = hint; $("#conf").onclick = replay;
robot.addEventListener("click", () => { if (!busy) { emotion("happy"); say(T("hi"), 2800); SND.pop(); } });
robot.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); robot.click(); } });
addEventListener("resize", () => { if (atHome && !busy && style === "robot") { const h = home(); setPos(h.x, h.y, true); } });

/* Public API so other games can reuse the companion */
window.Companion = { say, emotion, moveTo, point, unpoint, goHome, setStyle, config: CFG };

applyLang(); { const h = home(); setPos(h.x, h.y, true); }
setTimeout(() => { robot.classList.add("hop"); say(T("hi"), 4200); SND.pop(); }, 500);
})();
</script>

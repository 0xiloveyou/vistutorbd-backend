<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>River Boat Race (Class 6–8 example activity)</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#fffbf2;--ink:#27304a;--muted:#5b6485;--accent:#e4572e;--blue:#3a6ea5;--water:#dcebf7;--bot:#e8ebff;--botline:#4a47c4}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:500 17px/1.5 "Baloo Da 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
 background:var(--paper) repeating-linear-gradient(transparent 0 31px,#dfe8f7 31px 32px);
 padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:900px;margin:0 auto;padding:20px 16px 160px}
h1{font-size:30px;line-height:1.15;margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pill{font-weight:800;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 16px;margin-left:6px}
button{font:inherit;color:var(--ink);cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
.row button,.ctl button,.rk{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 14px;min-height:44px}
.row button[aria-pressed=true]{background:var(--ink);color:#fff}
.q{margin:0 0 12px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.card{position:relative;background:#fff;border:2px solid var(--ink);border-radius:18px;padding:14px;box-shadow:5px 5px 0 var(--ink)}
.card h2{margin:0 0 6px;font-size:21px;display:flex;align-items:center;gap:8px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block}
.card svg{width:100%;height:auto;display:block}
.cap2{font-size:14px;color:var(--muted);text-align:center}
table{border-collapse:collapse;width:100%;text-align:center}
th,td{border:2px solid var(--ink);padding:3px 6px}th{background:var(--bot)}
#sent{position:relative;font-size:24px;line-height:1.3;font-weight:800;padding:18px 4px;text-align:center}
.ans{margin-top:10px;display:flex;gap:8px;align-items:center;justify-content:center;font-weight:800}
.ans input{width:86px;font:inherit;font-weight:800;text-align:center;border:2px solid var(--ink);border-radius:10px;padding:5px}
.ans input.bad{border-color:var(--accent);background:#ffe9e2}
.lane{margin-top:16px;background:#fff;border:2px solid var(--ink);border-radius:18px;padding:8px;box-shadow:5px 5px 0 var(--ink)}
.lane svg{width:100%;height:auto;display:block}
.boat{transition:none}
#rank{position:relative;margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-weight:800}
.rk{font-weight:800;border-width:3px}
.rk b{display:inline-block;min-width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;margin-left:6px;font-size:14px;line-height:24px}
.rk b:empty{background:#e6ebf6}
#cap{margin-top:16px;padding:12px 16px;background:#fff;border-left:8px solid var(--blue);border-radius:10px;min-height:54px}
#cap[hidden]{display:none}#cap ol{margin:0;padding-left:22px}
body[data-style=text] #cap{border-left-color:var(--ink);font-family:Georgia,serif}
.ctl{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.ctl .go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:800}
.ctl [hidden]{display:none}
button:focus-visible,input:focus-visible,#robot:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
/* Line-art guidance: dashed pen outline that draws itself */
.hl:not(tr)::after{content:"";position:absolute;inset:-6px;border:3px dashed var(--accent);border-radius:16px;pointer-events:none;animation:pen 1s ease-out forwards}
tr.hl td{background:#fff4c2;border-bottom:4px solid var(--accent)}
@keyframes pen{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
.tri path{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:1;stroke-dashoffset:1}
.tri text{fill:var(--accent);font-size:9px;font-weight:700;opacity:0}
.tri.on path{animation:dr 1s forwards}.tri.on text{opacity:1;transition:opacity .4s .8s}
@keyframes dr{to{stroke-dashoffset:0}}
/* Robot (Bolt) */
#robot{position:fixed;left:0;top:0;width:80px;height:100px;z-index:50;cursor:pointer;touch-action:manipulation;
 filter:drop-shadow(0 6px 7px rgba(0,0,0,.2));transition:left 1s cubic-bezier(.45,.05,.25,1),top 1s cubic-bezier(.45,.05,.25,1)}
#robot[hidden]{display:none}#rsvg{width:100%;height:100%;overflow:visible}
#bob{animation:float 2.6s ease-in-out infinite}
#arm{transform-origin:60px 69px;transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
#mouth{transform-box:fill-box;transform-origin:center}
#robot[data-talk=on] #mouth{animation:talk .2s infinite alternate}
#robot[data-emo=sad] .eye circle{fill:#ff9fb2}
#robot.hop{animation:hop .6s}
.bubble{position:absolute;bottom:calc(100% + 8px);left:0;width:max-content;max-width:min(250px,72vw);background:#fff;border:2px solid var(--ink);
 border-radius:14px;padding:8px 12px;font-weight:700;font-size:15px;line-height:1.3;opacity:0;transform:scale(.9);transform-origin:bottom left;pointer-events:none;transition:.2s}
.bubble.show{opacity:1;transform:none}
.bubble::after{content:"";position:absolute;top:100%;left:30px;border:7px solid transparent;border-top-color:var(--ink)}
#robot.below .bubble{bottom:auto;top:calc(100% + 8px)}
#robot.below .bubble::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--ink)}
#robot.right .bubble{left:auto;right:0;transform-origin:bottom right}#robot.right .bubble::after{left:auto;right:30px}
@keyframes float{50%{transform:translateY(-5px)}}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes talk{to{transform:scaleY(.4)}}@keyframes hop{40%{transform:translateY(-22px)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body data-style="robot">
<main>
 <div class="top"><h1 id="title"></h1><div><span class="pill" id="round"></span><span class="pill" id="score" aria-live="polite"></span></div></div>
 <div class="row" role="group" aria-label="Style">
  <b data-k="style"></b>
  <button data-s="robot" aria-pressed="true">🤖 <span data-k="sRobot"></span></button>
  <button data-s="line" aria-pressed="false">✏️ <span data-k="sLine"></span></button>
  <button data-s="text" aria-pressed="false">📝 <span data-k="sText"></span></button>
 </div>
 <p class="q" id="q"></p>
 <div class="cards" id="cards"></div>
 <div class="lane" id="lane"></div>
 <div id="rank"></div>
 <div id="cap" role="status" aria-live="polite" hidden></div>
 <div class="ctl">
  <button class="go" id="check">✔ <span data-k="check"></span></button>
  <button id="how">▶ <span data-k="how"></span></button>
  <button id="hint">💡 <span data-k="hint"></span></button>
  <button id="conf">🙋 <span data-k="conf"></span></button>
  <button id="next" hidden>➡ <span data-k="next"></span></button>
  <button id="snd" aria-label="Sound">🔊</button>
  <button id="lng">EN / বাংলা</button>
 </div>
</main>

<div id="robot" data-emo="idle" data-talk="off" role="button" tabindex="0" aria-label="Bolt, your helper">
 <div class="bubble" id="bubble" role="status" aria-live="polite"></div>
 <svg id="rsvg" viewBox="0 0 80 100" aria-hidden="true"><g id="bob">
  <line x1="40" y1="6" x2="40" y2="18" stroke="#4a47c4" stroke-width="3"/><circle cx="40" cy="6" r="4.5" fill="#ff9fb2" stroke="#4a47c4" stroke-width="2.5"/>
  <rect x="14" y="18" width="52" height="40" rx="14" fill="#e8ebff" stroke="#4a47c4" stroke-width="3"/>
  <rect x="20" y="25" width="40" height="26" rx="9" fill="#171c38"/>
  <g class="eye"><circle cx="31" cy="35" r="4" fill="#7ef0c9"/><circle cx="49" cy="35" r="4" fill="#7ef0c9"/></g>
  <path id="mouth" d="M32 44q8 6 16 0" fill="none" stroke="#7ef0c9" stroke-width="3" stroke-linecap="round"/>
  <rect x="22" y="62" width="36" height="30" rx="10" fill="#e8ebff" stroke="#4a47c4" stroke-width="3"/>
  <g id="arm"><rect x="55.5" y="65" width="9" height="24" rx="4.5" fill="#e8ebff" stroke="#4a47c4" stroke-width="3"/></g>
 </g></svg>
</div>

<script>
/* ---------- 1. CONTENT (edit these to make new rounds) ---------- */
// Each boat's speed is given in a different form: graph point, table rows, sentence.
const ROUNDS = [
 { lal:{t:5,d:24}, nil:[[2,9],[4,18],[6,27],[8,36]],    sob:{d:28,t:6} },
 { lal:{t:5,d:26}, nil:[[3,15],[6,30],[9,45],[12,60]],  sob:{d:33,t:6} },
 { lal:{t:5,d:18}, nil:[[2,7],[4,14],[6,21],[8,28]],    sob:{d:22,t:6} }
];
const KEYROW = 1, COLORS = ["#e4572e","#3a6ea5","#3f9d6b"], FINISH = 60, SLOW = .3, TOL = .06;
const NAMES = { en:["Lal","Nil","Sobuj"], bn:["লাল","নীল","সবুজ"] };
const S = {
 en:{ title:"River Boat Race", style:"Style", sRobot:"Robot explains", sLine:"Line art", sText:"Text only",
  check:"Check and race", how:"Show me how", hint:"Suggestion", conf:"I didn’t understand", next:"Next round", again:"Play again",
  q:"Find each boat’s speed in metres per second. Then tap the boats from fastest to slowest.",
  us:"s", um:"m", unit:"m/s", gcap:"Distance–time graph", th1:"Time (s)", th2:"Distance (m)", rankL:"Fastest to slowest:",
  sent:"{n} sails {d} m in {t} seconds.", round:"Round {r} of {n}", stars:"Stars: {s}",
  needRates:"Fill in all three speeds first.", needRank:"Tap all three boats, fastest first.",
  rateWrong:"Check the speed of {n}. Divide the distance by the time.",
  rankWrong:"The speeds look right, but the order is off. The biggest speed wins.",
  go:"Great! Here we go…", won:"{n} wins at {v} m/s!", fin:"All rounds done. Well sailed!",
  h1:"Speed means how many metres the boat covers in ONE second.", h2:"Divide distance by time. Try the table first.", h3:"{n} goes {v} m/s.",
  c1:"Small case: a boat goes 12 m in 3 s. In 1 s it goes 12 ÷ 3 = 4 m. That is 4 m/s.",
  c2:"Think of walking: 10 m in 2 s means 5 m every second. Do the same for each boat.",
  hi:"Hi, I’m Bolt! I’ll help you find each speed.",
  s1:"The line passes through ({t} s, {d} m). Speed = {d} ÷ {t} = {v} m/s.",
  s2:"Take one row of the table: {d} m in {t} s. Speed = {d} ÷ {t} = {v} m/s.",
  s3:"The sentence says {d} m in {t} s. Speed = {d} ÷ {t} ≈ {v} m/s.",
  s4:"Now compare the three numbers. The biggest speed finishes first." },
 bn:{ title:"নদীর নৌকা দৌড়", style:"স্টাইল", sRobot:"রোবট বোঝায়", sLine:"রেখাচিত্র", sText:"শুধু লেখা",
  check:"যাচাই করো ও দৌড় দাও", how:"দেখাও কীভাবে", hint:"ইঙ্গিত", conf:"বুঝিনি", next:"পরের রাউন্ড", again:"আবার খেলো",
  q:"প্রতিটি নৌকার দ্রুতি মিটার/সেকেন্ডে বের করো। তারপর দ্রুততম থেকে ধীরতম ক্রমে নৌকায় ট্যাপ করো।",
  us:"সে.", um:"মি.", unit:"মি./সে.", gcap:"দূরত্ব–সময় লেখচিত্র", th1:"সময় (সে.)", th2:"দূরত্ব (মি.)", rankL:"দ্রুততম থেকে:",
  sent:"{n} {t} সেকেন্ডে {d} মিটার যায়।", round:"রাউন্ড {r}/{n}", stars:"তারা: {s}",
  needRates:"আগে তিনটি দ্রুতিই লেখো।", needRank:"তিনটি নৌকায় ট্যাপ করো, দ্রুততম আগে।",
  rateWrong:"{n}-এর দ্রুতি আবার দেখো। দূরত্বকে সময় দিয়ে ভাগ করো।",
  rankWrong:"দ্রুতি ঠিক আছে, কিন্তু ক্রম মেলেনি। বড় সংখ্যাই এগিয়ে।",
  go:"দারুণ! দৌড় শুরু…", won:"{n} জিতেছে, দ্রুতি {v} মি./সে.!", fin:"সব রাউন্ড শেষ। চমৎকার!",
  h1:"দ্রুতি মানে নৌকা ১ সেকেন্ডে কত মিটার যায়।", h2:"দূরত্বকে সময় দিয়ে ভাগ করো। আগে ছক দিয়ে চেষ্টা করো।", h3:"{n}-এর দ্রুতি {v} মি./সে.।",
  c1:"ছোট উদাহরণ: নৌকা 3 সেকেন্ডে 12 মিটার গেলে 1 সেকেন্ডে 12 ÷ 3 = 4 মিটার। দ্রুতি 4 মি./সে.।",
  c2:"হাঁটার কথা ভাবো: 2 সেকেন্ডে 10 মিটার মানে প্রতি সেকেন্ডে 5 মিটার। প্রতিটি নৌকায় এভাবেই করো।",
  hi:"আমি বোল্ট! প্রতিটি দ্রুতি বের করতে সাহায্য করব।",
  s1:"রেখাটি ({t} সে., {d} মি.) বিন্দু দিয়ে গেছে। দ্রুতি = {d} ÷ {t} = {v} মি./সে.",
  s2:"ছকের একটি সারি নাও: {t} সেকেন্ডে {d} মিটার। দ্রুতি = {d} ÷ {t} = {v} মি./সে.",
  s3:"বাক্যে আছে {t} সেকেন্ডে {d} মিটার। দ্রুতি = {d} ÷ {t} ≈ {v} মি./সে.",
  s4:"এবার তিনটি সংখ্যা তুলনা করো। যার দ্রুতি সবচেয়ে বেশি, সে আগে পৌঁছায়।" }
};

/* ---------- 2. SMALL HELPERS ---------- */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
const sleep = ms => new Promise(r => setTimeout(r, reduce ? 30 : ms));
let lang = "en", style = "robot", sound = true, round = 0, stars = 0, tries = 0, hints = 0, confN = 0;
let ranks = [], vals = ["", "", ""], busy = false, raced = false, atHome = true, timers = [];
const BN = "০১২৩৪৫৬৭৮৯";
const nm = x => lang === "bn" ? String(x).replace(/\d/g, d => BN[d]) : String(x);
const T = (k, v = {}) => nm(S[lang][k].replace(/\{(\w+)\}/g, (m, x) => v[x]));
const fmt = x => String(Math.round(x * 100) / 100);
const parse = s => parseFloat(String(s).replace(/[০-৯]/g, d => BN.indexOf(d)).replace(",", "."));
const R = () => ROUNDS[round];
const speeds = () => { const r = R(), k = r.nil[KEYROW]; return [r.lal.d / r.lal.t, k[1] / k[0], r.sob.d / r.sob.t]; };
const order = () => [0, 1, 2].sort((a, b) => speeds()[b] - speeds()[a]);
function beep(f, d = .12) { if (!sound) return; try { const c = beep.c || (beep.c = new AudioContext()), o = c.createOscillator(), g = c.createGain();
  g.gain.value = .06; o.frequency.value = f; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + d); } catch (e) {} }
const SND = { ok: () => { beep(880, .15); setTimeout(() => beep(1175, .2), 120); }, no: () => beep(220, .2), pop: () => beep(520, .08) };

/* ---------- 3. ROBOT (only used in Robot style) ---------- */
const robot = $("#robot"), bubble = $("#bubble"), arm = $("#arm"), cap = $("#cap"), RW = 80, RH = 100;
const MOUTH = { idle:"M32 44q8 6 16 0", happy:"M28 42q12 14 24 0", sad:"M32 50q8 -7 16 0", think:"M33 47h14" };
let bt;
function emo(e) { robot.dataset.emo = e; $("#mouth").setAttribute("d", MOUTH[e] || MOUTH.idle); }
function setPos(x, y) { robot.style.left = x + "px"; robot.style.top = y + "px";
  robot.classList.toggle("below", y < 130); robot.classList.toggle("right", x > innerWidth - 270); }
const home = () => setPos(12, innerHeight - RH - 12);
function say(text) { if (style !== "robot") return; bubble.textContent = text; bubble.classList.add("show"); robot.dataset.talk = "on";
  clearTimeout(bt); bt = setTimeout(() => { robot.dataset.talk = "off"; bubble.classList.remove("show"); }, Math.min(5000, 1200 + text.length * 45)); }
async function moveTo(el) {
  el.scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" }); await sleep(450);
  const r = el.getBoundingClientRect();
  setPos(Math.max(8, Math.min(innerWidth - RW - 8, r.right - RW - 10)), Math.max(8, Math.min(innerHeight - RH - 8, r.top - RH * .45)));
  atHome = false; await sleep(1050);
}
function point(el) { const t = el.getBoundingClientRect(), r = robot.getBoundingClientRect();
  const dx = t.left + t.width / 2 - (r.left + r.width * .75), dy = t.top + t.height / 2 - (r.top + r.height * .69);
  arm.style.transform = `rotate(${Math.atan2(dy, dx) * 180 / Math.PI - 90}deg)`; }
async function goHome() { arm.style.transform = "rotate(0deg)"; if (style !== "robot") return; home(); atHome = true; emo("idle"); await sleep(1050); }
function hop() { robot.classList.remove("hop"); void robot.offsetWidth; robot.classList.add("hop"); }

/* ---------- 4. DRAWING THE ACTIVITY ---------- */
const sy = 110 / 60;
function render() {
  const r = R(), v = speeds(), N = NAMES[lang], L = S[lang], g = r.lal;
  document.documentElement.lang = lang;
  $$("[data-k]").forEach(e => e.textContent = L[e.dataset.k]);
  $("#title").textContent = L.title; $("#q").textContent = L.q;
  $("#round").textContent = T("round", { r: round + 1, n: ROUNDS.length }); $("#score").textContent = T("stars", { s: stars });
  const xd = 30 + 15 * g.t, yd = 130 - sy * g.d, ye = 130 - sy * 10 * v[0];
  const grid = [0, 5, 10].map(t => `<line x1="${30 + 15 * t}" y1="130" x2="${30 + 15 * t}" y2="20" stroke="#e1e8f5"/><text x="${30 + 15 * t}" y="142" font-size="9" text-anchor="middle">${nm(t)}</text>`).join("")
    + [0, 20, 40, 60].map(m => `<line x1="30" y1="${130 - sy * m}" x2="180" y2="${130 - sy * m}" stroke="#e1e8f5"/><text x="26" y="${133 - sy * m}" font-size="9" text-anchor="end">${nm(m)}</text>`).join("");
  const graph = `<svg viewBox="0 0 200 150" role="img" aria-label="${L.gcap}">${grid}<path d="M30 130H180M30 130V20" stroke="#27304a" stroke-width="2" fill="none"/>
    <path d="M30 130L180 ${ye}" stroke="${COLORS[0]}" stroke-width="3" fill="none"/><circle cx="${xd}" cy="${yd}" r="4.5" fill="${COLORS[0]}"/>
    <text x="${xd + 6}" y="${yd + 14}" font-size="9" font-weight="700">(${nm(g.t)} ${L.us}, ${nm(g.d)} ${L.um})</text>
    <text x="186" y="134" font-size="9">${L.us}</text><text x="22" y="14" font-size="9">${L.um}</text>
    <g class="tri" id="tri"><path pathLength="1" d="M30 130H${xd}V${yd}"/><text x="${(30 + xd) / 2}" y="125" text-anchor="middle">${nm(g.t)} ${L.us}</text><text x="${xd + 4}" y="${(130 + yd) / 2}">${nm(g.d)} ${L.um}</text></g></svg>`;
  const rows = r.nil.map((p, i) => `<tr id="row${i}"><td>${nm(p[0])}</td><td>${nm(p[1])}</td></tr>`).join("");
  const body = [`<div class="cap2">${L.gcap}</div>${graph}`, `<table><tr><th>${L.th1}</th><th>${L.th2}</th></tr>${rows}</table>`,
    `<div id="sent">${T("sent", { n: N[2], d: r.sob.d, t: r.sob.t })}</div>`];
  $("#cards").innerHTML = [0, 1, 2].map(i => `<section class="card" id="card${i}"><h2><span class="dot" style="background:${COLORS[i]}"></span>${N[i]}</h2>${body[i]}
    <div class="ans"><input id="in${i}" inputmode="decimal" autocomplete="off" aria-label="${N[i]} ${L.unit}" value="${vals[i]}"> ${L.unit}</div></section>`).join("");
  const lanes = [0, 1, 2].map(i => `<rect x="0" y="${8 + 54 * i}" width="640" height="50" rx="8" fill="#dcebf7"/>
    <g class="boat" id="bt${i}" transform="translate(16 ${8 + 54 * i})"><path d="M0 34h34l-8 12H6z" fill="${COLORS[i]}"/><path d="M14 32V8l16 24z" fill="#fff" stroke="${COLORS[i]}" stroke-width="2"/>
    <text x="40" y="26" font-size="13" font-weight="800" fill="#27304a">${N[i]}</text></g><text id="md${i}" x="590" y="${40 + 54 * i}" font-size="20"></text>`).join("");
  $("#lane").innerHTML = `<svg viewBox="0 0 640 170" role="img" aria-label="River">${lanes}<path d="M580 4V166" stroke="#27304a" stroke-width="3" stroke-dasharray="7 5"/></svg>`;
  drawRank();
}
function drawRank() { const N = NAMES[lang];
  $("#rank").innerHTML = `<span>${S[lang].rankL}</span>` + [0, 1, 2].map(i => `<button class="rk" data-i="${i}" style="border-color:${COLORS[i]}">${N[i]}<b>${ranks.includes(i) ? nm(ranks.indexOf(i) + 1) : ""}</b></button>`).join(""); }

/* ---------- 5. ONE SOURCE OF TRUTH FOR EVERY STYLE ---------- */
function steps() { const r = R(), v = speeds(), k = r.nil[KEYROW], u = S[lang].unit, o = order();
  return [
   { t: "#card0", tri: true, say: `${r.lal.d} ÷ ${r.lal.t} = ${fmt(v[0])} ${u}`, text: T("s1", { t: r.lal.t, d: r.lal.d, v: fmt(v[0]) }) },
   { t: "#row" + KEYROW, say: `${k[1]} ÷ ${k[0]} = ${fmt(v[1])} ${u}`, text: T("s2", { t: k[0], d: k[1], v: fmt(v[1]) }) },
   { t: "#sent", say: `${r.sob.d} ÷ ${r.sob.t} ≈ ${fmt(v[2])} ${u}`, text: T("s3", { t: r.sob.t, d: r.sob.d, v: fmt(v[2]) }) },
   { t: "#rank", say: o.map(i => NAMES[lang][i]).join(" > "), text: T("s4") }];
}
const clearGuides = () => { $$(".hl").forEach(e => e.classList.remove("hl")); $("#tri")?.classList.remove("on"); };
function showCap(t) { cap.hidden = false; cap.textContent = t; }
async function how() {
  if (busy) return; busy = true; clearGuides(); const st = steps();
  if (style === "text") { cap.hidden = false; cap.innerHTML = "<ol>" + st.map(s => `<li>${s.text}</li>`).join("") + "</ol>"; busy = false; return; }
  for (const s of st) { const el = $(s.t); clearGuides();
    if (style === "robot") { emo("think"); await moveTo(el); point(el); emo("idle"); say(s.say); }
    else { el.scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" }); await sleep(450); }
    el.classList.add("hl"); if (s.tri) $("#tri").classList.add("on");
    showCap(s.text); await sleep(3400); }
  clearGuides(); await goHome(); busy = false;
}
function tell(msg, e) { showCap(msg); if (style === "robot") { emo(e || "idle"); say(msg); hop(); } }

/* ---------- 6. CHECK, HINTS, RACE ---------- */
function check() {
  if (busy) return; clearGuides(); const v = speeds(), nums = vals.map(parse);
  if (nums.some(isNaN)) return tell(T("needRates"), "think");
  if (ranks.length < 3) return tell(T("needRank"), "think");
  const bad = [0, 1, 2].filter(i => Math.abs(nums[i] - v[i]) > TOL);
  $$(".ans input").forEach((e, i) => e.classList.toggle("bad", bad.includes(i)));
  if (bad.length) { tries++; SND.no(); return tell(T("rateWrong", { n: bad.map(i => NAMES[lang][i]).join(" / ") }), "sad"); }
  if (ranks.join() !== order().join()) { tries++; SND.no(); return tell(T("rankWrong"), "sad"); }
  race();
}
function race() {
  busy = true; raced = true; const v = speeds(), o = order();
  stars += Math.max(1, 3 - Math.min(2, tries + (hints ? 1 : 0))); $("#score").textContent = T("stars", { s: stars });
  tell(T("go"), "happy"); SND.ok();
  [0, 1, 2].forEach(i => { const b = $("#bt" + i); b.style.transition = "none"; b.style.transform = `translate(16px,${8 + 54 * i}px)`; $("#md" + i).textContent = ""; });
  void $("#lane").offsetWidth;
  let end = 0;
  [0, 1, 2].forEach(i => { const T_ = FINISH / v[i] * SLOW, b = $("#bt" + i); end = Math.max(end, T_);
    b.style.transition = `transform ${T_}s linear`; b.style.transform = `translate(520px,${8 + 54 * i}px)`;
    timers.push(setTimeout(() => { $("#md" + i).textContent = ["🥇", "🥈", "🥉"][o.indexOf(i)]; SND.pop(); }, T_ * 1000)); });
  timers.push(setTimeout(() => { busy = false; tell(T("won", { n: NAMES[lang][o[0]], v: fmt(v[o[0]]) }), "happy"); SND.ok();
    $("#next").hidden = false; $("#next span").textContent = round < ROUNDS.length - 1 ? S[lang].next : S[lang].again; }, end * 1000 + 400));
}
function hint() { if (busy) return; hints++; const v = speeds(), L = S[lang];
  if (hints === 1) return tell(L.h1, "think"); if (hints === 2) return tell(L.h2, "think");
  const i = [0, 1, 2].find(i => !(Math.abs(parse(vals[i]) - v[i]) <= TOL)); tell(i === undefined ? L.h2 : T("h3", { n: NAMES[lang][i], v: fmt(v[i]) }), "idle"); }
async function confused() { if (busy) return; busy = true; clearGuides();
  const msg = S[lang][["c1", "c2"][confN++ % 2]]; busy = false; tell(nm(msg), "think"); }   // new wording, not a repeat
function next() { timers.forEach(clearTimeout); timers = []; round = (round + 1) % ROUNDS.length; if (round === 0) stars = 0;
  ranks = []; vals = ["", "", ""]; tries = hints = confN = 0; raced = false; $("#next").hidden = true; cap.hidden = true; render(); goHome(); }

/* ---------- 7. WIRING ---------- */
function setStyle(s) { style = s; document.body.dataset.style = s; clearGuides(); cap.hidden = true;
  $$(".row [data-s]").forEach(b => b.setAttribute("aria-pressed", b.dataset.s === s)); robot.hidden = s !== "robot";
  if (s === "robot") { home(); atHome = true; emo("happy"); setTimeout(() => say(S[lang].hi), 300); setTimeout(() => emo("idle"), 1600); } }
$$(".row [data-s]").forEach(b => b.onclick = () => setStyle(b.dataset.s));
$("#cards").addEventListener("input", e => { const i = +e.target.id.slice(2); vals[i] = e.target.value; e.target.classList.remove("bad"); });
$("#rank").addEventListener("click", e => { const b = e.target.closest(".rk"); if (!b || busy) return; const i = +b.dataset.i;
  ranks.includes(i) ? ranks.length = ranks.indexOf(i) : ranks.push(i); SND.pop(); drawRank(); });
$("#check").onclick = check; $("#how").onclick = how; $("#hint").onclick = hint; $("#conf").onclick = confused; $("#next").onclick = next;
$("#snd").onclick = e => { sound = !sound; e.currentTarget.textContent = sound ? "🔊" : "🔇"; };
$("#lng").onclick = () => { lang = lang === "en" ? "bn" : "en"; render(); cap.hidden = true; };
robot.onclick = () => hint(); robot.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); hint(); } };
addEventListener("resize", () => atHome && style === "robot" && home());
render(); setStyle("robot");
</script>
</body>
</html>

  <!-- All layout and components are reused from problem.html -->
  <!-- The only change is this custom fetchPosts() for Leet posts -->

  <script>
    async function fetchPosts() {
      try {
        const res = await fetch("/api/leet");
        return await res.json();
      } catch (e) {
        console.error("Error fetching leet posts:", e);
        return [];
      }
    }
  </script>

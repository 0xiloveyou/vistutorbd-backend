<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog - Cyber Security</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css"/>

<body>

  <!-- Reuse navbar, sidebar, search, pagination, scroll buttons as in Problem.html -->
  <!-- Just override fetchPosts() function below: -->

  <script>
    // Custom fetchPosts for cyber-security.html
    async function fetchPosts() {
      try {
        const res = await fetch("/api/cyber-security");
        return await res.json();
      } catch (e) {
        console.error("Error fetching cyber-security posts:", e);
        return [];
      }
    }
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

  <script src="js/blog.js"></script>
</body>

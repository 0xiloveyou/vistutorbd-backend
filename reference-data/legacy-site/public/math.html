        </div>

    <div>
      <a href="index.html">Home</a>
      <a href="editor.html">Editor</a>
      <button id="toggleReadingMode">📖 Reading Mode</button>
      <button id="fullscreenToggle" class="fullscreen-btn">🖥 Fullscreen</button>
      <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
    </div>
  </div>

  <div class="sidebar-toggle-btn" onclick="toggleSidebar()"> ☰ </div>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Search blog content..." onkeyup="searchPosts()" />
    <button class="clear-search" onclick="clearSearch()">×</button>
    <select id="sortSelect" onchange="sortPosts(this.value)">
      <option value="">Sort By</option>
      <option value="date-desc">Date: Newest First</option>
      <option value="date-asc">Date: Oldest First</option>
      <option value="title-asc">Title: A-Z</option>
      <option value="title-desc">Title: Z-A</option>
    </select>
    <select id="tagFilter" onchange="filterByTag(this.value)">
      <option value="">Filter by Tag</option>
    </select>
  </div>

  
  
  <div class="main-container">


    <div class="sidebar" id="sidebar">
      <h2>Categories</h2>
      <ul id="categoryList"></ul>
    </div>

    <div class="content" id="blogPosts"></div>

    
    <div class="floating-toc collapsed" id="floatingToc">
      <div class="toc-header" onclick="toggleToc()">
        📋 In This Post
        <span class="arrow" id="tocArrow">▶</span>
      </div>
      <ul id="tocList" class="toc-list"></ul>
    </div>
    
    

    <div id="codeModal" class="code-modal">
      <div class="code-modal-content">
        <button id="closeCodeModal" class="modal-close">✖</button>
        <button id="copyCodeModal" class="modal-copy">📋 Copy</button>
        <pre><code id="modalCode"></code></pre>
      </div>
    </div>
    <button id="exitReadingModeBtn" class="reading-exit-btn" style="display: none;">❌ Exit</button>
  </div>
    
  


  <div class="pagination" id="pagination"></div>

  <div class="scroll-buttons">
    <span id="dateTime" class="datetime-label"></span>
        <button onclick="scrollToTop(); document.getElementById('blogPosts').scrollIntoView({behavior: 'smooth'})">↑ Top</button>
    <button onclick="scrollToBottom(); document.getElementById('pagination').scrollIntoView({behavior: 'smooth'})">↓ Bottom</button>
  </div>


  

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
  <script src="js/math.js"></script>

  <script>
 window.onload = () => {
  applySavedTheme();      // Apply saved theme
  updateDateTime();       // Your existing functions
  renderBlogs();          // Load blog content
};
  </script>

  <style>
    .blog-image {
      max-width: 100%;
      height: auto;
      margin: 10px 0;
      border-radius: 5px;
    }
    .image-container {
      text-align: center;
    }
  </style>


</body>
